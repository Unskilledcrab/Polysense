e judge and public defender made this request, Atlanta News First reported.", "cite": ["P-069", "P-070"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "In the 2026 cycle, the Board adopted its budget in January, on Jan 21, 2026.", "cite": ["P-046"]}, {"t": "Atlanta News First reported that \"A January vote is normal protocol.\"", "cite": ["P-070"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed this directly.", "tag": "analysis", "note": "none of the archived statements does"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The deadline is \"no later than the second regular meeting in January,\" so an earlier vote is allowed.", "cite": ["P-005"]}, {"t": "Atlanta News First reported that \"current law does not prohibit commissioners from voting earlier.\"", "cite": ["P-070"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "We found no county notice of when the Board plans its hearing or vote.", "tag": "analysis", "note": "the newest notice on Nov 8 was for October's hearings (P-042)"}, {"t": "Our sources don't say who the incoming board members are or when they take office.", "tag": "analysis", "note": "none of the archived sources does"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "When the Board will hold its hearing and vote, since no date is posted.", "tag": "editorial", "note": ""}, {"t": "Commissioner Ellis said there is no talk of an early vote, Atlanta News First reported.", "cite": ["P-073"]}]}], "cardMeta": {"kind": "Documented", "side": "asks for a January vote", "claimType": "values, about timing", "evidence": "2026 vote in January: Supported (budget book). When new members take office: Uncertain (not in our sources). Whether to wait: a values question"}}, {"title": "6. Justice offices need more money", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Funding decisions could affect court delays, jail conditions and public safety, justice officials said, Atlanta News First reported.", "cite": ["P-069"]}, {"t": "The officials asked for more money.", "cite": ["P-070"]}, {"t": "2026 county records back rising jail-agreement costs, not most other needs.", "tag": "analysis", "note": "P-048 to P-050 and P-054 back the jail-agreement costs; most other needs rest on the offices' slides, P-061 to P-066"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Solicitor-General Keith Gammage said, \"Each year we are underfunded.\"", "cite": ["P-071"]}, {"t": "Gammage said one investigator carries \"a caseload - upwards of 400.\"", "cite": ["P-071"]}, {"t": "Gammage also cited \"a lack of proper investment\" in the courts.", "cite": ["P-077"]}, {"t": "Atlanta News First reported that the officials said funding decisions could affect court delays, jail conditions and public safety.", "cite": ["P-069"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "The county says it entered the jail agreement \"to address constitutional violations at the Fulton County Jail.\"", "cite": ["P-048"]}, {"t": "The county says the agreement \"mandated the County implement specific reforms,\" including \"improving staffing and supervision.\"", "cite": ["P-048"]}, {"t": "The 2026 budget message said \"additional resources will be needed for consent decree compliance.\"", "cite": ["P-049", "P-046"]}, {"t": "It said these costs are \"expected to grow.\"", "cite": ["P-050", "P-046"]}, {"t": "In the 2026 cycle, the Board raised consent decree funding from $31,843,000 to $50,000,000.", "cite": ["P-054"]}, {"t": "That is $18,157,000 more than proposed.", "tag": "computed", "note": "$50,000,000 − $31,843,000 = $18,157,000 (P-054)"}, {"t": "It raised the solicitor-general's budget from $14,605,358 to $16,149,063.", "cite": ["P-054"]}, {"t": "The sheriff's 2027 budget slides call for a staffing plan \"to stabilize staffing and strengthen compliance.\"", "cite": ["P-060", "P-055"]}, {"t": "The slides also ask for more overtime funding \"to align with operational realities and Consent Decree mandates.\"", "cite": ["P-060"]}, {"t": "The office's 2027 requests include \"Consent Decree Compliance.\"", "cite": ["P-061", "P-055"]}, {"t": "The solicitor-general's slides list \"Caseload Growth without proportional staffing\" as a challenge.", "cite": ["P-062", "P-056"]}, {"t": "Those slides also cite outside advice that prosecutors \"should not carry workloads so large/complex that they endanger fairness, accuracy or the timely processing of charges.\"", "cite": ["P-062"]}, {"t": "The probate court says \"Insufficient staffing and rising caseloads cause backlogs and delays.\"", "cite": ["P-065"]}, {"t": "It asks for 6 court clerks and 1 associate judge.", "cite": ["P-066"]}, {"t": "The public defender asks for $3,793,366 for attorney positions.", "cite": ["P-064"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed this directly.", "tag": "analysis", "note": "none of the archived statements does"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The 2026 budget message said there were \"no additional resources available\" for new programs beyond current services.", "cite": ["P-049", "P-046"]}, {"t": "The message said the volume of requests and known budget pressures \"resulted in many unmet requests.\"", "cite": ["P-049", "P-046"]}, {"t": "When the 2026 proposal was written, consent decree costs were \"still being vetted and have not been determined,\" though the county expected them to grow.", "cite": ["P-050", "P-046"]}, {"t": "The 2026 plan spends $73,637,614 more than it takes in, using savings, which the budget calls \"fund balance.\"", "cite": ["P-054"]}, {"t": "That leaves savings about $2.8 million above the least the county must keep.", "tag": "computed", "note": "$179,000,901 − $176,218,666 = $2,782,235, from P-054's \"Fund Balance Minimum Reserve\" row"}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "We found no outside data on court and prosecutor caseloads or staffing.", "tag": "analysis", "note": "none in the sources reviewed"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much of these requests the draft will fund, because it isn't public yet.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "asks for more justice funding", "claimType": "factual, with a values question", "evidence": "Jail agreement costs: Supported (budget book). Courts' and prosecutors' 2027 needs: Uncertain (mainly their own accounts). How to weigh them: a values question"}}, {"title": "Questions to weigh", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "Who should shape the first draft: staff alone, staff with the chairman, staff with two commissioners (one from each group of districts), or the whole Board?", "tag": "editorial", "note": "a question; the choices come from P-002, P-003, P-008 and P-014"}, {"t": "If commissioners take part, how should they be chosen?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Should departments' requests for extra money have a set limit, or should the draft list them without one?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Should the Board adopt the budget in December, or wait until January?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "How should the justice offices' requests be weighed against other county services and the county's savings?", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "evidence", "title": "Layer 5: Evidence", "blocks": [], "subs": [{"title": "Notes on the minutes and meeting video", "blocks": [{"kind": "para", "label": null, "units": [{"t": "The minutes of the Oct 21 and Nov 4 meetings, kept by the Clerk to the Commission, record the motions and votes on Resolution 26-0729.", "cite": ["P-096", "P-088", "P-090", "P-092", "P-097"]}, {"t": "They give no reasons.", "tag": "analysis", "note": "P-088 and P-092 are the full entries, and the full minutes are archived (sources.yaml, S05b and S05c)"}, {"t": "Both meetings also took up an \"Update on the Budget Committee and the budget approval process,\" which the minutes list only as discussed.", "cite": ["P-089", "P-093"]}, {"t": "The Board approved the Oct 21 minutes on Nov 4; the Nov 4 minutes are marked \"tentative,\" meaning not yet approved, until a vote set for Nov 18.", "cite": ["P-091", "P-090"]}, {"t": "The county's records link video of both meetings.", "cite": ["P-025"]}, {"t": "We did not review the video, so reasons may have been given there.", "tag": "editorial", "note": "scope note; see sources.yaml, S16"}]}], "cardMeta": null}]}]}, "passages": {"P-001": {"source": "S01", "locator": "p.1, lines 1-7 (title)", "text": "A RESOLUTION BY THE FULTON COUNTY BOARD OF COMMISSIONERS, TO RE- ESTABLISH A BUDGET COMMISSION TO ASSIST IN THE DEVELOPMENT OF THE COUNTY'S ANNUAL BUDGET; TO PROVIDE FOR ITS PURPOSE, COMPOSITION, SELECTION, ELIGIBILITY, AND DUTIES; TO AMEND SECTION 2-261 OF THE FULTON COUNTY CODE OF ORDINANCES; TO ADD SECTION 2-263 OF THE FULTON COUNTY CODE OF ORDINANCES; TO REPEAL CONFLICTING RESOLUTIONS; AND FOR OTHER PURPOSES.", "note": null}, "P-002": {"source": "S01", "locator": "p.1, lines 11-27 (history, 1953 to 2016)", "text": "WHEREAS, from 1953 until 2016, Fulton County’s budgeting process was prescribed by a 1953 local law applicable to densely populated counties and enacted by the Georgia General Assembly (1953 Ga. L. 2815), which entrusted the creation and proposal of the annual budgets to a county budget commission; and WHEREAS, the budget commission consisted of the individuals holding the county positions (as they are known currently) of the chairman of the board of commissioners, the county manager, and the chief financial officer; and WHEREAS, in 2016, the Georgia General Assembly repealed the 1953 local law, which had the effect of authorizing Fulton County to establish its own budget ordinance pursuant to O.C.G.A. § 36-81-3; and WHEREAS, on June 15, 2016, Fulton County enacted a budget ordinance at Fulton County Code (“FCC”) Sec. 2-261 and 2-262 through Resolution 16-0465, to establish a process for the proposal and adoption of the budget and to ensure expenditures are made in accordance with the budget; and WHEREAS, the 2016 budget ordinance maintained the use of a budget commission composed of the chairman of the board of commissioners, the county manager, and the chief financial officer; and", "note": null}, "P-003": {"source": "S01", "locator": "p.2, lines 1-6 (the 2018 change)", "text": "WHEREAS, on August 15, 2018, through Resolution 18-0577 (the “Prior Budget Resolution”), the Board of Commissioners (“BOC”) opted to replace the budget commission with a process, codified in FCC Section 2-261, where the county manager solely creates and submits the proposed budget but is directed to “include the budget requests of all of the county’s departments, agencies, elected officials, and authorities” along with the proposed budget; and", "note": null}, "P-004": {"source": "S01", "locator": "p.2, lines 7-14 (stated purpose of the change)", "text": "WHEREAS, the Board determines that it is in the best interest of Fulton County to reconstitute a Budget Commission in a modified form that combines the administrative and financial expertise of the County Manager and Chief Financial Officer with earlier and ongoing input from members of the Board, structured to ensure balanced representation from both the northern and southern portions of Fulton County; and WHEREAS, the Board desires to establish clear procedures governing the composition, selection, eligibility, and duties of such Budget Commission, while preserving the full Board's exclusive authority to adopt the County's annual budget.", "note": null}, "P-005": {"source": "S01", "locator": "pp.2-3, Sec. 2-261 as amended, first paragraph (as adopted: struck words dropped)", "text": "Sec. 2-261, - Proposal and adoption of the budget. The budget commission shall submit or cause to be submitted annually to the board of commissioners, by no later than November 15, a proposed budget governing expenditures of all county funds, including capital outlay and public works projects, for the following year. The budget commission’s submission of the proposed budget shall include the budget requests of all of the county's departments, agencies, elected officials and authorities who receive funding from the county through the budget process. This proposed budget will serve, as presented, as the operating budget until a final budget is adopted. The procedures for budget preparation, submission to the governing authority, review by the governing authority, public review, notice, and hearings shall be as provided for in Chapter 81 of Title 36 of the O.C.G.A. [O.C.G.A. § 36-81-1 et seq.]. The budget shall then be adopted by the board of commissioners by no later than the second regular meeting in January of the year to which it applies, which budget, when so adopted by the board of commissioners, shall constitute the board of commissioners' appropriation of all funds for such year.", "note": "Removed the page number '[2]' that falls inside the span at the page break. 'county manager' is struck through on lines 19 and 23 (checked visually on a rendered page image)."}, "P-006": {"source": "S01", "locator": "p.3, lines 9-22, Sec. 2-261 as amended, second paragraph", "text": "The county manager is authorized to take all administrative steps necessary to implement the budget as approved. The budget so adopted may be revised during the year only by formal action of the board of commissioners in a regular meeting which has been advertised in accordance with subsection (e) of Code Section 36-81-5 of the O.C.G.A. [O.C.G.A. § 36-81-5] and no increase shall be made in such budget without provision also being made for financing such increase. The proposed budget submitted by the budget commission shall be accompanied by a report containing information and data required by subsection (b) of Code Section 36-81-5 of the O.C.G.A. [O.C.G.A. § 36-81- 5]. A copy of the proposed budget shall be transmitted to the county clerk of the commission of Fulton County on the date it is submitted to the board of commissioners. Upon adoption of the budget, a copy shall be transmitted to the county clerk of the commission of Fulton County.", "note": "'county manager' is struck and 'budget commission' underlined on line 16 (checked visually)."}, "P-007": {"source": "S01", "locator": "p.3, lines 24-36, new Sec. 2-263(a) Purpose", "text": "BE IT FURTHER RESOLVED that the Fulton County Board of Commissioners hereby adopts a new section of the Fulton County Code, Section 2-263. – Budget commission., outlining the purpose, composition, selection, eligibility and duties of the budget commission, as follows: Section 2-263. – Budget commission. (a) Purpose. The purpose of the budget commission is to assist in the development of the county's proposed annual operating and capital budgets by combining the professional expertise of the county manager and chief financial officer with the policy priorities of the full board of commissioners, as represented by two commissioners selected in accordance with this code section.", "note": null}, "P-008": {"source": "S01", "locator": "pp.3-4, Sec. 2-263(b) Composition", "text": "(b) Composition. The budget commission shall be composed of four (4) members: (1) The county manager; (2) The chief financial officer; (3) One member of the board of commissioners representing commission district 1, 2, or 3 (the “Northern Representative”); and (4) One member of the board of commissioners representing commission district 4, 5, or 6 (the “Southern Representative”).", "note": "Removed the page number '[3]' at the page break."}, "P-009": {"source": "S01", "locator": "p.4, lines 11-34, Sec. 2-263(c) Selection", "text": "(c) Selection of commissioner members. (1) Prior to the commencement of each annual budget development cycle, the commissioners representing Districts 1, 2, and 3 shall meet and, by majority vote of those three members, nominate and select one of their number to serve as the Northern Representative for that cycle. (2) Prior to the commencement of each annual budget development cycle, the commissioners representing Districts 4, 5, and 6 shall meet and, by majority vote of those three members, nominate and select one of their number to serve as the Southern Representative for that cycle. (3) Selection under this code section shall occur at a regularly scheduled and duly noticed board of commissioners meeting, and the result shall be entered into the official minutes of the board of commissioners. (4) Where application of the Eligibility code subsection (d) leaves only one eligible commissioner within a district grouping described in paragraph (1) or (2) of this subsection, that commissioner shall serve as the applicable Representative without the necessity of nomination or vote.", "note": null}, "P-010": {"source": "S01", "locator": "pp.4-5, Sec. 2-263(d) Eligibility", "text": "(d) Eligibility; election-year exclusion. (1) A commissioner shall have served on the board of commissioners for at least one (1) year to be eligible to serve on the budget commission. (2) A commissioner whose current term of office expires in the same calendar year in which the budget commission is developing the budget for the forthcoming fiscal year shall not be eligible to serve as the Northern Representative or Southern Representative for that budget cycle. i. By way of illustration, a commissioner whose term expires in 2026 shall not be eligible to serve on the budget commission convened to develop the Fiscal Year 2027 budget, notwithstanding that such development begins in 2026 and continues into 2027. (3) In the event that every commissioner within a district grouping described in paragraphs (c)(1) or (c)(2) is simultaneously ineligible under this section for a given budget cycle, the full board of commissioners shall, by majority vote, either (i) permit the immediately preceding Northern Representative or Southern Representative, as applicable, to continue to serve in a holdover capacity for that cycle, or (ii) select a Representative from among the sitting commissioners representing that district grouping, notwithstanding the exclusion in paragraph (2) of this subsection.", "note": "Removed the page number '[4]' at the page break."}, "P-011": {"source": "S01", "locator": "p.5, lines 18-35, Sec. 2-263(e) Vice chair", "text": "(e) Vice chair. (1) If the vice chair of the board of commissioners is not, in a given budget cycle, ineligible under subsection (d), the vice chair shall automatically serve as the Northern Representative or Southern Representative, as applicable based on the vice chair’s district, without the necessity of nomination or election under subsection (c). (2) If the vice chair is ineligible under subsection (d) for a given budget cycle, the vice chair shall be excluded from service on the budget commission for that cycle in the same manner as any other commissioner, and the applicable district grouping shall select its Representative pursuant to subsection (c). (3) The district grouping not represented by the vice chair shall select its Representative pursuant to subsection (c) and subsection (d), regardless of whether the vice chair serves under paragraph (1) of this subsection.", "note": null}, "P-012": {"source": "S01", "locator": "p.5, lines 37-45, Sec. 2-263(f) County manager and CFO", "text": "(f) Administrative duties of the county manager and chief financial officer. The county manager and the chief financial officer shall retain administrative responsibility for budget preparation and presentation, including preparing budget documents, soliciting budget proposals from county departments, scheduling administrative budget meetings, and hosting meetings with departments to discuss proposed budgets and priorities.", "note": null}, "P-013": {"source": "S01", "locator": "p.6, lines 2-23, Sec. 2-263(g) Duties of commissioner members", "text": "(g) Duties of commissioner members. The Northern Representative and Southern Representative shall: (1) solicit budget priorities, requests, and concerns from all members of the board of commissioners, including those not serving on the budget commission, through individual meetings, written submissions, or regular check-ins; (2) represent the interests and priorities of their respective district grouping throughout the budget development process; (3) participate directly and continuously with the county manager and chief financial officer throughout the budget development process, including review of departmental requests, revenue and expenditure assumptions, specific budgetary requests from other elected officials, and capital planning; (4) report periodically to the full board of commissioners on the status of budget development; and (5) participate with the county manager and chief financial officer in preparing the recommended budget for presentation to the full board of commissioners.", "note": null}, "P-014": {"source": "S01", "locator": "p.6, lines 25-41, Sec. 2-263(h) Decision-making", "text": "(h) Decision-making; advisory nature. (1) The budget commission shall operate by consensus rather than as a formal voting body as it works toward a joint budgetary presentation to the full board. (2) Where differences arise or consensus on an issue cannot be reached, the County Manager shall determine the best approach forward for presenting a proposed budget to the full board of commissioners. (3) Nothing in this code section shall be construed to grant the budget commission authority to adopt, amend, or approve the County budget. Final authority to adopt the annual budget remains exclusively with the full board of commissioners, consistent with O.C.G.A. § 36-81-1 et seq. and other applicable law.", "note": null}, "P-015": {"source": "S01", "locator": "pp.6-7, Sec. 2-263(i)-(j) Presentation and meeting schedule", "text": "(i) Presentation to the board of commissioners. The recommended budget developed by the budget commission shall be presented jointly to the full board of commissioners by the county manager, the chief financial officer, the Northern Representative, and the Southern Representative, in accordance with the applicable budget calendar. (j) Meeting schedule. The budget commission shall convene on a schedule established by the county manager and chief financial officer in accordance with the applicable budget calendar.", "note": "Removed the page number '[6]' at the page break. Together, P-005, P-006 and P-007 to P-015 hold the full text of Sec. 2-261 and Sec. 2-263 as adopted."}, "P-016": {"source": "S01", "locator": "pp.7-8, sponsors", "text": "SPONSORED BY: Bob Ellis, Commissioner (District 2) CO-SPONSORED BY: Khadijah Abdur-Rahman, Vice Chair (District 6)", "note": "Removed the page number '[7]' at the page break."}, "P-017": {"source": "S02", "locator": "matter 26-0460: file number, title, status, dates", "text": "\"MatterFile\":\"26-0460\",\"MatterName\":null,\"MatterTitle\":\"Request approval of a Resolution by the Fulton County Board of Commissioners, to re-establish a Budget Commission to assist in the development of the County's annual budget; to provide for its purpose, composition, selection, eligibility, and duties; to amend Section 2-261 of the Fulton County Code of Ordinances; to add Section 2-263 of the Fulton County Code of Ordinances; to repeal conflicting Resolutions; and for other purposes. (Ellis/Abdur-Rahman) (APPROVED)\",\"MatterTypeId\":71,\"MatterTypeName\":\"Commissioners Action Item\",\"MatterStatusId\":72,\"MatterStatusName\":\"Passed\",\"MatterBodyId\":138,\"MatterBodyName\":\"Board of Commissioners\",\"MatterIntroDate\":\"2026-07-30T00:00:00\",\"MatterAgendaDate\":\"2026-08-05T00:00:00\",\"MatterPassedDate\":\"2026-08-05T00:00:00\"", "note": null}, "P-018": {"source": "S02b", "locator": "matter 26-0460 history: action of 2026-08-05", "text": "\"MatterHistoryActionDate\":\"2026-08-05T00:00:00\",\"MatterHistoryActionId\":383,\"MatterHistoryActionName\":\"approve\",\"MatterHistoryActionText\":\"A motion was made by Commissioner Ellis and seconded by Vice Chair Abdur-Rahman, to approve. The motion passed by the following vote:\",\"MatterHistoryActionBodyId\":138,\"MatterHistoryActionBodyName\":\"Board of Commissioners\",\"MatterHistoryPassedFlag\":1,\"MatterHistoryPassedFlagName\":\"Pass\",\"MatterHistoryRollCallFlag\":0,\"MatterHistoryFlagExtra\":null,\"MatterHistoryTally\":null,\"MatterHistoryAccelaRecordId\":null,\"MatterHistoryConsent\":0,\"MatterHistoryMoverId\":211,\"MatterHistoryMoverName\":\"Bob Ellis\",\"MatterHistorySeconderId\":501,\"MatterHistorySeconderName\":\"Khadijah Abdur-Rahman\"", "note": null}, "P-019": {"source": "S02c", "locator": "matter 26-0460 attachments (both files)", "text": "\"MatterAttachmentName\":\"08.05.26 - Resolution Fulton_County_Budget_Commission 7.30_\",\"MatterAttachmentHyperlink\":\"https://fulton.legistar1.com/fulton/attachments/3eebf1e5-1a77-413a-8209-b52b3b302a6e.pdf\",\"MatterAttachmentFileName\":\"3eebf1e5-1a77-413a-8209-b52b3b302a6e.pdf\",\"MatterAttachmentMatterVersion\":\"0\",\"MatterAttachmentIsHyperlink\":false,\"MatterAttachmentBinary\":null,\"MatterAttachmentIsSupportingDocument\":false,\"MatterAttachmentShowOnInternetPage\":true,\"MatterAttachmentIsMinuteOrder\":false,\"MatterAttachmentIsBoardLetter\":false,\"MatterAttachmentAgiloftId\":0,\"MatterAttachmentDescription\":null,\"MatterAttachmentPrintWithReports\":true,\"MatterAttachmentSort\":1},{\"MatterAttachmentId\":30722,\"MatterAttachmentGuid\":\"94325617-AE43-49F0-A5A6-49FB5EDED5DE\",\"MatterAttachmentLastModifiedUtc\":\"2026 \"VoteId\":31797,\"VoteGuid\":\"7A9B8A41-6A7C-4CAC-AFF4-7E6886AF88CB\",\"VoteLastModifiedUtc\":\"2026-08-05T20:20:07.51\",\"VoteRowVersion\":\"AAAAAAD+vCA=\",\"VotePersonId\":501,\"VotePersonName\":\"Khadijah Abdur-Rahman\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":6,\"VoteResult\":1,\"VoteEventItemId\":198790}]", "note": null}, "P-021": {"source": "S03", "locator": "matter 26-0471: title, status, dates", "text": "\"MatterFile\":\"26-0471\",\"MatterName\":null,\"MatterTitle\":\"BUDGET COMMISSION (APPROVED)\\n\\nThe Budget Commission shall be composed of four (4) members: the County Manager; the Chief Financial Officer; one member of the Board of Commissioners nominated by Commissioners for districts 1, 2 and 3 to be the Northern Representative; and one member of the Board of Commissioners nominated by Commissioners for districts 4, 5 and 6 to be the Southern Representative. Where application of the eligibility or Vice Chair provisions leaves only one eligible Commissioner to serve within a district grouping, nomination by that group is not necessary.\\n \\nFiscal Year 2027 Budget Development Cycle\\nCommissioner Ellis is the only eligible Commissioner to serve as the Northern Representative and will serve without nomination pursuant to F.C.C. Sec. 2-263(c)(4).\\n \\nVice Chair Abdur-Rahman is eligible to serve as the Southern Representative and will serve without nomination pursuant to F.C.C. Sec. 2-263(e)(1).\\n\\n\\nITEM REMOVED FROM THE CONSENT AGENDA FOR SEPARATE CONSIDERATION AS REQUESTED BY COMMISSIONER BARRETT\",\"MatterTypeId\":94,\"MatterTypeName\":\"Consent - Board of Commissioners\",\"MatterStatusId\":72,\"MatterStatusName\":\"Passed\",\"MatterBodyId\":138,\"MatterBodyName\":\"Board of Commissioners\",\"MatterIntroDate\":\"2026-08-13T00:00:00\",\"MatterAgendaDate\":\"2026-08-19T00:00:00\",\"MatterPassedDate\":\"2026-08-19T00:00:00\"", "note": null}, "P-022": {"source": "S03b", "locator": "matter 26-0471 history: action of 2026-08-19", "tex VOTE TAKEN)\",\"MatterHistoryActionBodyId\":138,\"MatterHistoryActionBodyName\":\"Board of Commissioners\",\"MatterHistoryPassedFlag\":null,\"MatterHistoryPassedFlagName\":null,\"MatterHistoryRollCallFlag\":0,\"MatterHistoryFlagExtra\":0,\"MatterHistoryTally\":null,\"MatterHistoryAccelaRecordId\":null,\"MatterHistoryConsent\":0,\"MatterHistoryMoverId\":568,\"MatterHistoryMoverName\":\"Dana Barrett\",\"MatterHistorySeconderId\":369,\"MatterHistorySeconderName\":\"Marvin S. Arrington, Jr.\",\"MatterHistoryMatterStatusId\":72},{\"MatterHistoryId\":207004,\"MatterHistoryGuid\":\"00F981A3-F7C4-4071-856A-0C4386B8A2AC\",\"MatterHistoryLastModifiedUtc\":\"2026-11-06T18:42:38.033\",\"MatterHistoryRowVersion\":\"AAAAAAEL2Zo=\",\"MatterHistoryEventId\":6399,\"MatterHistoryAgendaSequence\":null,\"MatterHistoryMinutesSequence\":64,\"MatterHistoryAgendaNumber\":null,\"MatterHistoryVideo\":154869,\"MatterHistoryVideoIndex\":7324,\"MatterHistoryVersion\":\"1\",\"MatterHistoryAgendaNote\":null,\"MatterHistoryMinutesNote\":null,\"MatterHistoryActionDate\":\"2026-11-04T00:00:00\",\"MatterHistoryActionId\":401,\"MatterHistoryActionName\":\"file\",\"MatterHistoryActionText\":\"b. A substitute motion was made by Vice Chair Abdur-Rahman and seconded by Commissioner Thorne, to file. The motion passed by the following vote:\",\"MatterHistoryActionBodyId\":138,\"MatterHistoryActionBodyName\":\"Board of Commissioners\",\"MatterHistoryPassedFlag\":1,\"MatterHistoryPassedFlagName\":\"Pass\",\"MatterHistoryRollCallFlag\":0,\"MatterHistoryFlagExtra\":null,\"MatterHistoryTally\":null,\"MatterHistoryAccelaRecordId\":null,\"MatterHistoryConsent\":0,\"MatterHistoryMoverId\":501,\"MatterHistoryMoverName\":\"Khadijah Abdur-Rahman\",\"MatterHistorySeconderId\":569,\"MatterHistorySeconderName\":\"Bridget Thorne\",\"MatterHistoryMatterStatusId\":74}]", "note": null}, "P-026": {"source": "S04c", "locator": "matter 26-0729 attachment", "text": "\"MatterAttachmentName\":\"Budget Cap Removal Resolution Draft\",\"MatterAttachmentHyperlink\":\"https://fulton.legistar1.com/fulton/attachments/83d19126-5565-4ca5-9bfe-92866f595c11.pdf\"", "note": null}, "P-027": {"source": "S04d", "locator": "p.1, lines 1-6 (title)", "text": "A RESOLUTION TO ENSURE TRANSPARENCY AND INFORMED DECISION- MAKING IN THE DEVELOPMENT OF THE FULTON COUNTY BUDGET; TO PROHIBIT ACROSS-THE-BOARD CAPS ON DEPARTMENTAL BUDGET REQUESTS; TO REMOVE THE 5% CAP PLACED ON ALL FULTON COUNTY DEPARTMENTS FOR THE 2027 BUDGET; TO REQUIRE THAT ALL DEPARTMENTAL BUDGET REQUESTS ARE DISCLOSED IN THE PROPOSED BUDGET; AND FOR OTHER PURPOSES.", "note": null}, "P-028": {"source": "S04d", "locator": "p.1, lines 8-27 (first five WHEREAS clauses)", "text": "WHEREAS, the Fulton County Board of Commissioners recognizes that across- the-board spending cuts and spending caps are not the best method for controlling costs in the long run as they allow legacy spending in some departments to go unchecked while new and often necessary funding is denied; and WHEREAS, the Government Finance Officers Association identifies across-the- board spending cuts or caps as a symptom of weak budget development practices, stating that they are “a symptom of a budget process that does not provide a means for precisely targeted reductions”; and WHEREAS, The Pew Charitable Trusts has advised state and local leaders to “resist the temptation to make indiscriminate, across-the-board budget cuts” and instead use data and evidence to make strategic decisions about the allocation of limited public resources; and WHEREAS, Fulton County has traditionally included departmental budget “enhancement requests” in its publicly available Proposed Budget, which has allowed the Board of Commissioners to get a true picture of the departments’ needs and to make adjustments to the budget based on these requests; and WHEREAS, from FY2025 to FY2026, the percent change in Fulton County’s departmental budgets ranged from a decrease of 4 percent to an increase of 43 percent, which demonstrates the significant variation in the budgetary needs of individual departments; and", "note": null}, "P-029": {"source": "S04d", "locator": "p.2, lines 1-17 (WHEREAS clauses on the 5% cap)", "text": "WHEREAS, the newly established Budget Commission has restricted all departments to making budget requests that do not exceed 5% of their “base budget” for 2027 and only allows departments to describe broader needs in narrative form; and WHEREAS, during the FY2026 budget process, 27 of the county’s 41 General Fund departments and agencies submitted budget enhancement requests exceeding 5% of their base budgets and 14 of them received budget increases that exceeded 5%; and WHEREAS, Fulton County Code Section 2-261 requires the Budget Commission’s submission of the proposed budget to include the budget requests of the County’s departments, agencies, elected officials, and authorities that receive funding through the budget process; and WHEREAS, by placing the 5% cap on departmental enhancement requests, the Budget Commission is effectively making its mandate to submit a proposed budget that includes the budget requests of the County’s departments impossible; and WHEREAS, the Budget Commission failed to uphold its required duty to \"solicit budget priorities, requests, and concerns from all members of the board of commissioners, including those not serving on the budget commission\" in implementing this unprecedented restriction on the departments; and", "note": null}, "P-030": {"source": "S04d", "locator": "pp.2-4, proposed new wording of Sec. 2-261 (as proposed: struck words dropped)", "text": "Sec. 2-261, - Proposal and adoption of the budget. The budget commission shall submit or cause to be submitted annually to the board of commissioners, by no later than November 15, a proposed budget governing expenditures of all county funds, including capital outlay and public works projects, for the following year. The budget commission’s submission of the proposed budget shall include all budget requests of all of the county's departments, agencies, elected officials and authorities who receive funding from the county through the budget process. No limits or caps shall be placed on what a department, agency, elected official, or authority can request. This proposed budget will serve, as presented, as the operating budget until a final budget is adopted. The procedures for budget preparation, submission to the governing authority, review by the governing authority, public review, notice, and hearings shall be as provided for in Chapter 81 of Title 36 of the O.C.G.A. [O.C.G.A. § 36- 81-1 et seq.]. The budget shall then be adopted by the board of commissioners by no later than the second regular meeting in January of the year to which it applies, which budget, when so adopted by the board of commissioners, shall constitute the board of commissioners' appropriation of all funds for such year. The county manager is authorized to take all administrative steps necessary to implement the budget as approved. The budget so adopted may be revised during the year only by formal action of the board of commissioners in a regular meeting which has been advertised in accordance with subsection (e) of Code Section 36-81-5 of the O.C.G.A. [O.C.G.A. § 36-81-5] and no increase shall be made in such budget without provision also being made for financing such increase. The proposed budget submitted by the budget commission shall be accompanied by a report containing information and data required by subsection (b) of Code Section 36-81-5 of the O.C.G.A. [O.C.G.A. § 36-81-5]. A copy of the proposed budget shall be transmitted to the county clerk of the commission of Fulton County on the date it is submitted to the board of commissioners. Upon adoption of the budget, a copy shall be transmitted to the county clerk of the commission of Fulton County.", "note": "Removed the page numbers '[2]' and '[3]' at the page breaks. In the draft, 'the' is struck and 'all' underlined on p.3 line 3, and the sentence 'No limits or caps shall be placed on what a department, agency, elected official, or authority can request.' is underlined (new)."}, "P-031": {"source": "S04d", "locator": "p.4, lines 6-11 (requests left out because of the cap)", "text": "BE IT FURTHER RESOLVED that all of the county's departments, agencies, elected officials and authorities who receive funding from the county through the budget process shall be given the opportunity to submit any budget enhancement request for FY2027 that was omitted due to the 5% cap and shall have those requests included in the FY2027 Proposed Budget that will be presented to the Board of Commissioners on November 15, 2026.", "note": null}, "P-032": {"source": "S04d", "locator": "p.5, sponsor", "text": "Sponsored by: _____________________________________ Dana Barrett, Commissioner (District 3)", "note": null}, "P-083": {"source": "S04d", "locator": "p.2, lines 18-20 (resolving clause)", "text": "NOW, THEREFORE BE IT RESOLVED that the Fulton County Board of Commissioners amends F.C.C. Sec. 2-261 to clarify that all departmental budget requests are included in the proposed budget as follows:", "note": null}, "P-084": {"source": "S04d", "locator": "p.4, lines 12-20 (severability, effective date, adoption line)", "text": "BE IT FURTHER RESOLVED that if any section, subsection, paragraph, sentence, clause, or phrase of this Resolution is for any reason held to be invalid or unconstitutional, such decision shall not affect the validity of the remaining portions of this Resolution. BE IT FINALLY RESOLVED that this Resolution shall become effective immediately upon adoption, and all other resolutions and parts of resolutions in conflict with this Resolution are hereby repealed to the extent of such conflict. PASSED AND ADOPTED by the Board of Commissioners of Fulton County, Georgia, this ____ day of ________________, 2026.", "note": "With P-027 to P-032 and P-083, this archives the resolution's full text apart from signature lines."}, "P-033": {"source": "S04e", "locator": "roll call, agenda item 205210 (26-0729), 2026-10-21 (whole response)", "text": "[{\"VoteId\":32722,\"VoteGuid\":\"5CA38356-F353-4091-BC37-500FF8407C37\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.39\",\"VoteRowVersion\":\"AAAAAAEHJYQ=\",\"VotePersonId\":407,\"VotePersonName\":\"Robert L. Pitts\",\"VoteValueId\":26,\"VoteValueName\":\"Did Not Vote\",\"VoteSort\":1,\"VoteResult\":0,\"VoteEventItemId\":205210},{\"VoteId\":32723,\"VoteGuid\":\"1E86D832-E241-4347-A5A4-F92FACFD1F5A\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.39\",\"VoteRowVersion\":\"AAAAAAEHXEQ=\",\"VotePersonId\":569,\"VotePersonName\":\"Bridget Thorne\",\"VoteValueId\":19,\"VoteValueName\":\"Absent\",\"VoteSort\":2,\"VoteResult\":0,\"VoteEventItemId\":205210},{\"VoteId\":32724,\"VoteGuid\":\"9E06D7C7-1688-45C8-8B27-97F80F7441F3\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.393\",\"VoteRowVersion\":\"AAAAAAEHJYY=\",\"VotePersonId\":211,\"VotePersonName\":\"Bob Ellis\",\"VoteValueId\":17,\"VoteValueName\":\"Nay\",\"VoteSort\":3,\"VoteResult\":2,\"VoteEventItemId\":205210},{\"VoteId\":32725,\"VoteGuid\":\"667BB2FB-1DC8-44A2-9734-0BB9D85235BD\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.4\",\"VoteRowVersion\":\"AAAAAAEHJYc=\",\"VotePersonId\":568,\"VotePersonName\":\"Dana Barrett\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":4,\"VoteResult\":1,\"VoteEventItemId\":205210},{\"VoteId\":32726,\"VoteGuid\":\"BD1C99EC-147B-4FBD-A04D-182E9D391583\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.403\",\"VoteRowVersion\":\"AAAAAAEHJYg=\",\"VotePersonId\":369,\"VotePersonName\":\"Marvin S. Arrington, Jr.\",\"VoteValueId\":26,\"VoteValueName\":\"Did Not Vote\",\"VoteSort\":5,\"VoteResult\":0,\"VoteEventItemId\":205210},{\"VoteId\":32727,\"VoteGuid\":\"D03AB4A6-2468-4AAC-A2E6-CCE32EBCDCB8\",\"VoteLastModifiedUtc\":\"2026-10-22T13:50:41.407\",\"VoteRowVersion\":\"AAAAAAEHXEY=\",\"VotePersonId\":501,\"VotePersonName\":\"Khadijah Abdur-Rahman\",\"VoteValueId\":19,\"VoteValueName\":\"Absent\",\"VoteSort\":6,\"VoteResult\":0,\"VoteEventItemId\":205210}]", "note": null}, "P-034": {"source": "S04f", "locator": "roll call, agenda item 207004 (26-0729, motion to file), 2026-11-04 (whole response)", "text": "[{\"VoteId\":32932,\"VoteGuid\":\"A23A42FE-3A2F-4648-A00C-CA57B996D1C1\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.193\",\"VoteRowVersion\":\"AAAAAAELoYA=\",\"VotePersonId\":407,\"VotePersonName\":\"Robert L. Pitts\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":1,\"VoteResult\":1,\"VoteEventItemId\":207004},{\"VoteId\":32933,\"VoteGuid\":\"78E580ED-3C41-4F5B-ABE2-BFC4194F1889\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.193\",\"VoteRowVersion\":\"AAAAAAELoYE=\",\"VotePersonId\":569,\"VotePersonName\":\"Bridget Thorne\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":2,\"VoteResult\":1,\"VoteEventItemId\":207004},{\"VoteId\":32934,\"VoteGuid\":\"42703982-4B79-47A3-8927-30C79F70B088\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.193\",\"VoteRowVersion\":\"AAAAAAELoYI=\",\"VotePersonId\":211,\"VotePersonName\":\"Bob Ellis\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":3,\"VoteResult\":1,\"VoteEventItemId\":207004},{\"VoteId\":32935,\"VoteGuid\":\"63C5710E-67CC-4C7A-A732-29DFD401327E\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.197\",\"VoteRowVersion\":\"AAAAAAELoYM=\",\"VotePersonId\":568,\"VotePersonName\":\"Dana Barrett\",\"VoteValueId\":17,\"VoteValueName\":\"Nay\",\"VoteSort\":4,\"VoteResult\":2,\"VoteEventItemId\":207004},{\"VoteId\":32936,\"VoteGuid\":\"1329ECE9-F61A-4570-855D-94E6FDE1694C\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.197\",\"VoteRowVersion\":\"AAAAAAELoYQ=\",\"VotePersonId\":369,\"VotePersonName\":\"Marvin S. Arrington, Jr.\",\"VoteValueId\":26,\"VoteValueName\":\"Did Not Vote\",\"VoteSort\":5,\"VoteResult\":0,\"VoteEventItemId\":207004},{\"VoteId\":32937,\"VoteGuid\":\"FE7E4677-CA67-4674-904D-6FCA59C3D2FA\",\"VoteLastModifiedUtc\":\"2026-11-05T02:56:22.2\",\"VoteRowVersion\":\"AAAAAAELoYU=\",\"VotePersonId\":501,\"VotePersonName\":\"Khadijah Abdur-Rahman\",\"VoteValueId\":16,\"VoteValueName\":\"Yea\",\"VoteSort\":6,\"VoteResult\":1,\"VoteEventItemId\":207004}]", "note": null}, "P-035": {"source": "S05", "locator": "p.1, heading and roll call", "text": "FULTON COUNTY BOARD OF COMMISSIONERS FIRST REGULAR MEETING November 4, 2026 10:00 AM Fulton County Government Center Assembly Hall 141 Pryor Street SW Atlanta, Georgia 30303 A G E N D A CALL TO ORDER: Chairman Robert L. Pitts ROLL CALL: Tonya R. Grier, Clerk to the Commission Robert L. Pitts, Chairman (At-Large) Bridget Thorne, Commissioner (District 1) Bob Ellis, Commissioner (District 2) Dana Barrett, Commissioner (District 3) Vacant (District 4) Marvin S. Arrington, Jr., Commissioner (District 5) Khadijah Abdur-Rahman, Vice Chair (District 6)", "note": null}, "P-085": {"source": "S05", "locator": "p.2, item 26-0736 (what the consent agenda is)", "text": "Adoption of the Consent Agenda - All matters listed on the Consent Agenda are considered routine by the County Commission and will be enacted by one motion. No separate discussion will take place on these items. If discussion of any Consent Agenda item is desired, the item will be moved to the First Regular Meeting Agenda for separate consideration.", "note": null}, "P-036": {"source": "S05", "locator": "p.5, item 26-0748 (Public Comment)", "text": "26-0748 Board of Commissioners Public Comment - Citizens are allowed to voice County related opinions, concerns, requests, etc. during the Public Comment portion of the Commission meeting. Priority for public comment will be given to Fulton County citizens and those individuals representing businesses or organizations located within Fulton County, including their employees, whether such persons are commenting in-person, via emails or via Zoom or other electronic media (i.e., phone call). Non-Fulton County citizens will only be heard after all in-person Fulton County citizens, representatives of business and organizations located within Fulton County, including their employees, have been heard and the time allotted for public comment has not expired, except as otherwise provided in this code section. County staff shall verify the residency of each public speaker prior to such person being heard by the board. Speakers will be granted up to two minutes each. Members of the public will not be allowed to yield or donate time to other speakers. The Public Comment portion of the meeting will not exceed sixty (60) minutes at the First Regular Meeting, nor will this portion exceed sixty (60) minutes at the Second Regular Meeting. In the event the 60-minute time limit is reached prior to public comments being completed, public comment will be suspended and the business portion of the BOC meeting will commence. Public comment will resume at the end of the meeting. For more information or to arrange a speaking date, contact the Clerk’s Office.", "note": null}, "P-037": {"source": "S05", "locator": "p.9, item 26-0729", "text": "26-0729 Board of Commissioners Request approval of a Resolution to ensure transparency and informed decision-making in the development of the Fulton County budget; to prohibit across-the-board caps on departmental budget requests; to remove the 5% cap placed on all Fulton County departments for the 2027 budget; to require that all departmental budget requests are disclosed in the proposed budget; and for other purposes. (Barrett) (MOTION TO APPROVE FAILED ON 10/21/26)", "note": null}, "P-038": {"source": "S05", "locator": "p.10, item 26-0766", "text": "26-0766 Board of Commissioners Discussion: Update on the Budget Committee and the budget approval process. (Abdur-Rahman)", "note": null}, "P-096": {"source": "S05b", "locator": "p.1, heading and document status (ratified 2026-11-04; see P-091)", "text": "FULTON COUNTY BOARD OF COMMISSIONERS SECOND REGULAR MEETING October 21, 2026 10:00 AM Fulton County Government Center Assembly Hall 141 Pryor Street SW Atlanta, Georgia 30303 POST AGENDA MINUTES This document is tentative, has not been ratified or approved by the Board of Commissioners, and is not binding on the County or any officer. Scheduled date for ratification: November 4, 2026", "note": null}, "P-088": {"source": "S05b", "locator": "p.15, item 26-0729 (motion to approve, 2026-10-21; whole entry)", "text": "26-0729 Board of Commissioners Request approval of a Resolution to ensure transparency and informed decision-making in the development of the Fulton County budget; to prohibit across-the-board caps on departmental budget requests; to remove the 5% cap placed on all Fulton County departments for the 2027 budget; to require that all departmental budget requests are disclosed in the proposed budget; and for other purposes. (Barrett) (MOTION TO APPROVE FAILED) A motion was made by Commissioner Barrett and seconded by Commissioner Arrington, to approve. The motion failed by the following vote: Yea: Barrett Nay: Ellis Absent: Thorne, and Abdur-Rahman Did Not Vote: Pitts, and Arrington", "note": null}, "P-089": {"source": "S05b", "locator": "p.17, added item 26-0735 (budget update, 2026-10-21; whole entry)", "text": "26-0735 Board of Commissioners Discussion: Update on the Budget Committee and the budget approval process. (Abdur-Rahman) (APPROVED TO ADD/DISCUSSED) A motion was made by Vice Chair Abdur-Rahman and seconded by Commissioner Ellis, to approve adding item #26-0735 to the Second Regular Meeting Agenda. The motion passed by the following vote: Yea: Pitts, Ellis, Barrett, Arrington, and Abdur-Rahman Absent: Thorne", "note": "The whole entry: it ends with the vote to add the item, and the next line is 'ADJOURNMENT'. It records no summary of the discussion."}, "P-090": {"source": "S05c", "locator": "p.1, heading and document status", "text": "FULTON COUNTY BOARD OF COMMISSIONERS FIRST REGULAR MEETING November 04, 2026 10:00 AM Fulton County Government Center Assembly Hall 141 Pryor Street SW Atlanta, Georgia 30303 POST AGENDA MINUTES This document is tentative, has not been ratified or approved by the Board of Commissioners, and is not binding on the County or any officer. Scheduled date for ratification: November 18, 2026", "note": null}, "P-091": {"source": "S05c", "locator": "p.4, item 26-0746 (ratification of minutes; whole entry)", "text": "26-0746 Clerk to the Commission Ratification of Minutes. (RATIFIED) First Regular Meeting Minutes, October 7, 2026 Second Regular Meeting Post Agenda Minutes, October 21, 2026 A motion was made by Commissioner Barrett and seconded by Commissioner Thorne, to ratify the meeting minutes. The motion passed by the following vote: Yea: Pitts, Thorne, Ellis, Barrett, and Abdur-Rahman Absent: Arrington", "note": null}, "P-092": {"source": "S05c", "locator": "p.11, item 26-0729 (motions to approve and to file, 2026-11-04; whole entry)", "text": "26-0729 Board of Commissioners Request approval of a Resolution to ensure transparency and informed decision-making in the development of the Fulton County budget; to prohibit across-the-board caps on departmental budget requests; to remove the 5% cap placed on all Fulton County departments for the 2027 budget; to require that all departmental budget requests are disclosed in the proposed budget; and for other purposes. (Barrett) (MOTION TO APPROVE FAILED ON 10/21/26) (FILED) a. A motion was made by Commissioner Barrett and seconded by Commissioner Arrington, to approve. (NO VOTE TAKEN) b. A substitute motion was made by Vice Chair Abdur-Rahman and seconded by Commissioner Thorne, to file. The motion passed by the following vote: Yea: Pitts, Thorne, Ellis, and Abdur-Rahman Nay: Barrett Did Not Vote: Arrington", "note": null}, "P-093": {"source": "S05c", "locator": "p.12, item 26-0766 (budget update, 2026-11-04; whole entry)", "text": "26-0766 Board of Commissioners Discussion: Update on the Budget Committee and the budget approval process. (Abdur-Rahman) (DISCUSSED)", "note": null}, "P-039": {"source": "S06", "locator": "2026 meeting schedule (whole document)", "text": "FULTON COUNTY BOARD OF COMMISSIONERS 2026 MEETING SCHEDULE FIRST REGULAR MEETINGS SECOND REGULAR MEETINGS Wednesday, January 7, 2026 Wednesday, January 21, 2026 Wednesday, February 4, 2026 Wednesday, February 18, 2026 Wednesday, March 4, 2026 Wednesday, March 18, 2026 Wednesday, April 1, 2026 Wednesday, April 15, 2026 Wednesday, May 6, 2026 Wednesday, May 20, 2026 Wednesday, June 3, 2026 Wednesday, June 17, 2026 *Wednesday, July 15, 2026 *(NO 2ND REGULAR MEETING) (POSTPONEDFROM JULY 1, 2026) Wednesday, August 5, 2026 Wednesday, August 19, 2026 Wednesday, September 2, 2026 Wednesday, September 16, 2026 Wednesday, October 7, 2026 Wednesday, October 21, 2026 Wednesday, November 4, 2026 Wednesday, November 18, 2026 Wednesday, December 2, 2026 Wednesday, December 16, 2026 *Except for the month of July, all meetings will be held on the first and third Wednesdays of each month at 10:00 a.m. in the Fulton County Government Center – Assembly Hall, 141 Pryor Street SW, Atlanta, Georgia. For more information, please contact the Office of the Clerk to the Commission at 404-612-8200 or visit Fulton County’s website at https://www.fultoncountyga.gov/", "note": null}, "P-040": {"source": "S07", "locator": "matter 26-0686 (2027 meeting calendar): title, status, dates", "text": "\"MatterFile\":\"26-0686\",\"MatterName\":null,\"MatterTitle\":\"Request approval of the proposed 2027 Fulton County Board of Commissioners’ Meeting Calendar. (APPROVED UPON ADOPTION OF THE CONSENT AGENDA)\",\"MatterTypeId\":94,\"MatterTypeName\":\"Consent - Board of Commissioners\",\"MatterStatusId\":80,\"MatterStatusName\":\"Agenda Ready\",\"MatterBodyId\":138,\"MatterBodyName\":\"Board of Commissioners\",\"MatterIntroDate\":\"2026-10-12T00:00:00\",\"MatterAgendaDate\":\"2026-10-21T00:00:00\",\"MatterPassedDate\":null", "note": null}, "P-041": {"source": "S07b", "locator": "proposed 2027 meeting schedule (whole document)", "text": "Fulton County Board of Commissioners Proposed 2027 Meeting Schedule First Regular Meetings Second Regular Meetings Wednesday, January 6, 2027 Wednesday, January 20, 2027 Wednesday, February 3, 2027 Wednesday, February 17, 2027 Wednesday, March 3, 2027 Wednesday, March 17, 2027 *Wednesday, April 14, 2027 Wednesday, April 21, 2027 (Postponed from April 7, 2027) Wednesday, May 5, 2027 Wednesday, May 19, 2027 Wednesday, June 2, 2027 Wednesday, June 16, 2027 *Wednesday, July 14, 2027 *No 2nd Regular Meeting (Postponed from July 7, 2027) Wednesday, August 4, 2027 Wednesday, August 18, 2027 Wednesday, September 1, 2027 Wednesday, September 15, 2027 Wednesday, October 6, 2027 Wednesday, October 20, 2027 Wednesday, November 3, 2027 Wednesday, November 17, 2027 Wednesday, December 1, 2027 Wednesday, December 15, 2027 * Except for the months of April and July, all meetings will be held on the first and third Wednesdays of each month at 10 a.m. in the Fulton County Government Center Assembly Hall, 141 Pryor Street SW, Atlanta, Georgia. For more information, please contact the Office of the Clerk to the Commission at 404-612-8200 or visit Fulton County’s website at www.fultoncountyga.gov", "note": null}, "P-098": {"source": "S08", "locator": "Public Notices page: the Board's Sept 30, 2026, 10 a.m. hearing on the proposed millage rate (captured 2026-11-08)", "text": "FULTON COUNTY BOARD OF COMMISSIONERS SPECIAL CALLED MEETING WEDNESDAY, SEPTEMBER 30, 2026 10 A.M. THE FULTON COUNTY GOVERNMENT CENTER ASSEMBLY HALL 141 PRYOR STREET, SW ATLANTA, GEORGIA 30303 The Fulton County Board of Commissioners will convene a Special Called Meeting on Wednesday, September 30, 2026 at 10 a.m. in the Fulton County Government Center, 141 Pryor Street, SW, Atlanta, Georgia 30303 for the purpose of a Public Hearing on proposed millage rate.", "note": "Revision 4. The same page lists a second hearing at 6 p.m. that day, and two hearings on July 29, 2026 that were canceled."}, "P-042": {"source": "S08", "locator": "Public Notices page, introduction and newest notice (captured 2026-11-08)", "text": "Public Notices are provided by applicable laws to inform citizens of special meetings, hearings, and other legislative events where a quorum of the Board of Commissioners is probable. Public Notices of the Board also appear in the county legal organ and posted throughout the Government Center, or at the exact meeting site. October 2026 PUBLIC NOTICE Fulton County Budget Commission - SPECIAL CALLED MEETINGS Monday, October 12, 2026, 10 a.m. – 5 p.m. Tuesday, October 13, 2026, 9 a.m. – 5 p.m. Wednesday, October 14, 2026, 9 a.m. – 5 p.m. Monday, October 19, 2026, 9 a.m. – 5 p.m. Tuesday, October 20, 2026, 9 a.m. – 4:30 p.m. Thursday, October 22, 2026, 9 a.m. – 5 p.m. Fulton County Government Center 141 Pryor Street, SW, Atlanta, GA 30303, Suite 3077A Special called meetings of the Fulton County Budget Commission will be conducted on the dates and locations provided above for the purpose of holding budget hearings for Fulton County’s 2027 General Fund Budget. Click here to view the meeting agenda . September 2026", "note": null}, "P-043": {"source": "S08b", "locator": "hearing agenda, heading and October 12-14", "text": "Fulton County Budget Commission Special Called Meetings Meeting Agenda Budget Proposal Meetings Priorty Area Monday, October 12th 10:00-11:00 BHDD Health & Human Services 11:00-12:00 Community Development Health & Human Services 12:00-1:00 LUNCH 1:00-2:00 HIV Elimination Health & Human Services 2:00-3:00 Public Works Health & Human Services 3:00-4:00 Senior Services Health & Human Services 4:00-5:00 Executive Team Discussion Tuesday, October 13th 9:00-10:00 Juvenile Court Justice & Safety 10:00-11:00 Public Defender Justice & Safety 11:00-12:00 Sheriff Justice & Safety 12:00-12:30 LUNCH 12:30-1:30 Marshal Justice & Safety 1:30-2:30 Solicitor General Justice & Safety 2:30-3:30 State Court Justice & Safety 3:30-4:30 Superior Court Administration Justice & Safety 4:30-5:00 Executive Team Discussion Wednesday, October 14th 9:00-10:00 AFCEMA Justice & Safety 10:00-11:00 Child Attorney Justice & Safety 11:00-12:00 Superior Court Clerk Justice & Safety 12:00-12:30 LUNCH 12:30-1:30 District Attorney Justice & Safety 1:30-2:30 E911 Justice & Safety 2:30-3:30 Medical Examiner Justice & Safety 3:30-4:30 Magistrate Court Justice & Safety", "note": null}, "P-044": {"source": "S08b", "locator": "hearing agenda, October 22", "text": "Thursday, October 22nd 9:00-10:00 Police Justice & Safety 10:00-11:00 Probate Court Justice & Safety", "note": null}, "P-045": {"source": "S09", "locator": "Budget page, introduction and newest documents (captured 2026-11-08)", "text": "Fulton County operates from a calendar year budget. Budgets are adopted annually for the General Fund and other specialty funds. Adopted budget documents are provided below. Budget Performance Reporting Strategic Plan 2026 FY 2026 Fulton County Adopted Budget FY2026 Fulton County Proposed Budget FY2026 Fulton County Government Revised Proposed Budget FY2026 Fulton County Government Revised Budget Presentation", "note": null}, "P-046": {"source": "S09b", "locator": "p.2, introduction", "text": "Fulton County’s Fiscal Year 2026 Final Adopted Budget was approved by the Board of Commissioners on January 21, 2026. This budget includes all recommendations outlined in the Fiscal Year 2026 Proposed Budget provided on November 15, 2025, presented on November 19, 2025, and amendments approved on January 21, 2026. In this booklet, you will find the budget message submitted to the Board as part of the Fiscal Year 2026 Proposed Budget, and additional memos describing all modifications to that budget.", "note": "Widened in revision 2 to include the sentence saying the book reprints the budget message submitted with the FY2026 proposed budget."}, "P-047": {"source": "S09b", "locator": "p.4, FY2026 budget resolution, lines 4-11 (signed 2026-01-21)", "text": "WHEREAS, Fulton County's County Manager submitted a proposed budget to the Board of Commissioners on November 15th, 2025, as required under the County's Budget Ordinance, and WHEREAS, Fulton County's Board of Commissioners held a public hearing, as required by O.C.G.A. § 36-81-5, at a meeting on December 3, 2025, and WHEREAS, O.C.G.A. § 36-81-6 requires that on a date after the conclusion of the hearing, the governing authority adopt a budget ordinance or resolution making appropriations in such sums as the governing authority may deem sufficient, whether greater or less than the sums presented in the proposed budget.", "note": "This page is a signed scan; its text layer omits the space after 'WHEREAS,' on line 6. Checked against the rendered page image."}, "P-048": {"source": "S09b", "locator": "p.7 (budget message): the jail agreement", "text": "In January 2025, the County entered into an agreement with the United States Department of Justice to address constitutional violations at the Fulton County Jail and mandated the County implement specific reforms to improve jail conditions, including providing better safety from violence, ensuring adequate medical and mental health care, improving staffing and supervision, and creating sanitary and humane living conditions. We were challenged with navigating consent decree compliance while continuing to recover from our 2024 cybersecurity incident.", "note": null}, "P-049": {"source": "S09b", "locator": "p.8 (budget message): hearings and enhancement requests (repeated on p.19)", "text": "The County reinstated formal budget hearings allowing department and agencies the platform to review current and historical personnel and operating data to identify key spending trends. The hearings also presented a platform for our partners to communicate opportunities, challenges and prioritize their additional financial requests (if any). Even with the efforts to reprioritize current resources, the county received hundreds of operating and capital enhancements. All submissions were received and carefully reviewed, however many included investment requests for enhanced programming with recurring costs. The volume of requests coupled with known budget pressures and financial resources resulted in many unmet requests. Working within the current financial constraints, a rules-based criterion which first categorized enhancements based on contractual, regulatory, statutory, board action, inflationary drivers and cybersecurity was utilized in evaluating additional investments above a department’s recurring base budget. We’ve continued utilization of non-recurring revenue for recurring costs where available, however there were no additional resources available to fund program enhancements above and beyond the increased costs for maintaining a current service level. This further emphasizes that additional resources will be needed for consent decree compliance. The enhancement submissions are included as an appendix and are categorized in tranches including Sheriff, Justice and Safety, Health and Human Services, Infrastructure and Economic Development and Open and Responsible Government.", "note": null}, "P-050": {"source": "S09b", "locator": "p.21 (budget message): consent decree costs and a 1% reduction", "text": "• Consent Decree: Includes funding of $31.8 million in Board approved consent decree costs. While over $30 million is included in the 2026 budget, costs could exceed a range from $30 - $60 million. To date, all decree compliance related costs are still being vetted and have not been determined, but as costs accelerate from partial year to full year recurring implementation, this number is expected to grow. Additional costs will be presented to the Board for consideration when available. • 1% Reduction across all Agencies/Departments: Includes a decrease of $10 million in the general fund budget by instituting a 1% decrease across all agencies and departments. Appointing Authorities will be able to review their remaining resources to determine impact.", "note": null}, "P-051": {"source": "S09b", "locator": "p.33 (budget message): requests beyond the proposal", "text": "In addition to the above-mentioned enhancements already considered, there were almost $158 million in unique personnel/operating requests and over $64 million in capital requests received from departments, agencies and external stakeholders during the FY2026 budget process. The requests were separately reviewed and categorized into tranches for funding consideration if additional resources are realized at the end of 2025.", "note": null}, "P-101": {"source": "S09b", "locator": "p.20 (budget message): property tax as the main revenue; when the 2026 tax rate (millage rate) is set", "text": "The County’s primary source of revenue is property tax. The FY2026 current year property tax revenue projection assumes a flat millage rate of 8.87 as provided by the Board of Commissioners when setting the FY2025 millage rate. The final determination of the FY2026 millage rate by the Board of Commissioners will take place during the summer of 2026.", "note": "Revision 4. Removed a bullet symbol (◼) that the PDF's layout places inside the sentence."}, "P-102": {"source": "S09b", "locator": "p.9 (budget message): how a property tax bill is figured", "text": "The tax digest value combined with the millage rate is used to determine the tax billing amount.", "note": null}, "P-103": {"source": "S09b", "locator": "p.16 (budget message, conclusion): whom the 2026 budget is for", "text": "This $1.4 billion budget reflects both, the needs of our residents and a steady operational and fiscally responsible plan.", "note": null}, "P-086": {"source": "S09b", "locator": "p.22 (budget message): what the county means by 'base budget'", "text": "As part of our FY2026 budget development process, we identified the County’s “Base Budget”. This represents the current funding needed to address historical spending patterns including personnel expenditures (filled and vacant) and other operational spending.", "note": null}, "P-052": {"source": "S09b", "locator": "p.76, adopted budget by fund (in millions)", "text": "FY2026 Adopted Budget by Fund and Year in millions $ FY2024 FY2025 FY2026 Fund Name Amended Amended Adopted Budget Budget Budget General Fund $ 954.1 $ 989.8 $ 1,057.1 Airport Fund 7.8 7 .9 8.0 Water Revenue Fund 164.1 1 71.0 181.4 Water Renewal Fund 105.5 9 9.0 19.1 FID Fund 28.3 3 1.1 30.3 Animal Services Fund 12.4 1 2.8 13.2 911 Emergency Fund 8.9 9 .3 9.6 Bond Fund Library 16.6 1 6.6 15.6 Risk Fund 60.0 7 0.1 83.2 Special Appropriation 22.2 2 3.7 23.9 Grand Total $ 1,379.9 $ 1,431.1 $ 1,441.3", "note": "Some figures carry stray spaces from the PDF's column layout (for example '7 .9' for 7.9); not corrected because the page cites only the General Fund and grand-total figures."}, "P-053": {"source": "S09b", "locator": "p.77, adopted budget by focus area and fund (in millions)", "text": "FY2026 Adopted Budget by Focus Area and Fund in millions $ Health and Infrastructure Justice and Open and Arts and Fund Name Human & Economic Grand Total Safety Responsible Libraries Services Development General Fund $ 160.6 $ 507.5 $ 194.0 $ 150.6 $ 44.4 $ 1,057.1", "note": "The column headings are stacked in the PDF, so extraction interleaves them. Read against the rendered page: the columns are Health and Human Services, Justice and Safety, Open and Responsible, Infrastructure & Economic Development, Arts and Libraries, Grand Total."}, "P-054": {"source": "S09b", "locator": "p.78, General Fund schedule (whole page)", "text": "Fund : 100 Adopted FY2026 Adopted Budget - General Fund January 21, 2026 2026 Proposed Changes to Changes to 2026 Adopted 2023 Actual 2024 Actual 2025 Actual Proposed Proposed Budget Budget Budget Budget 1-7-26 1-21-26 REVENUES 0 Property Taxes $ 693,724,900 $ 754,876,695 $ 790,822,783 $ 815,496,192 $ 4,055
