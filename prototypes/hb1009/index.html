tricts must publish the rules.", "cite": ["P-015"]}]}], "cardMeta": null}]}, {"id": "decision", "title": "Layer 2: The decision", "blocks": [{"kind": "para", "label": "What was decided", "units": [{"t": "Whether to extend Georgia's school-day device ban for public schools from kindergarten through 8th grade to high school.", "cite": ["P-028", "P-006"]}]}, {"kind": "para", "label": "What the law says the ban is for", "units": [{"t": "It defines a \"distraction-free education\" as one where student devices are banned to reduce distractions, improve school results, and increase meaningful interactions and focused learning.", "cite": ["P-057"]}]}, {"kind": "para", "label": "Before this law", "units": [{"t": "A 2025 law already bars devices during the school day for public school students in kindergarten through 8th grade.", "cite": ["P-006", "P-028"]}, {"t": "That rule had to start no later than July 1, 2026.", "cite": ["P-006"]}]}, {"kind": "para", "label": "What changes for high schools", "units": [{"t": "The rules that already cover younger students in public schools will apply through 12th grade.", "cite": ["P-007", "P-008"]}]}, {"kind": "num", "label": null, "units": [{"t": "Starting no later than July 1, 2027, students won't be allowed to use devices during the school day.", "cite": ["P-007"]}, {"t": "That means from the first bell to the last, including breaks and time between classes.", "cite": ["P-002"]}]}, {"kind": "num", "label": null, "units": [{"t": "Each district chooses where phones go, such as lockers, locked pouches or a set place in the classroom.", "cite": ["P-009"]}]}, {"kind": "num", "label": null, "units": [{"t": "Parents who need to reach their child during the school day must contact the school.", "cite": ["P-011"]}, {"t": "Emergency messages go through the school's own systems.", "cite": ["P-011"]}]}, {"kind": "num", "label": null, "units": [{"t": "Students whose IEP, Section 504 plan or medical plan explicitly requires a device may use it as the plan requires.", "cite": ["P-013"]}, {"t": "IEP and Section 504 plans are formal school plans for students with disabilities.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}, {"kind": "num", "label": null, "units": [{"t": "Breaking the rules leads to escalating consequences, such as warnings, taking the device, calling parents and other actions.", "cite": ["P-012"]}]}], "subs": [{"title": "Also new in this law", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "District policies must be reviewed every year by January 1, instead of by a one-time deadline of January 1, 2026.", "cite": ["P-008", "P-020"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The law now names dual enrollment, work-based learning and apprenticeships as examples of off-campus activities that district rules must cover.", "cite": ["P-010", "P-065"]}, {"t": "Dual enrollment means taking college classes while in high school.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}, {"kind": "bullet", "label": null, "units": [{"t": "E-readers were dropped from the law's list of example devices, but that list is not complete.", "cite": ["P-004", "P-021"]}]}], "cardMeta": null}, {"title": "Other rules in the law", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "Districts must set rules for off-campus activities like field trips, school transportation and sports.", "cite": ["P-010"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Students learning online away from campus are not covered.", "cite": ["P-005"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Schools can still give students laptops and tablets for schoolwork.", "cite": ["P-017"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Schools are encouraged to hold family workshops, town halls and screen-free challenges.", "cite": ["P-060"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Charter schools and other schools that can usually skip some state rules can't skip this one.", "cite": ["P-018"]}]}], "cardMeta": null}]}, {"id": "options", "title": "Layer 3: Options and tradeoffs", "blocks": [], "subs": [{"title": "Option A: Keep the old law (no state rule for high schools)", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "Sets a device ban for public school students in kindergarten through 8th grade only.", "cite": ["P-006", "P-066"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "HB 1009, signed May 5, 2026, expands that law to high schools; the change takes effect Dec 31, 2026.", "cite": ["P-024", "P-028", "P-019"]}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "High school students and families keep whatever phone access their district allows.", "tag": "analysis", "note": "the state rule covered only K-8 (P-006), so grades 9-12 were left to districts"}, {"t": "Teacher Darryl Adams said high school students, who are older and often more independent, should be allowed to keep access to their phones.", "cite": ["P-048"]}, {"t": "Schools avoid new monitoring and enforcement duties and keep local control.", "tag": "analysis", "note": "the duties come from P-014, and P-018 bars opting out"}, {"t": "If Florida's results apply here, students would also avoid the short-term rise in suspensions seen there, especially among Black students.", "tag": "analysis", "note": "based on P-039"}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "In districts without limits, phones stay in class, the kind of distraction the new law aims to reduce.", "tag": "analysis", "note": "the K-8-only rule (P-006) left grades 9-12 to districts; the law defines distraction-free education as banning access \"to minimize distractions\" (P-057)"}, {"t": "State School Superintendent Richard Woods called for extending the ban to end the harm he said constant phone access causes.", "cite": ["P-036"]}, {"t": "If Florida's results apply here, students would miss the test-score and attendance gains found there.", "tag": "analysis", "note": "based on P-040"}, {"t": "High school rules could differ from one district to the next.", "tag": "analysis", "note": "follows from leaving grades 9-12 to each district"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether districts would have limited phones on their own.", "tag": "editorial", "note": ""}, {"t": "Sen. Sally Harrell said, \"It has been done in high schools already, it’s been very successful and we look forward to rolling that out statewide.\"", "cite": ["P-046"]}, {"t": "We found no count of districts that already had them.", "tag": "analysis", "note": "none in the sources reviewed"}]}], "cardMeta": null}, {"title": "Option B: HB 1009 as passed (now law)", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "Bans device access for public high school students during the school day, from the first bell to the last, including breaks and time between classes.", "cite": ["P-007", "P-002"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "It passed the House 145 to 20 and the Senate 52 to 0, and was signed on May 5, 2026.", "cite": ["P-025", "P-024"]}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "In Florida, phone bans led to better test scores in the second year, and the study's findings suggest they cut unexcused absences.", "cite": ["P-040", "P-038"]}, {"t": "Among parents who back a ban, 87.7% expected better focus and learning, 71.2% better in-person social interactions, 69.1% better mental health and 60.3% better physical health and safety.", "cite": ["P-034"]}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "Families won't be able to reach students directly during the school day and will have to contact the school instead.", "cite": ["P-007", "P-011"]}, {"t": "Among parents who oppose a ban, 74.8% said there would be no way to reach their child in an emergency.", "cite": ["P-035"]}, {"t": "Students who use phones or smartwatches for health apps need a formal plan that explicitly requires the device, unless another law requires access.", "cite": ["P-013", "P-007", "P-004"]}, {"t": "Schools must set up phone storage methods, monitor and enforce the rules, review policies every year and keep families informed.", "cite": ["P-009", "P-014", "P-008", "P-015"]}, {"t": "The law gives schools state guidance but sets aside no money; any state funding would come through the budget, which we didn't review.", "tag": "analysis", "note": "no funding provision in the full enacted text, P-001 to P-019 and P-056 to P-061; P-016 provides guidance"}, {"t": "In Florida, enforcing phone bans led to more suspensions in the short term, especially among Black students; the rise began to fade after the first year.", "cite": ["P-039"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether, and how much, focus, learning and well-being will change in Georgia high schools, and whether suspensions will rise or emergency contact will suffer, since the evidence so far is limited (see Layer 4).", "tag": "editorial", "note": ""}, {"t": "How much the new duties will cost, since we found no official cost estimate (fiscal note) and costs depend on each district's choices, such as lockers or locked pouches.", "tag": "analysis", "note": "searched the 2025-2026 fiscal-note list, which has a 2026 section (P-062), for 1009; storage options are listed in P-009"}]}], "cardMeta": null}, {"title": "Option C: The Senate amendment that failed", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "This proposed change, called an amendment, would have let districts allow high school students to use phones in the brief time between classes.", "cite": ["P-027"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "Sen. Kemp of the 38th District offered it, and it failed, 13 to 38.", "cite": ["P-027", "P-026"]}, {"t": "This senator is not Gov. Brian Kemp.", "tag": "analysis", "note": "P-027 identifies \"Senator Kemp of the 38th\""}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "In districts that chose to allow it, students and families could reach each other between classes.", "tag": "analysis", "note": "inferred from the amendment text, P-027"}, {"t": "Each district would decide for itself.", "tag": "analysis", "note": "under P-027, access \"may be permitted in accordance with policies\" adopted by local school systems"}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "In those districts, part of the school day would no longer be phone-free.", "tag": "analysis", "note": "inferred from the amendment text, P-027"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether phones between classes would change focus or learning compared with a full-day ban, since no source we reviewed measured this.", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "arguments", "title": "Layer 4: Arguments you'll hear", "blocks": [{"kind": "para", "label": null, "units": [{"t": "In a survey of 1,002 Georgia parents in fall 2025, 70.8% supported a high school ban and 29.2% opposed it.", "cite": ["P-032", "P-033"]}, {"t": "The survey's margin of error, or how far off it could be, is about 4 points either way.", "tag": "computed", "note": "1.96 × 2.1 standard error (P-033) ≈ 4.1 percentage points"}]}, {"kind": "para", "label": null, "units": [{"t": "Our archived sources quote four officials and one student who support the law, and one teacher who argued against it.", "tag": "analysis", "note": "Gov. Kemp (P-029), Woods (P-036), Hilton (P-051), Harrell (P-044) and a student (P-052) for the law; Adams (P-047 to P-049) against"}, {"t": "That reflects whom those sources quoted, not how many people hold each view.", "tag": "editorial", "note": ""}, {"t": "The bill passed the House 145 to 20 and the Senate 52 to 0.", "cite": ["P-025"]}, {"t": "In the Senate, 13 senators voted for an amendment that would have let districts allow high school students to use phones between classes; it failed, and no senator voted against the final bill.", "cite": ["P-026", "P-027", "P-025"]}]}], "subs": [{"title": "How to read these cards", "blocks": [{"kind": "para", "label": null, "units": [{"t": "Every card uses the same fields, and one rule sets its evidence label.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Supported\" means the law's text or a study designed to show cause and effect backs the claim.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Uncertain\" means there are only statements, or studies that show links but not causes.", "tag": "editorial", "note": "labeling rule"}, {"t": "Values questions are marked as not mainly factual.", "tag": "editorial", "note": "labeling rule"}, {"t": "Cards for the law come first, then cards against it; the order is not a ranking.", "tag": "editorial", "note": "ordering rule"}]}, {"kind": "para", "label": null, "units": [{"t": "Reasons given within each group come from smaller samples.", "tag": "analysis", "note": "each reason was asked only of parents who supported, or only of those who opposed, a ban (P-034, P-035)"}, {"t": "Their margins of error are about 3.5 to 6 points for supporters' reasons and about 6 to 8 points for opponents' reasons.", "tag": "computed", "note": "1.96 × standard errors of 1.8 to 2.9 (P-034) ≈ 3.5 to 5.7; 1.96 × 2.9 to 4.2 (P-035) ≈ 5.7 to 8.2"}, {"t": "Parents could give more than one reason.", "tag": "analysis", "note": "the reasons in each table add up to more than 100% (P-034, P-035)"}]}, {"kind": "para", "label": null, "units": [{"t": "Two studies appear below.", "cite": ["P-055", "P-041"]}, {"t": "The Florida study is a 2025 working paper designed to estimate cause and effect.", "cite": ["P-055", "P-038"]}, {"t": "It used a \"quasi-experimental\" method, meaning it compared students without running a randomized experiment.", "tag": "analysis", "note": "P-038 names the method; the plain-language meaning is ours"}, {"t": "A working paper is an early research report shared before formal publication.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "Its summary says the bans' effects were larger in middle and high schools, where more students own smartphones.", "cite": ["P-040"]}, {"t": "It doesn't say whether that applies to every effect, including suspensions.", "tag": "analysis", "note": "P-040's sentence follows all three findings and doesn't name which ones"}, {"t": "Its summary doesn't say whether Florida's bans covered the whole school day, as Georgia's will.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't describe the bans' scope; Georgia's rule covers the whole day (P-002, P-007)"}, {"t": "The English study surveyed 1,227 students ages 12 to 15 at 30 schools and measured well-being with a standard questionnaire.", "cite": ["P-042", "P-041", "P-064"]}, {"t": "It compared schools at one point in time, and its strict schools banned recreational phone use.", "cite": ["P-041"]}, {"t": "We read each study's summary, not the full paper.", "tag": "editorial", "note": "process note"}]}], "cardMeta": null}, {"title": "1. The ban will help students learn", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Supporters say fewer distractions mean more learning; a Florida study found phone bans led to better test scores in the second year.", "cite": ["P-029", "P-036", "P-040"]}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Gov. Brian Kemp said the bills he signed would \"reduce distractions in the classroom.\"", "cite": ["P-029"]}, {"t": "State School Superintendent Richard Woods said learning without distractions is \"both an academic issue and a mental health issue.\"", "cite": ["P-036"]}, {"t": "Among parents who support a ban, 87.7% expected better focus and learning.", "cite": ["P-034"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "In Florida, phone bans led to better test scores in the second year, and the study's findings suggest they cut unexcused absences.", "cite": ["P-040", "P-038"]}, {"t": "Fewer unexcused absences may explain a large share of the test-score gains.", "cite": ["P-040"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed this directly.", "tag": "analysis", "note": "none of the archived statements argues that bans hurt learning; 19.8% of opposing parents said phones are needed for schoolwork (P-035), a related concern covered in card 6"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "In Florida, the test-score gains came in the second year, after a first year in which suspensions rose.", "cite": ["P-039", "P-040"]}, {"t": "Neither study summary we read reports that bans hurt learning.", "tag": "analysis", "note": "no negative learning result in P-038 to P-043, P-064, P-067 or P-068"}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The study used data from Florida only.", "cite": ["P-038"]}, {"t": "Its summary doesn't describe how much of the school day the bans covered.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't describe the bans' scope"}, {"t": "The English study's summary reports no test-score results, and we didn't read the full paper.", "tag": "analysis", "note": "its listed outcomes are well-being and phone and social media time (P-064)"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether Georgia high schools will see results like Florida's, since we found no Georgia high school results yet.", "tag": "analysis", "note": "none in the sources reviewed; Georgia's rule isn't required until July 1, 2027 (P-007)"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "predictive", "evidence": "Supported, with limits (one Florida working paper designed to estimate cause and effect; gains in year two; no Georgia results yet)"}}, {"title": "2. The ban will help teens' mental health and friendships", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Supporters expect better mental health and friendships; the one study we found, of younger students in England, found no evidence of a well-being difference.", "cite": ["P-034", "P-042"]}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Woods called for extending the ban \"to end the harm caused by constant technology access and interruption.\"", "cite": ["P-036"]}, {"t": "The bill's sponsor, Rep. Scott Hilton, said, \"The technology meant to bring people together actually makes us feel further apart.\"", "cite": ["P-051"]}, {"t": "Students testified in support at the hearing, and the article reported that one told lawmakers phones \"have become addictive for teens.\"", "cite": ["P-052"]}, {"t": "Among parents who support a ban, 71.2% expected better in-person social interactions and 69.1% better mental health.", "cite": ["P-034"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Hilton said districts had reported less isolation among younger students under all-day phone limits.", "cite": ["P-051"]}, {"t": "In the English study, strict rules went with about 40 minutes less phone time and about 32 minutes less social media time during school.", "tag": "computed", "note": "0.67 hours × 60 ≈ 40 minutes; 0.54 hours × 60 ≈ 32 minutes (P-042)"}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "The English study's authors said there is \"no evidence that restrictive school policies are associated with overall phone and social media use or better mental wellbeing in adolescents.\"", "cite": ["P-043"]}, {"t": "They added that their findings \"do not provide evidence to support the use of school policies that prohibit phone use during the school day in their current form, and indicate that these policies require further development.\"", "cite": ["P-043"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "That study found no evidence of better well-being at schools with strict rules, or of less phone use overall.", "cite": ["P-042", "P-043"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The district reports Hilton described were about younger students.", "cite": ["P-051"]}, {"t": "The article gives no measurements behind them.", "tag": "analysis", "note": "P-051 reports the claim without data"}, {"t": "The English study can show links, not cause and effect, and its summary reports no results on friendships.", "tag": "analysis", "note": "it compared schools at one point in time (P-041); its listed outcomes are in P-064"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How Georgia teens' well-being and friendships will change, because no study we found measured well-being or friendships among high school students under an all-day ban.", "tag": "editorial", "note": "reason drawn from P-038 to P-042 and P-064"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "predictive", "evidence": "Uncertain (one study of 12- to 15-year-olds in England found no evidence of a well-being difference; it couldn't test cause and effect)"}}, {"title": "3. Phone bans are already working in Georgia", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Supporters point to the 2025 law for younger grades and to schools that already limit phones.", "cite": ["P-028", "P-046"]}, {"t": "The evidence so far is statements, not measured results.", "tag": "analysis", "note": "no data appears in P-028, P-046, P-051 or P-053"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "The governor's office said HB 1009 \"builds on the success of HB 340,\" the 2025 law for kindergarten through 8th grade.", "cite": ["P-028"]}, {"t": "Sen. Sally Harrell said, \"It has been done in high schools already, it’s been very successful.\"", "cite": ["P-046"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Hilton said districts had reported improved focus among younger students under all-day phone limits.", "cite": ["P-051"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed that the rules work.", "tag": "analysis", "note": "none of the archived statements disputes it; teacher Darryl Adams's concerns were about enforcement, emergencies and older students (P-047 to P-049)"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The high school ban was signed on May 5, 2026, before the statewide K-8 deadline of July 1, 2026.", "cite": ["P-024", "P-006"]}, {"t": "So statewide K-8 results weren't available yet.", "tag": "analysis", "note": "follows from the two dates"}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "No source we reviewed measured how the K-8 ban is working.", "tag": "analysis", "note": "none of the archived sources reports K-8 outcome data"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How well the K-8 rules work statewide, because they only had to start in 2026.", "tag": "editorial", "note": "reason from P-006"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "factual", "evidence": "Uncertain (statements only; no measured results)"}}, {"title": "4. Families lose direct contact with students during the school day", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Students won't be allowed to use phones during the school day, so families will have to reach them through the school.", "cite": ["P-007", "P-011"]}, {"t": "Our sources have no data on how this affects safety in a crisis.", "tag": "analysis", "note": "no archived source reports how school alerts or students' own phones perform in emergencies"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Among parents who oppose a ban, 74.8% said there would be no way to reach their child in an emergency.", "cite": ["P-035"]}, {"t": "Teacher and parent Darryl Adams said phones can be critical for families seeking information during emergencies.", "cite": ["P-049"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Under the law, parents who need to reach their child during the school day must contact the school directly.", "cite": ["P-011"]}, {"t": "The law has no emergency exception for students' own devices.", "tag": "analysis", "note": "the full enacted text (P-001 to P-019, P-056 to P-061) allows access only under a plan that requires a device (P-013) or where access is \"required by law\" (P-007); neither is an emergency exception"}, {"t": "Adams said that when two of his daughters were in a lockdown, he could not get updates for hours.", "cite": ["P-049"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Sen. Sally Harrell said, \"We’ve gotten very dependent on being able to reach our kids whenever we want to, but that education time needs to be protected.\"", "cite": ["P-044"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "An Emory public health professor, Julie Gazmararian, said, \"Parents’ concerns about emergency access are valid and understandable. However, effective cellphone policies can address this by establishing rapid parent notification systems and guaranteed access to phones when needed.\"", "cite": ["P-037"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The law doesn't require the rapid parent alerts or guaranteed phone access Gazmararian described.", "tag": "analysis", "note": "no such requirement in the full enacted text (P-001 to P-019, P-056 to P-061)"}, {"t": "Districts can add faster parent alerts, because the law sets minimum rules, but they can't allow students' own phones in an emergency unless a plan or another law requires it.", "tag": "analysis", "note": "P-008 says policies must \"at a minimum\" include its list; P-007 allows access only as the law provides, P-011 sends all emergency communication through school systems, and the only device exception is a plan that requires one (P-013)"}, {"t": "Adams's lockdown account is one family's experience; the source doesn't say when it happened or what phone rules applied.", "tag": "analysis", "note": "based on P-049"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How well school alert systems will reach families in a real crisis, and whether students' own phones make emergencies safer or not, since our sources have no data on either.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "factual, with a values question", "evidence": "Supported on the facts (the law's text); uncertain on emergency safety (no data on how school alerts perform, or on whether students' own phones make emergencies safer)"}}, {"title": "5. Enforcing the ban will burden school staff and can lead to conflict", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Teacher Darryl Adams said policing phones would burden teachers and administrators and can invite conflict; in Florida, enforcing phone bans led to more suspensions at first, especially among Black students.", "cite": ["P-047", "P-039"]}, {"t": "No source we reviewed measured staff workload.", "tag": "analysis", "note": "none of the archived sources includes workload data"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Teacher Darryl Adams said he worries the bill would put the burden on teachers and administrators to police phones, a task that can invite conflict.", "cite": ["P-047"]}, {"t": "He said, \"We have a lot of older teachers that do not want to have that confrontation.\"", "cite": ["P-047"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Each school system must monitor and enforce the rules, which may include assigning staff and auditing phone storage.", "cite": ["P-014"]}, {"t": "The law itself sets aside no money for these duties; any state funding would come through the budget, which we didn't review.", "tag": "analysis", "note": "no funding provision in the full enacted text, P-001 to P-019 and P-056 to P-061"}, {"t": "Consequences can include taking students' devices.", "cite": ["P-012"]}, {"t": "In Florida, enforcing phone bans led to more suspensions in the short term, especially among Black students.", "cite": ["P-039"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Woods told lawmakers he had heard nothing but support from teachers across Georgia.", "cite": ["P-053"]}, {"t": "Sen. Sally Harrell said legislators want to hear teachers say, \"I can just teach again.\"", "cite": ["P-045"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "In Florida, the rise in suspensions began to fade after the first year.", "cite": ["P-039"]}, {"t": "The authors said this may suggest a new steady state after an initial adjustment period.", "cite": ["P-039"]}, {"t": "Districts choose their own storage and enforcement methods, and the state must give them guidance and technical support.", "cite": ["P-009", "P-050", "P-016"]}, {"t": "Districts must also regularly review whether their rules work and adjust them as needed.", "cite": ["P-015"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "No source we reviewed measured staff workload or surveyed teachers.", "tag": "analysis", "note": "none of the archived sources includes workload or teacher survey data"}, {"t": "So neither Woods's account of teachers' support nor Adams's concern has been measured.", "tag": "analysis", "note": "follows from the previous sentence"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much work each district's approach will create, since district policies were not part of our sources.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "predictive", "evidence": "Supported on new duties and early suspensions (the law's text; one Florida working paper); uncertain on staff workload (not measured)"}}, {"title": "6. High school students should be allowed to keep phone access", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Teacher Darryl Adams said high school students should keep access to their phones, and among parents who oppose a ban, 45.5% said it should be the parents' choice.", "cite": ["P-048", "P-035"]}, {"t": "This is mainly a question of values.", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Teacher Darryl Adams said high school students, who are older and often more independent, should be allowed to keep access to their phones.", "cite": ["P-048"]}, {"t": "Among parents who oppose a ban, 45.5% said it should be the parents' choice and 41.9% said students need to learn responsible use.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Among parents who oppose a ban, 26.6% said phones are needed for health tools or apps and 19.8% said they're needed for schoolwork.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Students testified in support of the ban, and a 17-year-old said, \"Social media is the cigarette of our generation.\"", "cite": ["P-052"]}, {"t": "Most parents surveyed, 70.8%, supported a high school ban.", "cite": ["P-033"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The law lets a student use a device that their IEP, Section 504 plan or medical plan explicitly requires.", "cite": ["P-013"]}, {"t": "Schools can also still provide laptops and tablets for schoolwork.", "cite": ["P-017"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Our sources don't measure whether teens learn responsible phone use with or without a ban.", "tag": "analysis", "note": "none of the archived sources addresses this"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "This is mainly a disagreement about who should decide and what school is for.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "mostly values", "evidence": "Not mainly a factual question (who should decide; whether teens learn responsible use with or without a ban is untested)"}}]}, {"id": "evidence", "title": "Layer 5: Evidence", "blocks": [], "subs": []}]}, "passages": {"P-001": {"source": "S01", "locator": "p.1, lines 1-7 (title)", "text": "To amend Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, so as to require local school systems and public schools to enact policies and procedures for use of personal electronic devices at school and school sponsored events by students in grades nine through twelve; to revise provisions relative to permissible student use of personal electronic devices; to revise a definition; to provide for related matters; to provide for an effective date; to repeal conflicting laws; and for other purposes.", "note": null}, "P-002": {"source": "S01", "locator": "p.2, lines 18-21, O.C.G.A. 20-2-324.8(a)(2)", "text": "(2) 'Bell-to-bell' means the period beginning with the first bell signaling the start of instructional time and ending with the final bell signaling the conclusion of the school day and shall include all scheduled instructional time, breaks, transitions, assemblies, and other school related activities occurring between the start and end of the school day.", "note": null}, "P-003": {"source": "S01", "locator": "p.2, lines 15-17, (a)(1)", "text": "(1) 'Access' means viewing, holding, wearing, or otherwise using a device for the purpose of communication, internet access, gaming, recording, listening to music, or any other function commonly associated with personal electronic devices.", "note": null}, "P-004": {"source": "S01", "locator": "p.2, lines 26-30, (a)(4)", "text": "(4) 'Personal electronic device' means any portable electronic device capable of transmitting, receiving, or accessing communications, data, or media. Such term includes, but is not limited to, smartphones, smartwatches, tablets, headphones, and other devices with functionalities such as wireless communication, internet access, messaging, video recording, gaming, social media access, or data transmission.", "note": null}, "P-005": {"source": "S01", "locator": "p.2, lines 31-33, (a)(5)", "text": "(5) 'School day' means the bell-to-bell period for students receiving instruction on a school campus. Such term shall not apply to students receiving virtual or remote instruction away from a school campus.", "note": null}, "P-006": {"source": "S01", "locator": "p.2, lines 39-41, (b)(1) (existing law, unchanged)", "text": "(b)(1) Beginning no later than July 1, 2026, no public school student in kindergarten through grade eight shall be permitted to access personal electronic devices during the school day, except as otherwise provided in this Code section or required by law.", "note": null}, "P-007": {"source": "S01", "locator": "p.3, lines 42-44, (b)(2) (new)", "text": "(2) Beginning no later than July 1, 2027, no public school student in grades nine through 12 shall be permitted to access personal electronic devices during the school day, except as otherwise provided in this Code section or required by law.", "note": null}, "P-008": {"source": "S01", "locator": "p.3, lines 45-48, (c) and (c)(1)", "text": "(c) By January 1 each year, each local school system and public school shall adopt, and revise as appropriate, policies and procedures that, at a minimum: (1) Prohibit bell-to-bell access to personal electronic devices by students in kindergarten through grade twelve, subject to exceptions provided for by law;", "note": "The comma after 'January 1' is struck through in the PDF together with ', 2026,' (checked visually); the word-level extractor kept it."}, "P-009": {"source": "S01", "locator": "p.3, lines 49-51, (c)(2)", "text": "(2) Establish appropriate methods for storing students' personal electronic devices, including, but not limited to, a student's locker, a locked pouch, or a designated place in the classroom;", "note": null}, "P-010": {"source": "S01", "locator": "p.3, lines 52-56, (c)(3)", "text": "(3) Establish clear procedures for off-site events or activities, including all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds, including, but not limited to, participation in the dual enrollment program, work based learning programs, and apprenticeship programs;", "note": null}, "P-011": {"source": "S01", "locator": "p.3, lines 57-61, (c)(4)(A)-(B)", "text": "(4) Establish clear communication protocols that: (A) Facilitate all emergency communication through school emergency communication management systems and coordinated by school personnel; (B) Require parents or guardians who need to communicate with their student during the school day to contact the school directly; and", "note": null}, "P-012": {"source": "S01", "locator": "pp.3-4, lines 65-69, (c)(5)", "text": "(5) Provide that any student found in violation of such policies and procedures during the school day shall be subject to progressive consequences in accordance with the local school system's or public school's student code of conduct, including, but not limited to, verbal warnings, confiscation of personal electronic devices, parental notification, and other actions as deemed appropriate.", "note": "Removed the page footer/header ('H. B. 1009 - 3 -', 'LC 49 2527/AP') that falls inside this span at the page break."}, "P-013": {"source": "S01", "locator": "p.4, lines 70-73, (d)", "text": "(d) A student whose Individualized Education Program (IEP), Section 504 Plan, or medical plan explicitly mandates the use of a personal electronic device for medical or educational purposes shall be permitted to access the device as necessary to fulfill the requirements of the respective program or plan.", "note": null}, "P-014": {"source": "S01", "locator": "p.4, lines 74-80, (e)(1)(A)", "text": "(e)(1) Each local school system and public school shall: (A) Implement appropriate monitoring and enforcement mechanisms to ensure compliance with policies and procedures established pursuant to this Code section, which may include, but need not be limited to, assigning designated school personnel to oversee implementation and adherence to such policies and procedures, conducting periodic audits of personal electronic device storage, and regularly reviewing enforcement practices;", "note": null}, "P-015": {"source": "S01", "locator": "p.4, lines 81-86, (e)(1)(B)-(C)", "text": "(B) Ensure that parents, guardians, and students are informed of such policies and procedures through student and family handbooks, student codes of conduct, school public websites, and other common communication channels; and (C) Regularly review the effectiveness of such policies and procedures and adjust as necessary to ensure its continued alignment with educational goals and student well-being.", "note": null}, "P-016": {"source": "S01", "locator": "p.5, lines 93-95, (f)", "text": "(f) The Department of Education shall provide local school systems and public schools with guidance and technical support for the effective implementation and enforcement of the provisions of this Code section.", "note": null}, "P-017": {"source": "S01", "locator": "p.5, lines 96-98, (g)", "text": "(g) Nothing in this Code section shall be construed or applied to prohibit or limit a local school system or public school from providing school equipment, including, but not limited to, laptops and tablets, for student use for educational purposes.", "note": null}, "P-018": {"source": "S01", "locator": "p.5, lines 99-102, (h)", "text": "(h) This Code section shall not be subject to waiver pursuant to Code Section 20-2-82 for a strategic waivers school system, Code Section 20-2-2063.2 or 20-2-2065 for a charter system, Code Section 20-2-2065 for a charter school, Code Section 20-2-2096.3 for a completion special school, or Code Section 20-2-244.\"", "note": null}, "P-019": {"source": "S01", "locator": "p.5, lines 103-104, Section 2", "text": "SECTION 2. This Act shall become effective December 31, 2026.", "note": null}, "P-020": {"source": "S01", "locator": "p.3, line 45-46 (prior law, (c) lead-in)", "text": "(c) By January 1, 2026, each local school system and public school shall adopt policies and procedures that, at a minimum:", "note": "Prior-law reading reconstructed from the strike-through/underline markup; the comma after 'adopt' is underlined (new) in the PDF."}, "P-021": {"source": "S01", "locator": "p.2, lines 26-28 (prior law, (a)(4) device list)", "text": "(4) 'Personal electronic device' means any portable electronic device capable of transmitting, receiving, or accessing communications, data, or media. Such term includes, but is not limited to, smartphones, smartwatches, tablets, e-readers, headphones,", "note": null}, "P-022": {"source": "S02", "locator": "bill page: First Reader Summary", "text": "First Reader Summary A BILL to be entitled an Act to amend Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, so as to require local school systems and public schools to enact policies and procedures for use of personal electronic devices at school and school sponsored events by students in grades nine through twelve; to revise provisions relative to permissible student use of personal electronic devices; to revise a definition; to provide for related matters; to provide for an effective date; to repeal conflicting laws; and for other purposes.", "note": null}, "P-023": {"source": "S02", "locator": "bill page: Sponsors and Committees", "text": "Sponsors No. Number in list Name District 1. Hilton, Scott 48th 2. Jones, Jan 47th 3. Donatucci, Sandy 105th 4. Reeves, Matt 99th 5. Silcox, Deborah 53rd 6. Rice, Carmen 139th Sponsored In Senate By:Still, Shawn Committees House Committee: Education Senate Committee: Children and Families", "note": null}, "P-024": {"source": "S02", "locator": "bill page: Status History", "text": "Status History Date Status 12/31/2026 Effective Date 05/05/2026 Act 395 05/05/2026 House Date Signed by Governor 04/06/2026 House Sent to Governor 03/23/2026 Senate Passed/Adopted 03/23/2026 Senate Third Read 03/19/2026 Senate Read Second Time 03/18/2026 Senate Committee Favorably Reported 02/25/2026 Senate Read and Referred 02/24/2026 House Passed/Adopted 02/24/2026 House Third Readers 02/06/2026 House Committee Favorably Reported 01/28/2026 House Second Readers 01/27/2026 House First Readers 01/16/2026 House Hopper", "note": null}, "P-025": {"source": "S02", "locator": "bill page: Votes table", "text": "Votes Date Vote No. Yea Nay NV Exc 02/24/2026 House Vote #545 145 20 8 7 03/23/2026 Senate Vote #783 13 38 4 1 03/23/2026 Senate Vote #784 52 0 3 1", "note": null}, "P-026": {"source": "S02", "locator": "detail JSON: votes[1] (Senate Vote #783)", "text": "\"number\": 783, \"caption\": \"ADOPTION OF AMENDMENT #1 BY THE SENATOR FROM THE 38TH\", \"date\": \"2026-03-23T11:58:00\", \"name\": \"Senate Vote #783\", \"yea\": 13, \"nay\": 38, \"notVoting\": 4, \"excused\": 1,", "note": null}, "P-027": {"source": "S03", "locator": "p.1, full text", "text": "LOST Senator Kemp of the 38th offered the following amendment #1: 1 Amend HB 1009 (LC 49 2527) by replacing lines 18 through 21 with the following: 2 (2) 'Bell-to-bell' means the period beginning with the first bell signaling the start of 3 instructional time and ending with the final bell signaling the conclusion of the school 4 day and shall include all scheduled instructional time, assemblies, and other school 5 related activities; provided, however, that such term shall not include brief transitions 6 between classes for students in grades nine through 12, during which access to personal 7 electronic devices may be permitted in accordance with policies and procedures 8 adopted by local school systems and other public schools pursuant to this Code section.", "note": null}, "P-028": {"source": "S09", "locator": "press release, HB 1009 paragraph", "text": "HB 1009, sponsored by Representative Scott Hilton, expands the prohibition of personal electronic devices in public schools to include high school grades nine through twelve. This was also a top priority of Speaker Jon Burns and builds on the success of HB 340, signed by the Governor in 2025, which banned these devices in K-8 classrooms.", "note": "Removed spaces before commas left by link boundaries in the HTML."}, "P-029": {"source": "S09", "locator": "press release, Governor's quote", "text": "said Governor Brian Kemp . \"The bills I signed today implement proven strategies to improve literacy and math scores, reduce distractions in the classroom, expand pathways to graduation, and further support hardworking educators and families.", "note": null}, "P-030": {"source": "S10c", "locator": "page heading", "text": "2025-2026 Regular Session | Governor's Office of Planning and Budget Skip to main content Fiscal Notes 2025 Document Description", "note": null}, "P-031": {"source": "S12", "locator": "release, paragraph 1", "text": "A recent poll of Georgia parents shows more than two-thirds (71%) support expanding the state’s recent ban on personal cellphones in K-8 schools to include high schools.", "note": null}, "P-032": {"source": "S12", "locator": "release, methods paragraph", "text": "This year’s survey was conducted among 1,002 Georgia parents between Oct. 30 and Nov. 24, 2025, and was designed to create population-representative estimates.", "note": null}, "P-033": {"source": "S12", "locator": "release, table: support", "text": "Do you support high schools banning student cellphone use during the school day? Response Overall % (SE) Yes 70.8 (2.1) No 29.2 (2.1)", "note": null}, "P-034": {"source": "S12", "locator": "release, table: reasons for supporting", "text": "Reasons for Supporting a High School Cellphone Ban Asked among parents who support a ban. Reason Overall % (SE) Improved academic focus and learning 87.7 (1.8) Improved in-person social interactions 71.2 (2.6) Improved mental health and wellbeing 69.1 (2.6) Improved physical health and safety 60.3 (2.9)", "note": null}, "P-035": {"source": "S12", "locator": "release, table: reasons for opposing", "text": "Reasons for Opposing a High School Cellphone Ban Asked among parents who oppose a ban. Reason Overall % (SE) Should be parental choice 45.5 (4.2) No way to reach child during emergency 74.8 (3.5) Phones needed for health tools/apps 26.6 (3.6) Phones needed for schoolwork 19.8 (2.9) Students need to learn responsible use 41.9 (4.2)", "note": null}, "P-036": {"source": "S12", "locator": "release, quote: State School Superintendent", "text": "“Students’ ability to learn without distractions is both an academic issue and a mental health issue,” State School Superintendent Richard Woods said. “I hear this directly from students, parents, and educators, and this survey bears out what I’ve heard in those conversations. This is why we are calling for Georgia’s distraction-free legislation to be extended into grades 9-12, to end the harm caused by constant technology access and interruption.", "note": null}, "P-037": {"source": "S12", "locator": "release, quote: Emory epidemiologist", "text": "“Parents’ concerns about emergency access are valid and understandable. However, effective cellphone policies can address this by establishing rapid parent notification systems and guaranteed access to phones when needed,\" says Julie Gazmararian, PhD, professor of epidemiology at the Rollins School of Public Health.", "note": "Removed a space before a comma left by a link boundary."}, "P-038": {"source": "S13a", "locator": "abstract, methods", "text": "In this study, we try to fill this gap by examining the causal effects of bans on student test scores, suspensions, and absences using detailed student-level data from Florida and a quasi-experimental research strategy relying upon differences in pre-ban cellphone use by students, as measured by building-level Advan data.", "note": null}, "P-039": {"source": "S13a", "locator": "abstract, finding 1", "text": "First, we show that the enforcement of cellphone bans in schools led to a significant increase in student suspensions in the short-term, especially among Black students, but disciplinary actions began to dissipate after the first year, potentially suggesting a new steady state after an initial adjustment period.", "note": null}, "P-040": {"source": "S13a", "locator": "abstract, findings 2-3", "text": "Second, we find significant improvements in student test scores in the second year of the ban after that initial adjustment period. Third, the findings suggest that cellphone bans in schools significantly reduce student unexcused absences, an effect that may explain a large fraction of the test score gains. The effects of cellphone bans are more pronounced in middle and high school settings where student smartphone ownership is more common.", "note": null}, "P-055": {"source": "S13a", "locator": "page, suggested citation", "text": "David N. Figlio and Umut Özek, \"The Impact of Cellphone Bans in Schools on Student Outcomes: Evidence from Florida,\" NBER Working Paper 34388 (2025), https://doi.org/10.3386/w34388.", "note": null}, "P-041": {"source": "S13b", "locator": "abstract, methods", "text": "We conducted a cross-sectional observational study with adolescents from 30 English secondary schools, comprising 20 with restrictive (recreational phone use is not permitted) and 10 with permissive (recreational phone use is permitted) policies.", "note": null}, "P-042": {"source": "S13b", "locator": "abstract, findings", "text": "We recruited 1227 participants (age 12–15) across 30 schools. Mean WEMWBS score was 47 (SD = 9) with no evidence of a difference between groups (adjusted mean difference −0.48, 95% CI −2.05 to 1.06, p = 0.62). Adolescents attending schools with restrictive, compared to permissive policies had lower phone (adjusted mean difference −0.67 h, 95% CI −0.92 to −0.43, p = 0.00024) and social media time (adjusted mean difference −0.54 h, 95% CI −0.74 to −0.36, p = 0.00018) during school time, but there was no evidence for differences when comparing usage time on weekdays or weekends.", "note": null}, "P-043": {"source": "S13b", "locator": "abstract, interpretation", "text": "There is no evidence that restrictive school policies are associated with overall phone and social media use or better mental wellbeing in adolescents. The findings do not provide evidence to support the use of school policies that prohibit phone use during the school day in their current form, and indicate that these policies require further development.", "note": null}, "P-044": {"source": "S16", "locator": "article, paragraphs 2-3 (Sen. Harrell)", "text": "State Sen. Sally Harrell said the proposal already has bipartisan support. “We’ve gotten very dependent on being able to reach our kids whenever we want to, but that education time needs to be protected,” Harrell said.", "note": null}, "P-045": {"source": "S16", "locator": "article, Sen. Harrell on teachers", "text": "“When you hear a teacher say, ‘I can just teach again,’ that’s what legislators want to hear,” she said.", "note": null}, "P-046": {"source": "S16", "locator": "article, Sen. Harrell on other high schools", "text": "“It has been done in high schools already, it’s been very successful and we look forward to rolling that out statewide,” she said.", "note": null}, "P-047": {"source": "S16", "locator": "article, teacher Darryl Adams on enforcement", "text": "Darryl Adams, a teacher, said he worries the bill would put the burden on teachers and administrators to police phones, a task that can invite conflict. “We have a lot of older teachers that do not want to have that confrontation,” Adams said.", "note": null}, "P-048": {"source": "S16", "locator": "article, Adams on older students", "text": "Adams also argues that high school students, who are older and often more independent, should be allowed to keep access to their phones.", "note": null}, "P-049": {"source": "S16", "locator": "article, Adams on emergencies", "text": "As a parent, Adams said phones can be critical for families seeking information during emergencies. He recalled a time when two of his daughters were in lockdown and he was unable to get updates for hours.", "note": null}, "P-050": {"source": "S16b", "locator": "article, enforcement method", "text": "The bill does not require a single statewide enforcement method, leaving districts to decide how to keep phones out of students’ hands during class.", "note": null}, "P-051": {"source": "S16b", "locator": "article, sponsor Rep. Scott Hilton", "text": "Republican state Rep. Scott Hilton, the sponsor, said the state should move quickly after districts reported improved focus and less isolation among younger students under “bell-to-bell” phone limits. “The technology meant to bring people together actually makes us feel further apart,” Hilton said.", "note": null}, "P-052": {"source": "S16b", "locator": "article, student testimony", "text": "Students testified in support during the hearing. [name withheld: minor], 17, a Milton High School student, told lawmakers that phones have become addictive for teens. “Social media is the cigarette of our generation,” [the student] said.", "note": "The student is a minor; our standards describe minors by role, not name. Only the name was replaced."}, "P-053": {"source": "S16b", "locator": "article, State School Superintendent testimony", "text": "State School Superintendent Richard Woods testified Tuesday. He told lawmakers he has heard nothing but support from teachers across Georgia.", "note": null}, "P-056": {"source": "S01", "locator": "p.1, lines 8-14 (enacting clause, Section 1)", "text": "BE IT ENACTED BY THE GENERAL ASSEMBLY OF GEORGIA: SECTION 1. Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, is amended by revising Code Section 20-2-324.8, relating to use of personal electronic devices during school day by students, as follows: \"20-2-324.8. (a) As used in this Code section, the term:", "note": null}, "P-057": {"source": "S01", "locator": "p.2, lines 22-25, (a)(3)", "text": "(3) 'Distraction-free education' means a learning environment where student access to personal electronic devices is prohibited to minimize distractions, improve academic outcomes, and increase meaningful interactions and focused learning experiences.", "note": null}, "P-058": {"source": "S01", "locator": "p.2, lines 34-38, (a)(6)", "text": "(6) 'School equipment' means any computer or computer networking equipment, technology or technology related device or service, or communication system or service that is operated, owned, leased, and made available to students by a local board of education, local school system, or public school and that is used for transmitting, receiving, or accessing communications, data, or media.", "note": null}, "P-059": {"source": "S01", "locator": "p.3, lines 62-64, (c)(4)(C)", "text": "(C) Communicate rules for school personnel and sponsors of all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds; and", "note": null}, "P-060": {"source": "S01", "locator": "p.4, lines 87-92, (e)(2)", "text": "(2) Each local school system and public school is encouraged to host student and parent engagement activities designed to promote distraction-free education through personal electronic device-free, independent play and learning, including, but not limited to, family workshops, question and answer sessions, town halls, mindfulness or enrichment sessions, screen-free challenges, and participation in initiatives that encourage students to engage in meaningful, personal electronic device-free play and activities.", "note": null}, "P-061": {"source": "S01", "locator": "p.5, lines 105-106, Section 3", "text": "SECTION 3. All laws and parts of laws in conflict with this Act are repealed.", "note": null}, "P-062": {"source": "S10c", "locator": "list section heading for 2026", "text": "Fiscal Notes 2026 Document Description", "note": null}, "P-065": {"source": "S01", "locator": "p.3, lines 52-54 (prior law, (c)(3))", "text": "(3) Establish clear procedures for off-site events or activities, including all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds,", "note": "Prior-law reading from the strike-through/underline markup: the dual enrollment, work-based learning and apprenticeship wording is underlined (new) in HB 1009. The prior clause's final punctuation is not recoverable from the markup."}, "P-066": {"source": "S01", "locator": "p.3, lines 47-48 (prior law, (c)(1))", "text": "(1) Prohibit bell-to-bell access to personal electronic devices by students in kindergarten through grade eight", "note": "Prior-law reading from the markup: 'eight' is struck and 'twelve' underlined in HB 1009."}, "P-067": {"source": "S13a", "locator": "abstract, opening sentence", "text": "Cellphone bans in schools have become a popular policy in recent years in the United States, yet very little is known about their effects on student outcomes.", "note": "Added so the whole abstract is archived as passages (P-067, P-038, P-068, P-039, P-040), making 'the summary doesn't say what the bans covered' checkable."}, "P-068": {"source": "S13a", "locator": "abstract, lead-in to findings", "text": "Several important findings emerge.", "note": null}, "P-064": {"source": "S13b", "locator": "abstract, outcomes", "text": "The primary outcome was mental wellbeing (assessed using Warwick–Edinburgh Mental Well-Being Scale [WEMWBS]). Secondary outcomes included smartphone and social media time.", "note": null}, "P-054": {"source": "S19", "locator": "school news page (browser-rendered)", "text": "Cairo High School June 1, 2026 Georgia House Bill 1009 is a law signed by Governor Brian Kemp that enacts a \"bell-to-bell\" ban on personal electronic devices for public high school students. The legislation requires high schools to restrict the use of devices like smartphones, smartwatches, tablets, and headphones during the instructional school day. Cairo High School will begin implementation of this law in the 2026-2027 school year.", "note": null}}, "sources": {"S01": {"title": "HB 1009, as passed House and Senate (26 LC 49 2527/AP)", "publisher": "Georgia General Assembly", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://www.legis.ga.gov/api/legislation/document/20252026/247117", "retrieved_at": "2026-11-08T04:03:25Z", "sha256": "9a6046e5d581bf4eed3fbf3f2501b853f68be0aa07371160700b2469a5b97130", "method": null, "short": "Bill text", "why": "The law itself, read with its strike-through and underline markup"}, "S02": {"title": "HB 1009 bill record: status history, sponsors, committees, versions, votes", "publisher": "Georgia General Assembly", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://www.legis.ga.gov/legislation/72304", "retrieved_at": "2026-11-08T04:02:25Z", "sha256": "df47fc6c1fed506a58a565fbd4c451afa06e9739d224442ba8a8e0112483e26b", "method": "Public page loaded in headless Chromium; saved the JSON the page itself requested (api/le e or is labeled as our analysis, that quotes match word for word, that saved files match their fingerprints, and that the reading level is about grade 8 or lower.", "No errors"], ["Blind fact-check", "A separate AI checker sees only this page and the source passages. For each sentence it must copy the exact words that support it, and code confirms those words are really there.", "Every flag fixed or answered"], ["Fairness panel", "Three more AI checkers. One speaks up for the law's supporters, one for its critics, and a neutral editor checks the rules. The editor also asks of each sentence: would we write it the same way about the other side?", "Both side reviewers give at least 4 of 5, and no serious problem is left"], ["Testing the fact-checker", "We hid 13 errors in a copy of the page, such as a wrong date, a misquote and one group's figure shown as everyone's. The fact-checker had to find them without knowing they were there.", "At least 9 of every 10 caught"]]}, {"title": "What each round found", "paras": ["Every round found something to fix. No fact-check found a claim that its sources didn't support, only sentences that said more than the sources did. The fairness panel failed twice before both side reviewers gave the page 4 of 5."], "head": ["Round", "Fact-check", "Supporters' reviewer", "Critics' reviewer", "Editor (neutral, clear)", "Result"], "rows": [["1", "58 supported, 9 partly, 0 unsupported", "3 of 5", "3 of 5", "3, 4", "Failed. Critics had 4 argument cards to supporters' 2, and some quotes were cut"], ["2", "89 supported, 10 partly, 0 unsupported", "3 of 5", "4 of 5", "4, 4", "Failed. Our fixes went too far the other way"], ["3", "100 supported, 7 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 4", "Not yet. The editor found 2 serious problems, now fixed"], ["4", "Running", "Running", "Running", "Running", "Running"]]}, {"title": "What this can't do", "paras": ["All the checkers are AI, like the writer, so they may share blind spots. Hiding test errors measures only the kinds of errors we thought to hide.", "The checkers compare this page with the sources we saved. They can't tell what is missing from those sources. Ours quote four officials and a student for the law, but only one named critic.", "The two side reviewers stand in for real people's views. They are not real people."]}, {"title": "See every report", "paras": ["Every check, report and fix is public in the project's repository, in trials/001-hb1009-high-school-cellphones/verification.md."]}]}}</script>

  function openPassages(pids, opener) {

    var c = el("div", { class: "stack" });
    c.appendChild(el("h3", { text: s.title || p0.source }));
    c.appendChild(el("span", { class: "type" + (s.type === "primary-government" ? " primary" : ""), text: s.typeLabel || s.type || "" }));
    pids.forEach(function (pid) {
      var p = D.passages[pid];
      c.appendChild(el("p", { class: "eyebrow", text: pid + " · " + p.locator }));
      c.appendChild(el("blockquote", { text: p.text }));
      if (p.note) c.appendChild(el("p", { class: "notice", text: "Note: " + p.note }));
    });
    var dl = el("dl");
    [["Publisher", s.publisher], ["Captured", s.retrieved_at], ["SHA-256", s.sha256 ? s.sha256.slice(0, 16) + "…" : "n/a"], ["How captured", s.method]].forEach(function (r) {
      if (!r[1]) return; dl.appendChild(el("dt", { text: r[0] })); dl.appendChild(el("dd", { class: r[0] === "SHA-256" ? "hash" : "", text: r[1] }));
    });
    c.appendChild(dl);
    if (s.url) c.appendChild(el("a", { href: s.url, target: "_blank", rel: "noopener", text: "Open the original source ↗" }));
    drawer("Source", c, opener);
  }
  function openTag(u, opener) {
    var expl = {
      analysis: "This sentence is our own reasoning from the cited facts, not a direct statement from a source.",
      editorial: "This sentence is our framing, such as what's missing or uncertain. It can't be cited, so we label it and our checkers review it.",
      computed: "We calculated this number from figures in the sources. The math is shown below."
    }[u.tag];
    var c = el("div", { class: "stack" }, [el("h3", { text: TAG_LABEL[u.tag] }), el("p", { text: expl })]);
    if (u.note) c.appendChild(el("blockquote", { text: u.note.replace(/P-(\d{3})/g, "passage P-$1") }));
    drawer("How to read this", c, opener);
  }

  // ---------- Views ----------
  function viewHome() {
    var h = D.home, root = el("div", { class: "stack-lg" });
    root.appendChild(el("div", { class: "stack" }, [
      el("p", { class: "eyebrow", text: "Georgia · your civic dashboard" }),
      el("h1", { text: "What can I influence?" }),
      el("p", { class: "lede", text: "Decisions you can act on, what's coming up, and what just happened. Every line links to its source." }),
      el("div", { class: "address" }, [
        el("input", { id: "addr", type: "text", disabled: "", placeholder: "Your address (district lookup comes in Trial C)", "aria-label": "Address (not available yet)" }),
        el("button", { type: "button", disabled: "", text: "Find my districts" })
      ]),
      el("p", { class: "notice", text: "Prototype: this page is built only from Trial 001 (HB 1009, 2026). A real dashboard would list hearings, votes and deadlines across your districts." })
    ]));
    h.sections.forEach(function (sec) {
      var s = el("section", { class: "home-sec", "aria-labelledby": "h-" + sec.id });
      s.appendChild(el("h2", { id: "h-" + sec.id }, [sec.title, el("span", { class: "count", text: String(sec.items.length) })]));
      sec.items.forEach(function (it) {
        var top = el("div", { class: "chips" });
        if (it.power) top.appendChild(el("span", { class: "power " + it.power.toLowerCase(), text: it.power }));
        top.appendChild(el("span", { class: "when", text: it.when }));
        var card = el("article", { class: "card item" }, [top, el("p", null, [units(it.units)]),
          el("a", { class: "go", href: "#hb1009", text: "HB 1009: phones in high schools →" })]);
        s.appendChild(card);
      });
      root.appendChild(s);
    });
    return root;
  }

  function sectionById(id) { return D.workspace.sections.filter(function (s) { return s.id === id; })[0]; }

  function layerHead(n, title, sub) {
    return el("div", { class: "layer-head" }, [el("p", { class: "eyebrow", text: "Layer " + n }), el("h2", { text: title }), sub ? el("p", { class: "lede", text: sub }) : null]);
  }

  function viewBill(layer) {
    var W = D.workspace, root = el("div", { class: "stack-lg" });
    var m = D.meta;
    root.appendChild(el("div", { class: "stack" }, [
      el("p", { class: "billcode", text: "HB 1009 · 2026 · ACT 395" }),
      el("h1", { text: "Phones in Georgia high schools" }),
      el("div", { class: "chips" }, [
        el("span", { class: "chip law", text: "Law · signed May 5, 2026" }),
        el("span", { class: "chip", text: "Takes effect Dec 31, 2026" }),
        el("a", { class: "chip " + (m.verified ? "ok" : "warn"), href: "#checks", text: m.statusText })
      ]),
      el("p", { class: "disclose", text: m.disclosure })
    ]));
    var sum = sectionById("summary");
    var box = el("section", { class: "thirty", "aria-labelledby": "h-30" }, [el("h2", { id: "h-30", text: "The 30-second version" })]);
    var ul = el("ul");
    sum.blocks.forEach(function (b) { ul.appendChild(block(b)); });
    box.appendChild(ul); root.appendChild(box);

    var tabs = el("nav", { class: "tabs", "aria-label": "Layers" });
    LAYERS.forEach(function (L) {
      tabs.appendChild(el("a", { href: "#hb1009-" + L.id, "aria-selected": String(L.id === layer) }, [el("span", { class: "n", text: L.n }), L.tab]));
    });
    root.appendChild(tabs);
    root.appendChild(({ overview: layerOverview, decision: layerDecision, options: layerOptions, arguments: layerArguments, evidence: layerEvidence })[layer]());
    return root;
  }

  function subs(sec) { var o = {}; sec.subs.forEach(function (s) { o[s.title] = s; }); return o; }

  function layerOverview() {
    var s = sectionById("overview"), S = subs(s), L = el("section", { class: "layer" });
    L.appendChild(layerHead(1, "Participate", "What happened, what's coming, and what you can still do."));
    var t = el("div", { class: "sub" }, [el("h3", { text: "What happened" })]);
    var ul = el("ul", { class: "blocks timeline" });
    S["What happened"].blocks.forEach(function (b) { var c = Object.assign({}, b, { kind: "timeline" }); ul.appendChild(block(c)); });
    t.appendChild(ul); L.appendChild(t);
    L.appendChild(el("div", { class: "sub" }, [el("h3", { text: "Coming up" }), renderBlocks(S["Coming up"].blocks)]));
    var act = el("div", { class: "sub" }, [el("h3", { text: "What you can do" })]);
    S["What you can do"].blocks.forEach(function (b) {
      act.appendChild(el("div", { class: "card item" }, [el("div", { class: "chips" }, [el("span", { class: "power " + b.label.toLowerCase(), text: b.label })]), el("p", null, [units(b.units)])]));
    });
    L.appendChild(act);
    return L;
  }

  function layerDecision() {
    var s = sectionById("decision"), L = el("section", { class: "layer" });
    L.appendChild(layerHead(2, "The decision"));
    L.appendChild(renderBlocks(s.blocks));
    s.subs.forEach(function (sub) {
      var d = el("details", { class: "more" }, [el("summary", { text: sub.title })]);
      d.appendChild(renderBlocks(sub.blocks));
      L.appendChild(d);
    });
    var more = el("details", { class: "more" }, [el("summary", { text: "See the exact changes in the bill text" })]);
    var mk = el("div", { class: "markup", role: "region", "aria-label": "Bill text with deletions struck through and additions underlined" });
    D.billChanges.forEach(function (line) {
      var row = el("div"); row.appendChild(el("span", { class: "ln", text: String(line.n) }));
      line.segs.forEach(function (sg) { row.appendChild(sg.k === "txt" ? document.createTextNode(sg.t) : el(sg.k, { text: sg.t })); });
      mk.appendChild(row);
    });
    more.appendChild(el("div", { class: "stack" }, [
      el("p", { class: "notice", text: "From the bill as passed (pages 2-3). Georgia bills strike out removed words and underline new ones." }), mk]));
    L.appendChild(more);
    return L;
  }

  function layerOptions() {
    var s = sectionById("options"), L = el("section", { class: "layer" });
    L.appendChild(layerHead(3, "Options and tradeoffs", "What lawmakers could have done, and who gains or gives up what."));
    var grid = el("div", { class: "options" });
    s.subs.forEach(function (o) {
      var chip = /as passed/i.test(o.title) ? el("span", { class: "chip law", text: "Now law" }) : /failed/i.test(o.title) ? el("span", { class: "chip bad", text: "Voted down 13-38" }) : el("span", { class: "chip", text: "Before HB 1009" });
      grid.appendChild(el("article", { class: "card stack" }, [el("div", { class: "opt-head" }, [el("h3", { text: o.title.replace(/^Option [A-C]: /, "") }), chip]), renderBlocks(o.blocks)]));
    });
    L.appendChild(grid);
    return L;
  }

  function evClass(label) { return /^support/i.test(label) ? "supported" : /^mixed/i.test(label) ? "mixed" : /^uncertain/i.test(label) ? "uncertain" : "values"; }

  function layerArguments() {
    var s = sectionById("arguments"), L = el("section", { class: "layer" });
    L.appendChild(layerHead(4, "Arguments you'll hear", "Each card shows who makes the argument, what backs it up, who disagrees, and what cuts against it. Tap a card to open it."));
    if (s.blocks.length) L.appendChild(el("div", { class: "card stack" }, [renderBlocks(s.blocks)]));
    var firstCard = true;
    s.subs.forEach(function (a) {
      if (!a.cardMeta) {  // a non-card subsection, such as "How to read these cards": collapsed by default
        var m = el("details", { class: "more" }, [el("summary", { text: a.title })]);
        m.appendChild(renderBlocks(a.blocks));
        L.appendChild(m);
        return;
      }
      var meta = a.cardMeta;
      var d = el("details", { class: "arg" });
      if (firstCard) { d.setAttribute("open", ""); firstCard = false; }
      var chips = el("div", { class: "chips" }, [
        el("span", { class: "chip", text: meta.side ? (meta.side.charAt(0).toUpperCase() + meta.side.slice(1)) : "" }),
        el("span", { class: "chip" + (meta.kind === "Anticipated" ? " warn" : ""), text: meta.kind === "Anticipated" ? "Anticipated · not said by a named person" : "Said on the record" }),
        el("span", { class: "chip", text: "Type: " + (meta.claimType || "") })
      ]);
      var shortB = a.blocks.filter(function (b) { return b.label === "In short"; })[0];
      var rest = a.blocks.filter(function (b) { return b !== shortB; });
      var head = [el("h3", { text: a.title.replace(/^\d+\.\s*/, "") }), chips];
      if (shortB) head.push(el("p", null, [units(shortB.units)]));
      head.push(el("div", null, [el("span", { class: "ev " + evClass(meta.evidence || ""), text: "Evidence: " + (meta.evidence || "") })]));
      d.appendChild(el("summary", null, head));
      d.appendChild(el("div", { class: "body" }, [renderBlocks(rest)]));
      L.appendChild(d);
    });
    L.appendChild(el("p", { class: "notice", text: "Every card uses the same fields for both sides, and one rule sets every evidence label (see \u201cHow to read these cards\u201d). Disagreements about values are not treated as misinformation." }));
    return L;
  }

  function layerEvidence() {
    var L = el("section", { class: "layer" });
    L.appendChild(layerHead(5, "Evidence", "Every source we cite, archived on the date shown. Anyone can download the original and compare its SHA-256 fingerprint."));
    var list = el("div", { class: "sources" });
    D.sourceOrder.forEach(function (sid) {
      var s = D.sources[sid];
      var pids = Object.keys(D.passages).filter(function (k) { return D.passages[k].source === sid; });
      var card = el("article", { class: "card source" }, [
        el("span", { class: "type" + (s.type === "primary-government" ? " primary" : ""), text: s.typeLabel }),
        el("h3", { text: s.title }),
        el("p", { class: "lede", text: s.why || "" }),
        el("div", { class: "meta" }, [el("span", { text: "Captured " + (s.retrieved_at || "") }), el("span", { class: "hash", text: "sha256 " + (s.sha256 || "").slice(0, 12) + "…" }), el("span", { text: pids.length + " passages cited" })])
      ]);
      var row = el("div", { class: "chips" });
      if (pids.length) { var b = el("button", { class: "src", type: "button", text: "Read the passages" }); b.addEventListener("click", function () { openPassages(pids, b); }); row.appendChild(b); }
      if (s.url) row.appendChild(el("a", { class: "chip", href: s.url, target: "_blank", rel: "noopener", text: "Original ↗" }));
      card.appendChild(row);
      list.appendChild(card);
    });
    L.appendChild(list);
    return L;
  }

  function viewChecks() {
    var V = D.verification, root = el("div", { class: "stack-lg" });
    root.appendChild(el("div", { class: "stack" }, [el("p", { class: "eyebrow", text: "Trial 001 · how this page was checked" }), el("h1", { text: "How we checked HB 1009" }),
      el("p", { class: "lede", text: V.intro })]));
    var stats = el("div", { class: "stats" });
    V.stats.forEach(function (st) { stats.appendChild(el("div", { class: "stat" }, [el("b", { text: st.value }), el("span", { text: st.label })])); });
    root.appendChild(stats);
    V.sections.forEach(function (sec) {
      var s = el("section", { class: "stack" }, [el("h2", { text: sec.title })]);
      sec.paras.forEach(function (p) { s.appendChild(el("p", { text: p })); });
      if (sec.rows) {
        var tb = el("table", { class: "t" }), thead = el("tr");
        sec.head.forEach(function (h) { thead.appendChild(el("th", { text: h })); });
        tb.appendChild(el("thead", null, [thead]));
        var tbody = el("tbody");
        sec.rows.forEach(function (r) { var tr = el("tr"); r.forEach(function (c) { tr.appendChild(el("td", { text: c })); }); tbody.appendChild(tr); });
        tb.appendChild(tbody); s.appendChild(el("div", { class: "tablebox" }, [tb]));
      }
      root.appendChild(s);
    });
    return root;
  }

  // ---------- Router ----------
  function route() {
    var h = (location.hash || "#home").slice(1), view = "home", layer = "overview";
    if (h === "hb1009") view = "hb1009";
    else if (h.indexOf("hb1009-") === 0) { view = "hb1009"; layer = h.slice(7); if (!LAYERS.some(function (L) { return L.id === layer; })) layer = "overview"; }
    else if (h === "checks") view = "checks";
    app.innerHTML = "";
    app.appendChild(view === "home" ? viewHome() : view === "checks" ? viewChecks() : viewBill(layer));
    app.appendChild(el("footer", { text: D.meta.footer }));
    document.querySelectorAll("[data-nav]").forEach(function (a) { if (a.getAttribute("data-nav") === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (view !== "hb1009" || h === "hb1009") window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", function () { closeDrawer(); route(); });
  route();
})();
</script>
