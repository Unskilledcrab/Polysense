uperior Court - General 22,576,085 24,408,409 26,659,959 $ 28,562,196 $ 28,562,196 Superior Court - Judges 9,666,890 9,729,911 10,461,187 $ 10,168,410 - $ 10,168,410 Tax Assessor 18,921,370 18,833,505 20,833,434 $ 23,744,799 $ 23,744,799 Tax Commissioner 18,525,401 18,723,615 19,796,784 $ 20,342,030 $ 20,342,030 Total of Expenditures $ 836,101,686 $ 866,772,399 $ 920,297,281 $ 1,053,152,000 $ 20,597,446 $ ( 16,648,868) $ 1,057,100,578 Revenues > Expenditures $ 2,978,328 $ 12,316,301 $ 12,980,636 $ (57,102,996) $ ( 16,541,486) $ 6,868 $ (73,637,614) Fund Balance - Beginning $ 224,363,249 $ 227,341,577 $ 239,657,878 $ 252,638,514 $ 252,638,514 Fund Balance - Ending $ 227,341,577 $ 239,657,878 $ 252,638,514 $ 195,535,519 $ 179,000,901 Fund Balance Minimum Reserve $ 139,628,982 $ 144,750,991 $ 153,689,646 $ 175,560,438 $ 176,218,666 Requirement", "note": "Columns: 2023 Actual, 2024 Actual, 2025 Actual, 2026 Proposed Budget, Changes to Proposed 1-7-26, Changes to Proposed 1-21-26, 2026 Adopted Budget. Some 'changes' figures carry stray spaces from the PDF layout (for example '3 88,116'); the page cites only the adopted column, which extracted cleanly."}, "P-055": {"source": "S10", "locator": "catalog entry: Sheriff deck", "text": "\"name\" : \"Sheriff Budget Presentation_2027\", \"id\" : \"idwu-2gmj\", \"resource_name\" : null, \"parent_fxf\" : [], \"description\" : \"\", \"attribution\" : null, \"attribution_link\" : null, \"contact_email\" : null, \"type\" : \"file\", \"updatedAt\" : \"2026-10-09T01:57:39.000Z\", \"createdAt\" : \"2026-10-09T01:57:08.000Z\"", "note": null}, "P-056": {"source": "S10", "locator": "catalog entry: Solicitor General deck", "text": "\"name\" : \"Solicitor General Budget Presentation_2027\", \"id\" : \"wit9-gumy\", \"resource_name\" : null, \"parent_fxf\" : [], \"description\" : \"\", \"attribution\" : null, \"attribution_link\" : null, \"contact_email\" : null, \"type\" : \"file\", \"updatedAt\" : \"2026-10-09T01:58:53.000Z\", \"createdAt\" : \"2026-10-09T01:58:29.000Z\"", "note": null}, "P-057": {"source": "S10", "locator": "catalog entry: Public Defender deck", "text": "\"name\" : \"Public Defender Budget Presentation_2027\", \"id\" : \"r22u-txge\", \"resource_name\" : null, \"parent_fxf\" : [], \"description\" : \"\", \"attribution\" : null, \"attribution_link\" : null, \"contact_email\" : null, \"type\" : \"file\", \"updatedAt\" : \"2026-10-09T01:47:52.000Z\", \"createdAt\" : \"2026-10-09T01:47:23.000Z\"", "note": null}, "P-058": {"source": "S10", "locator": "catalog entry: Probate Court deck", "text": "\"name\" : \"Probate Court Budget Presentation_2027\", \"id\" : \"3srn-tydw\", \"resource_name\" : null, \"parent_fxf\" : [], \"description\" : \"\", \"attribution\" : null, \"attribution_link\" : null, \"contact_email\" : null, \"type\" : \"file\", \"updatedAt\" : \"2026-10-09T01:44:05.000Z\", \"createdAt\" : \"2026-10-09T01:43:16.000Z\"", "note": null}, "P-094": {"source": "S10", "locator": "catalog result for the Sheriff deck (idwu-2gmj): permalink on the county's data site", "text": "\"permalink\" : \"https://data.fultoncountyga.gov/d/idwu-2gmj\"", "note": "Added in revision 3: names the site (data.fultoncountyga.gov) that the catalog entries P-055 to P-058 come from."}, "P-095": {"source": "S10", "locator": "catalog result for the Public Defender deck (r22u-txge): permalink on the county's data site", "text": "\"permalink\" : \"https://data.fultoncountyga.gov/d/r22u-txge\"", "note": null}, "P-059": {"source": "S10b", "locator": "Sheriff deck, slide 1 (cover)", "text": "FULTON COUNTY SHERIFF’S OFFICE PROPOSED BUDGET 2027 OCTOBER 13, 2026", "note": null}, "P-060": {"source": "S10b", "locator": "Sheriff deck, slide 2 (2026 challenges and resolutions, first three rows)", "text": "Attraction, Retention, and Recruitment of Personnel Implement a comprehensive staffing strategy that restores full-time positions, enhances pay and incentives (double overtime, and education/student loan reimbursement), expands recruitment outreach, and invests in wellness, leadership development, and improved work environments to stabilize staffing and strengthen compliance. Move jail overtime accrual from 171 hrs. to start at 12 hrs. Salary Attrition of $1,628,224 Restore 100% funding for all sworn and professional vacancies and discontinue attrition-based reductions. Ensure full-year budgeting for approved positions. Overtime Funding Increase overtime funding allocation to align with operational realities and Consent Decree mandates. Include all sworn and civilians whose job functions require work at the jail.", "note": null}, "P-061": {"source": "S10b", "locator": "Sheriff deck, slide 5 (2027 requests, ranked)", "text": "2027 ENHANCEMENT PRIORITIZATION Request Ranking Personnel Attraction/Retention/Recruitment 1 Consent Decree Compliance 1 Operating Essentials 1 Jail Technology Innovations 1 Court Ordered Contract 1 Other Contracts (i.e. , Medical Services, Food Services, Consultants, Inmate Transport Services) 1", "note": null}, "P-062": {"source": "S10c", "locator": "Solicitor General deck, slide 1 (2026 challenges and resolutions)", "text": "CHALLENGES Caseload Growth without proportional staffing Budget Constraints on Critical Services Salary Savings Personnel actions Sufficient victim contact to support statutory compliance with Marsy’s Law Compliance with ABA processing benchmarks for misdemeanor prosecution. 75% cases closed within 60 days of filing 90% cases closed within 90 days of filing 98% cases closed within 180 months of filing RESOLUTIONS Adequate and proportional staffing Reasonable discretion to manage our budget Remove policies that obstruct progress Provide county funded Victim Advocates Limit ASGs to 400 cases per year ABA advises that prosecutors should not carry workloads so large/complex that they endanger fairness, accuracy or the timely processing of charges.", "note": null}, "P-063": {"source": "S10c", "locator": "Solicitor General deck, slide 4 (2027 requests, ranked)", "text": "2027 ENHANCEMENT PRIORITIZATION Request Ranking The Standard for Court Prosecutors 1 Supplement the PAC-VOCA Grant Shortage 2 Middleware Phase 2-Development & Deployment 2", "note": null}, "P-064": {"source": "S10d", "locator": "Public Defender deck, slide 4 (2027 requests, ranked, with amounts)", "text": "2027 ENHANCEMENT PRIORITIZATION Request Ranking RENT / LEASE: Contractually obligated increase for office space $76,981 1 ATTORNEY POSITIONS: As outlined in Form H Summary Enhancement $3,793,366 2 SUPPORT POSITIONS: As outlined in Form H Summary Enhancement $755,884 3 PROFESSIONAL SERVICES: Partnership with United Way $30,000 4 EQUIPMENT: Computer equipment for additional staff $58,000 5 BAR FEES: Annual Bar fees for additional attorney staff $6,216 6", "note": null}, "P-065": {"source": "S10e", "locator": "Probate Court deck, slide 1 (2026 challenges)", "text": "CHALLENGES 1. Prolonged Case Processing Time Insufficient staffing and rising caseloads cause backlogs and delays in critical probate services. 2. Extended Wait Times for Hearings Limited staffing and judicial resources delay case preparation, hearings, and time-sensitive probate matters. 3. Growing Workload Without Corresponding Staffing Growth Growing caseloads and complexity without added staffing increases workloads, burnout, and retention challenges. 4. Limited Capacity to Maintain and Expand Public Access Budget constraints limit accessible services, technology, security, and efficiency improvements.", "note": null}, "P-087": {"source": "S10e", "locator": "Probate Court deck, slide 2 (2026 achievements: outreach)", "text": "Participated in more than 20 community events, bringing Probate Court information and resources directly into Fulton County communities and increasing public awareness of estates, guardianships, marriage licenses, weapons carry licenses, and other essential Court services.", "note": null}, "P-066": {"source": "S10e", "locator": "Probate Court deck, slide 4 (2027 requests, ranked)", "text": "2027 ENHANCEMENT PRIORITIZATION Request Ranking 6 Court Operations Specialists (Clerks) 1 1 Associate Judge 2", "note": null}, "P-067": {"source": "S11", "locator": "Clerk to the Commission page: public comment and accommodations (captured 2026-11-08)", "text": "Residents have two options to participate in public comment: in person and virtually via Zoom. All virtual public comments and requests to speak in person must be submitted before the clerk sounds the start of the 10 a.m. meeting. Fulton County Government is committed to providing individuals with disabilities an equal opportunity to participate in and benefit from county programs, activities, and services. To request reasonable accommodations based on disability, including this notification in an alternate format, please contact the Fulton County Clerk to the Commission at 404.612.8200.", "note": null}, "P-097": {"source": "S11", "locator": "Clerk to the Commission page: what the Clerk does (captured 2026-11-08)", "text": "The Clerk to the Commission is officially responsible for the County seal and the retention and preservation of official records, including meeting agendas, minutes, resolutions, ordinances, and appointments to more than 60 county-appointed boards and authorities. The Clerk to the Commission's primary role is to efficiently and effectively manage the goals and expectations of the Board of Commissioners.", "note": null}, "P-099": {"source": "S11", "locator": "Clerk page, site menu: link to the Commission District Finder (HTML; the site is fultoncountyga.gov, P-039)", "text": "<a href=\"/Commission-District-Finder\" class=\"desktop-utility-nav__link\" title=\"\" >Commission District Finder<\/a>", "note": null}, "P-100": {"source": "S11", "locator": "Clerk page, menu: link to the Public Notices page (HTML; the site is fultoncountyga.gov, P-039)", "text": "<a href=\"/Commissioners/Clerk-to-the-Commission/Public-Notices\" class=\"tertiary-menu__link\" title=\"Link to information about public notices\" >Public Notices<\/a>", "note": null}, "P-068": {"source": "S20", "locator": "page metadata: publication time", "text": "\"datePublished\": \"2026-10-07T15:55:37.083Z\"", "note": null}, "P-069": {"source": "S20", "locator": "article, paragraphs 1-3 (news conference, letter, who attended)", "text": "Fulton County justice officials are pushing back against proposed changes to next year’s budget process, warning that funding decisions could affect court delays, jail conditions and public safety. County leaders held a news conference on the steps of the Fulton County Courthouse Wednesday morning and sent a detailed letter to the Board of Commissioners outlining their requests. Officials unite on budget requests The sheriff, district attorney, solicitor-general, court clerk, probate judge and public defender attended the news conference.", "note": null}, "P-070": {"source": "S20", "locator": "article, paragraphs 4-5 (what the group asked for)", "text": "The group is asking commissioners to wait until January to approve the county’s 2027 spending plan, which would give incoming board members a say in the budget. A January vote is normal protocol, but current law does not prohibit commissioners from voting earlier. The officials are also calling for more funding to address what they describe as staffing shortages, court delays and jail overcrowding.", "note": null}, "P-071": {"source": "S20", "locator": "article, Solicitor-General Keith Gammage", "text": "Fulton County Solicitor General Keith Gammage said his office is underfunded. “Each year we are underfunded. My office is just one example. I’ll give you one more: We have a lack of law-enforcement investigators. What that is causing, is one investigator to carry a caseload - upwards of 400,” Gammage said.", "note": null}, "P-072": {"source": "S20", "locator": "article, Commissioner Dana Barrett", "text": "Fulton County Board Commissioner Dana Barrett, District 3, alleged some current board members are trying to take control of the budget process. “There are some shenanigans among some of the current board members who are angling to take control of the budget process in a way that I feel is inappropriate,” Barrett said. Barrett named Commissioner Bob Ellis and Vice Chair Khadijah Abdur-Rahman, saying they are “creating a budget commission that only they qualify to be on.”", "note": null}, "P-073": {"source": "S20", "locator": "article, Commissioner Bob Ellis; Vice Chair not reached", "text": "Commissioner Bob Ellis responded to the allegation. “We have a budget commission. Those meetings are open meetings. They are speaking and addressing the budget commission just like a standard committee structure, but all commissioners and their staff are able to attend and hear what is said,” Ellis said. “The process we’ve laid out is more transparent and open than anything we’ve had in recent years,” Ellis said. Ellis also said there is no talk of an early vote. Atlanta News First is still waiting to hear back from Commissioner Khadijah Abdur-Rahman.", "note": null}, "P-074": {"source": "S21", "locator": "page metadata: publication time", "text": "\"datePublished\":\"2026-10-07T19:15:15-04:00\"", "note": null}, "P-076": {"source": "S21", "locator": "article, 'What we know'", "text": "The coalition calling themselves \"Justice Leaders,\" which includes the sheriff, district attorney, superior court clerk, solicitor general, probate court chief judge and public defender, announced Wednesday that they will not attend scheduled budget hearings starting next week. Leaders sent a joint letter and held a news conference outlining their decision to decline live presentations. Their primary objection centers on a new framework that require department heads to present critical funding needs to a two-commissioner panel rather than the full board. Under the current structure, District 2 Commissioner Bob Ellis and District 6 Commissioner Khadijah Abdur-Rahman sit on the Budget Commission. The panel evaluates department requests and makes recommendations for the final budget but does not possess final voting power.", "note": null}, "P-077": {"source": "S21", "locator": "article, the 5% directive and Solicitor-General Gammage", "text": "The justice leaders also raised concerns over a directive asking all county departments to limit any request for additional funding to 5% above current allocations for the upcoming 2027 billion-dollar-plus budget. \"We believe it to be our duty to call attention to what we believe to be a lack of proper investment in the entire ecosystem of the courts,\" said Fulton County Solicitor General Keith Gammage.", "note": null}, "P-078": {"source": "S21", "locator": "article, Chief Probate Judge Johnson and Sheriff Labat", "text": "Fulton County Chief Probate Judge Kenya Johnson, speaking on behalf of the coalition, stated that the group respectfully declines to participate in a format that limits the voices of the justice system. \"We respectfully decline to participate in a process that unnecessarily limits the voices of the justice system,\" Johnson said. Sheriff Patrick Labat criticized the two-commissioner arrangement as unfair to county agencies and taxpayers. \"For two commissioners to take a hold of this project—hijack this process is simply unfair,\" Labat said.", "note": null}, "P-079": {"source": "S21", "locator": "article, Commissioner Ellis", "text": "Commissioner Bob Ellis addressed the coalition's concerns, noting that the Budget Commission is solely responsible for drafting recommendations and that the full Board of Commissioners will review and vote on the final budget.", "note": null}, "P-080": {"source": "S21", "locator": "article, written submissions; the story's sources and correction", "text": "Despite refusing to appear in person for next week's hearings, all participating justice department leaders confirmed they have submitted their formal 2027 budget requests in writing. The Source: The information in this story was gathered from a news conference and letter issued by Fulton County Justice Leaders, statements from Probate Court Chief Judge Kenya Johnson, Sheriff Patrick Labat, Commissioner Bob Ellis, Solicitor General Keith Gammage, and Clerk Che Alexander, as reported by FOX 5 Atlanta reporter Aungelique Proctor. The original story has been updated since publication to correct Judge Kenya Johnson's name.", "note": null}, "P-081": {"source": "S22", "locator": "page metadata: publication time", "text": "\"datePublished\":\"2026-08-09T23:55:00-0400\"", "note": null}, "P-082": {"source": "S22", "locator": "post, first sentence", "text": "The Fulton County Board of Commissioners voted 4-1 to reestablish a Budget Commission, with Commissioner Marvin Arrington Jr. abstaining and Commissioner Dana Barrett absent for the vote.", "note": "Removed a space before a comma left by a link boundary in the HTML. Only the sentence we cite is kept (copyrighted post)."}}, "sources": {"S01": {"title": "Resolution 26-0460: re-establishes the Budget Commission, amends Sec. 2-261 and adds Sec. 2-263 of the Fulton County Code (text attached to the Legistar matter as '08.05.26 - Resolution Fulton_County_Budget_Commission 7.30_')", "publisher": "Fulton County Board of Commissioners (Legistar)", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://fulton.legistar1.com/fulton/attachments/3eebf1e5-1a77-413a-8209-b52b3b302a6e.pdf", "retrieved_at": "2026-11-08T07:06:05Z", "sha256": "ca8be1ca14553d1a9b6328f66b5b975c08270a1963ff794d2b53eea780f24984", "method": "Direct download. The first request (07:05:32Z) got HTTP 404 from server node gasmp-legweb4; that response is kept as S01-404.html (sha256 dc1d54dab6ec8c00f70137927504e4f222c8395f10760b6beecfcfa94e08249f). One retry 33 seconds later reached node gasmp-legweb5 and returned the file. Same sha256 as the scout's copy fetched at 06:46Z.", "short": "Resolution 26-0460", "why": "The rul       if (/^(where the money|not known)/i.test(sub.title)) d.open = true;
      if (/^where the money/i.test(sub.title)) {  // the money steps, drawn as a flow
        d.appendChild(el("ol", { class: "flow" }, sub.blocks.map(function (b) {
          return el("li", null, [b.label ? el("strong", { class: "lead", text: b.label + ": " }) : null, units(b.units)]);
        })));
      } else d.appendChild(renderBlocks(sub.blocks));
      box.appendChild(d);
    });
    return box;
  }
  function layerDecision() {
    var s = sectionById("decision"), L = el("section", { class: "layer" });
    L.appendChild(layerHead(K().decision));
    L.appendChild(renderBlocks(s.blocks));
    var more = el("div", null);
    s.subs.forEach(function (sub) {
      var d = el("details", { class: "more" }, [el("summary", { text: sub.title })]);
      d.appendChild(renderBlocks(sub.blocks));
      more.appendChild(d);
    });
    if (!W.billChanges.length) { L.appendChild(more); return L; }
    var mk = el("div", { class: "markup", role: "region", "aria-label": "Bill text with deletions struck through and additions underlined" });
    W.billChanges.forEach(function (line) {
      var row = el("div"); row.appendChild(el("span", { class: "ln", text: String(line.n) }));
      line.segs.forEach(function (sg) { row.appendChild(sg.k === "txt" ? document.createTextNode(sg.t) : el(sg.k, { text: sg.t })); });
      mk.appendChild(row);
    });
    var bill = el("details", { class: "more" }, [el("summary", { text: "See the exact changes in the bill text" }), el("div", { class: "stack" }, [
      el("p", { class: "notice", text: W.markupNote || "" }), mk])]);
    more.appendChild(bill);
    L.appendChild(more);
    return L;
  }

  // Options: every option folds the same way; "What it does" stays visible.
  function layerOptions() {
    var s = sectionById("options"), L = el("section", { class: "layer" });
    L.appendChild(layerHead("Options and tradeoffs", K().options));
    if (s.blocks.length) L.appendChild(renderBlocks(s.blocks));
    var grid = el("div", { class: "options" });
    s.subs.forEach(function (o) {
      if (/^if you care most about/i.test(o.title)) {  // the values guide: what each side says it protects
        var g = el("section", { class: "card stack vguide", "aria-labelledby": "h-values" }, [el("h3", { id: "h-values", text: "What each side says it protects" }),
          el("p", { class: "meta-line", text: "Quoted from the record: each side's own words, or the reasons it gave. We don't recommend an option." })]);
        var vg = el("div", { class: "vgrid" });
        o.blocks.forEach(function (b) {
          if (b.label) vg.appendChild(el("div", { class: "vline" }, [el("h4", { text: b.label }), el("p", null, [units(b.units)])]));
        });
        g.appendChild(vg);
        o.blocks.forEach(function (b) { if (!b.label) g.appendChild(el("p", { class: "meta-line" }, [units(b.units)])); });
        L.appendChild(g);
        return;
      }
      var chip = null;
      Object.keys(W.optionChips).forEach(function (k) { if (o.title.indexOf(k) === 0) { var c = W.optionChips[k]; chip = el("span", { class: "chip" + (c.kind ? " " + c.kind : ""), text: c.text }); } });
      var does = o.blocks.filter(function (b) { return b.label === "What it does"; })[0];
      var rest = o.blocks.filter(function (b) { return b !== does; });
      var d = el("details", { class: "fold" });
      d.appendChild(el("summary", null, [el("h3", { text: o.title }), chip ? el("div", { class: "chips" }, [chip]) : null,
        does ? el("p", null, [units(does.units)]) : null,
        el("span", { class: "hint", text: rest.filter(function (b) { return b.label; }).map(function (b) { return b.label.toLowerCase(); }).join(" · ") || "Details" })]));
      // Who gains and who gives something up, side by side; the other fields below.
      var pair = rest.filter(function (b) { return b.label === "Who benefits" || b.label === "Who pays"; });
      var others = rest.filter(function (b) { return pair.indexOf(b) < 0; });
      d.appendChild(el("div", { class: "body" }, [pair.length ? el("div", { class: "twocol" }, pair.map(function (b) { return el("div", null, [field(b)]); })) : null, renderBlocks(others)]));
      grid.appendChild(d);
    });
    L.appendChild(grid);
    return L;
  }

  function evClass(label) { return /^support/i.test(label) ? "supported" : /^(mixed|contested)/i.test(label) ? "mixed" : /^uncertain/i.test(label) ? "uncertain" : "values"; }
  function evChip(g) { var c = evClass(g); return el("span", { class: "ev " + c }, [el("span", { "aria-hidden": "true", text: SYM[c] + " " }), g]); }
  function legendBox(used, rule) {
    var box = el("div", { class: "legend" });
    LEGEND.forEach(function (row) {
      if (used.indexOf(row[0]) < 0) return;
      box.appendChild(el("div", { class: "row" }, [evChip(row[0]), el("p", { text: row[2] })]));
    });
    if (rule) {
      var b = el("button", { class: "evbtn", type: "button", text: "This page's exact rule" });
      b.addEventListener("click", function () { drawer("How to read these cards", renderBlocks(rule.blocks), b); });
      box.appendChild(b);
    }
    return box;
  }

  // The grades an evidence label names, in order ("Supported", "Uncertain", "Values question"...). A folded
  // card shows only these, so it stays scannable on a phone; the full label is inside the card.
  // Split a card's evidence label into parts: [{grade, scope, note, text}]. Handles "Rules: Supported (note). Results:
  // Uncertain (note)", "Supported on X (note); uncertain on Y (note)" and "Supported (note); Mixed (note); size (note)".
  function evParts(label) {
    var t = (label || "").trim(), segs = [], cur = "", depth = 0, out = [];
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (ch === "(") depth++;
      else if (ch === ")") depth = Math.max(0, depth - 1);
      if (depth === 0 && (ch === ";" || (ch === "." && /\s/.test(t.charAt(i + 1) || " ")))) { if (cur.trim()) segs.push(cur.trim()); cur = ""; continue; }
      cur += ch;
    }
    if (cur.trim()) segs.push(cur.trim());
    segs.forEach(function (seg) {
      var head = seg, note = "", open = seg.indexOf("(");
      if (open >= 0 && /\)\s*$/.test(seg)) { head = seg.slice(0, open).trim(); note = seg.slice(open + 1, seg.lastIndexOf(")")).trim(); }
      var g = evGrades(head)[0], scope = "", m;
      if ((m = head.match(/^(.+?):\s*(?:a\s+)?(supported|mixed|uncertain|contested|values question|not mainly)/i))) scope = m[1].trim();
      else if ((m = head.match(/^(?:supported|mixed|uncertain|contested)(?:, with limits)?\s+on\s+(.+)$/i))) scope = m[1].trim();
      out.push({ grade: g || "", scope: scope, note: note, text: seg });
    });
    return out;
  }
  // One line per grade, naming the parts it covers ("● Supported: Rules"), or null when the label names no parts.
  function evByPart(parts) {
    var graded = parts.filter(function (p) { return p.grade; });
    if (graded.length < 2 || !graded.every(function (p) { return p.scope; })) return null;
    var order = [], by = {};
    graded.forEach(function (p) { if (!by[p.grade]) { by[p.grade] = []; order.push(p.grade); } by[p.grade].push(p.scope); });
    return el("ul", { class: "evlist" }, order.map(function (g) {
      var txt = by[g].map(function (x, i) { return i && /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x; }).join("; ");
      return el("li", null, [evChip(g), el("span", { class: "sr-only", text: ": " }), el("span", { class: "scope", text: txt })]);
    }));
  }
  function evGrades(label) {
    var t = label || "", prev;
    do { prev = t; t = t.replace(/\([^()]*\)/g, ""); } while (t !== prev);   // drop explanations in parentheses
    var out = [], m, re = /\b(supported, with limits|supported|mixed|uncertain|contested|not mainly a factual question|values question)\b/gi;
    while ((m = re.exec(t))) {
      var g = m[1].toLowerCase().replace("not mainly a factual question", "not mainly factual");
      g = g.charAt(0).toUpperCase() + g.slice(1);
      if (out.indexOf(g) < 0) out.push(g);
    }
    return out;
  }

  // Arguments: all cards start closed, so both sides' claims are visible at a glance.
  function layerArguments() {
    var s = sectionById("arguments"), L = el("section", { class: "layer" });
    L.appendChild(layerHead("Arguments you'll hear", "Tap a card to see who makes the argument, what backs it up, who disagrees and what's missing."));
    var used = [], rule = null, questions = null;
    s.subs.forEach(function (a) { if (a.cardMeta) evGrades(a.cardMeta.evidence).forEach(function (g) { if (used.indexOf(g) < 0) used.push(g); }); });
    s.subs.forEach(function (a) { if (/^how to read/i.test(a.title)) rule = a; if (/^questions to weigh/i.test(a.title)) questions = a; });
    var opts = sectionById("options");
    if (opts && opts.subs.some(function (o) { return /^if you care most about/i.test(o.title); }))
      L.appendChild(el("p", { class: "meta-line" }, ["What each side says it protects, quoted from the record, is at the top of the ", el("a", { href: "#" + W.slug + "-options", text: "Options tab" }), "."]));
    if (used.length) L.appendChild(el("section", { class: "card stack", "aria-labelledby": "h-legend" }, [el("h3", { id: "h-legend", text: "What the evidence labels mean" }), legendBox(used, rule)]));
    if (s.blocks.length) L.appendChild(el("div", { class: "card stack" }, [renderBlocks(s.blocks)]));
    s.subs.forEach(function (a) {
      if (!a.cardMeta) {  // a non-card subsection: the rule opens from the legend; questions show after the cards
        if (a === questions) return;
        var m = el("details", { class: "more" }, [el("summary", { text: a.title })]);
        m.appendChild(renderBlocks(a.blocks));
        L.appendChild(m);
        return;
      }
      var meta = a.cardMeta, grades = evGrades(meta.evidence), parts = evParts(meta.evidence), byPart = evByPart(parts);
      var side = meta.side ? (meta.side.charAt(0).toUpperCase() + meta.side.slice(1)) : "";
      var shortB = a.blocks.filter(function (b) { return b.label === "In short"; })[0];
      var rest = a.blocks.filter(function (b) { return b !== shortB; });
      var d = el("details", { class: "fold" });
      d.appendChild(el("summary", null, [
        el("h3", { text: a.title.replace(/^\d+\.\s*/, "") }),
        el("div", { class: "chips" }, [el("span", { class: "chip wrap", text: side })]),
        shortB ? el("p", null, [units(shortB.units)]) : null,
        grades.length
          ? (byPart
              ? el("div", { class: "evpart" }, [el("span", { class: "meta-line", text: "Evidence, part by part:" }), byPart, legendButton(used, rule)])
              : el("div", { class: "chips" }, [el("span", { class: "meta-line", text: "Evidence:" })]
                  .concat(grades.map(evChip)).concat([legendButton(used, rule)])))
          : el("div", null, [el("span", { class: "ev " + evClass(meta.evidence || ""), text: "Evidence: " + (meta.evidence || "") })])
      ]));
      var body = el("div", { class: "body" }, [
        el("p", { class: "meta-line", text: (meta.kind === "Anticipated" ? "Anticipated: not said by a named person" : "Documented: said on the record") + " · " + (meta.claimType || "") + " claim" }),
        grades.length ? el("div", { class: "evfull" }, [el("p", { class: "meta-line", text: "The evidence label in full:" }),
          el("ul", { class: "evlist" }, parts.map(function (p) {
            var what = p.scope ? p.scope + (p.note ? " (" + p.note + ")" : "") : p.note;
            return el("li", null, p.grade ? [evChip(p.grade), what ? el("span", { class: "sr-only", text: ": " }) : null, what ? el("span", { class: "scope", text: what }) : null]
                                          : [el("span", { class: "scope", text: p.text.charAt(0).toUpperCase() + p.text.slice(1) })]);
          }))]) : null,
        renderBlocks(rest)
      ]);
      d.appendChild(body);
      L.appendChild(d);
    });
    if (questions) L.appendChild(el("section", { class: "card stack qcard", "aria-labelledby": "h-questions" }, [el("h3", { id: "h-questions", text: questions.title }), renderBlocks(questions.blocks)]));
    L.appendChild(el("p", { class: "notice", text: "Every card uses the same fields for both sides, and one rule sets every evidence label. Disagreements about values are not treated as misinformation." }));
    return L;
  }
  // "What these mean" on a folded card opens the legend without unfolding the card.
  function legendButton(used, rule) {
    var b = el("button", { class: "evbtn", type: "button", text: "What these mean" });
    b.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); drawer("What the evidence labels mean", legendBox(used, rule), b); });
    return b;
  }

  function layerEvidence() {
    var L = el("section", { class: "layer" });
    L.appendChild(layerHead("Sources", "Every source we cite, saved on the date shown. Anyone can download the original and compare its SHA-256 fingerprint."));
    var list = el("div", { class: "sources" });
    W.sourceOrder.forEach(function (sid) {
      var s = W.sources[sid];
      var pids = Object.keys(W.passages).filter(function (k) { return W.passages[k].source === sid; });
      var card = el("article", { class: "card source" }, [
        el("span", { class: "type" + (s.type === "primary-government" ? " primary" : ""), text: s.typeLabel }),
        el("h3", { text: s.title }),
        el("p", { class: "lede", text: s.why || "" }),
        el("div", { class: "meta" }, [el("span", { text: "Captured " + (s.retrieved_at || "").slice(0, 10) }), el("span", { class: "hash", text: "fingerprint " + (s.sha256 || "").slice(0, 12) + "…" }), el("span", { text: pids.length + " passages" })])
      ]);
      var row = el("div", { class: "chips" });
      if (pids.length) { var b = el("button", { class: "src", type: "button", text: "Read the passages" }); b.addEventListener("click", function () { openPassages(pids, b); }); row.appendChild(b); }
      if (s.url) row.appendChild(el("a", { class: "chip", href: s.url, target: "_blank", rel: "noopener", text: "Original ↗" }));
      card.appendChild(row);
      list.appendChild(card);
    });
    L.appendChild(list);
    // Notes in Layer 5 (for example, what the meeting minutes and video do and don't record) show after the sources.
    var ev = sectionById("evidence");
    if (ev) ev.subs.forEach(function (sub) {
      if (!sub.blocks.length) return;
      var d = el("details", { class: "more" }, [el("summary", { text: sub.title })]);
      d.appendChild(renderBlocks(sub.blocks));
      L.appendChild(d);
    });
    return L;
  }

  function viewChecks() {
    var V = W.verification, root = el("div", { class: "stack-lg" });
    root.appendChild(el("div", { class: "stack" }, [el("p", { class: "eyebrow", text: "Test page " + W.trial + " · how this page was checked" }), el("h1", { text: "How we checked " + W.code.split(" · ")[0] }),
      el("div", { class: "chips" }, [statusChip(W)]), el("p", { class: "lede", text: V.intro }), el("a", { class: "go", href: "#" + W.slug, text: "← Back to " + W.linkText })]));
    var stats = el("div", { class: "stats" });
    V.stats.forEach(function (st) { stats.appendChild(el("div", { class: "stat" }, [el("b", { text: st.value }), el("span", { text: st.label })])); });
    root.appendChild(stats);
    V.sections.forEach(function (sec) {
      var s = el("section", { class: "stack" }, [el("h2", { text: sec.title })]);
      (sec.paras || []).forEach(function (p) { s.appendChild(el("p", { text: p })); });
      if (sec.items) {
        var ul = el("ul", { class: "lines" });
        sec.items.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
        s.appendChild(ul);
      }
      if (sec.rows) {
        var list = el("div", { class: "rowcards" });
        sec.rows.forEach(function (r) {
          var title = (sec.head[0] === "Round" ? "Round " : "") + r[0];
          var dl = el("dl");
          for (var i = 1; i < r.length; i++) { if (!r[i]) continue; dl.appendChild(el("dt", { text: sec.head[i] })); dl.appendChild(el("dd", { text: r[i] })); }
          list.appendChild(el("div", { class: "rowcard" }, [el("h3", { text: title }), dl]));
        });
        s.appendChild(list);
      }
      root.appendChild(s);
    });
    return root;
  }

  // ---------- Router ----------
  // #home · #decisions · #checks · #<slug> · #<slug>-<tab> · #<slug>-checks
  var prev = null;
  function route() {
    var h = (location.hash || "#home").slice(1), view = "home", layer = "overview", nav = "home";
    if (h === "decisions") { view = "decisions"; nav = "decisions"; }
    else if (h === "checks") { view = "method"; nav = "checks"; }
    else if (h !== "home" && h !== "") {
      var match = null;
      D.workspaces.forEach(function (w) { if (h === w.slug || h.indexOf(w.slug + "-") === 0) match = w; });
      if (match) {
        W = match; nav = "decisions"; view = "bill";
        var rest = h.slice(match.slug.length + 1);
        if (rest === "checks") { view = "checks"; nav = "checks"; }
        else if (rest && LAYERS.some(function (L) { return L.id === rest; })) layer = rest;
      }
    }
    var key = view === "bill" ? "bill:" + W.slug : view;
    var stayInBill = prev === key;
    app.innerHTML = "";
    app.appendChild(view === "home" ? viewHome() : view === "decisions" ? viewDecisions() : view === "method" ? viewMethod() : view === "checks" ? viewChecks() : viewBill(layer));
    app.appendChild(el("footer", { text: D.meta.footer + (view === "checks" ? " · Test page " + W.trial + " · " + W.revisionLabel
      : view === "bill" ? " · Test page · " + W.revisionLabel.replace(/ · fingerprint.*$/, "") : "") }));
    document.querySelectorAll("[data-nav]").forEach(function (a) { if (a.getAttribute("data-nav") === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    var tabs = document.querySelector(".tabs");
    if (stayInBill && tabs) {
      // Switching tabs: keep the tab row where it is and start the new tab at its top.
      var stick = parseFloat(getComputedStyle(tabs).top) || 0;
      var tabsTop = tabs.getBoundingClientRect().top + window.scrollY - stick;
      if (window.scrollY > tabsTop) window.scrollTo(0, tabsTop);
    } else {
      window.scrollTo(0, 0);
    }
    if (tabs) {
      var cur = tabs.querySelector('[aria-selected="true"]');
      if (cur) tabs.scrollLeft = cur.offsetLeft - (tabs.clientWidth - cur.clientWidth) / 2;
    }
    prev = key;
  }
  window.addEventListener("hashchange", function () { closeDrawer(); route(); });
  route();
})();
</script>
