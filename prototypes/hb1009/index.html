<title>Georgia Decisions Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
/* Layout, phone first: one reading column; the site menu sits in a bottom bar on phones and in the top bar on
   wide screens; the bill page pins one scrollable row of tabs at the top. */
:root {
  --bg: #f5f7f4; --surface: #ffffff; --sunk: #eef2ee; --ink: #16201c; --muted: #56625c; --line: #d6ddd7;
  --accent: #1d5a45; --accent-ink: #ffffff; --accent-soft: #e2efe8; --gold: #8a5a00; --gold-soft: #f6ead2;
  --ok: #2b7046; --ok-soft: #e1f0e6; --warn: #8a5a00; --warn-soft: #f6ead2; --bad: #a33a3a; --bad-soft: #f6e2e2;
  --ins: #1d5a45; --ins-bg: #dcefe4; --del: #a33a3a; --del-bg: #f6e2e2; --unc: #3d5486; --unc-soft: #e6ebf6;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px; --shadow: 0 1px 2px rgba(22, 32, 28, .06), 0 6px 18px rgba(22, 32, 28, .06);
  --bottom-nav: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #151d1a; --sunk: #111816; --ink: #e5ece8; --muted: #9eaba5; --line: #2a3531;
  --accent: #7cc9a6; --accent-ink: #0e1412; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --sunk: #111816; --ink: #e5ece8; --muted: #9eaba5; --line: #2a3531;
  --accent: #7cc9a6; --accent-ink: #0e1412; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438; --shadow: none; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Top bar: brand only on phones (it scrolls away); brand + menu, pinned, on wide screens */
.bar { background: var(--surface); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 52px }
.brand { font: 600 1.15rem/1 var(--font-display); letter-spacing: .01em; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: 8px }
.brand small { font: 500 .7rem/1 var(--font-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.nav { display: none; gap: 4px; margin-left: auto }
.nav a { font-size: .95rem; text-decoration: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); font-weight: 700 }

/* Bottom menu on phones, within thumb reach */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.bottom a { min-height: var(--bottom-nav); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: .82rem; line-height: 1.15; text-align: center; padding: 6px 4px }
.bottom a::before { content: ""; width: 22px; height: 3px; border-radius: 3px; background: transparent }
.bottom a[aria-current="page"] { color: var(--ink); font-weight: 700 }
.bottom a[aria-current="page"]::before { background: var(--accent) }
main { padding-block: 18px calc(var(--bottom-nav) + 48px + env(safe-area-inset-bottom, 0px)) }

@media (min-width: 720px) {
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
  .nav { display: flex }
  .bottom { display: none }
  main { padding-block: 24px 72px }
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(1.65rem, 4.6vw, 2.3rem) }
h2 { font-size: 1.35rem }
h3 { font-size: 1.12rem }
p { margin: 0 }
.eyebrow { font: 500 .75rem/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lede { color: var(--muted); max-width: 40rem }
.stack { display: flex; flex-direction: column; gap: 14px }
.stack-lg { display: flex; flex-direction: column; gap: 26px }
.notice { font-size: .92rem; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 12px }

/* Chips and badges */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font-size: .78rem; line-height: 1.2; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; max-width: 100% }
.chip.wrap { white-space: normal; border-radius: 12px }   /* long chips (a card's side) wrap instead of widening the page */
.chip.law { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok) }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn) }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad) }
.power { font: 700 .72rem/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px }
.power::before { content: ""; width: 8px; height: 8px; display: inline-block; border: 2px solid currentColor }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.evlist { list-style: none; margin: .35rem 0 .25rem; padding: 0; display: grid; gap: .3rem }
.evlist li { display: flex; flex-wrap: wrap; gap: .25rem .45rem; align-items: baseline }
.evlist .scope { flex: 1 1 7rem; min-width: 0; font-size: .92rem }
.evpart .evbtn { margin-top: .15rem }
.power.decide { color: var(--accent); background: var(--accent-soft) } .power.decide::before { background: currentColor }
.power.input { color: var(--gold); background: var(--gold-soft) } .power.input::before { border-radius: 50% }
.power.observe { color: var(--muted); background: var(--sunk) } .power.observe::before { border-radius: 50%; background: transparent }

/* Source chips: small, at the end of each sentence; tap for the exact passage */
.src { font: 500 .7rem/1 var(--font-body); vertical-align: .14em; margin-left: 5px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--sunk); color: var(--accent); cursor: pointer; min-height: 24px; white-space: nowrap }
.src:hover { border-color: var(--accent) }
.src.tag { color: var(--muted); border-style: dashed; background: transparent }
.src.tag.editorial { color: var(--gold) }

/* Labeled fields: the label on its own line, then one sentence per line */
.field { display: flex; flex-direction: column; gap: 4px }
.flabel { font: 700 .78rem/1.3 var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.lines li { padding-left: 14px; position: relative }
.lines li::before { content: ""; position: absolute; left: 1px; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .6 }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow) }
.home-sec { display: flex; flex-direction: column; gap: 12px }
.home-sec > h2 { display: flex; align-items: baseline; gap: 10px }
.home-sec > h2 .count { font: 500 .8rem var(--font-mono); color: var(--muted) }
.item { display: grid; gap: 8px }
.item .when { font: 500 .85rem/1.2 var(--font-mono); color: var(--ink) }
.item .go { font-weight: 700; text-decoration: none; justify-self: start; padding: 6px 0; min-height: 40px; display: inline-flex; align-items: center }

/* Bill header and the 30-second box */
.billcode { font: 500 .82rem/1 var(--font-mono); color: var(--accent); letter-spacing: .04em }
.billhead { display: flex; flex-direction: column; gap: 10px }
.thirty { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px }
.thirty h2 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 700; letter-spacing: .01em }
.cta { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; text-decoration: none; padding: 10px 14px }
.disclose { font-size: .86rem; color: var(--muted); display: flex; gap: 8px; align-items: flex-start }
.disclose::before { content: "i"; font: 700 .75rem/1.35rem var(--font-mono); flex: 0 0 1.35rem; text-align: center; border-radius: 50%; border: 1px solid var(--muted) }

/* Bill tabs: one scrollable row, pinned at the top while you read */
.tabs { display: flex; gap: 4px; padding: 6px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; scroll-snap-type: x proximity; box-shadow: 0 0 0 6px var(--bg) }
.tabs::-webkit-scrollbar { display: none }
.tabs a { flex: 0 0 auto; scroll-snap-align: center; text-decoration: none; color: var(--muted); font-size: .95rem; padding: 8px 12px; border-radius: 8px;
  min-height: 44px; display: inline-flex; align-items: center; white-space: nowrap }
.tabs a[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow) }
@media (min-width: 720px) { .tabs { top: calc(env(safe-area-inset-top, 0px) + 53px) } }

/* Workspace content */
.layer { display: flex; flex-direction: column; gap: 18px }
.layer-head { display: flex; flex-direction: column; gap: 4px }
.blocks { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.blocks li { padding-left: 16px; position: relative }
.blocks li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--line) }
.blocks.num { counter-reset: n } .blocks.num li { counter-increment: n; padding-left: 26px }
.blocks.num li::before { content: counter(n); width: auto; height: auto; background: none; top: 0; font: 700 .85rem/1.6 var(--font-mono); color: var(--accent) }
.label { font-weight: 700 }
.timeline { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; border-left: 2px solid var(--line); margin-left: 6px }
.timeline li { padding: 0 0 12px 16px; position: relative }
.timeline li::before { content: ""; position: absolute; left: -7px; top: .45em; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent) }
.timeline .when { display: block; font: 500 .82rem/1.4 var(--font-mono); color: var(--muted) }
.sub { display: flex; flex-direction: column; gap: 10px }
#act { scroll-margin-top: 76px }
.options { display: grid; gap: 12px }
.opt-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }

/* Expandable cards (options and arguments) */
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow) }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; gap: 8px }
details.fold > summary::-webkit-details-marker { display: none }
details.fold > summary h3 { display: flex; gap: 10px; align-items: baseline }
details.fold > summary h3::after { content: "+"; margin-left: auto; font: 500 1.2rem var(--font-mono); color: var(--muted) }
details.fold[open] > summary h3::after { content: "\2212" }
details.fold .hint { font-size: .86rem; color: var(--accent); font-weight: 700 }
details.fold[open] .hint { display: none }
details.fold .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line) }
.meta-line { font-size: .84rem; color: var(--muted) }
.ev { font: 700 .74rem/1.3 var(--font-mono); letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; border: 1px solid currentColor; display: inline-block }
.ev.supported { color: var(--ok) } .ev.mixed { color: var(--warn) }
.ev.uncertain { color: var(--unc); border-style: dashed } .ev.values { color: var(--muted); border-style: dotted }
.evbtn { font: 700 .78rem/1.2 var(--font-body); color: var(--accent); background: none; border: 0; padding: 6px 2px; min-height: 32px; cursor: pointer; text-decoration: underline }
.legend { display: grid; gap: 8px }
.legend .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline }
.legend .row p { margin: 0 }
/* "What it means for you" and the values guide */
.you { border-left: 4px solid var(--accent) }
/* Reader-first visuals: every figure is drawn from cited data; nothing is to scale unless the source gives amounts */
.datebadge { display: inline-flex; align-items: stretch; align-self: flex-start; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); max-width: 100% }
.datebadge .cal { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 12px; background: var(--accent); color: var(--accent-ink); min-width: 58px }
.datebadge .cal b { font: 600 1.5rem/1 var(--font-display) }
.datebadge .cal span { font: 500 .7rem/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase }
.datebadge .info { display: flex; flex-direction: column; justify-content: center; padding: 6px 12px; min-width: 0 }
.datebadge .info b { font-size: 1rem; line-height: 1.25 }
.datebadge .info span { font-size: .82rem; color: var(--muted); line-height: 1.3 }
.viz h3 { font: 700 .95rem/1.3 var(--font-body); margin: 0 }
.viz .note { margin: 0; font-size: .9rem; color: var(--muted) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 12px }
.tile { background: var(--sunk); border-radius: var(--radius); padding: 14px; min-width: 0 }
.tile .big { font: 600 clamp(1.7rem, 7vw, 2.3rem)/1.05 var(--font-display); font-variant-numeric: tabular-nums }
.tile p { margin: 6px 0 0; font-size: .9rem; color: var(--muted) }
.split { display: flex; gap: 2px; height: 22px }
.split i { display: block; border-radius: 4px; min-width: 6px }
.split .s0 { background: var(--accent) } .split .s1 { background: var(--muted); opacity: .45 }
.keys { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .9rem; margin: 0; padding: 0; list-style: none }
.keys li { display: flex; align-items: baseline; gap: 6px }
.keys i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none }
.keys .s0 { background: var(--accent) } .keys .s1 { background: var(--muted); opacity: .45 }
.keys b { font-variant-numeric: tabular-nums }
.parts { display: grid; gap: 10px }
.part { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; background: var(--sunk); border-radius: var(--radius); padding: 12px; min-width: 0 }
.part .arrow { grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 1.5rem/1 var(--font-body); background: var(--surface); border: 2px solid var(--ink) }
.part .arrow.up { border-style: dashed }
.part b { font-size: 1.05rem; line-height: 1.2 }
.part p { margin: 0; font-size: .92rem; grid-column: 2; min-width: 0 }
.seats { display: flex; flex-wrap: wrap; gap: 8px }
.seat { width: 22px; height: 22px; border-radius: 50%; background: var(--accent) }
.seat.vacant { background: transparent; border: 2px dashed var(--muted) }
.pick { display: flex; flex-wrap: wrap; gap: 8px }
.pick button { font: 700 .9rem/1.2 var(--font-body); min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.flow { list-style: none; margin: 0; padding: 0; counter-reset: step }
.flow li { counter-increment: step; position: relative; padding: 2px 0 18px 44px; min-height: 40px }
.flow li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font: 700 .9rem/1 var(--font-body); border: 1.5px solid var(--accent); box-sizing: border-box }
.flow li::after { content: ""; position: absolute; left: 14px; top: 34px; bottom: 2px; width: 2px; background: var(--line) }
.flow li:last-child { padding-bottom: 0 } .flow li:last-child::after { display: none }
.rail { list-style: none; margin: 0 0 0 7px; padding: 0; border-left: 2px solid var(--line) }
.rail li { position: relative; padding: 0 0 14px 18px }
.rail li:last-child { padding-bottom: 0 }
.rail li::before { content: ""; position: absolute; left: -8px; top: .4em; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); box-sizing: border-box }
.rail li.past { color: var(--muted) } .rail li.past::before { background: var(--muted) }
.rail li.next::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft) }
.rail li.today { font: 700 .78rem/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent) }
.rail li.today::before { border-radius: 2px; width: 14px; height: 4px; top: .45em; background: var(--accent); border: 0 }
.rail .when { display: block; font: 500 .82rem/1.4 var(--font-mono) }
.rail li.next .when { color: var(--accent); font-weight: 700 }
.vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 12px }
.vguide .vgrid .vline { background: var(--sunk); border-radius: var(--radius); padding: 14px; border-top: 0; min-width: 0 }
.vguide .vgrid .vline h4 { font: 600 1.05rem/1.25 var(--font-display); margin: 0 0 6px }
.vguide .vgrid .vline p { margin: 0; font-size: .95rem }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 12px }
.twocol > div { background: var(--sunk); border-radius: var(--radius); padding: 12px; min-width: 0 }
details.deep > summary { cursor: pointer; font-weight: 700; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); list-style: none }
details.deep > summary::-webkit-details-marker { display: none }
details.deep > summary::after { content: " +"; color: var(--accent) }
details.deep[open] > summary::after { content: " −" }
details.deep > summary span { display: block; font-weight: 400; font-size: .88rem; color: var(--muted) }
details.deep > .stack-lg { margin-top: 18px }
.you h2, .vguide h3 { margin: 0 }
.ifyou { padding-top: 10px; border-top: 1px solid var(--line) }
.ifyou:first-of-type { border-top: 0; padding-top: 0 }
.ifyou strong.lead, .vguide strong.lead { color: var(--ink) }
.vguide .vline { padding-top: 10px; border-top: 1px solid var(--line) }
.vguide .vline:first-of-type { border-top: 0 }
.chip.past { background: var(--sunk); color: var(--muted); border-style: dashed }
.mayline { margin: 0; font-size: .95rem }
.qcard ul { margin: 0; padding-left: 1.2em }

/* Collapsible notes */
details.more { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
details.more > summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 48px; display: flex; align-items: center }
details.more[open] { padding-bottom: 14px }

/* Bill markup */
.markup { font: .88rem/1.7 var(--font-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto }
.markup .ln { color: var(--muted); display: inline-block; width: 2.4em; user-select: none }
.markup del { color: var(--del); background: var(--del-bg); text-decoration: line-through; text-decoration-thickness: 2px }
.markup ins { color: var(--ins); background: var(--ins-bg); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px }

/* Next and previous tab */
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px }
