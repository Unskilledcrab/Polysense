sed rate.\"", "cite": ["P-121"]}, {"t": "GIPL also backs leaving out some items, such as gas hedging gains and losses and fuel-balance carrying costs, as not \"actual costs of fuel.\"", "cite": ["P-106"]}, {"t": "PIA Staff makes no recommendation on three of the costs, and says \"policy and cost causation arguments\" could justify leaving some out.", "cite": ["P-089", "P-064"]}, {"t": "GAM says real-time money on the base side lowers the costs other customers pay.", "cite": ["P-111", "P-112"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "PIA Staff and GIPL say customers on the fuel charge carry these costs; card 7 gives their case.", "cite": ["P-063", "P-099"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "GIPL says coal-related costs \"vary with sustained increases in demand,\" and PIA Staff says such costs depend on how much fuel, or what kind, the company buys.", "cite": ["P-156", "P-149"]}, {"t": "Georgia Power had said fixed fuel costs \"cannot be increased or avoided through changes in load priced at RTP.\"", "cite": ["P-049"]}, {"t": "Of the base-side argument, GIPL says, \"While I agree with this concept, it neglects two critical factors.\"", "cite": ["P-099"]}, {"t": "GIPL says capital substitution is \"a necessary cost of service, and from an economics perspective does not provide further surplus to represent downward pressure on rates.\"", "cite": ["P-098"]}, {"t": "Georgia Power's rebuttal says that real-time fuel revenue not fully covering pipeline fees \"does not mean that RTP customers are not effectively paying their share of fixed costs with the portion of RTP revenue that is allocated to base.\"", "cite": ["P-124"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Most single amounts in PIA Staff's table of left-out costs are blacked out.", "cite": ["P-150"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether costs that do not change with hour-to-hour use belong in the fuel credit; this is partly a question of definitions and partly of values.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors keeping other costs out (Georgia Power)", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that the real-time price is designed as a marginal-cost price); Mixed (PIA Staff and GIPL dispute that real-time customers pay their share of these costs through the base side, and GIPL says the price's peak-hour part is set too low); size (Georgia Power's $264 million capital-substitution figure for 2025 is public; GAM's total is blacked out)"}}, {"title": "9. Limit the shift of real-time money to fuel (GAM)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Limiting the shift would mean smaller fuel-charge cuts and less chance of base rates rising later.", "cite": ["P-144", "P-061", "P-111", "P-115", "P-016"]}, {"t": "GAM says real-time money now lowers other customers' base costs.", "cite": ["P-111"]}, {"t": "Evidence: Supported; Uncertain on how base rates would move.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "GAM witness Jonathan Ly filed testimony on Sep 23, 2026.", "cite": ["P-153"]}, {"t": "Ly said \"any increase in the amount of RTP revenues credited to GPC’s fuel account will necessarily reduce the RTP revenues currently used to offset GPC’s base revenue requirements.\"", "cite": ["P-111"]}, {"t": "GAM says that if the PSC finds a change is needed, either of Georgia Power's proposed changes would \"adequately address\" the concerns of PIA Staff and intervenors.", "cite": ["P-111"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that a bigger fuel credit moves the same dollars off the base side.", "tag": "analysis", "note": "P-061 (PIA Staff), P-047 (Georgia Power), P-105 (GIPL) and P-111 (GAM)"}, {"t": "GIPL, which backs a bigger credit, says a change it recommends \"will assist in reducing FCR rates for FCR customers, but may increase base rates for those same customers, depending on how other cost allocation questions are handled.\"", "cite": ["P-105"]}, {"t": "FCR customers are customers who pay the fuel charge.", "cite": ["P-144"]}, {"t": "Georgia Power's direct testimony said real-time revenue above added costs puts \"downward pressure on rates for all customers,\" and that changing the method would change base rate revenue.", "cite": ["P-045", "P-047"]}, {"t": "GAM said real-time revenue cut other customers' base revenues by $214 million in Georgia Power's 2022 rate case.", "cite": ["P-114"]}, {"t": "Citing Georgia Power, GAM said system lambda contributed $264 million in 2025, and that the 2025 total is \"a significant increase.\"", "cite": ["P-114"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "PIA Staff accepts a base-rate effect as \"a natural consequence of revising the methodology to accurately match costs and cost recovery in the same mechanism.\"", "cite": ["P-090"]}, {"t": "PIA Staff said \"since the fuel costs are completely the responsibility of ratepayers and the Company has no financial exposure, it is critical to get the RTP fuel credit methodology correct.\"", "cite": ["P-090"]}, {"t": "GIPL agrees \"with this concept,\" but says it \"neglects two critical factors\": fuel and base costs are shared among customer groups differently, and fuel balances carry forward.", "cite": ["P-099"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Looking back, PIA Staff says Georgia Power could have absorbed its plan \"while maintaining its targeted Return on Equity,\" with estimated earned returns of 10.3, 10.9 and 10.9 percent in 2023–2025, \"well within\" the PSC's allowed range of 9.5 to 11.9 percent.", "cite": ["P-090", "P-091"]}, {"t": "For any change made now, the order records the base-side change for the next base rate case.", "cite": ["P-016"]}, {"t": "GIPL said capital substitution is \"a necessary cost of service, and from an economics perspective does not provide further surplus to represent downward pressure on rates.\"", "cite": ["P-098"]}, {"t": "Georgia Power's rebuttal says this money \"is reducing other costs recovered through base rates and effectively lowering the retail cost of service for customers in a base rate case.\"", "cite": ["P-124"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "GAM's 2025 total for real-time money on the base side is blacked out in the public version.", "cite": ["P-112", "P-114"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much base rates would move, and which way: the PSC's order leaves that to Georgia Power's next base rate case.", "cite": ["P-016"]}, {"t": "Whether a lower fuel charge now is worth a possible base-rate change later is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors limiting the shift to fuel (GAM)", "claimType": "factual, predictive and values", "evidence": "Supported (no party whose testimony we could read disputes that a bigger fuel credit moves the same dollars off the base side); Uncertain (how base rates would move: a later base rate case decides); size (the same dollars as the fuel side, such as PIA Staff's $220 million for Option 2 in 2023–2025)"}}, {"title": "Questions to weigh", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "For take-or-pay contracts, should the credit count both their cost and their energy (take-or-pay choice 2), neither (take-or-pay choice 1), or keep today's energy-only count?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "How should the PSC weigh a lower fuel charge now against possible base-rate effects later, which its order leaves to the next base rate case?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Should any real-time revenue be counted toward pipeline and gas storage fees?", "tag": "editorial", "note": ""}, {"t": "If so, should old and new fees be treated alike, split by peak demand or by energy use, or moved to base rates?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Do real-time customers already pay their share of fixed fuel costs through the base side, or should the fuel credit count those costs too?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Customer groups pay different shares of fuel costs and base costs.", "cite": ["P-116", "P-099"]}, {"t": "How would each plan affect homes compared with businesses?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Which of these changes belong in this case, and which in Georgia Power's next base rate case?", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "evidence", "title": "Layer 5: Evidence", "blocks": [], "subs": []}]}, "passages": {"P-001": {"source": "S01", "locator": "docket page: docket fields", "text": "Docket #57171 Title: RTP Revenue Credit and Allocation Methodology Industry: Electric Date: 06/02/2026 Status: Open", "note": null}, "P-003": {"source": "S01b", "locator": "filing list: document 229261", "text": "\"documentId\":229261,\"description\":\"Transcript from hearing held on October 15, 2026\",\"filedDate\":\"2026-10-26T00:00:00\",\"receivedDate\":\"2026-10-26T00:00:00\",\"companyDetailsVm\":[{\"companyName\":\"Hearing Transcript\",\"companyId\":3901,\"companyIndustryVm\":[],\"selectedIndustries\":[],\"contactVm\":[],\"companyContactVm\":[],\"slug\":\"hearing-transcript-1\",\"addresses\":[],\"userId\":0,\"isGeneralError\":false,\"isUserBlocked\":false,\"createdOn\":\"2026-11-08T02:00:39.0357437-05:00\",\"modifiedOn\":\"2026-11-08T02:00:39.0357451-05:00\",\"isActive\":true}],\"isCurrentUserHasSubscribed\":false,\"hasAttachment\":false", "note": null}, "P-005": {"source": "S02", "locator": "order, section I (Background)", "text": "The May 28, 2026, Short Order Adopting Stipulation in Docket 56765 required that the “Commission shall further review the methodology by which the Company credits Real-Time Pricing (“RTP”) revenue to the FCR revenues and the allocations the Company is making under such methodology in this Docket. This proceeding shall be concluded by December 31, 2026, and the Commission may make modifications if appropriate. The implementation of such modifications, if any, shall be credited to fuel revenues as determined by the Commission, and any corresponding change to base revenues shall be recorded in a regulatory asset or liability and addressed in the next base rate case. As part of such proceeding, the Company shall provide Commission Staff, within 45 days of the date of the order adopting this Stipulation, complete hourly RTP generation and dispatch data including cost and energy (MWhs) for the FCR-27 historical period and projections for the current FCR-27 period. Staff may issue data requests seeking additional information related to the methodology and allocations.”", "note": null}, "P-006": {"source": "S02", "locator": "order, section II: PIA Staff", "text": "The PIA Staff shall be responsible for performing an independent evaluation of the filed case from the standpoint of promoting the public interest and just and reasonable rates and advocating for that position. The PIA Staff is considered a party to the case and may negotiate settlements with other parties, in the public interest.", "note": null}, "P-007": {"source": "S02", "locator": "order, section II: Commissioner Advisory Staff", "text": "The Commissioner Advisory Staff shall not be a party to this case, but shall act as a technical advisor to the Commissioners, and shall advise Commissioners upon request based exclusively on its own independent evaluation of the facts contained in the record.", "note": null}, "P-008": {"source": "S02", "locator": "order, section III: August 14 and September 1, 2026", "text": "August 14, 2026 Georgia Power Company will file by 4:00 p.m. with the Commission direct testimony regarding the RTP FCR methodology. September 1, 2026 Beginning at 9:30 a.m. the Commission will hear applications to intervene, any objections thereto, and any appropriate motions concerning Georgia Power’s pre-filed testimony. Following these motions, the Commission will conduct hearings on Georgia Power’s direct testimony in Docket 57171.", "note": null}, "P-009": {"source": "S02", "locator": "order, section III: September 23 to October 27, 2026", "text": "September 23, 2026 Staff and Intervenors shall pre-file direct testimony in Docket 57171 by 4:00 p.m. October 15, 2026 Beginning after the regularly scheduled Committee Meetings, the Commission will hear applications to intervene, any objections thereto, and any appropriate motions concerning Staff and Intervenors’ pre-filed testimony. Following these motions, the Commission will conduct hearings on Staff and Intervenors’ direct testimony in Docket 57171. October 27, 2026 Georgia Power may file any pre-filed rebuttal testimony in Docket 57171 by 4:00 p.m.", "note": null}, "P-010": {"source": "S02", "locator": "order, section III: November 12, 2026", "text": "November 12, 2026 Beginning after the regularly scheduled Committee Meetings, the Commission will hear applications to intervene, any objections thereto, and any appropriate motions concerning Georgia Power’s pre-filed rebuttal testimony. Following these motions, the Commission will conduct hearings on Georgia Power’s rebuttal testimony.", "note": null}, "P-011": {"source": "S02", "locator": "order, section III: December 2, 2026", "text": "December 2, 2026 All briefs and/or proposed orders shall be filed with the Commission by 4:00 p.m.", "note": null}, "P-012": {"source": "S02", "locator": "order, section III: December 10, 2026", "text": "December 10, 2026 This matter shall be considered at the scheduled Energy Committee Meeting, which begins at 9:30 a.m. and shall be held in the Commission’s hearing room.", "note": null}, "P-013": {"source": "S02", "locator": "order, section III: December 15, 2026", "text": "December 15, 2026 A Final Decision on this proceeding will be made by the Commission on December 15, 2026 at the regularly scheduled Administrative Session.", "note": null}, "P-014": {"source": "S02", "locator": "order, ordering paragraphs and closing line", "text": "ORDERED, that the procedures and schedules contained within this Procedural and Scheduling Order are hereby adopted by this Commission. ORDERED FURTHER, that a motion for reconsideration, rehearing or oral argument or any other motion shall not stay the effective date of this Order, unless otherwise ordered by the Commission. ORDERED FURTHER, that jurisdiction over this matter is expressly retained for the purpose of entering such further Order or Orders as this Commission may deem just and proper. The above by action of the Commission in its Administrative Session on the 7th day of July 2026.", "note": null}, "P-015": {"source": "S02", "locator": "order, letterhead (commissioners on 2026-07-07)", "text": "COMMISSIONERS: JASON SHAW, Chairman LAUREN “BUBBA” McDONALD, Vice-Chairman PETER HUBBARD DR. ALICIA M. JOHNSON TRICIA PRIDEMORE", "note": null}, "P-016": {"source": "S21", "locator": "short order, ordering paragraph 6", "text": "ORDERED FURTHER that the Commission shall further review the methodology by which the Company credits Real-Time Pricing (“RTP”) revenue to the FCR revenues and the allocations the Company is making under such methodology in this Docket. This proceeding shall be concluded by December 31, 2026, and the Commission may make modifications if appropriate. The implementation of such modifications, if any, shall be credited to fuel revenues as determined by the Commission, and any corresponding change to base revenues shall be recorded in a regulatory asset or liability and addressed in the next base rate case.", "note": null}, "P-017": {"source": "S21", "locator": "short order, procedural history (the stipulation)", "text": "On May 12, 2026, PIA Staff and the Company entered into a Stipulation which was intended to resolve all of the substantive issues in this proceeding between the two parties (as well as issues related to the concurrent Storm Cost Recovery Docket #44280). The Stipulation was filed that day. GAM subsequently joined as a Stipulating Party on May 14,, 2026. RSM joined as a Stipulating Part on May 27, 2026, and MARTA joined on May 28, 2026.", "note": null}, "P-018": {"source": "S21", "locator": "short order, procedural history (adoption)", "text": "On May 28, 2026, the Commission Advisory Staff recommended adoption of the Stipulation without modification and the Commission subsequently approved the Advisory Staff recommendation and adopted the proposed Stipulation in this matter.", "note": null}, "P-019": {"source": "S21", "locator": "short order, ordering paragraph 2", "text": "ORDERED FURTHER that the FCR-27 fuel cost recovery rates proposed by the Company, as modified by the Stipulation, are just and reasonable and shall be effective for bills rendered beginning June 1, 2026.", "note": null}, "P-020": {"source": "S05", "locator": "cover letter, 2026-08-28", "text": "This letter is to notify you that the legal notice for Georgia Power Company’s Real Time Pricing (“RTP”) Revenue Credit and Allocation Methodology was first published on August 24, 2026.", "note": null}, "P-021": {"source": "S05", "locator": "legal notice, paragraph 1", "text": "Consistent with the Georgia Public Service Commission’s (“Commission”) May 28, 2026 Short Order Adopting Stipulation in Docket No. 56765, the Commission will review the methodology by which Georgia Power Company (“Georgia Power”) credits real time pricing (“RTP”) revenue to the Fuel Cost Recovery (“FCR”) revenues and the allocation Georgia Power is making under such methodology. This matter has been assigned Docket No. 57171 and has been scheduled for hearing before the Commission. The Company direct hearing will begin on September 1, 2026, at 9:30 a.m. and will be held in Room 110 of the Commission offices located at 244 Washington Street, SW, Atlanta, Georgia 30334-5701. Please contact the Executive Secretary’s Office, Georgia Public Service Commission at (404) 656-4501 or 1-800-282-5813 (inside Georgia only) to confirm the location of the hearing.", "note": null}, "P-022": {"source": "S05", "locator": "legal notice, accommodation paragraph", "text": "If you have a disability and will need assistance or accommodation to participate, or need further information, please contact the Executive Secretary’s Office, Georgia Public Service Commission at (404) 656-4501 or 1-800-282-5813 (inside Georgia only) at least one day prior to the hearing in this matter.", "note": null}, "P-023": {"source": "S04", "locator": "calendar list: November 12, 2026", "text": "Nov 12 9:30 am Facilities Protection/Telecommunication/Energy And Administrative Affairs Committees 11-12-2026 Nov 12 9:35 am Docket No. 57171 RTP Revenue Credit and Allocation Methodology Hearing 11-12-2026", "note": null}, "P-024": {"source": "S04", "locator": "calendar list: December 10 and 15, 2026", "text": "Dec 10 9:30 am Facilities Protection/Telecommunication/Energy And Administrative Affairs Committees 12-10-2026 Dec 15 9:30 am Administrative Session 12-15-2026", "note": null}, "P-025": {"source": "S14", "locator": "public witness page, paragraph 1", "text": "A public witness is an individual (representing himself/herself or an entity) who does not make a formal request to intervene in a proceeding before the Georgia Public Service Commission (PSC or Commission), but wishes to make comments that become a part of the official transcript of the case.", "note": null}, "P-026": {"source": "S14", "locator": "public witness page, paragraph 3", "text": "Depending upon the number of people who sign up to speak as public witnesses, the amount of time allotted for individual comments may be limited.", "note": null}, "P-027": {"source": "S14", "locator": "public witness page, tip on written comments", "text": "If you prefer to have your written comments entered into the record as though read, you may make the request during the hearing in the event you are unable to complete your testimony or if you decide that you would rather not make a verbal presentation.", "note": null}, "P-028": {"source": "S14", "locator": "public witness page, tip on arrival", "text": "Arrive about 30 minutes before the hearing begins to give yourself time to settle down, sign-in to speak, and to become familiar with your surroundings.", "note": null}, "P-029": {"source": "S14", "locator": "public witness page, paragraph 2 (last sentence)", "text": "At the scheduled Administrative Session, the Commissioners make a decision based upon the evidence that was presented during the hearing.", "note": null}, "P-030": {"source": "S15", "locator": "public comments page, full text", "text": "The public comment is a comment to the Georgia Public Service Commission providing relevant feedback on any issue before the Commission. Comments must be submitted 24 hours before a Commission vote.", "note": null}, "P-031": {"source": "S19", "locator": "FAQ: How long has the PSC been around? (last sentence)", "text": "Today, five elected Commissioners, supported by approximately 90 staff members, make decisions that affect the lives of every Georgian each time a telephone is picked up, a light is turned on, and a gas burner is used.", "note": null}, "P-032": {"source": "S19", "locator": "FAQ: role and responsibility (administrative sessions)", "text": "Administrative sessions of the Georgia Public Service Commission are held the first and third Tuesday of each month in hearing room number 110 at 244 Washington St. in Atlanta. Proceedings are open to the public.", "note": null}, "P-169": {"source": "S19", "locator": "FAQ: role and responsibility (paragraph 1, first two sentences)", "text": "The Georgia Public Service Commission has exclusive power to decide what are fair and reasonable rates for services under its jurisdiction. It must balance Georgia citizens' need for reliable services and reasonable rates with the need for utilities to earn a reasonable return on investment.", "note": null}, "P-170": {"source": "S19", "locator": "FAQ: What Is Regulated by the PSC? (electric list)", "text": "What Is Regulated by the PSC? Electric Investor-owned electric power companies (1) Electric membership corporations (42) (Territory and financing only) Municipally-owned electric power companies (52) (Territory only)", "note": null}, "P-171": {"source": "S19", "locator": "FAQ: role and responsibility (standing committees)", "text": "When regulated companies bring a rate request before the PSC, it may be taken up first by one of the Commission's three standing committees on which the commissioners serve: Telecommunications, Energy, or Administrative Affairs.", "note": null}, "P-033": {"source": "S17", "locator": "Stan Wise bio: header fields", "text": "Commissioner Stan Wise Commissioner Since: September 5, 2026 Elected: 1994; Re-elected: 2000, 2006, 2012; Appointed: 2026 Serves Through: December 31, 2026", "note": null}, "P-034": {"source": "S17", "locator": "Stan Wise bio: paragraph 2", "text": "Wise stepped down from his Commission post on February 20, 2018. In 2026, when Commissioner Tricia Pridemore left her seat, Gov. Brian Kemp appointed Wise to serve the remainder of her term.", "note": null}, "P-035": {"source": "S17b", "locator": "Jason Shaw bio: header fields", "text": "Commissioner Jason Shaw PSC Chairman Commissioner Since: January 3, 2019 Year Appointed: 2019; Elected: 2020 Serves Through: December 31, 2028", "note": null}, "P-036": {"source": "S17c", "locator": "Lauren McDonald bio: header fields", "text": "Commissioner Lauren “Bubba” McDonald Vice Chairman Commissioner Since: January 1, 2009 Elected: 1998, 2008; Re-elected: 2014, 2020 Serves Through: December 31, 2028", "note": null}, "P-037": {"source": "S17d", "locator": "Peter Hubbard bio: header fields", "text": "Commissioner Peter Hubbard Commissioner Since: January 1, 2026 Year Elected: 2025 Serves Through: December 31, 2026", "note": null}, "P-038": {"source": "S17e", "locator": "Alicia M. Johnson bio: header fields", "text": "Commissioner Alicia M. Johnson, DBA Commissioner Since: January 1, 2026 Year Elected: 2025 Serves Through: December 31, 2030", "note": null}, "P-039": {"source": "S07b", "locator": "errata cover letter, date and paragraph 1", "text": "October 7, 2026 Ms. Sallie Tanner Executive Secretary Georgia Public Service Commission 244 Washington Street, S.W. Atlanta, GA 30334-5701 RE: Docket No. 57171: Real Time Pricing (“RTP”) Revenue Credit and Allocation Methodology Dear Ms. Tanner: On September 23, 2026, PIA Staff filed the Direct Testimony and Exhibits of Tom Newsome, Philip Hayet, and Leah Wellborn in the above-referenced proceeding. Please find enclosed the First Errata to that Direct Testimony and Exhibits, including corrections to Tables 2, 3, 4, and 7, as well as corrections on page 7, line 9 and page 20, line 15.", "note": null}, "P-040": {"source": "S07b", "locator": "errata cover letter, letterhead (commissioners on 2026-10-07)", "text": "COMMISSIONERS: JASON SHAW, Chairman LAUREN “BUBBA” McDONALD, Vice-Chairman PETER HUBBARD DR. ALICIA M. JOHNSON STAN WISE", "note": null}, "P-041": {"source": "S06", "locator": "cover page (p.1)", "text": "DIRECT TESTIMONY OF DR. ROSS BEPPLER, LEE EVANS, AND BRANDON LOONEY IN SUPPORT OF GEORGIA POWER COMPANY’S RTP REVENUE CREDIT AND ALLOCATION METHODOLOGY AUGUST 14, 2026", "note": null}, "P-042": {"source": "S06", "locator": "p.6, lines 19-22", "text": "RTP rates are a collection of tariffs that provide eligible customers the option to take on price risk in exchange for potential cost savings. The Company provides participating customers an hourly price that reflects its expectation of the marginal cost of electricity.", "note": null}, "P-043": {"source": "S06", "locator": "p.7, lines 12-17", "text": "Georgia Power’s RTP tariffs are two-part rate structures that blend standard embedded rates with a marginal cost-based rate. The standard embedded rate is applied to the Customer Baseline Load (“CBL”), while the RTP rate is assessed to incremental load and reflects hourly marginal costs. The standard embedded rate collects variable and fixed costs incurred by the Company while the RTP rate represents the costs that change alongside variations in load.", "note": "Removed footnote number 2, which the text layer fuses to the end of the first sentence."}, "P-044": {"source": "S06", "locator": "p.8, lines 8-11", "text": "The Company’s RTP tariffs are available to commercial and industrial customers with a minimum demand of 250 kilowatts (“kW”) (RTP-DA) or 5 megawatts (“MW”) (RTP-HA). Currently, there are approximately 2,300 customers on RTP-DA and 170 on RTP-HA.", "note": "Rejoined 'RTP-DA', split by a line-end hyphen."}, "P-045": {"source": "S06", "locator": "p.10, lines 3-7", "text": "Access to marginal cost-based rates makes RTP a driver of new economic activity and has been an important tool in attracting incremental load to the state. Importantly, as new projects are evaluated, the Company ensures that the expected revenues more than cover the incremental costs to serve new load. Revenues in excess of the incremental cost put downward pressure on rates for all customers.", "note": null}, "P-046": {"source": "S06", "locator": "pp.10-11, p.10 line 24 to p.11 line 6", "text": "In the 2010 rate case, the Commission approved Georgia Power’s proposal to record RTP fuel revenues based on the average marginal replacement fuel costs (rather than the embedded FCR rate) on an hourly basis. This method appropriately records more RTP revenues to fuel when marginal fuel prices are high and less when they are low, which mirrors the concepts behind the RTP rates and better tracks the RTP revenues collected with the marginal fuel costs being incurred. Notably, the implementation of this revised accounting method did not affect the RTP prices paid by customers but rather more appropriately records the revenues received from RTP customers between fuel and base.", "note": "Removed the page footer that falls inside this span at the page break."}, "P-047": {"source": "S06", "locator": "p.12, lines 9-11", "text": "Q. WOULD CHANGING THE METHODOLOGY FOLLOWING THIS INVESTIGATION CHANGE BASE RATE REVENUE? A. Yes.", "note": null}, "P-048": {"source": "S06", "locator": "p.12, lines 16-21", "text": "For the incremental load priced at RTP, the revenues based on an average hourly marginal replacement fuel cost are recorded to the fuel account. This average hourly marginal replacement fuel cost is based on all Georgia Power generating units running in each hour plus Georgia Power’s share of pool sales or purchases. For the CBL portion of RTP customer load, fuel costs are billed and revenues are collected as applicable at the underlying FCR rate.", "note": null}, "P-049": {"source": "S06", "locator": "p.13, lines 4-15", "text": "The RTP fuel credit is based on marginal replacement fuel costs as the RTP rate reflects the marginal cost of serving incremental load. This does not incorporate fixed fuel costs, which do not vary with changes in demand. Fixed fuel costs are costs that the Company will incur regardless of changes in RTP incremental load and thus cannot be increased or avoided through changes in load priced at RTP. A contribution to fixed costs is made through the capital substitution component as discussed further below. Q. CAN YOU GIVE EXAMPLES OF THESE FIXED COSTS? A. Yes. In the FCR-27 docket, fixed fuel costs related to non-dispatchable PPAs, existing unit FT costs, and FT costs associated with new generation being added to serve large loads and organic growth were identified as examples of fuel expenses not included in the RTP fuel credit calculation.", "note": null}, "P-050": {"source": "S06", "locator": "p.13, lines 17-25", "text": "Non-dispatchable PPAs are those contracts in which the Company has an obligation to pay for the output of the resource when energy is produced regardless of the system’s need or current cost position. These have also been referred to as take-or-pay contracts. These are distinguished from dispatchable PPAs in which the Company can control the output of the resource in response to changes in the marginal costs of the resource or load on the system. The Company’s renewable PPAs including solar, wind, and biomass are currently structured as non-dispatchable. The execution and certification of non-dispatchable PPAs and their associated costs are not driven by large load growth.", "note": "Rejoined 'take-or-pay' and 'non-dispatchable', split by line-end hyphens."}, "P-051": {"source": "S06", "locator": "p.14, lines 2-14", "text": "Firm Transportation costs are monthly pipeline capacity reservation payments that ensure gas pipeline transportation availability to existing Georgia Power units during all periods. These costs do not include any variable pipeline transportation costs or commodity costs, which are dependent on delivery volume, priced on a volumetric basis, and captured in the marginal replacement fuel costs used in the RTP fuel credit. Q. HOW IS THAT DIFFERENT FROM NEW FT COSTS? A. New FT costs are those payments that Georgia Power incurs to ensure gas availability for new or future generation that is in the Company’s plans. The Company is distinguishing new FT from existing FT in recognition that the growth of large load customers is a primary driver of new FT costs and they may need to be treated differently. As with the non-dispatchable PPAs, existing FT costs are not driven by large load growth.", "note": null}, "P-052": {"source": "S06", "locator": "p.14 line 18 to p.15 line 13", "text": "The RTP price charged to incremental load in all hours has a component, lambda, which is the marginal cost of the marginal unit on the system. In nearly all hours, the marginal running cost is greater than the average running cost of the system, which means that in virtually all periods, RTP incremental load is contributing to fixed costs. The Company has referred to this as the capital substitution component. Further, the CBL portion of an RTP customer’s load captures the fully embedded base and FCR rate, which directly includes the fixed costs. Q. YOU PREVIOUSLY MENTIONED A CAPITAL SUBSTITUTION COMPONENT, CAN YOU ELABORATE? A. Yes. The difference between lambda and the recorded fuel revenue covers two pieces: generation variable O&M and capital substitution. The capital substitution contribution, which is applied to base rates, covers additional fixed costs above the reliability capacity cost associated with resources that support lower fuel costs, including capital costs for baseload or intermediate generation and FT. Q. WHAT IS THE MAGNITUDE OF THAT CAPITAL SUBSTITUTION COMPONENT? A. The amount will vary from year to year based on the spread between the marginal and average running costs of the system and the volume of load that is priced at RTP. The Company performed an analysis based on 2025 actual data and the capital substitution contribution for 2025 was $264 million.", "note": "Removed the page footer that falls inside this span at the page break."}, "P-053": {"source": "S06", "locator": "p.15, lines 17-26", "text": "Over the past 16 years since the current RTP fuel credit methodology was established, the system has evolved in both the types of fuel expenses incurred and the magnitude of loads served through RTP offerings. In the FCR-27 proceeding, in light of the increase in large load customers served on Georgia Power’s RTP offerings and to ensure such customers pay their share of costs, PIA Staff and intervenors questioned whether the RTP revenues were appropriately allocated between fuel and base rates and recommended the Commission undertake an additional review of the RTP fuel credit and revenue allocation methodology. As demonstrated in the Stipulation ultimately approved in Docket No. 56765, the Company supported and agreed to this subsequent review.", "note": null}, "P-054": {"source": "S06", "locator": "p.16, lines 2-11", "text": "Per the Company’s revised rules and regulations approved by the Commission in 2025, Georgia Power has committed to protect existing customers from bearing any of the costs of adding these large customers. The Company’s approach ensures not only that large load customers pay for their costs but also that all customers benefit from adding them to the system. As previously noted, when revenues exceed the incremental cost to serve, it creates downward pressure on rates for all other customers. These benefits enabled the Company to freeze base rates through 2028 and ensure the incremental revenue from large load customers has downward pressure of at least $102 per year for the typical residential customer using an average of 1,000 kWh per month for years 2029, 2030, and 2031.", "note": "Removed footnote number 3, which the text layer fuses to '2025,'."}, "P-055": {"source": "S06", "locator": "p.16, lines 14-22", "text": "The revenues Georgia Power receives from large load customers pay for the costs the Company incurs to serve them. The question raised in FCR-27 and continued in this proceeding is whether those RTP revenues are appropriately being divided between fuel and base. Q. IS THE COMPANY PROPOSING ANY MODIFICATIONS TO ITS FUEL COST RECOVERY IN THIS PROCEEDING? A. Yes. The Company proposes that the costs of new FT attributable to large load customers be fully recovered from those customers and not borne by non-large load customers in the FCR clause.", "note": null}, "P-056": {"source": "S06", "locator": "p.17, lines 5-10", "text": "In their FCR-27 testimony filed in Docket No. 56765, PIA Staff showed a 1-CP (coincident peak) allocation of FT costs. The Company agrees with this approach but proposes using a winter CP and basing the allocation on the share of organic versus large load demand growth. This approach is consistent with the capacity need that drove the incremental generation resources and the allocation in the large load cost model.", "note": null}, "P-058": {"source": "S06", "locator": "p.18, lines 2-13", "text": "There are two potential options to address their concern. The first option is to exclude both the costs and the output from non-dispatchable PPAs in the RTP fuel credit calculation. This is consistent with an approach that the RTP fuel credit should be derived from marginal replacement fuel costs. Removing non-dispatchable PPA output (MWh) from the denominator of the RTP fuel credit calculation will increase the RTP fuel credit rate and thus the recording of all RTP revenues to the fuel clause. However, this approach is not based on all Georgia Power generating units running, as originally approved. The second option is to include both the costs and the MWh from non-dispatchable PPAs in the RTP fuel credit calculation. This would break from the marginal fuel cost-based approach approved and in place since 2010 but also result in a larger allocation of RTP revenues to the fuel clause.", "note": "Rejoined 'non-dispatchable', split by a line-end hyphen."}, "P-059": {"source": "S07", "locator": "cover page", "text": "ON BEHALF OF THE GEORGIA PUBLIC SERVICE COMMISSION PUBLIC INTEREST ADVOCACY STAFF PUBLIC DISCLOSURE VERSION September 23, 2026", "note": null}, "P-060": {"source": "S07", "locator": "p.2, witness Newsome", "text": "My name is Tom J. Newsome. I am the Director of Utility Finance with the Georgia Public Service Commission (“Commission”).", "note": null}, "P-160": {"source": "S07", "locator": "p.2, witness Hayet", "text": "My name is Philip Hayet. I am a Vice President and Principal of J. Kennedy and Associates, Inc. (“Kennedy and Associates”).", "note": null}, "P-161": {"source": "S07", "locator": "p.2, witness Wellborn", "text": "My name is Leah Wellborn. I am a Director of Consulting and Principal at Kennedy and Associates.", "note": null}, "P-061": {"source": "S07", "locator": "pp.2-3, why a fuel credit method is needed", "text": "Non-RTP customers, like residential and small commercial customers, are subject to separate rates to collect base revenues and fuel revenues. RTP sales are based on a single rate. RTP revenues must be allocated between base revenues and fuel revenues. The RTP Fuel Credit Methodology is used by the Company to calculate how much RTP revenue to allocate to fuel revenues. The remainder of RTP revenues are allocated to base revenues.", "note": null}, "P-062": {"source": "S07", "locator": "p.3, Staff's three guidelines", "text": "Staff had three guidelines. The first guideline is that fuel related costs should correspondingly be matched with fuel revenues to cover those costs. The second is that costs recovered through the fuel clause should be recovered from all customers, and the third is that costs recovered from fuel revenues should be allocated based on energy usage (MWhs).", "note": null}, "P-063": {"source": "S07", "locator": "pp.3-4, costs left out of the credit", "text": "The Company does not include the following costs in the RTP Fuel Credit Methodology calculation. • Natural gas firm transportation • Natural gas storage • Natural gas hedging gains/losses • Natural gas gains/losses on resales • Coal quality penalties and premiums • Coal rail car leases • Coal rail car shortfall/liquidated damages costs • Start-up costs for Purchased Power Agreements (PPAs) • Energy costs associated with non-dispatchable PPAs (Solar, Wind, Biomass, and Qualifying Facilities) • FCR over/under-balance carrying costs • Income Qualified Discount (IQD) • Non-subscription renewables program expenses • Corporate overhead and labor [fn2] Omitting these costs decreases the RTP revenues allocated to fuel revenues and results in non-RTP customers absorbing all these costs. This is inconsistent with Staff’s guideline that costs recovered through the fuel clause should be recovered from all customers.", "note": null}, "P-064": {"source": "S07", "locator": "p.4, not all costs need be included", "text": "Yes; however, Staff does not necessarily expect that all these costs be included in the RTP Fuel Credit Methodology calculation as there are policy and cost causation arguments that suggest some of these costs could be omitted when calculating the RTP revenues credited to the fuel revenues.", "note": null}, "P-065": {"source": "S07", "locator": "p.5, Table 1 (Georgia Power's and Staff's recommendations, all rows)", "text": "Category of Costs | Georgia Power Recommendation | Staff Recommendation Energy costs non-dispatchable PPAs | Option 1 or 2; Option 1 preferred [fn3] | Option 2 Natural gas FT costs (New) | Include, allocate on a winter 1-CP | Include, allocate on MWH Natural gas FT costs (Existing) | Exclude from RTP credit calculation | Natural gas storage | Exclude from RTP credit calculation | Non-subscription renewable program expenses | Over/Under determined in base rates per FCR-27 stipulation Coal rail car leases | Exclude from RTP credit calculation | Include, allocate on MWH Start-up costs for PPAs | Exclude from RTP credit calculation | Coal quality penalties and premiums | Exclude from RTP credit calculation | Coal rail car shortfall/ liquidated damages costs | Exclude from RTP credit calculation | Natural gas gains/losses resales | Exclude from RTP credit calculation | Corporate overhead and labor | Exclude from RTP credit calculation | Include, allocate on MWH FCR carrying costs | Exclude from RTP credit calculation | Policy Related (No Recommendation) Income Qualified Discount | Exclude from RTP credit calculation | Natural gas hedging gains/losses | Exclude from RTP credit calculation |", "note": "In the filed table, Staff's column has merged cells (checked in the .docx XML): a recommendation printed once covers the blank rows below it until the next entry. The renewable-program row's text spans both recommendation columns."}, "P-066": {"source": "S07", "locator": "p.7, estimated effect on current fuel rates (as filed; see S07b)", "text": "Q. IF STAFF’S RECOMMENDATIONS HAD BEEN IN PLACE DURING 2023 – 2025 WHAT WOULD HAVE BEEN THE IMPACT ON CURRENT (FCR-27) FUEL RATES? A. The additional $329 million of RTP revenues allocated to fuel revenues would have eliminated a $322 million under collected fuel balance. The current FCR-27 rate would have been lower resulting in a decrease in customer bills of approximately $1.35 per month.", "note": null}, "P-067": {"source": "S07", "locator": "footnote 4", "text": "[footnote 4] The $1.35 per month savings based on data in the Company’s Docket 3382 monthly fuel report “FCR-27 Over Under Recovery – June 2026 TS Errata.xlsx” and a residential customer that consumes 1,000 kWhs per month.", "note": null}, "P-068": {"source": "S07", "locator": "p.8, reporting recommendation 1", "text": "1) Monthly RTP Reporting: Staff recommends monthly fuel reporting include sufficient detail on RTP fuel credit rate, mega-watt hour (“MWh”) sales, RTP fuel revenues compared to the average non-RTP fuel rates. The monthly fuel report filed by the Company under Docket 3382 should include a new separate line item in Retail Fuel Revenues section showing RTP sales (MWhs) and RTP revenues. The Company should file a corresponding separate report to show the calculation of RTP revenues credited to fuel revenues, starting no later than January 1, 2027.", "note": null}, "P-070": {"source": "S07", "locator": "p.9, RTP load growth", "text": "The Company acknowledged the growth in new economic development load will mainly be based on RTP pricing.", "note": null}, "P-071": {"source": "S07", "locator": "footnote 10", "text": "[footnote 10] New Large Load customers under the TOU-SC tariff have no CBL, pay RTP rates, and have a Monthly Access Charge (“MAC\") to ensure incremental fixed cost recovery.", "note": null}, "P-072": {"source": "S07", "locator": "p.13, the take-or-pay concern and Georgia Power's two options", "text": "Staff is concerned the current RTP Fuel Credit Methodology does not include the costs of non-dispatchable PPA contracts, also referred to as Take or Pay contracts, in the calculation of RTP revenues credited to the fuel revenues. This results in less RTP revenue being credited to fuel revenues. The Company recognized this is a problem in this proceeding, and in testimony recommended either excluding both the energy and the costs of non-dispatchable PPAs from the RTP Fuel Credit calculation (Option 1) or including both the energy and the costs associated with non-dispatchable PPAs in the calculation (Option 2).", "note": null}, "P-073": {"source": "S07", "locator": "p.13, Staff recommends Option 2", "text": "Staff recommends Option 2, which includes both the energy (MWhs) and costs (dollars) associated with all non-dispatchable PPAs in the Fuel Credit Methodology. This is consistent with the 2010 rate case proposal, which assumed that all Georgia power unit and purchase costs would be included in the calculation.", "note": null}, "P-074": {"source": "S07", "locator": "p.14, why Staff opposes Option 1", "text": "Option 1 is inconsistent with Staff’s guidelines. All costs should be included when calculating the amount of RTP revenue to allocate to fuel revenues. Option 1 omits non-dispatchable costs from the calculation when the energy from these non-dispatchable resources serve all customers.", "note": null}, "P-075": {"source": "S07", "locator": "p.15, the AIER", "text": "Had the Company wanted to use an accurate “marginal” cost RTP Fuel Cost Credit methodology, the Company should have proposed the associated interchange energy rate (“AIER”) for use as the RTP fuel credit methodology.", "note": null}, "P-076": {"source": "S07", "locator": "p.15, 2025 take-or-pay data", "text": "The Company provided settlement data for 2025, which showed that approximately 9.8 million MWh of non-dispatchable generation was included in the RTP fuel credit calculation,[fn23] while the Company reported that $486 million in associated costs were excluded from the RTP fuel credit calculation.[fn24] By including MWhs and omitting dollars from take-or-pay contracts in RTP Fuel Credit calculation the Company unreasonably suppressed the amount RTP revenues credited to fuel revenues.", "note": null}, "P-077": {"source": "S07", "locator": "footnote 24", "text": "[footnote 24] STF-JKA-3-6. By 2027, the excluded take-or-pay contracts may exceed more 17 million MWh, showing that the impacts of non-dispatchable PPAs are growing. Note, $486 million is the total amount of non-dispatchable costs on the system in the year, not an RTP allocation of cost responsibility.", "note": null}, "P-078": {"source": "S07", "locator": "p.16, Table 5 and the text after it", "text": "Historic 2023-2025 (Calendar Year) | RTP Fuel Credit | GPC Option 2 | Delta | Current Method | Add Take-or-Pay Costs | Shortfall 2023 | ……………. | ……………. | $69,780,970 2024 | ……………. | ……………. | $74,278,059 2025 | ……………. | ……………. | $76,395,242 Total | $1,085,720,026 | $1,306,174,298 | $220,454,272 The Company’s current RTP Fuel Credit methodology resulted in an under-allocation of $70 million, $74 million and $76 million of RTP revenues to fuel revenues for the years 2023, 2024 and 2025, respectively. Note that Staff’s review was limited to the data the Company provided, which Staff found to be incomplete, and therefore, these results may actually under-estimate the total impact.", "note": null}, "P-079": {"source": "S07", "locator": "p.17, Table 6 and the text after it", "text": "Projected 2026-2031 (Calendar Year) | RTP Fuel Credit | GPC Option 2 | Delta | Current Method | Add Take-or-Pay Costs | Shortfall 2026 | ……………. | ……………. | $125,870,149 2027 | ……………. | ……………. | $168,584,073 2028 | ……………. | ……………. | $235,346,380 2029 | ……………. | ……………. | $310,361,061 2030 | ……………. | ……………. | $374,891,320 2031 | ……………. | ……………. | $399,271,411 These projected results indicate that the under-allocation of RTP revenues to fuel revenues is expected to grow over time compared to the historical period, if the current RTP Fuel Credit methodology is not modified as recommended by Staff.", "note": null}, "P-080": {"source": "S07", "locator": "p.17, summary of the take-or-pay recommendation", "text": "Staff recommends the RTP Fuel Credit Methodology be modified to include both the costs and the energy associated with take-or-pay contracts in the hourly calculation (the Company’s Option 2). These costs are incurred to serve all customers at all times and should be included when the Company calculates the amount of RTP revenues credited to fuel revenues.", "note": null}, "P-081": {"source": "S07", "locator": "p.17, pipeline (FT) and storage costs", "text": "Natural gas FT and storage costs are fixed costs the Company pays to ensure natural gas is deliverable via various pipelines and from storage facilities to ensure generating unit reliability.[fn28] These costs are labeled “fixed” because they generally do not change with the volume of natural gas consumed to generate energy. Staff’s investigation noted that RTP customer load occurs in both high and low load hours, making it reasonable that RTP revenues be allocated to the fuel revenues to address the natural gas FT and storage costs.", "note": null}, "P-082": {"source": "S07", "locator": "p.18, Georgia Power's partial proposal", "text": "The Company proposed that only new FT costs be shared and allocated on a winter 1-CP basis. The Company’s proposal does not address the allocation of RTP revenues to fuel revenues to cover existing FT cost. Therefore, the Company’s proposal to allocate new FT costs is only a partial solution and adds undue complexity to the RTP fuel credit methodology.", "note": null}, "P-083": {"source": "S07", "locator": "p.18, double-recovery concern", "text": "The Company has asserted that a portion of the revenue paid by RTP customers that is currently credited to base revenues is intended to cover some FT costs.[fn29] This raises the possibility of double recovery because all FT costs are indisputably charged to and recovered from fuel revenues. Absent a modification to the RTP Fuel Methodology, there is a risk that the Company may recover a portion of its FT costs twice.", "note": null}, "P-084": {"source": "S07", "locator": "pp.18-19, Staff's pipeline-cost recommendation", "text": "To eliminate this risk, Staff recommends that the RTP Fuel Credit Methodology be modified so that all FT costs, both existing and new, are allocated across all customers on the basis of monthly energy consumption. Because the FCR tariff rate is an energy-based rate, allocating FT costs on an energy basis is consistent with the manner in which fuel costs are recovered. This is also consistent with how FT costs have been recovered from non-RTP customers over the past 15 years.", "note": null}, "P-085": {"source": "S07", "locator": "p.19, on a single-peak-hour (1-CP) allocation", "text": "It is clear that fixed cost recovery and reliability are not issues limited to a single 1-CP winter hour. FT is necessary for all hours across each month in order to reliably serve customers.", "note": null}, "P-086": {"source": "S07", "locator": "p.21, alternative if the PSC prefers a demand allocator", "text": "If the Commission prefers a demand allocator, or separate treatment of existing and new FT for allocation purposes, Staff recommends that all FT costs no longer be recovered through the FCR mechanism. Instead, these costs should be recovered through base rates to provide full transparency and ensure that costs and revenues are matched within the same recovery mechanism.", "note": null}, "P-087": {"source": "S07", "locator": "p.24, Table 11 (fuel-related fixed costs)", "text": "Coal rail car leases | Excluded from RTP credit calculation | Include and assign on MWH Start-up costs for Purchased Power Agreements (PPAs) | Excluded from RTP credit calculation | Include and assign on MWH Coal quality penalties and premiums | Excluded from RTP credit calculation | Include and assign on MWH Coal rail car shortfall/ liquidated damages costs | Excluded from RTP credit calculation | Include and assign on MWH Natural gas gains/losses on resales | Excluded from RTP credit calculation | Include and assign on MWH", "note": null}, "P-088": {"source": "S07", "locator": "p.25, corporate overhead", "text": "Staff recommends that Corporate Overhead costs be included in RTP Fuel Credit calculation, as it is a fuel-related cost and follows procurement.", "note": null}, "P-089": {"source": "S07", "locator": "p.25, policy-related costs", "text": "Staff acknowledges that other costs recovered from fuel revenues are primarily policy-related or could otherwise be considered independent of fuel procurement or dispatch processes. These categories include over/under balance carrying costs, income qualified discount programs, and natural gas hedging gains and losses. It may be reasonable to allocate the three remaining costs in Table 13 to all customers on an energy basis. However these are policy related matters and, Staff makes no recommendation at this time.", "note": null}, "P-090": {"source": "S07", "locator": "p.27, rate case considerations", "text": "However, since the fuel costs are completely the responsibility of ratepayers and the Company has no financial exposure, it is critical to get the RTP fuel credit methodology correct. Any impact to base rates would be a natural consequence of revising the methodology to accurately match costs and cost recovery in the same mechanism. The direction and magnitude of any future impact would need to be determined in a base rate case. Staff reviewed the 2023 – 2025 Annual Surveillance Review filings and concluded the Company would have had the financial capability to absorb additional RTP revenues credited to fuel revenues while maintaining its targeted Return on Equity (“ROE”).", "note": null}, "P-091": {"source": "S07", "locator": "footnote 45", "text": "[footnote 45] Staff estimated the Company’s earned ROE would have decreased an average of 0.49 percent during each of these three years. The Company’s revised ROEs would have been 10.3 percent, 10.9 percent and 10.9 percent for 2023, 2024 and 2025, respectively. These revised ROEs are well within the Commission approved earnings band of 9.5 percent to 11.9 percent from the 2022 rate case.", "note": null}, "P-092": {"source": "S08", "locator": "PDF p.3 (testimony p.1), line 2", "text": "My name is John D. Wilson. I am the Vice President of Grid Strategies LLC", "note": null}, "P-093": {"source": "S08", "locator": "PDF p.4 (testimony p.2), lines 10-12", "text": "ON WHOSE BEHALF ARE YOU TESTIFYING IN THIS CASE? A: Georgia Interfaith Power and Light (GIPL), and its member congregations Park Avenue Baptist Church, Temple Sinai, and Unitarian Universalist Church of Savannah.", "note": null}, "P-094": {"source": "S08", "locator": "PDF p.4 (testimony p.2), lines 16-18", "text": "First, I find that Georgia Power has set its RTP price too low during peak hours because the reliability cost component was set inconsistently with the peaker method.", "note": null}, "P-095": {"source": "S08", "locator": "PDF p.5 (testimony p.3), lines 14-20", "text": "Second, I find that several categories of costs recovered from FCR customers are not included in the RTP fuel credit. The RTP fuel credit – on a $/MWh basis – is therefore an underestimate of the fuel costs that should be allocated to the incremental load priced at RTP. Accordingly, I make several recommendations for changes to the RTP fuel credit, including that the Commission should: 4. Adopt Georgia Power’s recommendation to “exclude both the costs and the output from non-dispatchable PPAs in the RTP fuel credit calculation.”", "note": null}, "P-096": {"source": "S08", "locator": "PDF p.6 (testimony p.4), lines 1-17", "text": "5. Adopt, with modifications, Georgia Power’s recommendation to recover the costs of new firm transportation (FT) cost from large load customers, excluding those costs from the FCR rate. 6. Revise the RTP fuel credit calculation to include direct contributions to FT cost, assuming fixed fuel delivery costs are not included in the marginal value of generation capacity. If that is not the case, then I provide two alternate recommendations whereby the Commission should either allocate FT costs to RTP customers in the fuel docket or move FT costs to base rates. 7. Reject Georgia Power’s proposal for a winter 1CP allocation of new FT cost, instead using the same allocation factor as transmission costs until the issue is fully examined in the next rate case. To the extent that the Commission seeks to rely on Georgia Power’s large load cost model, the Commission should also direct Georgia Power to make a working copy available to intervenors on a basis that addresses commercial sensitivity concerns yet allows for full stakeholder participation in Commission decisions based wholly or in part on that model. 8. Revise the RTP fuel revenue credit to include coal-related costs and corporate overhead and labor.", "note": null}, "P-097": {"source": "S08", "locator": "PDF p.7 (testimony p.5), lines 6-14", "text": "In the last few years, the Commission has approved the procurement of thousands of megawatts of new generation resources to accommodate large load customers. Given the magnitude of the billpayer investments forecasted by Georgia Power, the Commission has treated these large loads in a distinct manner, holding them to a higher standard when it comes to cost shifting. The FCR-27 proceeding was the first fuel proceeding since the data center boom began and parties raised concerns that the current RTP methodology, which has been applied to data center customers, resulted in higher fuel costs for other customers, in apparent contravention of Georgia Power’s statements that data centers would not be subsidized by existing customers.", "note": null}, "P-098": {"source": "S08", "locator": "PDF p.9 (testimony p.7), lines 7-19", "text": "Capital substitution is a core component of the peaker method and represents the contribution from lambda to the cost of more efficient generation. As an example, if a utility built all peakers, then system lambda would be approximately equal to average fuel costs, and there would be no surplus to provide capital substitution – but capital substitution would be unnecessary because the marginal cost of generation, based on the peaker cost, would also be covered. This is because the marginal cost of generation is set to cover the full cost of a peaker unit. Thus, if a customer’s energy use is fully priced using RTP, then in theory the RTP rate covers the full cost of that peaker unit. However, Georgia Power does not fully rely on peakers, at some periods the system lambda recovers more revenues than are credited to cover fuel costs. This surplus is needed to cover the higher cost of generation that operates more frequently than peakers (e.g., intermediate units). This is a necessary cost of service, and from an economics perspective does not provide further surplus to represent downward pressure on rates.", "note": null}, "P-099": {"source": "S08", "locator": "PDF p.22 (testimony p.20), lines 3-13", "text": "Several categories of costs recovered from FCR customers are not included in either the Georgia Power unit costs or the pool purchases/sales cost. The credit – on a $/MWh basis – is therefore an underestimate of the fuel costs that should be allocated to the incremental load priced at RTP. This shifts costs to FCR customers. While in this proceeding, Georgia Power has agreed to make some changes, it argues that the current method is fair, as any revenues that are not recorded as a credit in the FCR are recorded as base revenues, and serve to diminish the revenue requirement for other customers collected through base rates. While I agree with this concept, it neglects two critical factors: cost allocation in the FCR differs from cost allocation in base rates, and the FCR is subject to under- or over-recovery that is carried forward as a balance, which may affect either an FCR filing or a rate case.", "note": null}, "P-100": {"source": "S08", "locator": "PDF p.24 (testimony p.22), lines 1-7", "text": "Q: DO YOU SUPPORT THIS PROPOSAL? A: Yes. This resolves this problem with the current RTP fuel credit calculation. I would further note that as long as the output from non-dispatchable PPAs remains less than the load from FCR customers, then the net effect of this approach is to assign both the costs and the benefits of non-dispatchable resources to FCR customers. This is appropriate, as incremental RTP load should be assigned the cost of resources that may be dispatched in response to price-sensitive demand.", "note": null}, "P-101": {"source": "S08", "locator": "PDF p.24 (testimony p.22), lines 16-20", "text": "Yes, but with modifications. I agree with Georgia Power that removing the costs of new FT attributable to large load customers from the FCR clause addresses one problem with the current RTP fuel credit calculation. However, I do not agree that it is reasonable to excuse incremental RTP load from an explicit allocation of FT cost, nor do I agree with the proposed cost allocation factor for FT attributable to large load customers.", "note": null}, "P-102": {"source": "S08", "locator": "PDF p.26 (testimony p.24), lines 9-16", "text": "Furthermore, even if FT costs are included in Georgia Power’s marginal value data, it does matter where these revenues are credited. Costs in the FCR are allocated on the basis of energy (MWh) and fixed O&M in base rates are generally allocated on the basis of demand (MW). If the ratio of MWh to MW were the same for all classes, I would agree with Georgia Power. But that ratio, of course, varies, meaning that cost allocation outcomes differ depending on whether FT costs are allocated on the basis of energy or demand. To resolve these problems, the Commission should revise the RTP fuel credit calculation to include a direct contribution to FT costs.", "note": null}, "P-103": {"source": "S08", "locator": "PDF p.28 (testimony p.26), lines 8-12", "text": "And further, Georgia Power’s assertion that its model uses a winter 1CP allocation factor, nor any information on how it is used, is not supported by any available evidence in this or any other related proceeding. Georgia Power has consistently refused to allow intervenors any opportunity whatsoever to review the large load cost model it refers to – not even on a trade secret basis.", "note": null}, "P-104": {"source": "S08", "locator": "PDF p.29 (testimony p.27), lines 3-8", "text": "Since FT is similar to transmission, in that it is required to meet peak demand conditions whenever and for whatever reason they may occur, I recommend that new FT costs be allocated between large load customers and other growth using the same allocation factor as transmission costs. This decision could be made explicitly provisional until the next rate case when a full review of cost allocation methods relevant to large load customers can be considered.", "note": null}, "P-105": {"source": "S08", "locator": "PDF p.32 (testimony p.30), lines 8-11", "text": "This will not result in double-recovery, as the rates charged to RTP customers will not change, just the RTP fuel revenue credit. But it will shift revenue credit from base rates to FCR. This will assist in reducing FCR rates for FCR customers, but may increase base rates for those same customers, depending on how other cost allocation questions are handled.", "note": null}, "P-106": {"source": "S08", "locator": "PDF p.33 (testimony p.31), lines 14-16", "text": "I support excluding fuel-related costs that are not actual costs of fuel (or purchased power) used to generate electricity. This includes gas hedging gains/losses, gas gains/losses on resales, FCR carrying costs, and net renewable program revenues/expenses.", "note": null}, "P-107": {"source": "S08", "locator": "PDF p.19 (testimony p.17), lines 15-19", "text": "Q: ARE CHANGES TO RTP RATE DESIGN WITHIN THE SCOPE OF THIS PROCEEDING? A: No. Nonetheless, I recommend that Georgia Power propose for Commission review and approval RTP pricing that utilizes [blacked out in the public version] as quickly as possible.", "note": "Marked a redaction the text layer drops: the words after 'utilizes' are blacked out in the public PDF. The coordinating session checked a rendered image of PDF p.19 (testimony p.17): lines 18-19 show black redaction bars there."}, "P-108": {"source": "S09", "locator": "PDF p.4 (testimony p.1), line 5", "text": "I am an Associate Consultant at J. Pollock, Incorporated.", "note": null}, "P-109": {"source": "S09", "locator": "PDF p.5 (testimony p.2), lines 2-5", "text": "I am testifying on behalf of the Georgia Association of Manufacturers (GAM). The members of GAM are customers of Georgia Power Company (GPC). They consume large quantities of electricity, primarily for manufacturing, under a variety of rate schedules.", "note": null}, "P-110": {"source": "S09", "locator": "PDF p.6 (testimony p.3), lines 25-32", "text": "No specific portion of RTP revenues should be credited against FT costs because FT costs are fully fixed costs that affect GPC’s average cost of service. In contrast, RTP is a marginal cost-based rate. • However, RTP sales can contribute to the recovery of these costs when the system lambda charge, an RTP component which reflects the replacement cost of fuel, exceeds GPC’s average fuel costs. In addition, other components of RTP contribute to the recovery of fixed production operation and maintenance (O&M) expenses.", "note": null}, "P-111": {"source": "S09", "locator": "PDF p.7 (testimony p.4), lines 1-7", "text": "The revenues derived from RTP sales place downward price pressure on non-RTP rates. Thus, any increase in the amount of RTP revenues credited to GPC’s fuel account will necessarily reduce the RTP revenues currently used to offset GPC’s base revenue requirements. • Should the Commission find that GPC’s RTP fuel credit calculation methodology should be modified, either of GPC’s proposed changes would adequately address PIA Staff and intervenors’ concerns.", "note": null}, "P-112": {"source": "S09", "locator": "PDF p.8 (testimony p.5), lines 17-20", "text": "The adders paid by RTP customers lower the remaining costs that GPC must recover from non-RTP customers. As discussed later, RTP revenues reduced GPC’s system revenue requirements by $ in 2025.", "note": null}, "P-113": {"source": "S09", "locator": "PDF p.14 (testimony p.11), lines 3-7", "text": "GPC is proposing that the costs of the new FT capacity be allocated to new very large load customers based upon their contribution to the winter coincident peak load relative to organic load growth. This proposal would ensure that incremental FT costs attributable to new very large load customers are fully recovered from these customers.", "note": "Removed footnote number 2, which the text layer fuses to 'growth.'."}, "P-114": {"source": "S09", "locator": "PDF p.15 (testimony p.12), lines 6-11", "text": "According to GPC, system lambda contributed $264 million to the recovery of fixed production O&M expenses in 2025. This is in addition to the $ of fixed cost contributions from the other RTP pricing components in 2025, resulting in a total contribution of $ to base rates. This amount represents a significant increase from the RTP revenues that reduced non-RTP base revenues in GPC’s 2022 rate case, Docket No. 44280, which totaled $214 million.", "note": "Removed footnote number 6, which the text layer fuses to '2025.'. The blanks after '$' are redactions in the public version."}, "P-115": {"source": "S09", "locator": "PDF p.16 (testimony p.13), lines 3-7", "text": "Either of these changes would increase the amount of RTP revenues that are credited to fuel. However, I would note that any increase in the amount of RTP revenues credited to the fuel account will necessarily reduce the RTP revenues currently used to offset GPC’s non-fuel base revenue requirements. Thus, increasing the RTP fuel credit would put upward pressure on base rates.", "note": null}, "P-116": {"source": "S09", "locator": "PDF pp.16-17 (testimony pp.13-14), Table 1 and p.14 lines 1-4", "text": "Table 1 Percentage of Base Revenues vs. Fuel Revenues By Customer Class Customer Base Fuel Class Revenues Revenues Domestic 58.07% 55.36% Small Business 12.93% 9.76% Medium Business 19.71% 22.46% Large Business 4.29% 6.82% Agricultural 0.28% 0.37% Government/Institution 2.33% 3.78% Lighting 2.39% 1.44% Total Retail 100.00% 100.00% Source: Docket No. 44820, Georgia Power Company Cost-of- Service Study for Test Year Ending July 31, 2023, Schedule 2.10, lines 1 and 2. As can be seen, crediting additional RTP revenues to the fuel account would provide a greater benefit to Medium Business, Large Business, Agricultural, and Government/Institution customers than to Domestic, Small Business, and Lighting customers.", "note": "Removed the page footer and header that fall inside this span at the page break."}, "P-117": {"source": "S11", "locator": "cover page", "text": "REBUTTAL TESTIMONY OF DR. ROSS BEPPLER, LEE EVANS, AND BRANDON LOONEY IN SUPPORT OF GEORGIA POWER COMPANY’S RTP REVENUE CREDIT AND ALLOCATION METHODOLOGY OCTOBER 27, 2026", "note": null}, "P-118": {"source": "S11", "locator": "section I, summary (Staff's guidelines)", "text": "Specifically, we address PIA Staff’s three overarching guidelines, which serve as the basis for their recommended modifications to the RTP fuel credit methodology. We explain how these three guidelines, which are introduced for the first time in this proceeding as a policy recommendation, are not supported by cost allocation and ratemaking principles and should be given no weight by the Georgia Public Service Commission (the “Commission”).", "note": null}, "P-119": {"source": "S11", "locator": "section I, summary (Option 1)", "text": "Regarding non-dispatchable power purchase agreements (“PPAs”), we emphasize our support, alongside GIPL, for Option 1, which preserves the integrity of RTP as a marginal cost-based rate by excluding both the costs and output of non-dispatchable PPAs from the RTP fuel credit calculation.", "note": null}, "P-120": {"source": "S11", "locator": "section II, Staff's guidelines", "text": "PIA Staff’s guidelines are new policy recommendations for the Commission’s consideration,[fn2] and are not based on or consistent with cost-allocation best practices, previous Commission policy decisions, or any widely accepted principles, by their own admission.", "note": null}, "P-121": {"source": "S11", "locator": "section II, overarching concerns", "text": "PIA Staff’s recommendations endeavor to treat RTP load more like non-RTP load in how costs and revenues are allocated. However, the RTP rate is by design a marginal cost-based rate that is not intended to recover all embedded costs. This does not mean that RTP customers do not pay their fair share of system costs or cost to serve. Rather, the pricing for RTP is dynamic and allows participating customers to take on price risk to better manage how and when they use energy. Eligible commercial and industrial customers can respond to price signals and modify their usage on an hourly basis. RTP customers and non-RTP customers are not similarly situated and do not take service on similar rates by design. Efforts to make RTP cost and revenue allocations more like those for non-RTP customers would undermine the effectiveness and competitive value of RTP as a marginal cost-based rate.", "note": null}, "P-123": {"source": "S11", "locator": "section III, double recovery", "text": "The Company would only be double recovering if it was charging customers for FT costs in both fuel and base rates; however, FT costs are charged to fuel and are not included in base revenue requirements.", "note": null}, "P-124": {"source": "S11", "locator": "section III, revenue on the base side", "text": "That said, just because the full cost of FT in fuel is not directly offset by RTP fuel revenue does not mean that RTP customers are not effectively paying their share of fixed costs with the portion of RTP revenue that is allocated to base. To be clear, RTP revenue allocated to base for fixed costs (like FT) through capital substitution or other mechanisms indicates that such RTP revenue is reducing other costs recovered through base rates and effectively lowering the retail cost of service for customers in a base rate case.", "note": null}, "P-125": {"source": "S11", "locator": "section III, Staff's earlier allocation", "text": "PIA Staff now recommends that the Company recover new and existing FT on a megawatt-hour (“MWh”) or energy basis. That recommendation cannot be reconciled with PIA Staff’s own FCR-27 testimony filed just five months ago, in which it allocated FT using a 1-CP allocator, a demand-based method.", "note": null}, "P-126": {"source": "S11", "locator": "section III, energy allocation", "text": "As such, energy is not an appropriate allocation factor for FT because FT is fixed, driven by peak demand, and should be treated similarly to other large infrastructure expenses (generation, transmission, distribution) and allocated on a demand basis.", "note": null}, "P-127": {"source": "S11", "locator": "section III, demand-based allocation and customer protection", "text": "The Company’s proposed demand-based allocation for new FT ensures that the RTP revenues booked to fuel will cover the large load causation of the FT cost independent of project materialization since the allocation will be fixed based on the planning assumptions that drove the need. PIA Staff’s recommended energy-based allocation for new FT does not provide this level of customer protection and is inconsistent with the Commission’s approach to customer protection.", "note": null}, "P-128": {"source": "S11", "locator": "section IV, the two options", "text": "As it pertains to non-dispatchable PPAs, the Company presented two options: Option 1 - exclude both the costs and the output (MWh) from non-dispatchable PPAs in the RTP fuel credit calculation. Option 2 - include both the costs and the output (MWh) from non-dispatchable PPAs in the RTP fuel credit calculation. The Company and GIPL recommend the Commission approve Option 1.[fn11] GAM[fn12] and PIA Staff[fn13] agree that Option 1 will increase the amount of RTP revenues credited to fuel.", "note": null}, "P-129": {"source": "S11", "locator": "section IV, why Option 1", "text": "Option 1 preserves the integrity of RTP as a marginal cost-based rate and is consistent with the foundational principle that the RTP fuel credit should be derived from marginal replacement fuel costs, consistent with marginal cost recovery theory.[fn14] PIA Staff’s preferred option (Option 2) would be a departure from the marginal fuel cost-based approach approved by the Commission and in place since 2010.", "note": null}, "P-130": {"source": "S11", "locator": "section IV, Option 1 and marginal cost", "text": "Similarly, when RTP load does respond to the price signal, the non-dispatchable PPA cost is unable to be avoided by that response; thus, it should not be included in the credit given for demand response or the cost for taking service. Lastly, the benefits of non-dispatchable PPAs, which deliver energy at a fixed price, accrue to FCR customers by reducing average fuel costs when the fixed price is below the marginal fuel cost. RTP load pays the marginal fuel cost and does not directly benefit from the fixed price feature of the non-dispatchable PPA.", "note": null}, "P-131": {"source": "S11", "locator": "section IV, Staff's other cost categories", "text": "As such, the Commission should decline to adopt PIA Staff’s recommendations presented in Table 1 and instead preserve the integrity and structure of the RTP rate design, as proposed by the Company in its direct testimony.", "note": null}, "P-132": {"source": "S11", "locator": "section V, reporting", "text": "The Company does not believe that PIA Staff’s recommended monthly reporting and MFR modifications are needed and, in some instances, they are not feasible in the requested timeframe.", "note": null}, "P-133": {"source": "S11", "locator": "section VI, scope", "text": "The current proceeding is appropriately limited to the accounting treatment of the RTP customer revenues between base and fuel. Intervenor testimony that strays into cost allocation, rate design, and changes to the RTP components are changes the Commission can and should review in the context of the Company’s next base rate case.", "note": null}, "P-134": {"source": "S12", "locator": "motion, opening paragraph", "text": "COMES NOW Georgia Power Company (“Georgia Power” or the “Company”) and moves to strike portions of the Direct Testimony of John D. Wilson on behalf of Georgia Interfaith Power and Light (“GIPL”), and its member congregations Park Avenue Baptist Church, Temple Sinai, and Unitarian Universalist Church of Savannah (the “GIPL Testimony”). The portions of the GIPL Testimony at issue in this Motion to Strike are irrelevant, clearly outside the scope of this proceeding, and would not assist the Georgia Public Service Commission (the “Commission”) in rendering a decision on this matter. Accordingly, the portions of the GIPL Testimony identified in this Motion to Strike should be excluded from the record in this proceeding and not considered by this Commission.", "note": null}, "P-135": {"source": "S12", "locator": "motion, signature line", "text": "Respectfully submitted, this 8th day of October 2026.", "note": null}, "P-136": {"source": "S13", "locator": "response, p.1 (last sentences)", "text": "As explained below, the entirety of Mr. Wilson’s testimony falls well within the scope of this proceeding and is relevant to the issues identified in the Procedural and Scheduling Order (PSO). The Commission should deny Georgia Power’s motion.", "note": null}, "P-137": {"source": "S13", "locator": "response, signature line (p.7)", "text": "Respectfully submitted this 14th day of October, 2026.", "note": null}, "P-138": {"source": "S06b", "locator": "response GIPL-1-2", "text": "Please see GIPL-1-2 Attachment A for the Company’s analysis of the impact of Option 1, excluding both the costs and output (MWh) associated with non-dispatchable PPAs from the RTP fuel credit calculation. Revenues shown reflect the Company’s estimate of additional revenue that would be booked to fuel revenues if Option 1 was adopted. Please see GIPL-1-2 Attachment B for the Company’s analysis of the impact of Option 2, including both the fixed costs and output (MWh) associated with non-dispatchable PPAs within the RTP fuel credit calculation. Revenues shown reflect the Company’s estimate of additional revenue that would be booked to fuel revenues if Option 2 was adopted.", "note": null}, "P-139": {"source": "S06b", "locator": "GIPL-1-2 Attachment A (Option 1), sheet Impact, rows 39-53", "text": "Impact!39: A=Additional Fuel Revenue Impact!40: B=2026 | C=2027 | D=2028 | E=2029 | F=2030 | G=2031 Impact!41: A=Jan | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!42: A=Feb | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!43: A=Mar | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!44: A=Apr | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!45: A=May | B=REDACTED | C=RED
