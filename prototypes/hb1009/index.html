ld have let school districts allow phones between classes.", "cite": ["P-027", "P-026"]}]}], "subs": [{"title": "If you care most about…", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "The two lines that follow use the same fall 2025 survey of 1,002 Georgia parents by the Emory Center for Child Health Policy, which surveys Georgia parents each year.", "cite": ["P-032", "P-070"]}]}, {"kind": "bullet", "label": "If you care most about your child's focus in class", "units": [{"t": "In the Emory survey, the top reason parents cited for backing a high school cellphone ban was \"Improved academic focus and learning.\"", "cite": ["P-034", "P-032", "P-070"]}]}, {"kind": "bullet", "label": "If you care most about reaching your child in an emergency", "units": [{"t": "In the Emory survey, the top reason parents cited for opposing a high school cellphone ban was \"No way to reach child during emergency.\"", "cite": ["P-035", "P-032", "P-070"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Option C, the change state senators voted down, has no line because we found no documented argument for it, and this guide does not recommend any option.", "tag": "editorial", "note": ""}]}], "cardMeta": null}, {"title": "Option A: Keep the old law (no state rule for high schools)", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "Sets a device ban for public school students in kindergarten through 8th grade only.", "cite": ["P-006", "P-066"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "HB 1009, signed May 5, 2026, expands that law to high schools.", "cite": ["P-024", "P-028"]}, {"t": "The new law takes effect Dec 31, 2026, and high schools must comply no later than July 1, 2027.", "cite": ["P-019", "P-007"]}, {"t": "The law's new duties for districts and schools, such as a device policy every year, apply from Dec 31, 2026.", "tag": "analysis", "note": "P-008 and P-014 set the duties, and P-019 sets the date the law takes effect"}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "High school students and families keep whatever phone access their district allows.", "tag": "analysis", "note": "the state rule covered only K-8 (P-006), so grades 9-12 were left to districts"}, {"t": "In the Emory survey, 29.2% of parents opposed a high school ban.", "cite": ["P-033", "P-032"]}, {"t": "Among those opponents, 74.8% cited having no way to reach their child in an emergency as a reason, 45.5% parental choice and 41.9% students' need to learn responsible use.", "cite": ["P-035"]}, {"t": "Fewer cited needing phones for health tools or apps (26.6%) or for schoolwork (19.8%).", "cite": ["P-035"]}, {"t": "Teacher Darryl Adams said high school students, who are older and often more independent, should be allowed to keep access to their phones.", "cite": ["P-048", "P-047"]}, {"t": "High schools avoid new monitoring and enforcement duties, and districts keep deciding high school phone rules.", "tag": "analysis", "note": "the duties come from P-014, and P-018 bars opting out"}, {"t": "If the results of a 2025 Florida study apply here, students would also avoid the short-term rise in suspensions seen there, especially among Black students.", "tag": "analysis", "note": "based on P-039 and P-055"}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "In districts without limits, students can access phones in class, which the new law bans to reduce distractions.", "tag": "analysis", "note": "the K-8-only rule (P-006) left grades 9-12 to districts; the law defines distraction-free education as banning access \"to minimize distractions\" (P-057)"}, {"t": "State School Superintendent Richard Woods called for extending the ban \"to end the harm caused by constant technology access and interruption.\"", "cite": ["P-036"]}, {"t": "A study of 12- to 15-year-olds in England found that strict school phone rules went with less phone and social media time during school, but found no evidence of better well-being.", "cite": ["P-041", "P-042", "P-043"]}, {"t": "That study couldn't test cause and effect.", "tag": "analysis", "note": "it compared schools at one point in time (P-041)"}, {"t": "If Florida's results apply here, students would miss the test-score gains found there in year two, and the drop in unexcused absences the study suggests.", "tag": "analysis", "note": "based on P-040"}, {"t": "High school rules could differ from one district to the next.", "tag": "analysis", "note": "follows from leaving grades 9-12 to each district"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether districts would have limited phones on their own.", "tag": "editorial", "note": ""}, {"t": "State Sen. Sally Harrell said, \"It has been done in high schools already, it’s been very successful and we look forward to rolling that out statewide.\"", "cite": ["P-046", "P-044"]}, {"t": "We found no count of districts that already had limits.", "tag": "analysis", "note": "none in the sources reviewed"}]}], "cardMeta": null}, {"title": "Option B: HB 1009 as passed (now law)", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "Bans device access for public high school students during the school day, a period the law calls \"bell-to-bell\": from the first bell to the last, including breaks and time between classes.", "cite": ["P-007", "P-005", "P-002"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "The bill passed the House 145 to 20 and the Senate 52 to 0, and the governor signed it on May 5, 2026.", "cite": ["P-025", "P-024"]}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "The Florida study found that phone bans led to better test scores in the second year of the ban.", "cite": ["P-040"]}, {"t": "The study's findings also suggest the bans cut unexcused absences.", "cite": ["P-040", "P-038"]}, {"t": "In the Emory survey, 70.8% of parents supported a high school ban.", "cite": ["P-033", "P-032"]}, {"t": "Among those supporters, 87.7% cited better focus and learning as a reason, 71.2% better in-person social interactions, 69.1% better mental health and 60.3% better physical health and safety.", "cite": ["P-034"]}, {"t": "A study of 12- to 15-year-olds in England found that strict school phone rules went with less phone and social media time during school, but found no evidence of better well-being.", "cite": ["P-041", "P-042", "P-043"]}, {"t": "That study couldn't test cause and effect.", "tag": "analysis", "note": "it compared schools at one point in time (P-041)"}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "Families won't be able to reach students directly during the school day and will have to contact the school instead.", "cite": ["P-007", "P-011"]}, {"t": "Of the 29.2% who opposed a ban, 74.8% cited having no way to reach their child in an emergency as a reason.", "cite": ["P-033", "P-035"]}, {"t": "Students who use phones or smartwatches for health apps need an Individualized Education Program (IEP), Section 504 plan or medical plan that explicitly requires the device, unless another law requires access.", "cite": ["P-013", "P-007", "P-004"]}, {"t": "IEP and Section 504 plans are formal school plans for students with disabilities.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "Schools must set up phone storage, monitor and enforce the rules, review policies every year and keep families informed.", "cite": ["P-009", "P-014", "P-008", "P-015"]}, {"t": "The law gives schools state guidance but sets aside no money.", "tag": "analysis", "note": "no funding provision in the full enacted text, P-001 to P-019 and P-056 to P-061; P-016 provides guidance"}, {"t": "Any state funding would come through the state budget, which we didn't review.", "tag": "analysis", "note": "no funding provision in the law; the budget is outside our sources"}, {"t": "The Florida study found that enforcing phone bans led to more suspensions in the short term, especially among Black students.", "cite": ["P-039"]}, {"t": "The rise in suspensions began to fade after the first year.", "cite": ["P-039"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much focus, learning and well-being will change in Georgia high schools, if at all, is not known yet.", "tag": "editorial", "note": "the evidence so far is limited; see the Arguments tab"}, {"t": "The same goes for suspensions and for reaching students in an emergency.", "tag": "editorial", "note": ""}]}], "cardMeta": null}, {"title": "Option C: The Senate amendment that failed", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "This proposed change, called an amendment, would have let districts allow high school students to access phones in the brief time between classes.", "cite": ["P-027"]}, {"t": "The amendment also rewrote the law's definition of the \"bell-to-bell\" period and left out \"breaks\", which the passed law includes.", "cite": ["P-027", "P-002"]}]}, {"kind": "bullet", "label": "What happened", "units": [{"t": "Sen. Kemp of the 38th District offered the amendment, and it failed, 13 to 38.", "cite": ["P-027", "P-026"]}, {"t": "This senator is not Gov. Brian Kemp.", "tag": "analysis", "note": "P-027 identifies \"Senator Kemp of the 38th\""}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "In districts that chose to allow phones between classes, students and families could reach each other then.", "tag": "analysis", "note": "inferred from the amendment text, P-027"}, {"t": "Each district would decide for itself.", "tag": "analysis", "note": "under P-027, access \"may be permitted in accordance with policies\" adopted by local school systems"}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "In those districts, part of the school day would no longer be phone-free.", "tag": "analysis", "note": "inferred from the amendment text, P-027"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether phones between classes would change focus or learning compared with a full-day ban, since no source we reviewed measured this.", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "arguments", "title": "Layer 4: Arguments you'll hear", "blocks": [{"kind": "para", "label": null, "units": [{"t": "Supporters said the ban would cut distractions and ease anxiety.", "cite": ["P-071"]}, {"t": "Opponents said the ban could spark conflict for school staff and leave parents with fewer ways to reach their children in emergencies.", "cite": ["P-071"]}, {"t": "Below are three cards for the law and three against it, each with the same fields.", "tag": "editorial", "note": ""}]}, {"kind": "para", "label": null, "units": [{"t": "Our archived sources quote five people who spoke for the law: Gov. Brian Kemp; State School Superintendent Richard Woods; the bill's sponsor, state Rep. Scott Hilton; state Sen. Sally Harrell; and a student.", "tag": "analysis", "note": "Gov. Kemp (P-029), Woods (P-036), Hilton as sponsor (P-028, P-051), Harrell (P-044) and a student (P-052)"}, {"t": "The same sources quote one person who spoke against the law: teacher Darryl Adams.", "tag": "analysis", "note": "Adams (P-047 to P-049)"}, {"t": "Our sources also quote a public health professor who called parents' emergency concerns valid and said effective policies can address them with rapid parent notification and guaranteed access to phones when needed.", "tag": "analysis", "note": "Gazmararian (P-037)"}, {"t": "This count reflects whom those sources quoted, not how many people hold each view.", "tag": "editorial", "note": ""}]}], "subs": [{"title": "How to read these cards", "blocks": [{"kind": "para", "label": null, "units": [{"t": "Every card uses the same fields, and one rule sets its evidence label.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Supported\" means the law's text or a study designed to show cause and effect backs the claim.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Supported, with limits\" means one such study backs the claim, but the support is narrow, such as a single working paper from another state with no Georgia results yet, and the label names those limits.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Uncertain\" means there are only statements, or studies that show links but not causes.", "tag": "editorial", "note": "labeling rule"}, {"t": "Values questions are marked as not mainly factual.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Documented\" means a real person made the argument, and we cite where.", "tag": "editorial", "note": "labeling rule"}, {"t": "A \"predictive\" claim is about what will happen; a \"factual\" claim is about what is true now.", "tag": "editorial", "note": "labeling rule"}, {"t": "Cards for the law come first, then cards against it; the order is not a ranking.", "tag": "editorial", "note": "ordering rule"}]}, {"kind": "para", "label": null, "units": [{"t": "Several cards cite a fall 2025 survey of 1,002 Georgia parents by the Emory Center for Child Health Policy, which surveys Georgia parents each year.", "cite": ["P-032", "P-070"]}, {"t": "Overall, 70.8% supported a high school ban and 29.2% opposed it.", "cite": ["P-033"]}, {"t": "For this question, the margin of error, or how far off the result is likely to be, is about 4 points either way.", "tag": "computed", "note": "1.96 × 2.1 standard error (P-033) ≈ 4.1 percentage points"}]}, {"kind": "para", "label": null, "units": [{"t": "Reasons given within each group come from smaller samples.", "tag": "analysis", "note": "each reason was asked only of parents who supported, or only of those who opposed, a ban (P-034, P-035)"}, {"t": "Their margins of error are about 3.5 to 6 points for supporters' reasons and about 6 to 8 points for opponents' reasons.", "tag": "computed", "note": "1.96 × standard errors of 1.8 to 2.9 (P-034) ≈ 3.5 to 5.7; 1.96 × 2.9 to 4.2 (P-035) ≈ 5.7 to 8.2"}, {"t": "Parents could give more than one reason.", "tag": "analysis", "note": "the reasons in each table add up to more than 100% (P-034, P-035)"}]}, {"kind": "para", "label": null, "units": [{"t": "Two studies appear on the cards.", "cite": ["P-055", "P-041"]}, {"t": "The Florida study is a 2025 working paper designed to estimate cause and effect.", "cite": ["P-055", "P-038"]}, {"t": "A working paper is an early research report shared before formal publication.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "The Florida study compared students without running a randomized experiment.", "tag": "analysis", "note": "P-038 names a \"quasi-experimental\" method; the plain-language meaning is ours"}, {"t": "The Florida summary says the bans' effects were larger in middle and high schools, where more students own smartphones.", "cite": ["P-040"]}, {"t": "That summary doesn't say which effects were larger, or whether Florida's bans covered the whole school day, as Georgia's will.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't say; Georgia's rule covers the whole day (P-002, P-007)"}, {"t": "The English study surveyed 1,227 students ages 12 to 15 at 30 schools, using a standard well-being questionnaire.", "cite": ["P-042", "P-041", "P-064"]}, {"t": "The English study compared schools at one point in time, and its strict schools banned recreational phone use, meaning use for fun.", "cite": ["P-041"]}, {"t": "We read each study's summary, not the full paper.", "tag": "editorial", "note": "process note"}]}], "cardMeta": null}, {"title": "1. The ban will help students learn", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Students would learn more with fewer distractions, supporters say.", "cite": ["P-029", "P-036", "P-071"]}, {"t": "A Florida study found phone bans led to better test scores in the ban's second year.", "cite": ["P-040"]}, {"t": "We found no measured results from Georgia high schools yet.", "tag": "analysis", "note": "none in the sources reviewed, though a state senator said limits had been used in high schools already (P-046); Georgia's high school ban must start no later than July 1, 2027 (P-007)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Gov. Brian Kemp said the bills he signed would \"reduce distractions in the classroom.\"", "cite": ["P-029"]}, {"t": "State School Superintendent Richard Woods said learning without distractions is \"both an academic issue and a mental health issue.\"", "cite": ["P-036"]}, {"t": "Among parents who support a ban, 87.7% cited better focus and learning as a reason.", "cite": ["P-034"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "The Florida study found that phone bans led to better test scores in the second year, and its findings suggest they cut unexcused absences.", "cite": ["P-040", "P-038"]}, {"t": "Fewer unexcused absences may explain a large share of the test-score gains.", "cite": ["P-040"]}, {"t": "The study's summary says the bans' effects were larger in middle and high schools, where more students own smartphones.", "cite": ["P-040"]}, {"t": "That summary doesn't say which effects were larger: test scores, absences or suspensions.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't say"}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one quoted in our sources disputed this claim directly.", "tag": "analysis", "note": "none of the quoted statements argues that bans hurt learning"}, {"t": "Of the 29.2% of parents who opposed a high school ban in the Emory survey, 19.8% cited \"Phones needed for schoolwork\" as a reason.", "cite": ["P-033", "P-035"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "In the Florida study, the test-score gains came in the second year, after a first year in which suspensions rose.", "cite": ["P-039", "P-040"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The study used data from Florida only.", "cite": ["P-038"]}, {"t": "The study's summary doesn't describe how much of the school day the bans covered.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't describe the bans' scope"}, {"t": "The English study's summary reports no test-score results, and we didn't read the full paper.", "tag": "analysis", "note": "its listed outcomes are well-being and phone and social media time (P-064)"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether Georgia high schools will see results like Florida's, since we found no Georgia high school results yet.", "tag": "analysis", "note": "none in the sources reviewed; Georgia's high school ban must start no later than July 1, 2027 (P-007)"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "predictive", "evidence": "Supported, with limits (one Florida working paper designed to estimate cause and effect; gains in year two; no Georgia results yet)"}}, {"title": "2. The ban will help teens' mental health and friendships", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Teens' mental health and in-person social lives would improve, supporters say.", "cite": ["P-036", "P-051", "P-071", "P-034"]}, {"t": "A study in England found no evidence of better well-being among 12- to 15-year-olds at schools that barred phone use for fun.", "cite": ["P-041", "P-042", "P-043"]}, {"t": "That study couldn't test cause and effect.", "tag": "analysis", "note": "it compared schools at one point in time (P-041)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Woods called for extending the ban \"to end the harm caused by constant technology access and interruption.\"", "cite": ["P-036"]}, {"t": "The bill's sponsor, state Rep. Scott Hilton, said, \"The technology meant to bring people together actually makes us feel further apart.\"", "cite": ["P-051"]}, {"t": "Students testified in support at a legislative hearing; one, a 17-year-old, compared social media to cigarettes.", "cite": ["P-052"]}, {"t": "Among parents who support a ban, 71.2% cited better in-person social interactions and 69.1% better mental health as reasons.", "cite": ["P-034"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Hilton said districts had reported less isolation among younger students under all-day phone limits.", "cite": ["P-051"]}, {"t": "In the English study, strict rules went with about 40 minutes less phone time and about 32 minutes less social media time during school.", "tag": "computed", "note": "0.67 hours × 60 ≈ 40 minutes; 0.54 hours × 60 ≈ 32 minutes (P-042)"}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "The English study's authors said there is \"no evidence that restrictive school policies are associated with overall phone and social media use or better mental wellbeing in adolescents.\"", "cite": ["P-043"]}, {"t": "The authors added that their findings \"do not provide evidence to support the use of school policies that prohibit phone use during the school day in their current form, and indicate that these policies require further development.\"", "cite": ["P-043"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The English study also found no evidence of less phone or social media use overall at its strict schools.", "cite": ["P-042", "P-043"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The district reports Hilton described were about younger students.", "cite": ["P-051"]}, {"t": "The quoted passage gives no measurements behind those reports.", "tag": "analysis", "note": "P-051 reports the claim without data"}, {"t": "The English study can show links, not cause and effect, and its summary reports no results on friendships.", "tag": "analysis", "note": "it compared schools at one point in time (P-041); its listed outcomes are in P-064"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether, and how, the well-being and friendships of Georgia's public high school students will change.", "tag": "editorial", "note": ""}, {"t": "No study we found measured well-being among American high school students under a full-day ban; the English study covered ages 12 to 15.", "tag": "analysis", "note": "P-041, P-042, P-064; the Florida summary (P-038 to P-040) reports no well-being results"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "predictive", "evidence": "Uncertain (one study of 12- to 15-year-olds in England found no evidence of a well-being difference; it couldn't test cause and effect)"}}, {"title": "3. Phone bans are already working in Georgia", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Younger students under phone limits in Georgia focus better and feel less isolated, and some high schools have had success, supporters say.", "cite": ["P-051", "P-046", "P-044"]}, {"t": "Our sources give statements, not measured results.", "tag": "analysis", "note": "no data appears in P-028, P-046, P-051 or P-053"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "The governor's office said House Bill (HB) 1009 \"builds on the success of HB 340,\" the 2025 law for kindergarten through 8th grade (K-8).", "cite": ["P-028", "P-054"]}, {"t": "State Sen. Sally Harrell said, \"It has been done in high schools already, it’s been very successful and we look forward to rolling that out statewide.\"", "cite": ["P-046", "P-044"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Hilton said districts had reported improved focus among younger students under all-day phone limits.", "cite": ["P-051"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed that Georgia's phone rules are working.", "tag": "analysis", "note": "none of the archived statements about Georgia disputes it; teacher Darryl Adams's concerns were about enforcement, emergencies and older students (P-047 to P-049); the English study's authors wrote about schools in England (P-041, P-043)"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The high school ban was signed on May 5, 2026, before the statewide K-8 start deadline of July 1, 2026.", "cite": ["P-024", "P-006"]}, {"t": "Districts and public schools did have to adopt policies banning K-8 device access by Jan 1, 2026.", "cite": ["P-020", "P-066"]}, {"t": "So K-8 policies were due before the signing, but the latest date to start the K-8 ban had not yet passed.", "tag": "analysis", "note": "follows from the three dates"}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "No source we reviewed measured how the K-8 ban is working.", "tag": "analysis", "note": "none of the archived sources reports K-8 outcome data"}, {"t": "Harrell's remark, as reported, doesn't name the high schools or say how their success was measured.", "tag": "analysis", "note": "based on P-046, with P-044 naming her as a state senator"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How well the K-8 rules work statewide, because they only had to start in 2026.", "tag": "editorial", "note": "reason from P-006"}]}], "cardMeta": {"kind": "Documented", "side": "supports the law", "claimType": "factual", "evidence": "Uncertain (statements only; no measured results)"}}, {"title": "4. Families lose direct contact with students during the school day", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Under the law, families must go through the school to reach students during the day.", "cite": ["P-007", "P-011"]}, {"t": "Phones can be critical for families in an emergency, opponents say.", "cite": ["P-049", "P-047", "P-035", "P-071"]}, {"t": "Our sources have no data on emergency safety.", "tag": "analysis", "note": "no archived source reports how school alerts or students' own phones perform in emergencies"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Among parents who oppose a ban, 74.8% cited having no way to reach their child in an emergency as a reason.", "cite": ["P-035"]}, {"t": "Teacher and parent Darryl Adams said phones can be critical for families seeking information during emergencies.", "cite": ["P-049", "P-047"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Under the law, parents who need to reach their child during the school day must contact the school directly.", "cite": ["P-011"]}, {"t": "The law has no emergency exception for students' own devices.", "tag": "analysis", "note": "the full enacted text (P-001 to P-019, P-056 to P-061) allows access only under a plan that requires a device (P-013) or where access is \"required by law\" (P-007); neither is an emergency exception"}, {"t": "Adams said that when two of his daughters were in a lockdown, he could not get updates for hours.", "cite": ["P-049", "P-047"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "State Sen. Sally Harrell said, \"We’ve gotten very dependent on being able to reach our kids whenever we want to, but that education time needs to be protected.\"", "cite": ["P-044"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Julie Gazmararian, a professor at the Rollins School of Public Health, said, \"Parents’ concerns about emergency access are valid and understandable. However, effective cellphone policies can address this by establishing rapid parent notification systems and guaranteed access to phones when needed.\"", "cite": ["P-037"]}, {"t": "The law requires each district's and school's policy to set clear protocols that send all emergency communication through school emergency systems, coordinated by school staff.", "cite": ["P-008", "P-011"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The law doesn't require the \"rapid parent notification systems\" or the \"guaranteed access to phones when needed\" that Gazmararian named, and her words don't say whose phones.", "tag": "analysis", "note": "no such requirement in the full enacted text (P-001 to P-019, P-056 to P-061); her words are from P-037"}, {"t": "Districts can add faster parent alerts, because the law sets minimum rules, but by our reading they can't let students use their own phones in an emergency unless a student's disability or medical plan, or another law, requires access.", "tag": "analysis", "note": "P-008 says policies must \"at a minimum\" include its list; P-007 allows access only as the law provides, P-011 sends all emergency communication through school systems, and the only device exception is a plan that requires one (P-013)"}, {"t": "Adams's account, as reported, doesn't say when two of his daughters were in a lockdown, or what phone rules applied.", "tag": "analysis", "note": "based on P-049, with P-047 naming him as a teacher"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How well school alert systems will reach families in a real crisis, and whether students' own phones make emergencies safer or not, since our sources have no data on either question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "factual, with a values question", "evidence": "Supported on the facts (the law's text); uncertain on emergency safety (no data on how school alerts perform, or on whether students' own phones make emergencies safer)"}}, {"title": "5. Enforcing the ban will burden school staff and can lead to conflict", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Schools must enforce the ban.", "cite": ["P-014"]}, {"t": "Staff policing phones can invite conflict, opponents say.", "cite": ["P-047", "P-071"]}, {"t": "A Florida study found enforcing bans led to more suspensions at first, especially among Black students.", "cite": ["P-039"]}, {"t": "We found no measured Georgia high school results or workload data.", "tag": "analysis", "note": "none in the sources reviewed, though a state senator said limits had been used in high schools already (P-046); no archived source includes workload data; Georgia's high school ban must start no later than July 1, 2027 (P-007)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Teacher Darryl Adams said he worries the bill would put the burden on teachers and administrators to police phones, a task that can invite conflict.", "cite": ["P-047"]}, {"t": "He said, \"We have a lot of older teachers that do not want to have that confrontation.\"", "cite": ["P-047"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Each school system must monitor and enforce the rules, which may include assigning staff and auditing phone storage.", "cite": ["P-014"]}, {"t": "Each district and school must also regularly review whether its rules work and adjust them as needed.", "cite": ["P-015", "P-014"]}, {"t": "The law itself sets aside no money for these duties; any state funding would come through the budget, which we didn't review.", "tag": "analysis", "note": "no funding provision in the full enacted text, P-001 to P-019 and P-056 to P-061"}, {"t": "Consequences can include taking students' devices.", "cite": ["P-012"]}, {"t": "The Florida study found that enforcing phone bans led to more suspensions in the short term, especially among Black students.", "cite": ["P-039"]}, {"t": "The study's summary says the bans' effects were larger in middle and high schools, where more students own smartphones.", "cite": ["P-040"]}, {"t": "That summary doesn't say which effects were larger: test scores, absences or suspensions.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't say"}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Woods told lawmakers he had heard nothing but support from teachers across Georgia.", "cite": ["P-053"]}, {"t": "Sen. Sally Harrell said legislators want to hear teachers say, \"I can just teach again.\"", "cite": ["P-045", "P-044"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "In that study, the rise in suspensions began to fade after the first year.", "cite": ["P-039"]}, {"t": "The authors said the fading may suggest things settled down after an initial adjustment period.", "cite": ["P-039"]}, {"t": "Districts choose their own storage and enforcement methods, and the state must give them guidance and technical support.", "cite": ["P-009", "P-050", "P-016"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "No source we reviewed measured staff workload or surveyed teachers.", "tag": "analysis", "note": "none of the archived sources includes workload or teacher survey data"}, {"t": "So neither Woods's account of teachers' support nor Adams's concern has been measured.", "tag": "analysis", "note": "follows from the previous sentence"}, {"t": "The Florida study used data from Florida only.", "cite": ["P-038"]}, {"t": "The study's summary doesn't describe how much of the school day the bans covered.", "tag": "analysis", "note": "the full abstract (P-067, P-038, P-068, P-039, P-040) doesn't describe the bans' scope"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much work each district's approach will create, since district policies were not part of our sources.", "tag": "editorial", "note": ""}, {"t": "Whether Georgia high schools will see a short-term rise in suspensions like Florida's, since we found no Georgia high school results yet.", "tag": "analysis", "note": "none in the sources reviewed; Georgia's high school ban must start no later than July 1, 2027 (P-007)"}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "predictive", "evidence": "Supported on new duties (the law's text); supported, with limits on early suspensions (one Florida working paper; no Georgia results yet); uncertain on staff workload (not measured)"}}, {"title": "6. High school students should be allowed to keep phone access", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "High school students should be allowed to keep phone access, opponents say, because teens are older and often more independent and the choice should be parents'.", "cite": ["P-048", "P-047", "P-035"]}, {"t": "The disagreement is mainly about values.", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Teacher Darryl Adams said high school students, who are older and often more independent, should be allowed to keep access to their phones.", "cite": ["P-048", "P-047"]}, {"t": "Among parents who oppose a ban, 45.5% cited parental choice and 41.9% cited students' need to learn responsible use as reasons.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Among parents who oppose a ban, 26.6% cited needing phones for health tools or apps and 19.8% cited needing them for schoolwork.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Students testified in support of the ban, and a 17-year-old said, \"Social media is the cigarette of our generation.\"", "cite": ["P-052"]}, {"t": "Most parents surveyed, 70.8%, supported a high school ban.", "cite": ["P-033"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The law lets a student access a device that their Individualized Education Program (IEP), Section 504 plan or medical plan explicitly requires, but only \"as necessary to fulfill the requirements\" of that plan.", "cite": ["P-013"]}, {"t": "IEP and Section 504 plans are formal school plans for students with disabilities.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "Schools can also still provide laptops and tablets for schoolwork.", "cite": ["P-017"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Our sources don't measure whether teens learn responsible phone use with or without a ban.", "tag": "analysis", "note": "none of the archived sources addresses this"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "The disagreement here is mainly about who should decide and what school is for.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "opposes the law", "claimType": "mostly values", "evidence": "Not mainly a factual question (who should decide; whether teens learn responsible use with or without a ban is untested)"}}, {"title": "Questions to weigh", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "What results would show whether the ban helps or hurts learning and well-being in Georgia high schools, and how soon could anyone know?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "How well can school alert systems and students' own phones each keep families informed in an emergency, and how could anyone know?", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": null, "units": [{"t": "Who would you want to set phone rules for high school students: the state, each school district or each family?", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "evidence", "title": "Layer 5: Evidence", "blocks": [], "subs": []}]}, "passages": {"P-001": {"source": "S01", "locator": "p.1, lines 1-7 (title)", "text": "To amend Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, so as to require local school systems and public schools to enact policies and procedures for use of personal electronic devices at school and school sponsored events by students in grades nine through twelve; to revise provisions relative to permissible student use of personal electronic devices; to revise a definition; to provide for related matters; to provide for an effective date; to repeal conflicting laws; and for other purposes.", "note": null}, "P-002": {"source": "S01", "locator": "p.2, lines 18-21, O.C.G.A. 20-2-324.8(a)(2)", "text": "(2) 'Bell-to-bell' means the period beginning with the first bell signaling the start of instructional time and ending with the final bell signaling the conclusion of the school day and shall include all scheduled instructional time, breaks, transitions, assemblies, and other school related activities occurring between the start and end of the school day.", "note": null}, "P-003": {"source": "S01", "locator": "p.2, lines 15-17, (a)(1)", "text": "(1) 'Access' means viewing, holding, wearing, or otherwise using a device for the purpose of communication, internet access, gaming, recording, listening to music, or any other function commonly associated with personal electronic devices.", "note": null}, "P-004": {"source": "S01", "locator": "p.2, lines 26-30, (a)(4)", "text": "(4) 'Personal electronic device' means any portable electronic device capable of transmitting, receiving, or accessing communications, data, or media. Such term includes, but is not limited to, smartphones, smartwatches, tablets, headphones, and other devices with functionalities such as wireless communication, internet access, messaging, video recording, gaming, social media access, or data transmission.", "note": null}, "P-005": {"source": "S01", "locator": "p.2, lines 31-33, (a)(5)", "text": "(5) 'School day' means the bell-to-bell period for students receiving instruction on a school campus. Such term shall not apply to students receiving virtual or remote instruction away from a school campus.", "note": null}, "P-006": {"source": "S01", "locator": "p.2, lines 39-41, (b)(1) (existing law, unchanged)", "text": "(b)(1) Beginning no later than July 1, 2026, no public school student in kindergarten through grade eight shall be permitted to access personal electronic devices during the school day, except as otherwise provided in this Code section or required by law.", "note": null}, "P-007": {"source": "S01", "locator": "p.3, lines 42-44, (b)(2) (new)", "text": "(2) Beginning no later than July 1, 2027, no public school student in grades nine through 12 shall be permitted to access personal electronic devices during the school day, except as otherwise provided in this Code section or required by law.", "note": null}, "P-008": {"source": "S01", "locator": "p.3, lines 45-48, (c) and (c)(1)", "text": "(c) By January 1 each year, each local school system and public school shall adopt, and revise as appropriate, policies and procedures that, at a minimum: (1) Prohibit bell-to-bell access to personal electronic devices by students in kindergarten through grade twelve, subject to exceptions provided for by law;", "note": "The comma after 'January 1' is struck through in the PDF together with ', 2026,' (checked visually); the word-level extractor kept it."}, "P-009": {"source": "S01", "locator": "p.3, lines 49-51, (c)(2)", "text": "(2) Establish appropriate methods for storing students' personal electronic devices, including, but not limited to, a student's locker, a locked pouch, or a designated place in the classroom;", "note": null}, "P-010": {"source": "S01", "locator": "p.3, lines 52-56, (c)(3)", "text": "(3) Establish clear procedures for off-site events or activities, including all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds, including, but not limited to, participation in the dual enrollment program, work based learning programs, and apprenticeship programs;", "note": null}, "P-011": {"source": "S01", "locator": "p.3, lines 57-61, (c)(4)(A)-(B)", "text": "(4) Establish clear communication protocols that: (A) Facilitate all emergency communication through school emergency communication management systems and coordinated by school personnel; (B) Require parents or guardians who need to communicate with their student during the school day to contact the school directly; and", "note": null}, "P-012": {"source": "S01", "locator": "pp.3-4, lines 65-69, (c)(5)", "text": "(5) Provide that any student found in violation of such policies and procedures during the school day shall be subject to progressive consequences in accordance with the local school system's or public school's student code of conduct, including, but not limited to, verbal warnings, confiscation of personal electronic devices, parental notification, and other actions as deemed appropriate.", "note": "Removed the page footer/header ('H. B. 1009 - 3 -', 'LC 49 2527/AP') that falls inside this span at the page break."}, "P-013": {"source": "S01", "locator": "p.4, lines 70-73, (d)", "text": "(d) A student whose Individualized Education Program (IEP), Section 504 Plan, or medical plan explicitly mandates the use of a personal electronic device for medical or educational purposes shall be permitted to access the device as necessary to fulfill the requirements of the respective program or plan.", "note": null}, "P-014": {"source": "S01", "locator": "p.4, lines 74-80, (e)(1)(A)", "text": "(e)(1) Each local school system and public school shall: (A) Implement appropriate monitoring and enforcement mechanisms to ensure compliance with policies and procedures established pursuant to this Code section, which may include, but need not be limited to, assigning designated school personnel to oversee implementation and adherence to such policies and procedures, conducting periodic audits of personal electronic device storage, and regularly reviewing enforcement practices;", "note": null}, "P-015": {"source": "S01", "locator": "p.4, lines 81-86, (e)(1)(B)-(C)", "text": "(B) Ensure that parents, guardians, and students are informed of such policies and procedures through student and family handbooks, student codes of conduct, school public websites, and other common communication channels; and (C) Regularly review the effectiveness of such policies and procedures and adjust as necessary to ensure its continued alignment with educational goals and student well-being.", "note": null}, "P-016": {"source": "S01", "locator": "p.5, lines 93-95, (f)", "text": "(f) The Department of Education shall provide local school systems and public schools with guidance and technical support for the effective implementation and enforcement of the provisions of this Code section.", "note": null}, "P-017": {"source": "S01", "locator": "p.5, lines 96-98, (g)", "text": "(g) Nothing in this Code section shall be construed or applied to prohibit or limit a local school system or public school from providing school equipment, including, but not limited to, laptops and tablets, for student use for educational purposes.", "note": null}, "P-018": {"source": "S01", "locator": "p.5, lines 99-102, (h)", "text": "(h) This Code section shall not be subject to waiver pursuant to Code Section 20-2-82 for a strategic waivers school system, Code Section 20-2-2063.2 or 20-2-2065 for a charter system, Code Section 20-2-2065 for a charter school, Code Section 20-2-2096.3 for a completion special school, or Code Section 20-2-244.\"", "note": null}, "P-019": {"source": "S01", "locator": "p.5, lines 103-104, Section 2", "text": "SECTION 2. This Act shall become effective December 31, 2026.", "note": null}, "P-020": {"source": "S01", "locator": "p.3, line 45-46 (prior law, (c) lead-in)", "text": "(c) By January 1, 2026, each local school system and public school shall adopt policies and procedures that, at a minimum:", "note": "Prior-law reading reconstructed from the strike-through/underline markup; the comma after 'adopt' is underlined (new) in the PDF."}, "P-021": {"source": "S01", "locator": "p.2, lines 26-28 (prior law, (a)(4) device list)", "text": "(4) 'Personal electronic device' means any portable electronic device capable of transmitting, receiving, or accessing communications, data, or media. Such term includes, but is not limited to, smartphones, smartwatches, tablets, e-readers, headphones,", "note": null}, "P-022": {"source": "S02", "locator": "bill page: First Reader Summary", "text": "First Reader Summary A BILL to be entitled an Act to amend Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, so as to require local school systems and public schools to enact policies and procedures for use of personal electronic devices at school and school sponsored events by students in grades nine through twelve; to revise provisions relative to permissible student use of personal electronic devices; to revise a definition; to provide for related matters; to provide for an effective date; to repeal conflicting laws; and for other purposes.", "note": null}, "P-023": {"source": "S02", "locator": "bill page: Sponsors and Committees", "text": "Sponsors No. Number in list Name District 1. Hilton, Scott 48th 2. Jones, Jan 47th 3. Donatucci, Sandy 105th 4. Reeves, Matt 99th 5. Silcox, Deborah 53rd 6. Rice, Carmen 139th Sponsored In Senate By:Still, Shawn Committees House Committee: Education Senate Committee: Children and Families", "note": null}, "P-024": {"source": "S02", "locator": "bill page: Status History", "text": "Status History Date Status 12/31/2026 Effective Date 05/05/2026 Act 395 05/05/2026 House Date Signed by Governor 04/06/2026 House Sent to Governor 03/23/2026 Senate Passed/Adopted 03/23/2026 Senate Third Read 03/19/2026 Senate Read Second Time 03/18/2026 Senate Committee Favorably Reported 02/25/2026 Senate Read and Referred 02/24/2026 House Passed/Adopted 02/24/2026 House Third Readers 02/06/2026 House Committee Favorably Reported 01/28/2026 House Second Readers 01/27/2026 House First Readers 01/16/2026 House Hopper", "note": null}, "P-025": {"source": "S02", "locator": "bill page: Votes table", "text": "Votes Date Vote No. Yea Nay NV Exc 02/24/2026 House Vote #545 145 20 8 7 03/23/2026 Senate Vote #783 13 38 4 1 03/23/2026 Senate Vote #784 52 0 3 1", "note": null}, "P-026": {"source": "S02", "locator": "detail JSON: votes[1] (Senate Vote #783)", "text": "\"number\": 783, \"caption\": \"ADOPTION OF AMENDMENT #1 BY THE SENATOR FROM THE 38TH\", \"date\": \"2026-03-23T11:58:00\", \"name\": \"Senate Vote #783\", \"yea\": 13, \"nay\": 38, \"notVoting\": 4, \"excused\": 1,", "note": null}, "P-027": {"source": "S03", "locator": "p.1, full text", "text": "LOST Senator Kemp of the 38th offered the following amendment #1: 1 Amend HB 1009 (LC 49 2527) by replacing lines 18 through 21 with the following: 2 (2) 'Bell-to-bell' means the period beginning with the first bell signaling the start of 3 instructional time and ending with the final bell signaling the conclusion of the school 4 day and shall include all scheduled instructional time, assemblies, and other school 5 related activities; provided, however, that such term shall not include brief transitions 6 between classes for students in grades nine through 12, during which access to personal 7 electronic devices may be permitted in accordance with policies and procedures 8 adopted by local school systems and other public schools pursuant to this Code section.", "note": null}, "P-028": {"source": "S09", "locator": "press release, HB 1009 paragraph", "text": "HB 1009, sponsored by Representative Scott Hilton, expands the prohibition of personal electronic devices in public schools to include high school grades nine through twelve. This was also a top priority of Speaker Jon Burns and builds on the success of HB 340, signed by the Governor in 2025, which banned these devices in K-8 classrooms.", "note": "Removed spaces before commas left by link boundaries in the HTML."}, "P-029": {"source": "S09", "locator": "press release, Governor's quote", "text": "said Governor Brian Kemp . \"The bills I signed today implement proven strategies to improve literacy and math scores, reduce distractions in the classroom, expand pathways to graduation, and further support hardworking educators and families.", "note": null}, "P-030": {"source": "S10c", "locator": "page heading", "text": "2025-2026 Regular Session | Governor's Office of Planning and Budget Skip to main content Fiscal Notes 2025 Document Description", "note": null}, "P-031": {"source": "S12", "locator": "release, paragraph 1", "text": "A recent poll of Georgia parents shows more than two-thirds (71%) support expanding the state’s recent ban on personal cellphones in K-8 schools to include high schools.", "note": null}, "P-032": {"source": "S12", "locator": "release, methods paragraph", "text": "This year’s survey was conducted among 1,002 Georgia parents between Oct. 30 and Nov. 24, 2025, and was designed to create population-representative estimates.", "note": null}, "P-033": {"source": "S12", "locator": "release, table: support", "text": "Do you support high schools banning student cellphone use during the school day? Response Overall % (SE) Yes 70.8 (2.1) No 29.2 (2.1)", "note": null}, "P-034": {"source": "S12", "locator": "release, table: reasons for supporting", "text": "Reasons for Supporting a High School Cellphone Ban Asked among parents who support a ban. Reason Overall % (SE) Improved academic focus and learning 87.7 (1.8) Improved in-person social interactions 71.2 (2.6) Improved mental health and wellbeing 69.1 (2.6) Improved physical health and safety 60.3 (2.9)", "note": null}, "P-035": {"source": "S12", "locator": "release, table: reasons for opposing", "text": "Reasons for Opposing a High School Cellphone Ban Asked among parents who oppose a ban. Reason Overall % (SE) Should be parental choice 45.5 (4.2) No way to reach child during emergency 74.8 (3.5) Phones needed for health tools/apps 26.6 (3.6) Phones needed for schoolwork 19.8 (2.9) Students need to learn responsible use 41.9 (4.2)", "note": null}, "P-036": {"source": "S12", "locator": "release, quote: State School Superintendent", "text": "“Students’ ability to learn without distractions is both an academic issue and a mental health issue,” State School Superintendent Richard Woods said. “I hear this directly from students, parents, and educators, and this survey bears out what I’ve heard in those conversations. This is why we are calling for Georgia’s distraction-free legislation to be extended into grades 9-12, to end the harm caused by constant technology access and interruption.", "note": null}, "P-037": {"source": "S12", "locator": "release, quote: Emory epidemiologist", "text": "“Parents’ concerns about emergency access are valid and understandable. However, effective cellphone policies can address this by establishing rapid parent notification systems and guaranteed access to phones when needed,\" says Julie Gazmararian, PhD, professor of epidemiology at the Rollins School of Public Health.", "note": "Removed a space before a comma left by a link boundary."}, "P-038": {"source": "S13a", "locator": "abstract, methods", "text": "In this study, we try to fill this gap by examining the causal effects of bans on student test scores, suspensions, and absences using detailed student-level data from Florida and a quasi-experimental research strategy relying upon differences in pre-ban cellphone use by students, as measured by building-level Advan data.", "note": null}, "P-039": {"source": "S13a", "locator": "abstract, finding 1", "text": "First, we show that the enforcement of cellphone bans in schools led to a significant increase in student suspensions in the short-term, especially among Black students, but disciplinary actions began to dissipate after the first year, potentially suggesting a new steady state after an initial adjustment period.", "note": null}, "P-040": {"source": "S13a", "locator": "abstract, findings 2-3", "text": "Second, we find significant improvements in student test scores in the second year of the ban after that initial adjustment period. Third, the findings suggest that cellphone bans in schools significantly reduce student unexcused absences, an effect that may explain a large fraction of the test score gains. The effects of cellphone bans are more pronounced in middle and high school settings where student smartphone ownership is more common.", "note": null}, "P-055": {"source": "S13a", "locator": "page, suggested citation", "text": "David N. Figlio and Umut Özek, \"The Impact of Cellphone Bans in Schools on Student Outcomes: Evidence from Florida,\" NBER Working Paper 34388 (2025), https://doi.org/10.3386/w34388.", "note": null}, "P-041": {"source": "S13b", "locator": "abstract, methods", "text": "We conducted a cross-sectional observational study with adolescents from 30 English secondary schools, comprising 20 with restrictive (recreational phone use is not permitted) and 10 with permissive (recreational phone use is permitted) policies.", "note": null}, "P-042": {"source": "S13b", "locator": "abstract, findings", "text": "We recruited 1227 participants (age 12–15) across 30 schools. Mean WEMWBS score was 47 (SD = 9) with no evidence of a difference between groups (adjusted mean difference −0.48, 95% CI −2.05 to 1.06, p = 0.62). Adolescents attending schools with restrictive, compared to permissive policies had lower phone (adjusted mean difference −0.67 h, 95% CI −0.92 to −0.43, p = 0.00024) and social media time (adjusted mean difference −0.54 h, 95% CI −0.74 to −0.36, p = 0.00018) during school time, but there was no evidence for differences when comparing usage time on weekdays or weekends.", "note": null}, "P-043": {"source": "S13b", "locator": "abstract, interpretation", "text": "There is no evidence that restrictive school policies are associated with overall phone and social media use or better mental wellbeing in adolescents. The findings do not provide evidence to support the use of school policies that prohibit phone use during the school day in their current form, and indicate that these policies require further development.", "note": null}, "P-044": {"source": "S16", "locator": "article, paragraphs 2-3 (Sen. Harrell)", "text": "State Sen. Sally Harrell said the proposal already has bipartisan support. “We’ve gotten very dependent on being able to reach our kids whenever we want to, but that education time needs to be protected,” Harrell said.", "note": null}, "P-045": {"source": "S16", "locator": "article, Sen. Harrell on teachers", "text": "Harrell said lawmakers like to hear that a policy change means teachers can focus on instruction again. “When you hear a teacher say, ‘I can just teach again,’ that’s what legislators want to hear,” she said.", "note": "Widened in revision 5 to include the sentence naming the speaker; the quote itself says only 'she said'."}, "P-046": {"source": "S16", "locator": "article, Sen. Harrell on other high schools", "text": "Harrell said schools around the state have already implemented similar restrictions with success, and she expects a statewide policy would build on those examples. “It has been done in high schools already, it’s been very successful and we look forward to rolling that out statewide,” she said.", "note": "Widened in revision 5 to include the sentence naming the speaker; the quote itself says only 'she said'."}, "P-047": {"source": "S16", "locator": "article, teacher Darryl Adams on enforcement", "text": "Darryl Adams, a teacher, said he worries the bill would put the burden on teachers and administrators to police phones, a task that can invite conflict. “We have a lot of older teachers that do not want to have that confrontation,” Adams said.", "note": null}, "P-048": {"source": "S16", "locator": "article, Adams on older students", "text": "Adams also argues that high school students, who are older and often more independent, should be allowed to keep access to their phones.", "note": null}, "P-049": {"source": "S16", "locator": "article, Adams on emergencies", "text": "As a parent, Adams said phones can be critical for families seeking information during emergencies. He recalled a time when two of his daughters were in lockdown and he was unable to get updates for hours.", "note": null}, "P-050": {"source": "S16b", "locator": "article, enforcement method", "text": "The bill does not require a single statewide enforcement method, leaving districts to decide how to keep phones out of students’ hands during class.", "note": null}, "P-051": {"source": "S16b", "locator": "article, sponsor Rep. Scott Hilton", "text": "Republican state Rep. Scott Hilton, the sponsor, said the state should move quickly after districts reported improved focus and less isolation among younger students under “bell-to-bell” phone limits. “The technology meant to bring people together actually makes us feel further apart,” Hilton said.", "note": null}, "P-052": {"source": "S16b", "locator": "article, student testimony", "text": "Students testified in support during the hearing. [name withheld: minor], 17, a Milton High School student, told lawmakers that phones have become addictive for teens. “Social media is the cigarette of our generation,” [the student] said.", "note": "The student is a minor; our standards describe minors by role, not name. Only the name was replaced."}, "P-053": {"source": "S16b", "locator": "article, State School Superintendent testimony", "text": "State School Superintendent Richard Woods testified Tuesday. He told lawmakers he has heard nothing but support from teachers across Georgia.", "note": null}, "P-056": {"source": "S01", "locator": "p.1, lines 8-14 (enacting clause, Section 1)", "text": "BE IT ENACTED BY THE GENERAL ASSEMBLY OF GEORGIA: SECTION 1. Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to elementary and secondary education, is amended by revising Code Section 20-2-324.8, relating to use of personal electronic devices during school day by students, as follows: \"20-2-324.8. (a) As used in this Code section, the term:", "note": null}, "P-057": {"source": "S01", "locator": "p.2, lines 22-25, (a)(3)", "text": "(3) 'Distraction-free education' means a learning environment where student access to personal electronic devices is prohibited to minimize distractions, improve academic outcomes, and increase meaningful interactions and focused learning experiences.", "note": null}, "P-058": {"source": "S01", "locator": "p.2, lines 34-38, (a)(6)", "text": "(6) 'School equipment' means any computer or computer networking equipment, technology or technology related device or service, or communication system or service that is operated, owned, leased, and made available to students by a local board of education, local school system, or public school and that is used for transmitting, receiving, or accessing communications, data, or media.", "note": null}, "P-059": {"source": "S01", "locator": "p.3, lines 62-64, (c)(4)(C)", "text": "(C) Communicate rules for school personnel and sponsors of all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds; and", "note": null}, "P-060": {"source": "S01", "locator": "p.4, lines 87-92, (e)(2)", "text": "(2) Each local school system and public school is encouraged to host student and parent engagement activities designed to promote distraction-free education through personal electronic device-free, independent play and learning, including, but not limited to, family workshops, question and answer sessions, town halls, mindfulness or enrichment sessions, screen-free challenges, and participation in initiatives that encourage students to engage in meaningful, personal electronic device-free play and activities.", "note": null}, "P-061": {"source": "S01", "locator": "p.5, lines 105-106, Section 3", "text": "SECTION 3. All laws and parts of laws in conflict with this Act are repealed.", "note": null}, "P-062": {"source": "S10c", "locator": "list section heading for 2026", "text": "Fiscal Notes 2026 Document Description", "note": null}, "P-065": {"source": "S01", "locator": "p.3, lines 52-54 (prior law, (c)(3))", "text": "(3) Establish clear procedures for off-site events or activities, including all school sponsored events and field trips, daily transportation, athletic and extracurricular events, and other instructional opportunities that do not occur on school grounds,", "note": "Prior-law reading from the strike-through/underline markup: the dual enrollment, work-based learning and apprenticeship wording is underlined (new) in HB 1009. The prior clause's final punctuation is not recoverable from the markup."}, "P-066": {"source": "S01", "locator": "p.3, lines 47-48 (prior law, (c)(1))", "text": "(1) Prohibit bell-to-bell access to personal electronic devices by students in kindergarten through grade eight", "note": "Prior-law reading from the markup: 'eight' is struck and 'twelve' underlined in HB 1009."}, "P-067": {"source": "S13a", "locator": "abstract, opening sentence", "text": "Cellphone bans in schools have become a popular policy in recent years in the United States, yet very little is known about their effects on student outcomes.", "note": "Added so the whole abstract is archived as passages (P-067, P-038, P-068, P-039, P-040), making 'the summary doesn't say what the bans covered' checkable."}, "P-068": {"source": "S13a", "locator": "abstract, lead-in to findings", "text": "Several important findings emerge.", "note": null}, "P-069": {"source": "S10c", "locator": "the list's whole 2026 section", "text": "Fiscal Notes 2026 Document Description LC 59 0490 (PDF, 382.84 KB) Reduce the amounts of the standard and dependent deductions from state taxable income for individuals. LC 44 3458 (PDF, 395.81 KB) Senate Bill 520 - State Income Tax Rates; revise; Code Section 20-2A-4; repeal and reserve LC 46 1536S (PDF, 139.25 KB) House Bill 323 - requirements for transaction of insurance; 26-11-08."}, "P-064": {"source": "S13b", "locator": "abstract, outcomes", "text": "The primary outcome was mental wellbeing (assessed using Warwick–Edinburgh Mental Well-Being Scale [WEMWBS]). Secondary outcomes included smartphone and social media time.", "note": null}, "P-054": {"source": "S19", "locator": "school news page (browser-rendered)", "text": "Cairo High School June 1, 2026 Georgia House Bill 1009 is a law signed by Governor Brian Kemp that enacts a \"bell-to-bell\" ban on personal electronic devices for public high school students. The legislation requires high schools to restrict the use of devices like smartphones, smartwatches, tablets, and headphones during the instructional school day. Cairo High School will begin implementation of this law in the 2026-2027 school year.", "note": null}, "P-070": {"source": "S12", "locator": "release, about the survey (before the methods paragraph)", "text": "Each year, the Emory Center for Child Health Policy, based in the Rollins School of Public Health, surveys Georgia parents to understand their concerns about their children.", "note": null}, "P-071": {"source": "S16b", "locator": "article, opening paragraph (both sides)", "text": "Supporters argued the move would cut distractions and ease anxiety, while opponents warned it could spark conflict for school staff and leave parents with fewer ways to reach their children during emergencies.", "note": null}, "P-072": {"source": "S16b", "locator": "article, start dates", "text": "Under the new measure, restrictions for high school students would begin in the 2027-28 school year.", "note": null}, "P-073": {"source": "S22", "locator": "Office of the Governor contact page: page title", "text": "Contact Us | Governor Brian P. Kemp Office of the Governor", "note": null}, "P-074": {"source": "S22", "locator": "Office of the Governor contact page: phone and mailing address", "text": "Primary (404) 656-1776 Visit: (details) 206 Washington Street 111 State Capitol Atlanta, GA 30334 Mail to 206 Washington Street Suite 203, State Capitol Atlanta, GA 30334", "note": "Removed spaces left by link and line boundaries in the HTML ('( details )' and 'Atlanta , GA')."}}, "sources": {"S01": {"title": "HB 1009, as passed House and Senate (26 LC 49 2527/AP)", "publisher": "Georgia General Assembly", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://www.legis.ga.gov/api/legislation/document/20252026/247117", "retrieved_at": "2026-11-08T04:03:25Z", "sha256": "9a6046e5d581bf4eed3fbf3f2501b853f68be0aa07371160700b2469a5b97130", "method": null, "short": "Law", "why": "The law itself, read with its strike-through and underline markup"}, "S02": {"title": "HB 1009 bill record: status history, sponsors, committees, versions, votes", "publisher": "Georgia General Assembly", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://www.legis.ga.gov/legislation/72304", "retrieved_at": "2026-11-08T04:02:25Z", "sha256": "df47fc6c1fed506a58a565fbd4c451afa06e9739d224442ba8a8e0112483e26b", "method": "Public page loaded in headless Chromium; saved the JSON the page itself requested (api/legislation/detail/72304) and the rendered page text.", "short": "General Assembly bill page", "why": "Official dates, committees, sponsors and vote counts"}, "S03": {"title": "Senate Floor Amendment 1 to HB 1009 (AM 49 0318), marked LOST", "publisher": "Georgia State Senate", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://www.legis.ga.gov/api/legislation/document/20252026/246996", "retrieved_at": "2026-11-08T04:03:27Z", "sha256": "bcdf2460d040811cc512ea8cf7128e7ebcba1e3f8907fc6ff01b71d314087989", "method": null, "short": "Amendment", "why": "The alternative senators voted on"}, "S09": {"title": "Gov. Kemp Signs Bills Strengthening Literacy and K-12 Schools (press release, 2026-05-05)", "publisher": "Office of the Governor", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://gov.georgia.gov/press-releases/2026-05-05/gov-kemp-signs-bills-strengthening-literacy-and-k-12-schools", "retrieved_at": "2026-11-08T04:05:36Z", "sha256": "83d7747fe616e08326ec43d8d7e7cbea717471f2855e45592385c5976603d203", "method": null, "short": "Governor's press release", "why": "The governor's stated reasons"}, "S10c": {"title": "OPB: Fiscal notes, 2025-2026 Regular Session (list)", "publisher": "Governor's Office of Planning and Budget", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://opb.georgia.gov/budget-information/fiscal-notes/2025-2026-regular-session", "retrieved_at": "2026-11-08T04:06:10Z", "sha256": "d4386a2edbea81049b678d8012a4de8c7710949e2bf4aab394c38e36f9a4b934", "method": null, "short": "Fiscal notes", "why": "Checked for an official cost estimate"}, "S12": {"title": "Most Georgia Parents Support Banning Cellphones in High Schools, New Poll Finds (Emory Rollins School of Public Health, 2026-01-26)", "publisher": "Emory University", "type": "secondary-research", "typeLabel": "Research", "url": "https://sph.emory.edu/news/most-georgia-parents-support-banning-cellphones-high-schools-new-poll-finds", "retrieved_at": "2026-11-08T04:05:37Z", "sha256": "dec405bf387c2cc034aed3ac52de0af142df57a64153bf91d42c7e1bfb599442", "method": null, "short": "Emory parent survey", "why": "What parents think, and why, with error margins"}, "S13a": {"title": "Figlio & Özek, The Impact of Cellphone Bans in Schools on Student Outcomes: Evidence from Florida (NBER WP 34388, Oct 2025): abstract page", "publisher": "National Bureau of Economic Research", "type": "secondary-research", "typeLabel": "Research", "url": "https://www.nber.org/papers/w34388", "retrieved_at": "2026-11-08T04:05:38Z", "sha256": "65142a15ae9bddb8d6238f54e540c48186ac0b1e5ec9bc37734692bedfd75bb6", "method": null, "short": "Florida study", "why": "Effects on test scores, suspensions and absences"}, "S13b": {"title": "Goodyear et al., School phone policies an
