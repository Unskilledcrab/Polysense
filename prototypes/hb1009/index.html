, and one that asks of each changed summary line whether we would write it the same way about the other side. Other suggestions wait for the next full round."], "head": ["Check", "What it does", "Pass mark"], "rows": [["Automatic checks", "Code confirms that every sentence cites a source passage or is labeled as our analysis, that quotes match word for word, that saved files match their fingerprints, and that the reading level is about grade 8 or lower.", "No errors"], ["Blind fact-check", "A separate AI checker sees only this page and the source passages. For each sentence it must copy the exact words that support it, and code confirms those words are really there.", "No unsupported claims"], ["Fairness panel", "Three more AI checkers. One speaks up for the law's supporters, one for its critics, and a neutral editor checks the rules. The editor also asks of each sentence: would we write it the same way about the other side?", "Both side reviewers give at least 4 of 5, and no serious problem"], ["Testing the fact-checker", "Each round, we hid errors in a copy of the page, such as a wrong deadline, an exception the law doesn't make, a misquoted survey answer and a sentence recommending an option. The fact-checker had to find them without knowing they were there.", "At least 9 of every 10 caught"]]}, {"title": "What each round found", "paras": ["No fact-check found a claim that its sources didn't support, only sentences that said more than the sources did. Rounds 1 to 4 checked earlier versions. Round 5 checked the rewrite for new readers, and round 6 checked one evidence label that all three panelists asked us to change."], "head": ["Round", "Fact-check", "Supporters' reviewer", "Critics' reviewer", "Editor (neutral, clear)", "Result"], "rows": [["1", "58 supported, 9 partly, 0 unsupported", "3 of 5", "3 of 5", "3, 4", "Failed. Critics had 4 argument cards to supporters' 2, and some quotes were cut"], ["2", "89 supported, 10 partly, 0 unsupported", "3 of 5", "4 of 5", "4, 4", "Failed. Our fixes went too far the other way"], ["3", "100 supported, 7 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 4", "Not yet. The editor found 2 serious problems, which we fixed"], ["4", "108 supported, 6 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 3", "Passed. We then fixed every sentence that said more than its source"], ["5", "149 supported, 3 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 4", "Passed. The rewrite for new readers"], ["6", "166 supported, 3 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 3", "Passed. Card 5's label now treats the Florida study as card 1 does"], ["Follow-up", "50 changed sentences, then 12, then 11: none unsupported", "", "", "", "Passed. The page you see is this version (6.4)"]]}, {"title": "What's still open", "paras": ["These suggestions change a card, a label or the balance between sides, so they wait for the next full round. Some contradict each other; we list both views rather than pick one quietly."], "items": ["Reviewers disagree on two evidence labels: supporters want card 2's and card 5's labels worded differently; critics accept them. Labels change only in a full round.", "Card 2's title says \"friendships\"; the survey's words are \"in-person social interactions\". Titles change only in a full round.", "The K-8 line notes the law dropped e-readers from its list of examples; the law's general definition may still cover them.", "Our sources give no phone number or email for lawmakers or school districts, so the page can't list them.", "The State School Superintendent's job isn't described in any source we saved."]}, {"title": "What this can't do", "paras": ["All the checkers are AI, like the writer, so they may share blind spots. Hiding test errors measures only the kinds of errors we thought to hide.", "The checkers compare this page with the sources we saved. They can't tell what is missing from those sources.", "The two side reviewers stand in for real people's views. They are not real people."]}, {"title": "See every report", "paras": ["Every check, report and fix is public in the project's repository, in trials/001-hb1009-high-school-cellphones/verification.md."]}]}, "audiences": ["Student", "Parent of a high schooler", "School staff", "K-8 parent"], "visuals": {}}, {"slug": "psc-57171", "code": "PSC Docket 57171 · 2026", "title": "Georgia regulators' Dec 15 decision: how real-time payments split between fuel and base costs", "linkText": "Larger businesses' real-time power payments and your Georgia Power bill", "kind": "regulatory-case", "trial": "002", "status": [{"text": "Open case at the Georgia Public Service Commission"}, {"text": "Decision scheduled Dec 15, 2026"}], "optionChips": {"Plan A": {"text": "Keep today's method"}, "Plan B": {"text": "Georgia Power's plan"}, "Plan C": {"text": "PIA Staff's plan"}, "Plan D": {"text": "GIPL's plan"}}, "verified": false, "statusText": "4 sentences waiting for a check", "disclosure": "Drafted with AI help from the archived sources below. Every sentence links to its source or is labeled as our analysis. This draft has not passed our checks yet; see how we checked it. This is a test page; no person reviewed it.", "revisionLabel": "version 7.6 · fingerprint 9658f0d75337", "workspace": {"sections": [{"id": "summary", "title": "30-second version", "blocks": [{"kind": "bullet", "label": "What's being decided", "units": [{"t": "The Georgia Public Service Commission (PSC), five commissioners who set utility rates, will decide how much of larger businesses' real-time payments counts toward fuel costs.", "cite": ["P-031", "P-169", "P-013", "P-016", "P-044"]}, {"t": "Real-time prices change by the hour.", "cite": ["P-042"]}]}, {"kind": "bullet", "label": "Who it affects", "units": [{"t": "Georgia Power customers on standard rates, including homes.", "cite": ["P-061"]}, {"t": "More real-time money toward fuel would likely lower their fuel charge, the bill's fuel part.", "cite": ["P-058", "P-144", "P-061"]}, {"t": "Base rates, the rest of the bill, could rise later.", "cite": ["P-061", "P-105", "P-115", "P-016"]}]}, {"kind": "bullet", "label": "What's next", "units": [{"t": "A hearing Nov 12; a decision set for Dec 15, 2026; comments due 24 hours before the vote.", "cite": ["P-010", "P-013", "P-030"]}]}], "subs": []}, {"id": "you", "title": "What it means for you", "blocks": [{"kind": "bullet", "label": "If you pay a Georgia Power bill at home", "units": [{"t": "If the PSC adopts any proposed plan, your fuel charge would likely drop, but your base rates could rise later.", "cite": ["P-058", "P-115", "P-144", "P-016", "P-105"]}, {"t": "As of Nov 8, 2026, no filing we read gives a home's net (both changes together) or its timing.", "tag": "editorial", "note": "scoped to the filings we read; Georgia Power's per-$100 million figures (P-142, P-143) are examples, not a plan's effect; the order leaves the fuel timing \"as determined by the Commission\" (P-016)"}]}, {"kind": "bullet", "label": "If you run a business on Georgia Power's standard rates", "units": [{"t": "If the PSC adopts any proposed plan, your fuel charge would likely drop, but your base rates could rise later.", "cite": ["P-058", "P-115", "P-144", "P-016", "P-105"]}, {"t": "As of Nov 8, 2026, no filing we read gives a business's net (both changes together) or its timing.", "tag": "editorial", "note": "scoped to the filings we read; the order leaves the fuel timing \"as determined by the Commission\" (P-016)"}]}, {"kind": "bullet", "label": "If your business pays real-time prices", "units": [{"t": "The PSC is reviewing how your payments are split between fuel and base, not your hourly prices.", "cite": ["P-016", "P-107", "P-133"]}, {"t": "Baseline power gets standard-rate changes, but some new large-load customers have no baseline.", "cite": ["P-043", "P-048", "P-071"]}, {"t": "As of Nov 8, 2026, no filing we read gives your baseline's net or timing.", "tag": "editorial", "note": "scoped to the filings we read"}]}, {"kind": "bullet", "label": "If your power comes from an electric membership corporation (EMC) or a city-owned utility", "units": [{"t": "This Georgia Power case doesn't set your power company's rates.", "cite": ["P-016", "P-170"]}, {"t": "The PSC oversees only where EMCs and city-owned utilities serve, plus EMCs' financing.", "tag": "analysis", "note": "plain-language reading of P-170, which lists electric membership corporations for \"Territory and financing only\" and city-owned power companies for \"Territory only\""}, {"t": "As of Nov 8, 2026, no filing we read gives any effect on your bill or its timing.", "tag": "editorial", "note": "scoped to the filings we read"}]}], "subs": [{"title": "Where the money comes from", "blocks": [{"kind": "num", "label": null, "units": [{"t": "Larger businesses on real-time prices pay Georgia Power an hourly price for power above a set baseline.", "cite": ["P-043", "P-042", "P-044"]}]}, {"kind": "num", "label": null, "units": [{"t": "Georgia Power splits those real-time payments: one part counts toward fuel costs, and the rest toward base costs.", "cite": ["P-061"]}]}, {"kind": "num", "label": null, "units": [{"t": "The fuel part, called the fuel credit, is recorded in the fuel account and lowers the fuel charge on standard rates.", "cite": ["P-144"]}, {"t": "The fuel credit is an accounting entry, not a credit on anyone's bill.", "tag": "analysis", "note": "plain-language gloss of P-144"}]}, {"kind": "num", "label": null, "units": [{"t": "A bigger fuel credit means the same number of dollars less toward base costs.", "cite": ["P-061", "P-111"]}]}, {"kind": "num", "label": null, "units": [{"t": "The PSC's order records that base-side change for Georgia Power's next base rate case to settle.", "cite": ["P-016"]}, {"t": "A base rate case is the PSC's full review of base rates.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}], "cardMeta": null}, {"title": "Decided now, and decided later", "blocks": [{"kind": "bullet", "label": "Decided by Dec 15", "units": [{"t": "whether to change how the fuel credit counts take-or-pay contracts, pipeline fees and other fuel costs, and whether to require monthly reports on the credit.", "cite": ["P-013", "P-016", "P-058", "P-065", "P-068"]}, {"t": "Take-or-pay contracts are deals, such as for solar and wind power, that require Georgia Power to pay for the power whenever it is produced.", "cite": ["P-050"]}]}, {"kind": "bullet", "label": "Decided later", "units": [{"t": "how much of the base-side change reaches base rates, in Georgia Power's next base rate case.", "cite": ["P-016", "P-090"]}, {"t": "Georgia Power says base rates are frozen through 2028.", "cite": ["P-054"]}]}, {"kind": "bullet", "label": "Set by the PSC, with no date given", "units": [{"t": "when a change reaches the fuel charge; the order says changes are credited to fuel revenues \"as determined by the Commission.\"", "cite": ["P-016"]}]}], "cardMeta": null}, {"title": "Not known yet", "blocks": [{"kind": "bullet", "label": "How much each plan would move", "units": [{"t": "Georgia Power's estimates for both of its take-or-pay choices are blacked out in the public copy.", "cite": ["P-139", "P-140"]}, {"t": "PIA Staff, which is PSC staff acting as a party in the case, estimates that the take-or-pay choice it recommends would add about $126 million to the fuel credit in 2026, rising to about $399 million in 2031.", "cite": ["P-006", "P-073", "P-079"]}, {"t": "Those were the public figures as of Nov 8, 2026.", "tag": "editorial", "note": "process note"}]}, {"kind": "bullet", "label": "A typical home's net, for any plan", "units": [{"t": "The filings we read, as of Nov 8, 2026, give none.", "tag": "editorial", "note": "scoped to the filings we read"}, {"t": "Georgia Power's figures, about $1.48 a month off a typical home's fuel charge and about $1.65 on its base rates for each $100 million moved, are examples, not any plan's effect.", "cite": ["P-141", "P-142", "P-143"]}]}, {"kind": "bullet", "label": "A pending request", "units": [{"t": "Georgia Power asked the PSC to strike part of the testimony of Georgia Interfaith Power & Light (GIPL), a group of congregations.", "cite": ["P-134", "P-093"]}, {"t": "We found no ruling in the filing list as of Nov 8, 2026.", "tag": "editorial", "note": "process note; the filing list (S01b) shows no order on the motion"}]}, {"kind": "bullet", "label": "The parties' final arguments", "units": [{"t": "Briefs are due by 4 p.m. on Dec 2, 2026.", "cite": ["P-011"]}, {"t": "Briefs are the parties' final written arguments.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "As of Nov 8, 2026, the briefs had not been filed.", "tag": "editorial", "note": "process note"}]}, {"kind": "bullet", "label": "Resource Supply Management's view", "units": [{"t": "Its testimony is a scanned image we could not read, so this page does not cover it.", "tag": "editorial", "note": "process note"}]}, {"kind": "bullet", "label": "Why some material is blacked out", "units": [{"t": "The public copies black out some figures from Georgia Power, PIA Staff and GAM, a manufacturers' group, and some words from GIPL.", "cite": ["P-139", "P-140", "P-146", "P-147", "P-150", "P-109", "P-112", "P-114", "P-107"]}, {"t": "The copies we read give no reason for any party's blacked-out material.", "tag": "editorial", "note": "scoped to the copies we read"}]}], "cardMeta": null}]}, {"id": "overview", "title": "Layer 1: Participate", "blocks": [], "subs": [{"title": "What you can do", "blocks": [{"kind": "bullet", "label": "Input", "units": [{"t": "The PSC's public witness page says members of the public can testify at its hearings, and their comments become part of the official transcript.", "cite": ["P-025", "P-159"]}, {"t": "No filing we read says whether public witnesses will be heard on Nov 12.", "tag": "editorial", "note": "process note; P-010 lists only motions and hearings on Georgia Power's rebuttal"}, {"t": "To ask, call the PSC at 404-656-4501 (local) or 1-800-282-5813 (outside metro-Atlanta) and press 2, or email gapsc@psc.state.ga.us.", "cite": ["P-163"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "If you go, the PSC suggests arriving about 30 minutes early to sign in to speak.", "cite": ["P-028"]}, {"t": "The PSC calendar lists the Nov 12 hearing at 9:35 a.m., so arriving 30 minutes early means about 9:05 a.m.", "tag": "computed", "note": "9:35 a.m. (P-023) minus about 30 minutes (P-028)"}, {"t": "Speaking time may be limited if many people sign up.", "cite": ["P-026"]}, {"t": "If you can't finish speaking, or would rather not speak, you can ask during the hearing to have your written comments entered into the record.", "cite": ["P-027"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "If you have a disability and need help to take part, the legal notice for the Sep 1 hearing said to call the PSC's Executive Secretary's Office at (404) 656-4501 or 1-800-282-5813, which that notice lists as \"inside Georgia only,\" at least one day before the hearing.", "cite": ["P-021", "P-022"]}]}, {"kind": "bullet", "label": "Input", "units": [{"t": "Send the PSC a public comment by 9:30 a.m. on Dec 14, 2026.", "tag": "computed", "note": "comments must be submitted 24 hours before a Commission vote (P-030); the Dec 15 Administrative Session, where the final decision is scheduled (P-013), starts at 9:30 a.m. (P-024); 24 hours earlier is 9:30 a.m. on Dec 14"}, {"t": "The PSC's Public Comments page doesn't say how to send a comment.", "tag": "editorial", "note": "process note; P-030 is the page's full text"}, {"t": "To ask, call the PSC at 404-656-4501 (local) or 1-800-282-5813 (outside metro-Atlanta) and press 2, or email gapsc@psc.state.ga.us.", "cite": ["P-163"]}, {"t": "The Public Comments page says: \"Comments must be submitted 24 hours before a Commission vote.\"", "cite": ["P-030"]}, {"t": "Dec 14 at 9:30 a.m. is 24 hours before the Dec 15 session starts.", "tag": "computed", "note": "the Dec 15 Administrative Session starts at 9:30 a.m. (P-024); 24 hours earlier is 9:30 a.m. on Dec 14"}, {"t": "The time this case comes up in that session isn't posted as of Nov 8, 2026.", "tag": "editorial", "note": "process note; P-024 gives only the session's start"}, {"t": "The Energy Committee takes up the case on Dec 10.", "cite": ["P-012"]}, {"t": "No PSC page we found says whether the committee meeting counts as a Commission vote, so ask the PSC whether an earlier deadline applies.", "tag": "editorial", "note": "process note; P-030 says only \"a Commission vote\""}, {"t": "If the PSC moves the vote, the deadline moves too.", "tag": "analysis", "note": "follows from the 24-hour rule in P-030"}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "The Dec 15 decision comes at a session that is open to the public, in hearing room 110 at 244 Washington St. in Atlanta.", "cite": ["P-013", "P-032"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The Dec 10 committee meeting is in the PSC hearing room.", "cite": ["P-012"]}, {"t": "The PSC's FAQ says \"Proceedings are open to the public\" in its answer on administrative sessions.", "cite": ["P-032"]}, {"t": "We found no PSC page that says whether the public may attend or speak at committee meetings, so ask the PSC at the numbers above.", "tag": "editorial", "note": "process note; the PSC's public witness and public comment pages (S14, S15) do not mention committee meetings, and its FAQ (S19) names the standing committees (P-171) but, in the copy we archived, doesn't say whether the public may attend or speak at their meetings"}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "Read the case filings on the PSC's web page for Docket 57171.", "cite": ["P-001", "P-003"]}, {"t": "A docket is the PSC's case file.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}], "cardMeta": null}, {"title": "Who decides, and how to reach them", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "The PSC's five commissioners make the final decision, at an administrative session open to the public.", "cite": ["P-013", "P-029", "P-031", "P-032"]}]}, {"kind": "bullet", "label": "Jason Shaw", "units": [{"t": "chairman; serves through Dec 31, 2028.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "Lauren \"Bubba\" McDonald", "units": [{"t": "vice chairman; serves through Dec 31, 2028.", "cite": ["P-036"]}]}, {"kind": "bullet", "label": "Peter Hubbard", "units": [{"t": "commissioner; serves through Dec 31, 2026.", "cite": ["P-037"]}]}, {"kind": "bullet", "label": "Alicia M. Johnson", "units": [{"t": "commissioner; serves through Dec 31, 2030.", "cite": ["P-038"]}]}, {"kind": "bullet", "label": "Stan Wise", "units": [{"t": "commissioner; serves through Dec 31, 2026.", "cite": ["P-033"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Every one of these terms runs past the Dec 15 decision date, so these five commissioners are set to vote.", "tag": "analysis", "note": "every term in P-033 and P-035 to P-038 runs past the Dec 15 decision date in P-013"}]}, {"kind": "bullet", "label": "To reach the PSC", "units": [{"t": "email gapsc@psc.state.ga.us, or call 404-656-4501 (local) or 1-800-282-5813 (outside metro-Atlanta) and press 2.", "cite": ["P-163"]}]}, {"kind": "bullet", "label": "Where the commissioners vote", "units": [{"t": "administrative sessions on the first and third Tuesday of each month, in hearing room number 110 at 244 Washington St. in Atlanta, where \"Proceedings are open to the public.\"", "cite": ["P-032"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The PSC's Public Interest Advocacy Staff (PIA Staff) takes part in this case as a party.", "cite": ["P-006"]}, {"t": "A separate advisory staff advises the commissioners and is not a party.", "cite": ["P-007"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Outside groups that join the case as parties are called intervenors; a party here is a participant in the case, not a political party.", "tag": "analysis", "note": "plain-language definition; P-009 schedules testimony from \"Staff and Intervenors\""}]}], "cardMeta": null}, {"title": "Coming up", "blocks": [{"kind": "bullet", "label": "Nov 12, 2026", "units": [{"t": "Hearing on Georgia Power's rebuttal testimony.", "cite": ["P-010"]}, {"t": "The hearing starts after the PSC's committee meetings, which begin at 9:30 a.m.", "cite": ["P-010", "P-023"]}, {"t": "The PSC calendar lists the hearing at 9:35 a.m.", "cite": ["P-023"]}]}, {"kind": "bullet", "label": "Dec 2, 4 p.m.", "units": [{"t": "Deadline for parties to file briefs and proposed orders.", "cite": ["P-011"]}, {"t": "Briefs are the parties' final written arguments, and proposed orders are the decisions they ask the PSC to adopt.", "tag": "analysis", "note": "plain-language definitions, not from the cited sources"}]}, {"kind": "bullet", "label": "Dec 10", "units": [{"t": "The PSC's Energy Committee, a committee of its commissioners, takes up the case at its meeting in the PSC hearing room, which begins at 9:30 a.m.", "cite": ["P-012", "P-024", "P-171"]}]}, {"kind": "bullet", "label": "Dec 15", "units": [{"t": "The PSC is scheduled to make its final decision at its Administrative Session, a regular meeting where commissioners vote, which starts at 9:30 a.m.", "cite": ["P-013", "P-024", "P-029", "P-032"]}, {"t": "The time this case comes up in the session isn't posted as of Nov 8, 2026.", "tag": "editorial", "note": "process note; P-024 gives only the session's start"}, {"t": "The PSC says commissioners decide at that session based on the evidence presented at the hearings.", "cite": ["P-029"]}]}, {"kind": "bullet", "label": "Dec 31", "units": [{"t": "The case must be finished by this date.", "cite": ["P-016"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "We copied these dates from PSC pages on Nov 8, 2026; they can change, so check the PSC calendar before you go.", "tag": "editorial", "note": "process note"}]}], "cardMeta": null}, {"title": "What happened", "blocks": [{"kind": "bullet", "label": "May 28, 2026", "units": [{"t": "The PSC approved a settlement in Georgia Power's fuel-rate case, a separate case, and its order started this review.", "cite": ["P-017", "P-018", "P-019", "P-016"]}, {"t": "The order says the PSC \"shall further review\" how Georgia Power credits real-time revenue to the fuel side, and \"may make modifications if appropriate.\"", "cite": ["P-016"]}, {"t": "Georgia Power says that, as more large customers were served on real-time prices, PIA Staff and intervenors sought the review \"to ensure such customers pay their share of costs,\" and that it \"supported and agreed to this subsequent review.\"", "cite": ["P-053"]}, {"t": "Georgia Interfaith Power & Light (GIPL), a group of congregations, says parties in that case raised concerns that the method had raised other customers' fuel costs.", "cite": ["P-093", "P-097"]}, {"t": "The order said the review \"shall be concluded by December 31, 2026.\"", "cite": ["P-016", "P-005"]}]}, {"kind": "bullet", "label": "Jul 7", "units": [{"t": "The PSC adopted the schedule for this case.", "cite": ["P-014"]}]}, {"kind": "bullet", "label": "Aug 14", "units": [{"t": "Georgia Power filed testimony with two options for counting its take-or-pay power contracts.", "cite": ["P-041", "P-058"]}]}, {"kind": "bullet", "label": "Aug 24", "units": [{"t": "A legal notice of the case was first published.", "cite": ["P-020"]}]}, {"kind": "bullet", "label": "Sep 1", "units": [{"t": "The PSC held a hearing on Georgia Power's testimony.", "cite": ["P-008", "P-151"]}]}, {"kind": "bullet", "label": "Sep 5", "units": [{"t": "Stan Wise became a commissioner, appointed to serve the rest of former Commissioner Tricia Pridemore's term.", "cite": ["P-033", "P-034", "P-015", "P-040"]}]}, {"kind": "bullet", "label": "Sep 22–23", "units": [{"t": "PIA Staff, Georgia Interfaith Power & Light (GIPL), the Georgia Association of Manufacturers (GAM) and Resource Supply Management filed testimony.", "cite": ["P-059", "P-152", "P-153", "P-162"]}, {"t": "Resource Supply Management's testimony is a scanned image we could not read, so this page does not cover its view.", "tag": "editorial", "note": "process note"}]}, {"kind": "bullet", "label": "Oct 7", "units": [{"t": "PIA Staff filed corrections to its testimony.", "cite": ["P-039"]}]}, {"kind": "bullet", "label": "Oct 8", "units": [{"t": "Georgia Power asked the PSC to strike, or remove from the record, parts of GIPL's testimony.", "cite": ["P-134", "P-135"]}]}, {"kind": "bullet", "label": "Oct 14", "units": [{"t": "GIPL asked the PSC to deny that request.", "cite": ["P-136", "P-137"]}]}, {"kind": "bullet", "label": "Oct 15", "units": [{"t": "The PSC held a hearing on the testimony of PIA Staff and the intervenors.", "cite": ["P-009", "P-003"]}]}, {"kind": "bullet", "label": "Oct 27", "units": [{"t": "Georgia Power filed rebuttal testimony, the last written testimony on the schedule.", "cite": ["P-117", "P-009", "P-010", "P-011"]}]}], "cardMeta": null}]}, {"id": "decision", "title": "Layer 2: The decision", "blocks": [{"kind": "para", "label": "What's being decided", "units": [{"t": "Georgia Power splits what its real-time customers, larger businesses on hourly prices, pay between fuel and base costs.", "cite": ["P-061", "P-042", "P-044"]}, {"t": "The fuel part, called the fuel credit, lowers other customers' fuel charge, the part of their bills for fuel.", "cite": ["P-144", "P-061"]}, {"t": "The fuel credit is an accounting entry, not a bill credit.", "tag": "analysis", "note": "plain-language gloss of P-144"}, {"t": "The rest helps cover base costs, paid through base rates, the rest of the bill.", "cite": ["P-061", "P-124"]}, {"t": "The Public Service Commission (PSC), which decides fair and reasonable utility rates, is reviewing that split.", "cite": ["P-169", "P-016"]}]}, {"kind": "para", "label": "What would change", "units": []}, {"kind": "num", "label": null, "units": [{"t": "Take-or-pay contracts are deals, such as for solar and wind power, that require Georgia Power to pay for the power whenever it is produced.", "cite": ["P-050"], "segs": [{"t": "Take-or-pay contracts", "b": true}, {"t": " are deals, such as for solar and wind power, that require Georgia Power to pay for the power whenever it is produced."}]}, {"t": "Today the credit counts the contracts' energy but not their cost, which lowers the credit.", "cite": ["P-049", "P-076", "P-058"]}, {"t": "Should the credit count the contracts' cost along with their energy, drop the cost and the energy, or keep counting only the energy?", "tag": "editorial", "note": ""}, {"t": "Counting the cost along with the energy would raise the credit, and so would dropping the cost and the energy.", "cite": ["P-058", "P-115"]}]}, {"kind": "num", "label": null, "units": [{"t": "Pipeline fees (fixed payments Georgia Power makes to reserve gas pipeline space for its power plants): should real-time money count against the fees, and how?", "cite": ["P-051", "P-049", "P-081", "P-055", "P-157", "P-104", "P-110"], "segs": [{"t": "Pipeline fees", "b": true}, {"t": " (fixed payments Georgia Power makes to reserve gas pipeline space for its power plants): should real-time money count against the fees, and how?"}]}]}, {"kind": "num", "label": null, "units": [{"t": "Other fuel costs, such as coal rail car leases: should the credit count those costs?", "cite": ["P-063", "P-065"], "segs": [{"t": "Other fuel costs", "b": true}, {"t": ", such as coal rail car leases: should the credit count those costs?"}]}]}, {"kind": "num", "label": "Reports", "units": [{"t": "should Georgia Power file monthly reports on the credit?", "cite": ["P-068", "P-132"]}]}, {"kind": "para", "label": null, "units": [{"t": "One party's testimony, Resource Supply Management's, is a scanned image we could not read, so this page does not cover its view.", "tag": "editorial", "note": "process note"}]}], "subs": [{"title": "How real-time pricing works", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "Business customers with a demand of at least 250 kilowatts can choose real-time pricing (RTP).", "cite": ["P-044", "P-042"]}, {"t": "About 2,300 use the day-ahead version (RTP-DA), and about 170 use the hour-ahead version (RTP-HA), which requires at least 5 megawatts.", "cite": ["P-044", "P-164"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "They pay standard rates, fuel charge included, on a set baseline amount of power, and an hourly price on power above it.", "cite": ["P-043", "P-048"]}, {"t": "The hourly price reflects what Georgia Power expects its marginal cost to be.", "cite": ["P-042"]}, {"t": "Marginal cost is the cost of making one more unit of power.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}, {"kind": "bullet", "label": null, "units": [{"t": "So later changes to the fuel charge or base rates would reach real-time customers' baseline power.", "tag": "analysis", "note": "follows from P-043 and P-048"}, {"t": "New large-load customers on one tariff have no baseline.", "cite": ["P-071"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Georgia Power says these customers take on price risk in exchange for possible savings.", "cite": ["P-042"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Georgia Power expects most new business growth to use real-time pricing, said PIA Staff, which is PSC staff acting as a party in the case.", "cite": ["P-070", "P-006"]}, {"t": "Georgia Interfaith Power & Light (GIPL), a group of congregations, says the method under review has been applied to data centers.", "cite": ["P-097", "P-093"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "PIA Staff says new large-load customers on one rate schedule, or tariff, have no baseline and pay real-time rates.", "cite": ["P-071"]}, {"t": "PIA Staff says those customers also pay a monthly access charge to cover added fixed costs.", "cite": ["P-071"]}, {"t": "The Georgia Association of Manufacturers (GAM) is a group whose members buy large amounts of Georgia Power's electricity.", "cite": ["P-109"]}, {"t": "GAM says new customers of 100 megawatts and up may choose real-time pricing for all or part of their power.", "cite": ["P-168"]}, {"t": "GAM says those customers pay access charges that reflect Georgia Power's added costs.", "cite": ["P-168"]}, {"t": "The two descriptions may cover different groups.", "tag": "analysis", "note": "P-071 describes customers on one tariff; P-168 describes customers of 100 MW and up"}]}, {"kind": "bullet", "label": null, "units": [{"t": "GIPL says a change it recommends would not change the rates real-time customers pay, \"just the RTP fuel revenue credit.\"", "cite": ["P-105"]}, {"t": "Georgia Power said the same of its 2010 change to the method.", "cite": ["P-046"]}, {"t": "GIPL also says the real-time price is set \"too low during peak hours.\"", "cite": ["P-094"]}, {"t": "GIPL says rate design is outside this case, but still recommends that Georgia Power propose new real-time pricing.", "cite": ["P-107"]}]}], "cardMeta": null}, {"title": "Words used on this page", "blocks": [{"kind": "bullet", "label": "Fuel charge", "units": [{"t": "the part of a standard-rate bill that pays for fuel; its formal name is fuel cost recovery (FCR).", "cite": ["P-021", "P-061"]}]}, {"kind": "bullet", "label": "Base rates", "units": [{"t": "the rest of the bill, which pays for power plants, power lines, other costs besides fuel, and the company's profit.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}, {"kind": "bullet", "label": "Base rate case", "units": [{"t": "the PSC's full review of base rates.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "The filings we read give no date for the next one.", "tag": "editorial", "note": "scoped to the filings we read"}, {"t": "Georgia Power says base rates are frozen through 2028.", "cite": ["P-054"]}]}, {"kind": "bullet", "label": "Standard rates", "units": [{"t": "the regular rates for customers not on real-time pricing, with separate charges for base costs and for fuel.", "cite": ["P-061"]}, {"t": "Homes are on standard rates, since real-time pricing is open only to businesses with a demand of at least 250 kilowatts.", "tag": "analysis", "note": "P-044 and P-061"}]}, {"kind": "bullet", "label": "Fuel credit", "units": [{"t": "the part of real-time payments recorded toward fuel costs; it is an accounting entry, not a credit on anyone's bill.", "tag": "analysis", "note": "plain-language gloss of P-144"}]}, {"kind": "bullet", "label": "Base side", "units": [{"t": "the part of real-time payments counted toward base costs.", "tag": "analysis", "note": "plain-language gloss of P-061"}]}, {"kind": "bullet", "label": "Regulatory asset or liability", "units": [{"t": "an amount the company records to collect from customers, or return to them, later; here the next base rate case settles it.", "tag": "analysis", "note": "plain-language gloss of P-016"}]}, {"kind": "bullet", "label": "Take-or-pay contracts", "units": [{"t": "contracts, such as Georgia Power's solar, wind and biomass deals, under which it must pay for power whenever it is produced.", "cite": ["P-050"]}, {"t": "The filings also call them non-dispatchable PPAs, or power purchase agreements.", "cite": ["P-050", "P-119"]}]}, {"kind": "bullet", "label": "Pipeline fees", "units": [{"t": "fixed monthly payments to reserve space on gas pipelines for Georgia Power's power plants.", "cite": ["P-049", "P-051"]}, {"t": "The filings call them firm transportation (FT).", "cite": ["P-096"]}]}, {"kind": "bullet", "label": "Peak demand and energy use", "units": [{"t": "peak demand is the most power used at one time, such as on a cold winter morning.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}, {"t": "Energy use is the total power used over a month.", "tag": "analysis", "note": "plain-language definition, not from the cited sources"}]}, {"kind": "bullet", "label": "Average hourly marginal replacement fuel cost", "units": [{"t": "the rate the credit uses today.", "cite": ["P-048"]}, {"t": "That rate is the cost to replace the fuel burned, averaged over all of Georgia Power's units running that hour.", "tag": "analysis", "note": "plain-language gloss of P-048"}]}, {"kind": "bullet", "label": "Pool sales or purchases", "units": [{"t": "power traded through a power pool; the credit's rate counts Georgia Power's share.", "tag": "analysis", "note": "plain-language gloss; P-048 names it"}]}, {"kind": "bullet", "label": "System lambda", "units": [{"t": "the cost of the last unit of power the system makes in an hour.", "cite": ["P-052"]}, {"t": "System lambda is part of the real-time price, and Georgia Power says it is above the average running cost in nearly all hours.", "cite": ["P-052"]}]}, {"kind": "bullet", "label": "Capital substitution", "units": [{"t": "Georgia Power's name for part of the gap between lambda and the money recorded to fuel; it goes to base rates.", "cite": ["P-052"]}]}, {"kind": "bullet", "label": "Capacity values", "units": [{"t": "the part of the real-time price meant to cover having enough power plants for peak times.", "tag": "analysis", "note": "plain-language gloss of the \"reliability capacity cost component\" and \"marginal value of capacity\" in P-148"}]}, {"kind": "bullet", "label": "Large-load customers", "units": [{"t": "the parties' term for big new power users; the filings we read give it no size threshold.", "tag": "editorial", "note": "process note; P-051, P-055, P-071 and P-101 use the term without one"}, {"t": "GAM's \"very large load\" means new customers of 100 megawatts and up.", "cite": ["P-168"]}]}, {"kind": "bullet", "label": "Under-collected fuel balance", "units": [{"t": "fuel costs already  ["P-016"]}, {"t": "The parties differ on how that would reach base rates.", "cite": ["P-115", "P-105", "P-090"]}, {"t": "Part of the pipeline and storage fees would be counted against real-time payments, based on energy use.", "cite": ["P-157"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "PIA Staff's yearly estimates for its pipeline plan are blacked out.", "cite": ["P-147"]}, {"t": "Its take-or-pay table shows yearly figures only for the difference.", "cite": ["P-078"]}, {"t": "The other columns give only 2023–2025 totals: about $1.09 billion under today's method and $1.31 billion with take-or-pay costs.", "cite": ["P-078"]}]}], "cardMeta": null}, {"title": "Plan D: GIPL's plan", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "Uses Georgia Power's take-or-pay choice 1.", "cite": ["P-095", "P-128"]}, {"t": "New pipeline fees tied to large-load customers would be recovered from them.", "cite": ["P-096"]}, {"t": "As filed, the new fees would be split the way power-line costs are, until the next rate case reviews the issue.", "cite": ["P-096", "P-104"]}, {"t": "The credit would also include a direct share of pipeline fees, plus coal-related costs and corporate overhead.", "cite": ["P-096", "P-102"]}, {"t": "If the PSC relies on Georgia Power's large-load cost model, GIPL asks that intervenors get a working copy.", "cite": ["P-096"]}]}, {"kind": "bullet", "label": "Where it stands", "units": [{"t": "GIPL proposes it, filing with three of its member congregations.", "cite": ["P-093"]}, {"t": "Georgia Power also backs choice 1 and recovering new pipeline fees from large-load customers.", "cite": ["P-128", "P-055"]}, {"t": "PIA Staff also backs counting coal-related costs and corporate overhead.", "cite": ["P-087", "P-088"]}, {"t": "PIA Staff opposes choice 1, and Georgia Power proposes a different pipeline split and opposes counting the other costs.", "cite": ["P-074", "P-056", "P-131"]}, {"t": "GAM says that if the PSC finds a change is needed, either of Georgia Power's proposed changes would \"adequately address\" the concerns of PIA Staff and intervenors.", "cite": ["P-111"]}, {"t": "Georgia Power's rebuttal says GIPL's witness changed his pipeline advice at a hearing because of Georgia Power's later data responses.", "cite": ["P-154", "P-155"]}, {"t": "Card 5 gives the details.", "tag": "editorial", "note": ""}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "Customers on standard rates.", "cite": ["P-096", "P-144"]}, {"t": "More real-time money would count toward fuel, from take-or-pay choice 1, a direct pipeline share, and coal and overhead costs.", "cite": ["P-095", "P-096", "P-105", "P-128"]}, {"t": "GIPL says its take-or-pay choice gives standard-rate customers both the contracts' costs and benefits, as long as the contracts' output stays below their use.", "cite": ["P-100"]}, {"t": "How much isn't public: Georgia Power's estimate for its first take-or-pay choice is blacked out.", "cite": ["P-139"]}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "Less real-time money goes toward base costs, by the same amount the credit grows, so base rates could rise later; the parties differ on whether and how much.", "cite": ["P-061", "P-115", "P-105", "P-090"]}, {"t": "More of large-load customers' payments would be counted toward the new pipeline fees tied to their growth.", "cite": ["P-096"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "GIPL says it is not clear whether Georgia Power's capacity values already include pipeline costs.", "cite": ["P-148"]}, {"t": "If they do, GIPL offers two other choices.", "cite": ["P-096"]}]}], "cardMeta": null}]}, {"id": "arguments", "title": "Layer 4: Arguments you'll hear", "blocks": [{"kind": "para", "label": null, "units": [{"t": "Five parties filed testimony; each is described below.", "cite": ["P-041", "P-059", "P-152", "P-153", "P-162"]}]}, {"kind": "para", "label": "The parties and their witnesses", "units": []}, {"kind": "bullet", "label": "Georgia Power", "units": [{"t": "the utility whose method is under review.", "cite": ["P-016"]}, {"t": "Its witnesses: its director of pricing and rates, its vice president of pricing and revenue strategy, and a director of demand planning and analysis at Southern Company Services.", "cite": ["P-165", "P-166", "P-167"]}]}, {"kind": "bullet", "label": "PIA Staff", "units": [{"t": "PSC staff that takes part in this case as a party.", "cite": ["P-006"]}, {"t": "Its witnesses: the PSC's director of utility finance and two principals of J. Kennedy and Associates.", "cite": ["P-060", "P-160", "P-161"]}]}, {"kind": "bullet", "label": "GIPL", "units": [{"t": "Georgia Interfaith Power & Light, which filed with three of its member congregations: Park Avenue Baptist Church, Temple Sinai, and Unitarian Universalist Church of Savannah.", "cite": ["P-093"]}, {"t": "The filings we read don't describe its members' power use.", "tag": "editorial", "note": "scoped to the filings we read"}, {"t": "Its witness: the vice president of Grid Strategies LLC.", "cite": ["P-092"]}]}, {"kind": "bullet", "label": "GAM", "units": [{"t": "the Georgia Association of Manufacturers, whose members are Georgia Power customers that use large amounts of power, mainly for manufacturing, under \"a variety of rate schedules.\"", "cite": ["P-109"]}, {"t": "Its witness: an associate consultant at J. Pollock, Incorporated.", "cite": ["P-108"]}]}, {"kind": "bullet", "label": "Resource Supply Management", "units": [{"t": "its witness is Jim Clarkson, and its filing page gives no role.", "cite": ["P-162"]}, {"t": "Its testimony is a scanned image we could not read, so this page does not summarize it.", "tag": "editorial", "note": "process note"}]}, {"kind": "para", "label": "Words on these cards", "units": [{"t": "Real-time pricing (RTP) is an hourly price that businesses using at least 250 kilowatts can choose.", "cite": ["P-042", "P-044"]}, {"t": "The fuel credit is the part of real-time payments recorded toward fuel costs.", "cite": ["P-144"]}, {"t": "The fuel credit is an accounting entry, not a credit on anyone's bill.", "tag": "analysis", "note": "plain-language gloss of P-144"}, {"t": "The fuel charge, formally fuel cost recovery (FCR), is the part of standard-rate bills that pays for fuel, and base rates are the rest.", "cite": ["P-021", "P-061"]}, {"t": "Take-or-pay contracts, such as for solar and wind power, require Georgia Power to pay for the power whenever it is produced.", "cite": ["P-050"]}, {"t": "Georgia Power offered two take-or-pay choices, 1 and 2, which the filings call Option 1 and Option 2.", "cite": ["P-058", "P-128"]}, {"t": "Pipeline fees are fixed payments to reserve gas pipeline space for Georgia Power's power plants.", "cite": ["P-049", "P-051"]}]}, {"kind": "para", "label": null, "units": [{"t": "The named voices below are the parties' witnesses, not members of the public, so they reflect who filed testimony, not how many people hold each view.", "tag": "editorial", "note": ""}, {"t": "The cards cover take-or-pay contracts, pipeline fees and other fuel costs, not the monthly reports.", "tag": "editorial", "note": ""}, {"t": "On reports, PIA Staff proposes a monthly report on the credit, and Georgia Power says the reports are not needed and, in some cases, \"not feasible in the requested timeframe.\"", "cite": ["P-068", "P-132"]}]}], "subs": [{"title": "How to read these cards", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "Every card uses the same fields, and its label grades the card's main factual premise, set apart from who disagrees with the proposal, then says what is public about the size.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "\"Supported\" means the record backs the premise and no party whose testimony we could read disputes it; \"Mixed\" means parties give conflicting accounts; \"Uncertain\" means the deciding facts are blacked out, missing or not yet known.", "tag": "editorial", "note": "labeling rule"}, {"t": "We say \"whose testimony we could read\" because Resource Supply Management's testimony is a scan we could not read, and the Oct 15 hearing transcript is listed without a file.", "tag": "editorial", "note": "labeling rule; P-003 lists the transcript without a file"}, {"t": "A label names any disputed reading of the facts as such.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "Dollar figures are the parties' own, and many are estimates; a blacked-out figure exists but is hidden, so it is neither zero nor evidence against another party's figure.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "\"Claim type\" says whether a card rests on facts, values, predictions or a mix; values questions can't be settled by evidence.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "\"Documented\" means a named witness made the argument in a filing, given with its date, and \"Side\" names the plan or option a card argues for.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "Under \"What challenges it\", the card's side answers a challenge with its own statement on the point when one is on record; \"had said\" marks a statement filed before the challenge.", "tag": "editorial", "note": "labeling rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "Georgia Power filed last, on Oct 27, and the schedule sets no written replies before the Dec 2 briefs, so some rebuttal points have no written answer yet.", "cite": ["P-117", "P-009", "P-010", "P-011"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Cards follow the order of the questions under \"What would change\"; within each question, proposed changes come first, in the order they were filed, and a card for keeping today's treatment comes last.", "tag": "editorial", "note": "ordering rule"}, {"t": "The last card covers GAM's view of the base side, which bears on every question, and the order is not a ranking.", "tag": "editorial", "note": "ordering rule"}]}, {"kind": "bullet", "label": null, "units": [{"t": "PIA Staff's Oct 7 corrections changed Tables 2, 3, 4 and 7 and one line each on pages 7 and 20 of its testimony.", "cite": ["P-039"]}, {"t": "Its page-7 figures are flagged in Plan C, and its page-20 text on pipeline fees could not be checked against the correction.", "tag": "analysis", "note": "P-039 compared with the locations of P-066 and P-157"}, {"t": "No Staff figure on this page is taken from those tables.", "tag": "analysis", "note": "P-039 compared with the locations of P-076 to P-079, P-091, P-147 and P-150"}, {"t": "Staff's profit-rate estimates under \"Fuel side versus base side\" and in card 9 were not among the corrections, but they may rest on credited amounts in Tables 2 and 7, which were corrected, so they may not reflect the corrections.", "tag": "analysis", "note": "P-039 lists the corrections and doesn't include footnote 45 (P-091); P-150 says Staff's credited amounts are shown in Tables 2, 5 and 7, and P-090 bases the estimates on the added revenue credited to fuel"}]}], "cardMeta": null}, {"title": "1. Remove take-or-pay contracts' cost and energy from the credit (take-or-pay choice 1)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges would likely fall; base rates could rise later.", "cite": ["P-058", "P-144", "P-061", "P-115", "P-016"]}, {"t": "Georgia Power says real-time customers can't avoid take-or-pay costs; GIPL says real-time load should bear costs of plants run in response to it.", "cite": ["P-130", "P-100"]}, {"t": "Evidence: Supported; Mixed on whom contracts serve.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Georgia Power witnesses Ross Beppler, Lee Evans and Brandon Looney filed rebuttal testimony on Oct 27, 2026.", "cite": ["P-117"]}, {"t": "They said \"Option 1 preserves the integrity of RTP as a marginal cost-based rate.\"", "cite": ["P-129"]}, {"t": "They said real-time customers cannot avoid take-or-pay costs by changing their use.", "cite": ["P-130"]}, {"t": "GIPL witness John D. Wilson filed direct testimony on Sep 23, 2026.", "cite": ["P-092", "P-152"]}, {"t": "Wilson said real-time load should carry the costs of plants that are run up or down as demand responds to prices: it \"should be assigned the cost of resources that may be dispatched in response to price-sensitive demand.\"", "cite": ["P-100"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that take-or-pay choice 1 raises the credit, or that real-time customers can't avoid take-or-pay costs by changing their use.", "tag": "analysis", "note": "P-058, P-128 and P-115 on the credit; P-050 and P-130 on the costs, which PIA Staff's objection (P-074) does not contest"}, {"t": "Georgia Power said the contracts and their costs \"are not driven by large load growth.\"", "cite": ["P-050"]}, {"t": "Georgia Power said \"RTP load pays the marginal fuel cost and does not directly benefit from the fixed price feature of the non-dispatchable PPA.\"", "cite": ["P-130"]}, {"t": "Georgia Power said the PSC approved in 2010 recording real-time fuel revenue at \"average marginal replacement fuel costs (rather than the embedded FCR rate).\"", "cite": ["P-046"]}, {"t": "GIPL said that while the contracts' output stays below standard-rate customers' use, take-or-pay choice 1 gives those customers both the contracts' costs and their benefits.", "cite": ["P-100", "P-128"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "PIA Staff said take-or-pay choice 1 \"omits non-dispatchable costs from the calculation when the energy from these non-dispatchable resources serve all customers.\"", "cite": ["P-074"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "PIA Staff said that if Georgia Power had wanted an accurate marginal-cost method, it \"should have proposed the associated interchange energy rate.\"", "cite": ["P-075"]}, {"t": "Georgia Power's direct testimony said its first take-or-pay choice \"is not based on all Georgia Power generating units running, as originally approved.\"", "cite": ["P-058"]}, {"t": "In the same passage, Georgia Power had said this choice \"is consistent with an approach that the RTP fuel credit should be derived from marginal replacement fuel costs.\"", "cite": ["P-058"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The public copies we found have no dollar figure for what take-or-pay choice 1 would add.", "cite": ["P-138", "P-139"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether the fuel credit should count only fuel costs that change with real-time customers' use, or also fixed costs such as these contracts; this is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors take-or-pay choice 1", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that Option 1 raises the credit, or that real-time use can't avoid these contracts' costs); Mixed (whether the contracts mainly benefit customers on standard rates or serve all customers); size blacked out (Georgia Power's estimate)"}}, {"title": "2. Count the costs of take-or-pay contracts too (take-or-pay choice 2)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges would likely fall; base rates could rise later.", "cite": ["P-058", "P-144", "P-061", "P-115", "P-016"]}, {"t": "PIA Staff says take-or-pay contracts serve all customers at all times, so the contracts' costs should count in the credit too.", "cite": ["P-080"]}, {"t": "Evidence: Supported; Mixed on whom contracts serve.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "PIA Staff witnesses Tom Newsome, Philip Hayet and Leah Wellborn filed testimony on Sep 23, 2026.", "cite": ["P-059", "P-060", "P-160", "P-161"]}, {"t": "They said: \"These costs are incurred to serve all customers at all times and should be included when the Company calculates the amount of RTP revenues credited to fuel revenues.\"", "cite": ["P-080"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that today the credit counts the contracts' energy but not their cost, or that counting both the contracts' cost and their energy raises the credit.", "tag": "analysis", "note": "P-049 and P-058 (Georgia Power), P-076 (PIA Staff), P-100 (GIPL), P-115 (GAM)"}, {"t": "In 2025, about 9.8 million MWh of take-or-pay energy was counted while the related $486 million in costs was not, which Staff said \"unreasonably suppressed\" the credit.", "cite": ["P-076"]}, {"t": "That $486 million is the contracts' total cost for the year, not the share real-time customers would carry.", "cite": ["P-077"]}, {"t": "PIA Staff says Georgia Power \"recognized this is a problem,\" and GIPL says take-or-pay choice 1 \"resolves this problem.\"", "cite": ["P-072", "P-100"]}, {"t": "Georgia Power's direct testimony offered take-or-pay choice 2 as one of its two options and said it would \"result in a larger allocation of RTP revenues to the fuel clause\" than today's method.", "cite": ["P-058"]}, {"t": "PIA Staff estimates that take-or-pay choice 2 would have added $220 million to the credit in 2023–2025, and the same $220 million would have come off the base side.", "tag": "computed", "note": "dollar for dollar, as P-061 describes the split; amount from P-078"}, {"t": "Staff says the data Georgia Power provided were incomplete, so the figure may be too low, and that the difference is expected to keep growing through 2031; it said the excluded contracts may top 17 million MWh by 2027.", "cite": ["P-078", "P-079", "P-077"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Georgia Power said real-time customers cannot avoid take-or-pay costs by cutting their use, so those costs \"should not be included in the credit given for demand response or the cost for taking service,\" and that the contracts' fixed-price benefits go to customers on standard rates \"when the fixed price is below the marginal fuel cost.\"", "cite": ["P-130"]}, {"t": "GIPL said leaving the contracts out is \"appropriate, as incremental RTP load should be assigned the cost of resources that may be dispatched in response to price-sensitive demand.\"", "cite": ["P-100"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Georgia Power said take-or-pay choice 2 \"would be a departure from the marginal fuel cost-based approach approved by the Commission and in place since 2010.\"", "cite": ["P-129"]}, {"t": "PIA Staff had said take-or-pay choice 2 \"is consistent with the 2010 rate case proposal, which assumed that all Georgia power unit and purchase costs would be included in the calculation.\"", "cite": ["P-073"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Georgia Power's estimates for both options are blacked out in the public copy.", "cite": ["P-138", "P-139", "P-140"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How the two take-or-pay choices compare in size, since only choice 2 has a public estimate.", "tag": "analysis", "note": "P-078 and P-079 cover Option 2; P-139 is blacked out"}, {"t": "Whether the fuel credit should count only fuel costs that change with real-time customers' use, or also fixed costs such as these contracts; this is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors take-or-pay choice 2", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that today the credit counts the contracts' energy but not their cost, or that counting both raises it); Mixed (whether the contracts serve all customers or mainly benefit those on standard rates); size public (PIA Staff's estimate; Georgia Power's is blacked out)"}}, {"title": "3. Recover new pipeline fees from large-load customers, split by winter peak (Georgia Power's pipeline plan)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "New large-load pipeline fees would stay off fuel charges; base rates could rise later.", "cite": ["P-055", "P-127", "P-065", "P-061", "P-115", "P-016"]}, {"t": "Georgia Power says large-load growth is a primary driver of these fees, so winter peak demand should set shares.", "cite": ["P-051", "P-056"]}, {"t": "Evidence: Supported; Mixed on the split.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Georgia Power witnesses Ross Beppler, Lee Evans and Brandon Looney filed direct testimony on Aug 14, 2026.", "cite": ["P-041"]}, {"t": "They proposed that new pipeline fees tied to large-load customers \"be fully recovered from those customers and not borne by non-large load customers in the FCR clause.\"", "cite": ["P-055"]}, {"t": "In rebuttal testimony filed Oct 27, 2026, they said pipeline fees are fixed and driven by peak demand, like power plants and power lines, so energy use \"is not an appropriate allocation factor for FT.\"", "cite": ["P-117", "P-126"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that large-load growth is a primary driver of new pipeline fees.", "tag": "analysis", "note": "P-051 (Georgia Power); GIPL (P-101) and GAM (P-113) refer to new pipeline costs attributable to large-load customers; PIA Staff disputes the winter-peak split and treating new fees apart from existing ones (P-082, P-157), not what drives the new fees"}, {"t": "Georgia Power said its split builds on a peak-based showing PIA Staff made in the fuel case, which used a summer peak and which Staff calls \"simply for illustration purposes.\"", "cite": ["P-056", "P-145"]}, {"t": "Georgia Power said its split is fixed in advance, so it covers the new fees tied to large-load customers even if their projects don't materialize.", "cite": ["P-127"]}, {"t": "GIPL also ties pipeline space to peak demand, though it asked the PSC to reject the winter-peak split.", "cite": ["P-104", "P-096"]}, {"t": "GAM, which opposes crediting real-time money to pipeline fees, said the plan \"would ensure that incremental FT costs attributable to new very large load customers are fully recovered from these customers.\"", "cite": ["P-113", "P-110"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "PIA Staff said: \"FT is necessary for all hours across each month in order to reliably serve customers.\"", "cite": ["P-085"]}, {"t": "GIPL agreed that taking new large-customer fees out of the fuel charge \"addresses one problem,\" but it rejected the winter-peak split and said real-time load should not be excused from \"an explicit allocation of FT cost.\"", "cite": ["P-101"]}, {"t": "GAM opposes crediting any specific part of real-time revenue to pipeline fees; card 6 gives its case.", "cite": ["P-110"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "PIA Staff said the plan leaves out existing pipeline fees and \"adds undue complexity.\"", "cite": ["P-082"]}, {"t": "Georgia Power had said it treats existing fees separately because they \"are not driven by large load growth.\"", "cite": ["P-051"]}, {"t": "Georgia Power said its split is \"consistent with the capacity need that drove the incremental generation resources and the allocation in the large load cost model.\"", "cite": ["P-056"]}, {"t": "GIPL said that statement \"is not supported by any available evidence in this or any other related proceeding.\"", "cite": ["P-103"]}, {"t": "GIPL said Georgia Power \"has consistently refused\" to let intervenors review the model, \"not even on a trade secret basis.\"", "cite": ["P-103"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The dollar amounts in Georgia Power's forecast of new pipeline fees are blacked out in the public copy.", "cite": ["P-146"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much new pipeline cost large-load customers will cause, since those amounts are not public.", "tag": "analysis", "note": "P-146"}, {"t": "How to split fixed costs between customer groups is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors Georgia Power's pipeline plan", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that large-load growth is a primary driver of new pipeline fees); Mixed (the winter-peak split: PIA Staff says the fees serve every hour, and GIPL rejects a single winter peak); size blacked out (Georgia Power's forecast)"}}, {"title": "4. Share all pipeline and storage fees by energy use (PIA Staff's pipeline plan)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges would likely fall; base rates could rise later.", "cite": ["P-157", "P-144", "P-061", "P-115", "P-016"]}, {"t": "PIA Staff says the fees serve every hour and its split avoids collecting them twice.", "cite": ["P-085", "P-084"]}, {"t": "Evidence: Supported; Mixed on double recovery and the split.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "PIA Staff witnesses Tom Newsome, Philip Hayet and Leah Wellborn filed testimony on Sep 23, 2026.", "cite": ["P-059", "P-060", "P-160", "P-161"]}, {"t": "They said an energy split \"is consistent with the manner in which fuel costs are recovered\" and with \"how FT costs have been recovered from non-RTP customers over the past 15 years.\"", "cite": ["P-084"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that all pipeline fees are charged to fuel today.", "tag": "analysis", "note": "P-083 (PIA Staff) and P-123 (Georgia Power)"}, {"t": "One reason Staff gives is the risk of double recovery.", "cite": ["P-083"]}, {"t": "Staff said: \"The Company has asserted that a portion of the revenue paid by RTP customers that is currently credited to base revenues is intended to cover some FT costs.\"", "cite": ["P-083"]}, {"t": "Georgia Power's direct testimony says capital substitution, which goes to base rates, covers fixed costs \"including capital costs for baseload or intermediate generation and FT.\"", "cite": ["P-052"]}, {"t": "Staff's recommendation begins \"To eliminate this risk.\"", "cite": ["P-084"]}, {"t": "PIA Staff also said real-time customers use power \"in both high and low load hours.\"", "cite": ["P-081"]}, {"t": "Georgia Power's direct testimony describes the fees as ensuring pipeline availability \"during all periods.\"", "cite": ["P-051"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Georgia Power said Staff's energy split \"does not provide this level of customer protection\" if large projects fall through.", "cite": ["P-127"]}, {"t": "Georgia Power said pipeline fees are \"fixed, driven by peak demand,\" like other large infrastructure costs.", "cite": ["P-126"]}, {"t": "Georgia Power said it would only collect twice \"if it was charging customers for FT costs in both fuel and base rates,\" and that pipeline fees are not in base rates.", "cite": ["P-123"]}, {"t": "GAM opposes crediting any specific part of real-time revenue to pipeline fees; card 6 gives its case.", "cite": ["P-110"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Georgia Power said Staff's energy split \"cannot be reconciled\" with Staff's fuel-case testimony five months earlier, which used a peak-based method.", "cite": ["P-125"]}, {"t": "PIA Staff had said it used that method \"simply for illustration purposes.\"", "cite": ["P-145"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "PIA Staff's yearly estimates for its pipeline plan are blacked out in the public copy.", "cite": ["P-147"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether real-time money on the base side already helps pay these fees is disputed: Georgia Power says it does, GAM says it can, and GIPL says only the capacity part of the real-time price could cover them at peak.", "cite": ["P-124", "P-110", "P-148"]}, {"t": "How to split fixed costs between customer groups is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors PIA Staff's pipeline plan", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that all pipeline fees are charged to fuel today); Mixed (whether that risks double recovery, and whether every-hour use or peak demand should set the split); size blacked out (PIA Staff's yearly estimates)"}}, {"title": "5. Split new pipeline fees the way power-line costs are split (GIPL's pipeline plan)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges would likely fall; base rates could rise later.", "cite": ["P-096", "P-102", "P-144", "P-061", "P-115", "P-016"]}, {"t": "GIPL's testimony says pipelines, like power lines, must meet peaks whenever they occur, so new fees warrant that split until the next rate case.", "cite": ["P-104", "P-096"]}, {"t": "Evidence: Mixed on group effects, peaks.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "GIPL witness John D. Wilson filed direct testimony on Sep 23, 2026.", "cite": ["P-092", "P-152"]}, {"t": "Wilson said pipeline space \"is similar to transmission, in that it is required to meet peak demand conditions whenever and for whatever reason they may occur.\"", "cite": ["P-104"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "GIPL says it \"does matter where these revenues are credited,\" because fuel costs are split by energy use and fixed costs in base rates generally by peak demand, in ratios that differ from group to group.", "cite": ["P-102"]}, {"t": "GIPL says, \"If the ratio of MWh to MW were the same for all classes, I would agree with Georgia Power.\"", "cite": ["P-102"]}, {"t": "GIPL said \"Southern Company does not include FT cost in lambda,\" leaving only the capacity part of the real-time price to cover these costs at peak.", "cite": ["P-148"]}, {"t": "GIPL said its split \"could be made explicitly provisional until the next rate case.\"", "cite": ["P-104"]}, {"t": "Georgia Power's rebuttal also calls pipeline fees \"driven by peak demand,\" and PIA Staff also wants real-time load to carry a pipeline share, split by energy use.", "cite": ["P-126", "P-157"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "By GIPL's account, Georgia Power holds that where the money is credited does not change what each group pays.", "tag": "analysis", "note": "P-102"}, {"t": "Georgia Power proposes a winter-peak split, which it says fits \"the capacity need that drove the incremental generation resources.\"", "cite": ["P-056"]}, {"t": "Georgia Power says intervenors' proposals on cost allocation are changes the PSC \"can and should review in the context of the Company’s next base rate case.\"", "cite": ["P-133"]}, {"t": "PIA Staff said: \"FT is necessary for all hours across each month in order to reliably serve customers.\"", "cite": ["P-085"]}, {"t": "GAM opposes any pipeline share in the credit; card 6 gives its case.", "cite": ["P-110"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Georgia Power's rebuttal says GIPL's witness changed his pipeline advice at a hearing, from the power-line split to an energy-based split.", "cite": ["P-154", "P-155"]}, {"t": "Georgia Power says he made the change because of Georgia Power's later data responses, and it cites hearing transcript pages; the Oct 15 transcript is listed without a file.", "cite": ["P-155", "P-003"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "The dollar amounts in Georgia Power's forecast of new pipeline fees are blacked out in the public copy.", "cite": ["P-146"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Which split GIPL now backs, and whether Georgia Power's capacity values already include pipeline costs.", "tag": "analysis", "note": "P-154, P-155 and P-148"}, {"t": "If they do, GIPL would count pipeline fees against real-time customers in the fuel case or move them to base rates; PIA Staff offers the same move to base rates as its fallback.", "cite": ["P-096", "P-086"]}, {"t": "How to split fixed costs between customer groups is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors GIPL's pipeline plan", "claimType": "factual and values", "evidence": "Mixed (whether where the money is credited changes what each customer group pays: GIPL says it does, and that Georgia Power disagrees); Mixed (whether pipeline space mainly serves peaks whenever they occur, as GIPL says and Georgia Power partly agrees, or every hour, as PIA Staff says); size blacked out (Georgia Power's forecast)"}}, {"title": "6. Credit no real-time money against pipeline fees (GAM)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges keep paying pipeline fees; base rates could stay lower.", "cite": ["P-083", "P-144", "P-061", "P-111", "P-112"]}, {"t": "GAM says the fees are fixed, unlike the marginal-cost real-time rate, so no specific real-time money should offset them.", "cite": ["P-110"]}, {"t": "Evidence: Supported; Mixed on whether real-time money already helps.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "GAM witness Jonathan Ly filed testimony on Sep 23, 2026.", "cite": ["P-153"]}, {"t": "Ly said \"No specific portion of RTP revenues should be credited against FT costs because FT costs are fully fixed costs that affect GPC’s average cost of service.\"", "cite": ["P-110"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that pipeline fees are fixed costs, or that new large-load customers pay access charges.", "tag": "analysis", "note": "P-081 (PIA Staff), P-126 (Georgia Power) and P-110 (GAM) on fixed costs; P-071 (PIA Staff) and P-168 (GAM) on access charges"}, {"t": "GAM said, \"In contrast, RTP is a marginal cost-based rate,\" and that real-time sales \"can contribute to the recovery of these costs\" when system lambda \"exceeds GPC’s average fuel costs.\"", "cite": ["P-110"]}, {"t": "GAM said the pipeline debate \"appears to conflate RTP\" with pricing for new very large customers, who \"will pay access charges that reflect GPC’s incremental costs.\"", "cite": ["P-168"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Georgia Power, PIA Staff and GIPL each propose counting some pipeline fees in the credit.", "cite": ["P-065", "P-157", "P-096"]}, {"t": "GIPL says real-time load should not be excused from \"an explicit allocation of FT cost.\"", "cite": ["P-101"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "GIPL says \"Southern Company does not include FT cost in lambda,\" so whether the real-time price covers pipeline costs is \"questionable.\"", "cite": ["P-148"]}, {"t": "PIA Staff says that counting base-side real-time money toward pipeline fees, while all pipeline fees are charged to fuel, raises \"the possibility of double recovery.\"", "cite": ["P-083"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "No filing we read shows how much real-time money now goes toward pipeline fees.", "tag": "analysis", "note": "GAM's 2025 totals are blacked out (P-112, P-114)"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether pipeline costs belong with real-time pricing at all, or with large-load customers' access charges and base rates; this is partly a values question.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "favors keeping pipeline fees out of the credit (GAM)", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that pipeline fees are fixed, or that new large-load customers pay access charges); Mixed (whether real-time money already helps pay these fees: GIPL calls that questionable); size blacked out (GAM's figures for real-time money on the base side)"}}, {"title": "7. Count more fuel-related costs in the credit (PIA Staff and GIPL)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Counting costs such as coal rail car leases would likely lower fuel charges; base rates could rise later.", "cite": ["P-063", "P-144", "P-061", "P-115", "P-016"]}, {"t": "PIA Staff and GIPL say leaving those costs out makes fuel-charge payers absorb them.", "cite": ["P-063", "P-099"]}, {"t": "Evidence: Supported; Mixed on whether costs shift.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "PIA Staff witnesses Tom Newsome, Philip Hayet and Leah Wellborn filed testimony on Sep 23, 2026.", "cite": ["P-059", "P-060", "P-160", "P-161"]}, {"t": "They said leaving out these costs \"results in non-RTP customers absorbing all these costs.\"", "cite": ["P-063"]}, {"t": "GIPL witness John D. Wilson filed direct testimony on Sep 23, 2026.", "cite": ["P-092", "P-152"]}, {"t": "Wilson said the credit is \"an underestimate of the fuel costs that should be allocated to the incremental load priced at RTP.\"", "cite": ["P-099"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that most costs left out of the credit are paid through the fuel charge.", "tag": "analysis", "note": "P-144 (GIPL), P-063 (PIA Staff), and P-049 and P-124 (Georgia Power)"}, {"t": "For one of them, non-subscription renewable program expenses, the over- or under-recovery is \"determined in base rates per FCR-27 stipulation.\"", "cite": ["P-065"]}, {"t": "PIA Staff said costs like rail car leases are influenced by how much fuel, or what kind, the company buys.", "cite": ["P-149"]}, {"t": "GIPL said coal-related costs \"vary with sustained increases in demand,\" though they are \"fixed\" based on Georgia Power's coal orders, and that if coal use \"increased or decreased by 250%,\" there would be \"some increase or decrease in each of these costs.\"", "cite": ["P-156"]}, {"t": "GIPL said parties in the fuel case raised concerns that the current method, \"which has been applied to data center customers, resulted in higher fuel costs for other customers, in apparent contravention of Georgia Power’s statements that data centers would not be subsidized by existing customers.\"", "cite": ["P-097"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Georgia Power asks the PSC to decline Staff's recommendations, which include these costs.", "cite": ["P-131", "P-065"]}, {"t": "On new large customers, it says their revenues \"pay for the costs the Company incurs to serve them,\" and that it \"has committed to protect existing customers from bearing any of the costs of adding these large customers.\"", "cite": ["P-055", "P-054"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "Georgia Power says Staff's guidelines are \"new policy recommendations for the Commission’s consideration.\"", "cite": ["P-120", "P-117"]}, {"t": "Georgia Power says Staff's guidelines \"are not based on or consistent with cost-allocation best practices, previous Commission policy decisions, or any widely accepted principles.\"", "cite": ["P-120", "P-117"]}, {"t": "Georgia Power says the guidelines should be given no weight.", "cite": ["P-118"]}, {"t": "PIA Staff had said \"costs recovered through the fuel clause should be recovered from all customers,\" and that these costs depend on \"the amount of fuel procured or the type of fuel procured.\"", "cite": ["P-062", "P-149"]}, {"t": "GIPL had said the PSC has held large loads \"to a higher standard when it comes to cost shifting.\"", "cite": ["P-097"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Most single items in PIA Staff's table of left-out costs, including coal costs, are blacked out.", "cite": ["P-150"]}, {"t": "So what these costs alone would add is not public.", "tag": "analysis", "note": "P-150"}, {"t": "The table's public yearly totals are about $741 million in 2023, $824 million in 2024 and $732 million in 2025.", "tag": "computed", "note": "P-150 totals $740,969,011, $824,063,892 and $732,060,350, rounded to the nearest million"}, {"t": "Those totals include take-or-pay and pipeline costs, plus hedging and carrying costs that no party whose testimony we read asks to count.", "cite": ["P-150", "P-089", "P-106", "P-131"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Which of these costs belong in the credit: the two supporters split on some, as GIPL would leave gas resale gains and losses out while PIA Staff would count them.", "cite": ["P-106", "P-087"]}]}], "cardMeta": {"kind": "Documented", "side": "favors counting more costs (PIA Staff and GIPL)", "claimType": "factual and values", "evidence": "Supported (no party whose testimony we could read disputes that most costs left out of the credit are paid through the fuel charge); Mixed (whether that shifts costs, since Georgia Power says real-time customers pay their share through the base side); size (no public estimate of what these costs alone would add)"}}, {"title": "8. Keep other fuel-related costs out of the credit (Georgia Power)", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Fuel charges keep paying most left-out costs; base rates could stay lower.", "cite": ["P-144", "P-063", "P-065", "P-061", "P-124"]}, {"t": "Georgia Power says the real-time rate is \"not intended to recover all embedded costs\" but helps cover fixed costs.", "cite": ["P-121", "P-052", "P-124"]}, {"t": "Evidence: Supported; Mixed on base-side share, peak prices.", "tag": "editorial", "note": "restates the label"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Georgia Power witnesses Ross Beppler, Lee Evans and Brandon Looney filed rebuttal testimony on Oct 27, 2026.", "cite": ["P-117"]}, {"t": "They said the PSC \"should decline to adopt PIA Staff’s recommendations presented in Table 1 and instead preserve the integrity and structure of the RTP rate design, as proposed by the Company in its direct testimony.\"", "cite": ["P-131"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "No party whose testimony we could read disputes that the real-time price is designed as a marginal-cost price, though GIPL says its peak-hour part is set too low.", "tag": "analysis", "note": "P-121 and P-042 (Georgia Power) and P-110 (GAM) on the design; GIPL's P-094 says Georgia Power \"has set its RTP price too low during peak hours\"; PIA Staff's P-075 questions the credit's method, not the price's design"}, {"t": "Georgia Power said \"the RTP rate is by design a marginal cost-based rate that is not intended to recover all embedded costs.\"", "cite": ["P-121"]}, {"t": "Georgia Power said, \"This does not mean that RTP customers do not pay their fair share of system costs or cost to serve.\"", "cite": ["P-121"]}, {"t": "Georgia Power said making real-time allocations more like other customers' \"would undermine the effectiveness and competitive value of RTP as a marginal cost-ba
