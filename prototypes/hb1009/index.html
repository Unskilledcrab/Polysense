<title>Georgia Decisions Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* A phone app first: a pinned app bar, a tab bar with icons, flat cards and lists, and sheets that slide up.
   Wide screens get the same screens in a centered column, with the menu in the top bar.
   The page loads nothing from another host: system fonts, inline icons. */
:root {
  --bg: #f2f2f7; --surface: #ffffff; --sunk: #f1f2f6; --ink: #111418; --muted: #5b6170; --line: #e2e4ea;
  --accent: #1d5a45; --accent-ink: #ffffff; --accent-soft: #e2efe8; --gold: #8a5a00; --gold-soft: #f6ead2;
  --ok: #1f7a45; --ok-soft: #e1f0e6; --warn: #8a5a00; --warn-soft: #f6ead2; --bad: #a33a3a; --bad-soft: #f6e2e2;
  --ins: #1d5a45; --ins-bg: #dcefe4; --del: #a33a3a; --del-bg: #f6e2e2; --unc: #3d5486; --unc-soft: #e6ebf6;
  /* Topic colors mark the subject of a decision, never a side or an option. Checked with the dataviz validator. */
  --t1: #6d4fc9; --t1-ink: #4f35a8; --t1-soft: #efebfb;
  --t2: #b9540a; --t2-ink: #8f3f05; --t2-soft: #fbeee2;
  --t3: #00897b; --t3-ink: #00665b; --t3-soft: #e0f3f0;
  --on-topic: #ffffff; --glass: rgba(242, 242, 247, .88);
  --topic: var(--accent); --topic-ink: var(--accent); --topic-soft: var(--accent-soft);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: var(--font); --font-body: var(--font);
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 16px; --radius-sm: 12px; --shadow: 0 1px 2px rgba(17, 20, 24, .04), 0 4px 14px rgba(17, 20, 24, .05);
  --bar: 48px; --bottom-nav: 56px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0e; --surface: #18191d; --sunk: #222429; --ink: #eceef2; --muted: #a0a5b1; --line: #2c2e35;
  --accent: #7cc9a6; --accent-ink: #0b0c0e; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438;
  --t1: #8f79e6; --t1-ink: #b9aaf2; --t1-soft: #241f3d;
  --t2: #cc7526; --t2-ink: #e9a264; --t2-soft: #33230f;
  --t3: #1aa38c; --t3-ink: #5fd0bc; --t3-soft: #0f2b27;
  --on-topic: #0b0c0e; --glass: rgba(11, 12, 14, .86); --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0c0e; --surface: #18191d; --sunk: #222429; --ink: #eceef2; --muted: #a0a5b1; --line: #2c2e35;
  --accent: #7cc9a6; --accent-ink: #0b0c0e; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438;
  --t1: #8f79e6; --t1-ink: #b9aaf2; --t1-soft: #241f3d;
  --t2: #cc7526; --t2-ink: #e9a264; --t2-soft: #33230f;
  --t3: #1aa38c; --t3-ink: #5fd0bc; --t3-soft: #0f2b27;
  --on-topic: #0b0c0e; --glass: rgba(11, 12, 14, .86); --shadow: none; color-scheme: dark }
.t-school { --topic: var(--t1); --topic-ink: var(--t1-ink); --topic-soft: var(--t1-soft) }
.t-bolt { --topic: var(--t2); --topic-ink: var(--t2-ink); --topic-soft: var(--t2-soft) }
.t-building { --topic: var(--t3); --topic-ink: var(--t3-ink); --topic-soft: var(--t3-soft) }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
a { color: var(--accent) }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.wrap { max-width: 44rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ico { flex: none; display: block }

/* App bar: pinned. Root screens show the name; a decision shows a back button and its topic. */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--glass);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px) }
.bar .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; min-height: var(--bar) }
.bar .lead { display: flex; align-items: center; min-width: 0 }
.brand { font: 800 1.15rem/1 var(--font); letter-spacing: -.01em; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; min-height: 44px }
.brand small { font: 700 .6rem/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 7px }
.back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding-right: 10px; margin-left: -6px; text-decoration: none; color: var(--accent); font-weight: 600; font-size: 1rem; white-space: nowrap }
.back:active { opacity: .5 }
.bartitle { transition: opacity .15s ease; font-weight: 700; font-size: 1rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.bartitle.late { opacity: 0 }
.nav { display: none; justify-self: end; gap: 4px }
.nav a { font-size: .92rem; font-weight: 600; text-decoration: none; color: var(--muted); padding: 8px 10px; border-radius: 10px; min-height: 40px; display: inline-flex; align-items: center; white-space: nowrap }
.nav a[aria-current="page"] { color: var(--ink); background: var(--surface) }

/* Tab bar on phones, within thumb reach */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--glass); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.bottom a { min-height: var(--bottom-nav); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: .68rem; font-weight: 600; line-height: 1.1; text-align: center; padding: 4px }
.bottom a[aria-current="page"] { color: var(--ink) }
.bottom a[aria-current="page"] .ico { stroke-width: 2.5 }
.bottom a:active { opacity: .5 }

/* "What you can do": one button, pinned above the tab bar on every tab of a decision */
.actbar { position: fixed; left: 0; right: 0; bottom: calc(var(--bottom-nav) + env(safe-area-inset-bottom, 0px)); z-index: 6; pointer-events: none;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 55%, transparent) }
.actbar button { pointer-events: auto; width: 100%; max-width: 42rem; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 1rem; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .18) }
.actbar button:active { transform: scale(.98) }

main { padding-block: 8px calc(var(--bottom-nav) + 32px + env(safe-area-inset-bottom, 0px)); overflow-x: clip }
body.has-act main { padding-bottom: calc(var(--bottom-nav) + 104px + env(safe-area-inset-bottom, 0px)) }
@media (min-width: 720px) {
  .nav { display: flex }
  .bottom { display: none }
  .actbar { bottom: 0; padding-bottom: 18px }
  .actbar button { max-width: 22rem }
  main { padding-block: 16px 72px }
  body.has-act main { padding-bottom: 120px }
}

h1, h2, h3, h4 { font-family: var(--font); line-height: 1.2; letter-spacing: -.01em; text-wrap: balance; margin: 0 }
h1 { font-size: 1.5rem; font-weight: 800 }
h2 { font-size: 1.2rem; font-weight: 700 }
h3 { font-size: 1.05rem; font-weight: 700 }
p { margin: 0 }
.screen-title { font-size: 2.1rem; letter-spacing: -.025em }
.eyebrow { font: 700 .72rem/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.lede { color: var(--muted); max-width: 40rem }
.stack { display: flex; flex-direction: column; gap: 14px }
.stack-sm { display: flex; flex-direction: column; gap: 6px }
.stack-lg { display: flex; flex-direction: column; gap: 22px }
.notice { font-size: .88rem; color: var(--muted) }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* Chips and badges */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font-size: .78rem; font-weight: 600; line-height: 1.2; padding: 5px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; max-width: 100%; text-decoration: none; box-shadow: inset 0 0 0 1px var(--line) }
.chip.wrap { white-space: normal; border-radius: 12px; margin: 0; padding: 5px 10px }   /* long chips wrap instead of widening the page */
.chip.law { background: var(--accent-soft); color: var(--accent); box-shadow: none }
.chip.ok { background: var(--ok-soft); color: var(--ok); box-shadow: none }
.chip.warn { background: var(--warn-soft); color: var(--warn); box-shadow: none }
.chip.bad { background: var(--bad-soft); color: var(--bad); box-shadow: none }
.chip.past { background: var(--sunk); color: var(--muted) }
.power { font: 700 .68rem/1 var(--font); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px }
.power::before { content: ""; width: 8px; height: 8px; display: inline-block; border: 2px solid currentColor }
.power.decide { color: var(--accent); background: var(--accent-soft) } .power.decide::before { background: currentColor }
.power.input { color: var(--gold); background: var(--gold-soft) } .power.input::before { border-radius: 50% }
.power.observe { color: var(--muted); background: var(--sunk) } .power.observe::before { border-radius: 50%; background: transparent }
.evlist { list-style: none; margin: .35rem 0 .25rem; padding: 0; display: grid; gap: .3rem }
.evlist li { display: flex; flex-wrap: wrap; gap: .25rem .45rem; align-items: baseline }
.evlist .scope { flex: 1 1 7rem; min-width: 0; font-size: .92rem }
.evpart .evbtn { margin-top: .15rem }

/* Source dots: a small number after each sentence; tap for the exact passage. Tags (our analysis, note, math) are
   squared and dashed. The touch area is larger than the dot. */
.src { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 19px; height: 19px; padding: 0 5px; margin-left: 3px;
  vertical-align: .12em; border: 0; border-radius: 999px; background: var(--surface); color: var(--accent); box-shadow: inset 0 0 0 1px var(--line);
  font: 700 .66rem/1 var(--font); font-variant-numeric: tabular-nums; cursor: pointer }
.src::after { content: ""; position: absolute; inset: -8px -6px }
.src:active { background: var(--accent-soft) }
.src.tag { border-radius: 6px; color: var(--muted); background: transparent; box-shadow: none; border: 1px dashed var(--muted) }
.src.tag.editorial { color: var(--gold); border-color: var(--gold) }
.linkbtn { font-weight: 600; font-size: .88rem; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--sunk); color: var(--ink); cursor: pointer }
.linkbtn:active { background: var(--line) }

/* Labeled fields: the label on its own line, then one sentence per line */
.field { display: flex; flex-direction: column; gap: 4px }
.flabel { font: 700 .72rem/1.3 var(--font); letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.lines li { padding-left: 14px; position: relative }
.lines li::before { content: ""; position: absolute; left: 1px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--topic); opacity: .7 }

/* Cards, lists and rows */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow) }
.home-sec { display: flex; flex-direction: column; gap: 12px }
.home-sec > h2 { display: flex; align-items: baseline; gap: 8px; font-size: 1.3rem; font-weight: 800 }
.home-sec > h2 .count { font: 600 .85rem var(--font); color: var(--muted) }
.go { font-weight: 700; text-decoration: none; justify-self: start; align-self: flex-start; padding: 6px 0; min-height: 40px; display: inline-flex; align-items: center }
.stretch::after { content: ""; position: absolute; inset: 0; border-radius: inherit }
.dcard { position: relative; display: grid; gap: 10px; transition: transform .12s ease }
.dcard:active { transform: scale(.985) }
.dcard .src, .dcard .okline { position: relative; z-index: 1 }
.dtop { display: flex; align-items: center; gap: 10px; min-width: 0 }
.ticon { width: 36px; height: 36px; border-radius: 10px; background: var(--topic); color: var(--on-topic); display: grid; place-items: center; flex: none }
.tlabel { font-weight: 700; font-size: .9rem; color: var(--topic-ink); min-width: 0 }
.pill { margin-left: auto; font: 700 .78rem/1 var(--font); padding: 7px 10px; border-radius: 999px; background: var(--topic-soft); color: var(--topic-ink); white-space: nowrap; font-variant-numeric: tabular-nums }
.dcard h2 { font-size: 1.15rem; line-height: 1.25; text-wrap: pretty }
.dcard h2 a { color: inherit; text-decoration: none }
.dsum { color: var(--muted); font-size: .95rem }
.dfoot { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px }
.dfoot > div { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px }
.okline { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; text-decoration: none; color: var(--ok); min-height: 28px }
.okline.warn { color: var(--warn) }
.upd { font-weight: 600; color: var(--ink) }
.pick.filter { margin-top: -8px }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden }
.row { position: relative; display: flex; gap: 12px; align-items: center; padding: 12px 14px; min-height: 56px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer }
.row + .row, .month + .row { border-top: 1px solid var(--line) }
button.row:active, .row.item:active { background: var(--sunk) }
.rico { width: 32px; height: 32px; border-radius: 9px; background: var(--sunk); color: var(--ink); display: grid; place-items: center; flex: none }
.rbody { flex: 1; min-width: 0; display: grid; gap: 3px }
.rtitle { font-weight: 600 }
.rsub { font-size: .85rem; color: var(--muted) }
.row > .ico { color: var(--muted) }
.row.item { align-items: flex-start; cursor: default }
.row.item .src { z-index: 1 }
.row.item p { font-size: .95rem }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px }
.when { font: 700 .82rem/1.3 var(--font); color: var(--ink); font-variant-numeric: tabular-nums }
.rlink { display: inline-flex; align-items: center; gap: 2px; font-size: .85rem; font-weight: 600; text-decoration: none; color: var(--topic-ink); min-height: 28px }
.dtile { width: 46px; flex: none; border-radius: 10px; background: var(--topic-soft); color: var(--topic-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; padding: 4px 0 }
.dtile span { font: 700 .6rem/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase }
.dtile b { font: 800 1.15rem/1.1 var(--font); font-variant-numeric: tabular-nums }
.dtile.soft { background: transparent; outline: 1.5px dashed var(--topic); outline-offset: -1.5px }   /* "by", "before", "expected": not a fixed day */
.month { padding: 8px 14px; font: 700 .72rem/1.2 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--sunk) }
.row + .month { border-top: 1px solid var(--line) }

/* Decision header and the 30-second box */
.billhead { display: flex; flex-direction: column; gap: 12px; background: var(--topic-soft); border-radius: 20px; padding: 16px }
.billhead h1 { font-size: 1.45rem; text-wrap: pretty }
.billcode { font: 600 .8rem/1.3 var(--font); color: var(--muted) }
.thirty { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px }
.disclose { font-size: .84rem; color: var(--muted); display: flex; gap: 8px; align-items: flex-start }
.disclose::before { content: "i"; font: 700 .75rem/1.35rem var(--font); flex: 0 0 1.35rem; text-align: center; border-radius: 50%; border: 1px solid var(--muted) }

/* Tabs: an underline strip, pinned under the app bar */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar)); z-index: 4;
  margin: 0 -16px; padding: 0 16px; background: var(--glass); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px) }
.tabs::-webkit-scrollbar { display: none }
.tabs a { flex: 0 0 auto; text-decoration: none; color: var(--muted); font-size: .95rem; font-weight: 600; padding: 0 10px; min-height: 46px;
  display: inline-flex; align-items: center; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px }
.tabs a[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--topic) }

/* Workspace content */
.layer { display: flex; flex-direction: column; gap: 16px }
.layer-head { display: flex; flex-direction: column; gap: 4px }
.blocks { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.blocks li { padding-left: 16px; position: relative }
.blocks li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 6px; height: 6px; border-radius: 50%; background: var(--line) }
.blocks.num { counter-reset: n } .blocks.num li { counter-increment: n; padding-left: 26px }
.blocks.num li::before { content: counter(n); width: auto; height: auto; background: none; top: 0; font: 700 .85rem/1.75 var(--font); color: var(--topic-ink) }
.label { font-weight: 700 }
.timeline { display: flex; flex-direction: column; gap: 0; margin: 0 0 0 6px; padding: 0; list-style: none; border-left: 2px solid var(--line) }
.timeline li { padding: 0 0 12px 16px; position: relative }
.timeline li::before { content: ""; position: absolute; left: -7px; top: .4em; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--topic) }
.timeline .when { display: block; color: var(--muted) }
.sub { display: flex; flex-direction: column; gap: 10px }
.options { display: grid; gap: 12px }
.acard { background: var(--sunk); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 8px }

/* Expandable cards (options and arguments) */
details.fold { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow) }
details.fold > summary { list-style: none; cursor: pointer; padding: 16px; display: grid; gap: 8px }
details.fold > summary::-webkit-details-marker { display: none }
details.fold > summary h3 { display: flex; gap: 10px; align-items: flex-start }
details.fold > summary h3::after, details.more > summary::after { content: ""; flex: none; margin: .3em 4px 0 auto; width: 9px; height: 9px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s ease }
details.fold[open] > summary h3::after, details.more[open] > summary::after { transform: rotate(-135deg); margin-top: .55em }
details.fold .hint { font-size: .84rem; color: var(--muted); font-weight: 600 }
details.fold[open] .hint { display: none }
details.fold .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line) }
.meta-line { font-size: .84rem; color: var(--muted) }
.ev { font: 700 .74rem/1.3 var(--font); padding: 5px 8px; border-radius: 6px; border: 1px solid currentColor; display: inline-block }
.ev.supported { color: var(--ok) } .ev.mixed { color: var(--warn) }
.ev.uncertain { color: var(--unc); border-style: dashed } .ev.values { color: var(--muted); border-style: dotted }
.evbtn { font: 700 .78rem/1.2 var(--font); color: var(--accent); background: none; border: 0; padding: 6px 2px; min-height: 32px; cursor: pointer; text-decoration: underline }
.legend { display: grid; gap: 8px }
.legend .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; padding: 0; min-height: 0; cursor: default; border: 0 }
.legend .row p { margin: 0 }

/* Pictures: every figure is drawn from cited data; nothing is to scale unless the source gives amounts */

ill hear applications to intervene, any objections thereto, and any appropriate motions concerning Staff and Intervenors’ pre-filed testimony. Following these motions, the Commission will conduct hearings on Staff and Intervenors’ direct testimony in Docket 57171. October 27, 2026 Georgia Power may file any pre-filed rebuttal testimony in Docket 57171 by 4:00 p.m.", "note": null}, "P-010": {"source": "S02", "locator": "order, section III: November 12, 2026", "text": "November 12, 2026 Beginning after the regularly scheduled Committee Meetings, the Commission will hear applications to intervene, any objections thereto, and any appropriate motions concerning Georgia Power’s pre-filed rebuttal testimony. Following these motions, the Commission will conduct hearings on Georgia Power’s rebuttal testimony.", "note": null}, "P-011": {"source": "S02", "locator": "order, section III: December 2, 2026", "text": "December 2, 2026 All briefs and/or proposed orders shall be filed with the Commission by 4:00 p.m.", "note": null}, "P-012": {"source": "S02", "locator": "order, section III: December 10, 2026", "text": "December 10, 2026 This matter shall be considered at the scheduled Energy Committee Meeting, which begins at 9:30 a.m. and shall be held in the Commission’s hearing room.", "note": null}, "P-013": {"source": "S02", "locator": "order, section III: December 15, 2026", "text": "December 15, 2026 A Final Decision on this proceeding will be made by the Commission on December 15, 2026 at the regularly scheduled Administrative Session.", "note": null}, "P-016": {"source": "S21", "locator": "short order, ordering paragraph 6", "text": "ORDERED FURTHER that the Commission shall further review the methodology by which the Company credits Real-Time Pricing (“RTP”) revenue to the FCR revenues and the allocations the Company is making under such methodology in this Docket. This proceeding shall be concluded by December 31, 2026, and the Commission may make modifications if appropriate. The implementation of such modifications, if any, shall be credited to fuel revenues as determined by the Commission, and any corresponding change to base revenues shall be recorded in a regulatory asset or liability and addressed in the next base rate case.", "note": null}, "P-023": {"source": "S04", "locator": "calendar list: November 12, 2026", "text": "Nov 12 9:30 am Facilities Protection/Telecommunication/Energy And Administrative Affairs Committees 11-12-2026 Nov 12 9:35 am Docket No. 57171 RTP Revenue Credit and Allocation Methodology Hearing 11-12-2026", "note": null}, "P-024": {"source": "S04", "locator": "calendar list: December 10 and 15, 2026", "text": "Dec 10 9:30 am Facilities Protection/Telecommunication/Energy And Administrative Affairs Committees 12-10-2026 Dec 15 9:30 am Administrative Session 12-15-2026", "note": null}, "P-031": {"source": "S19", "locator": "FAQ: How long has the PSC been around? (last sentence)", "text": "Today, five elected Commissioners, supported by approximately 90 staff members, make decisions that affect the lives of every Georgian each time a telephone is picked up, a light is turned on, and a gas burner is used.", "note": null}, "P-044": {"source": "S06", "locator": "p.8, lines 8-11", "text": "The Company’s RTP tariffs are available to commercial and industrial customers with a minimum demand of 250 kilowatts (“kW”) (RTP-DA) or 5 megawatts (“MW”) (RTP-HA). Currently, there are approximately 2,300 customers on RTP-DA and 170 on RTP-HA.", "note": "Rejoined 'RTP-DA', split by a line-end hyphen."}, "P-058": {"source": "S06", "locator": "p.18, lines 2-13", "text": "There are two potential options to address their concern. The first option is to exclude both the costs and the output from non-dispatchable PPAs in the RTP fuel credit calculation. This is consistent with an approach that the RTP fuel credit should be derived from marginal replacement fuel costs. Removing non-dispatchable PPA output (MWh) from the denominator of the RTP fuel credit calculation will increase the RTP fuel credit rate and thus the recording of all RTP revenues to the fuel clause. However, this approach is not based on all Georgia Power generating units running, as originally approved. The second option is to include both the costs and the MWh from non-dispatchable PPAs in the RTP fuel credit calculation. This would break from the marginal fuel cost-based approach approved and in place since 2010 but also result in a larger allocation of RTP revenues to the fuel clause.", "note": "Rejoined 'non-dispatchable', split by a line-end hyphen."}, "P-061": {"source": "S07", "locator": "pp.2-3, why a fuel credit method is needed", "text": "Non-RTP customers, like residential and small commercial customers, are subject to separate rates to collect base revenues and fuel revenues. RTP sales are based on a single rate. RTP revenues must be allocated between base revenues and fuel revenues. The RTP Fuel Credit Methodology is used by the Company to calculate how much RTP revenue to allocate to fuel revenues. The remainder of RTP revenues are allocated to base revenues.", "note": null}, "P-105": {"source": "S08", "locator": "PDF p.32 (testimony p.30), lines 8-11", "text": "This will not result in double-recovery, as the rates charged to RTP customers will not change, just the RTP fuel revenue credit. But it will shift revenue credit from base rates to FCR. This will assist in reducing FCR rates for FCR customers, but may increase base rates for those same customers, depending on how other cost allocation questions are handled.", "note": null}, "P-115": {"source": "S09", "locator": "PDF p.16 (testimony p.13), lines 3-7", "text": "Either of these changes would increase the amount of RTP revenues that are credited to fuel. However, I would note that any increase in the amount of RTP revenues credited to the fuel account will necessarily reduce the RTP revenues currently used to offset GPC’s non-fuel base revenue requirements. Thus, increasing the RTP fuel credit would put upward pressure on base rates.", "note": null}, "P-117": {"source": "S11", "locator": "cover page", "text": "REBUTTAL TESTIMONY OF DR. ROSS BEPPLER, LEE EVANS, AND BRANDON LOONEY IN SUPPORT OF GEORGIA POWER COMPANY’S RTP REVENUE CREDIT AND ALLOCATION METHODOLOGY OCTOBER 27, 2026", "note": null}, "P-144": {"source": "S08", "locator": "PDF p.21 (testimony p.19), lines 20-22", "text": "The RTP Fuel Credit is the process for recording a portion of revenues from incremental load priced at RTP as a credit in the FCR. In other words, FCR customers pay all fuel costs net of the RTP Fuel Credit.", "note": null}, "P-163": {"source": "S14", "locator": "public witness page, contact block", "text": "For more information, contact us at: Georgia Public Service Commission 244 Washington Street, SW Atlanta, Georgia 30334 email: gapsc@psc.state.ga.us fax: 404-463-6683 1-800-282-5813 (outside metro-Atlanta), press 2 404-656-4501 (local), press 2", "note": null}, "P-169": {"source": "S19", "locator": "FAQ: role and responsibility (paragraph 1, first two sentences)", "text": "The Georgia Public Service Commission has exclusive power to decide what are fair and reasonable rates for services under its jurisdiction. It must balance Georgia citizens' need for reliable services and reasonable rates with the need for utilities to earn a reasonable return on investment.", "note": null}, "P-171": {"source": "S19", "locator": "FAQ: role and responsibility (standing committees)", "text": "When regulated companies bring a rate request before the PSC, it may be taken up first by one of the Commission's three standing committees on which the commissioners serve: Telecommunications, Energy, or Administrative Affairs.", "note": null}}, "sources": {"S07": {"title": "PIA Staff: Direct Testimony and Exhibits of Tom Newsome, Philip M. Hayet and Leah J. Wellborn, public disclosure version (2026-09-23)", "publisher": "Georgia Public Service Commission, Public Interest Advocacy Staff", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228948", "retrieved_at": "2026-11-08T07:02:07Z", "sha256": "d19327e10815c7ca5f32ea66e8a1a7bc3eaadfbd1f8a2c072b3d52d4bf9e7ac7", "method": null, "short": "PIA Staff testimony", "why": "The case for take-or-pay choice 2, energy-based pipeline sharing and more costs; Staff's estimates"}, "S04": {"title": "Commission Calendar (list view)", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/agendas-calendars/commission-calendar/", "retrieved_at": "2026-11-08T07:07:10Z", "sha256": "e2e03628b1a00831b56a155f69b5588abf923e7181b406d8c42a3ea572cbd608", "method": null, "short": "PSC calendar", "why": "Meeting times for Nov 12, Dec 10 and Dec 15"}, "S02": {"title": "Procedural and Scheduling Order, Docket 57171 (adopted 2026-07-07)", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/search/facts-document/?documentId=227135", "retrieved_at": "2026-11-08T07:00:45Z", "sha256": "a8b397a87e39877e6e94e34517535a5c6320d321fb63ee099dd7f57dff96bd8e", "method": null, "short": "Schedule order", "why": "The PSC's own schedule and decision date"}, "S08": {"title": "GIPL et al.: Direct Testimony of John D. Wilson, public disclosure version (2026-09-23)", "publisher": "Georgia Interfaith Power & Light, Park Avenue Baptist Church, Temple Sinai, and Unitarian Universalist Church of Savannah", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228952", "retrieved_at": "2026-11-08T07:02:12Z", "sha256": "47521a3c063504b19aec01d5a191c99987d1d3bfd3f58219feb3208c0304e206", "method": null, "short": "GIPL testimony", "why": "The case for take-or-pay choice 1, a power-line-style pipeline split and more costs"}, "S09": {"title": "GAM: Testimony of Jonathan Ly, redacted public version (2026-09-23)", "publisher": "Georgia Association of Manufacturers", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228951", "retrieved_at": "2026-11-08T07:02:14Z", "sha256": "f9e0e836ff374e59149a0466d1ae86bf737d15dd4e940c9a60c8f62d44c37861", "method": null, "short": "GAM testimony", "why": "The base-rate trade-off, its effect by customer group, and GAM's pipeline view"}, "S19": {"title": "PSC FAQs", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/faqs/", "retrieved_at": "2026-11-08T07:08:20Z", "sha256": "0b8e208f57ddc171dfd222568af8cdd70f1b91e78b0658fb38e87bcf4b0667db", "method": null, "short": "PSC FAQ", "why": "How residents can take part, whom to call, and when sessions are open"}, "S21": {"title": "Short Order Adopting Stipulation, Docket 56765 (FCR-27), 2026-05-28", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/search/facts-document/?documentId=226750", "retrieved_at": "2026-11-08T07:09:24Z", "sha256": "83a8b6fb70674d7b3c28f4c7a04f1dd7e1dd939f39241c4ffe3dcb96a62f4854", "method": null, "short": "Fuel order", "why": "The order that started this review and set its deadline"}, "S14": {"title": "Appearing as a Public Witness Before The Georgia Public Service Commission", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/about-the-psc/consumer-corner/consumer-advisories/public-witness/", "retrieved_at": "2026-11-08T07:07:13Z", "sha256": "61789d2c4299e6668f55e17ca6f7694b35086aa0d34743f0f9e952b76d607a44", "method": null, "short": "Public witness", "why": "How residents can take part, whom to call, and when sessions are open"}, "S06": {"title": "Georgia Power: RTP Direct Testimony of Dr. Ross Beppler, Lee Evans and Brandon Looney (2026-08-14)", "publisher": "Georgia Power Company", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=227629", "retrieved_at": "2026-11-08T07:02:04Z", "sha256": "9a1f4ec4ec9ec0b8429817e45ac153fd36f703b1fd08c24d46e11b84ad998fba", "method": null, "short": "Georgia Power testimony", "why": "Today's method, the two take-or-pay choices, the company's pipeline plan"}, "S11": {"title": "Georgia Power: RTP Rebuttal Testimony of Dr. Ross Beppler, Lee Evans and Brandon Looney (2026-10-27)", "publisher": "Georgia Power Company", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=229275", "retrieved_at": "2026-11-08T07:02:18Z", "sha256": "1f62d47f9e1648f02793d68b45e7950c8e30595c662e14b822e799c0531c47e0", "method": null, "short": "Georgia Power rebuttal", "why": "The company's answers to Staff and GIPL, its case for keeping other costs out, and its witnesses' roles"}}, "verification": {"stats": [{"value": "560", "label": "sentences, each tied to a source or labeled as our own analysis"}, {"value": "0", "label": "claims found unsupported by their sources in rounds 2 to 6 and the follow-up checks (round 1 found 1, which we fixed)"}, {"value": "12 of 12", "label": "hidden test errors the fact-checker caught"}, {"value": "4 of 5", "label": "fairness rating from both side reviewers, rounds 4, 5 and 6"}]}}, {"slug": "fulton-budget-2027", "code": "Fulton County · 2027 budget", "title": "Fulton County commissioners must adopt the 2027 budget by their second regular January meeting", "linkText": "Fulton County's 2027 budget", "kind": "budget", "topic": "County budget", "icon": "building", "stage": "open", "updated": "2026-11-13", "trial": "003", "status": [{"text": "Budget Commission draft due by Nov 15, 2026"}, {"text": "Board vote due by its 2nd regular January meeting, expected Jan 20"}], "verified": true, "statusText": "Passed our checks", "lite": true, "workspace": {"sections": [{"id": "summary", "title": "30-second version", "blocks": [{"kind": "bullet", "label": "What's being decided", "units": [{"t": "Fulton County's 2027 budget: what the county spends.", "cite": ["P-005", "P-042"]}]}], "subs": []}]}, "passages": {"P-005": {"source": "S01", "locator": "pp.2-3, Sec. 2-261 as amended, first paragraph (as adopted: struck words dropped)", "text": "Sec. 2-261, - Proposal and adoption of the budget. The budget commission shall submit or cause to be submitted annually to the board of commissioners, by no later than November 15, a proposed budget governing expenditures of all county funds, including capital outlay and public works projects, for the following year. The budget commission’s submission of the proposed budget shall include the budget requests of all of the county's departments, agencies, elected officials and authorities who receive funding from the county through the budget process. This proposed budget will serve, as presented, as the operating budget until a final budget is adopted. The procedures for budget preparation, submission to the governing authority, review by the governing authority, public review, notice, and hearings shall be as provided for in Chapter 81 of Title 36 of the O.C.G.A. [O.C.G.A. § 36-81-1 et seq.]. The budget shall then be adopted by the board of commissioners by no later than the second regular meeting in January of the year to which it applies, which budget, when so adopted by the board of commissioners, shall constitute the board of commissioners' appropriation of all funds for such year.", "note": "Removed the page number '[2]' that falls inside the span at the page break. 'county manager' is struck through on lines 19 and 23 (checked visually on a rendered page image)."}, "P-014": {"source": "S01", "locator": "p.6, lines 25-41, Sec. 2-263(h) Decision-making", "text": "(h) Decision-making; advisory nature. (1) The budget commission shall operate by consensus rather than as a formal voting body as it works toward a joint budgetary presentation to the full board. (2) Where differences arise or consensus on an issue cannot be reached, the County Manager shall determine the best approach forward for presenting a proposed budget to the full board of commissioners. (3) Nothing in this code section shall be construed to grant the budget commission authority to adopt, amend, or approve the County budget. Final authority to adopt the annual budget remains exclusively with the full board of commissioners, consistent with O.C.G.A. § 36-81-1 et seq. and other applicable law.", "note": null}, "P-036": {"source": "S05", "locator": "p.5, item 26-0748 (Public Comment)", "text": "26-0748 Board of Commissioners Public Comment - Citizens are allowed to voice County related opinions, concerns, requests, etc. during the Public Comment portion of the Commission meeting. Priority for public comment will be given to Fulton County citizens and those individuals representing businesses or organizations located within Fulton County, including their employees, whether such persons are commenting in-person, via emails or via Zoom or other electronic media (i.e., phone call). Non-Fulton County citizens will only be heard after all in-person Fulton County citizens, representatives of business and organizations located within Fulton County, including their employees, have been heard and the time allotted for public comment has not expired, except as otherwise provided in this code section. County staff shall verify the residency of each public speaker prior to such person being heard by the board. Speakers will be granted up to two minutes each. Members of the public will not be allowed to yield or donate time to other speakers. The Public Comment portion of the meeting will not exceed sixty (60) minutes at the First Regular Meeting, nor will this portion exceed sixty (60) minutes at the Second Regular Meeting. In the event the 60-minute time limit is reached prior to public comments being completed, public comment will be suspended and the business portion of the BOC meeting will commence. Public comment will resume at the end of the meeting. For more information or to arrange a speaking date, contact the Clerk’s Office.", "note": null}, "P-039": {"source": "S06", "locator": "2026 meeting schedule (whole document)", "text": "FULTON COUNTY BOARD OF COMMISSIONERS 2026 MEETING SCHEDULE FIRST REGULAR MEETINGS SECOND REGULAR MEETINGS Wednesday, January 7, 2026 Wednesday, January 21, 2026 Wednesday, February 4, 2026 Wednesday, February 18, 2026 Wednesday, March 4, 2026 Wednesday, March 18, 2026 Wednesday, April 1, 2026 Wednesday, April 15, 2026 Wednesday, May 6, 2026 Wednesday, May 20, 2026 Wednesday, June 3, 2026 Wednesday, June 17, 2026 *Wednesday, July 15, 2026 *(NO 2ND REGULAR MEETING) (POSTPONEDFROM JULY 1, 2026) Wednesday, August 5, 2026 Wednesday, August 19, 2026 Wednesday, September 2, 2026 Wednesday, September 16, 2026 Wednesday, October 7, 2026 Wednesday, October 21, 2026 Wednesday, November 4, 2026 Wednesday, November 18, 2026 Wednesday, December 2, 2026 Wednesday, December 16, 2026 *Except for the month of July, all meetings will be held on the first and third Wednesdays of each month at 10:00 a.m. in the Fulton County Government Center – Assembly Hall, 141 Pryor Street SW, Atlanta, Georgia. For more information, please contact the Office of the Clerk to the Commission at 404-612-8200 or visit Fulton County’s website at https://www.fultoncountyga.gov/", "note": null}, "P-041": {"source": "S07b", "locator": "proposed 2027 meeting schedule (whole document)", "text": "Fulton County Board of Commissioners Proposed 2027 Meeting Schedule First Regular Meetings Second Regular Meetings Wednesday, January 6, 2027 Wednesday, January 20, 2027 Wednesday, February 3, 2027 Wednesday, February 17, 2027 Wednesday, March 3, 2027 Wednesday, March 17, 2027 *Wednesday, April 14, 2027 Wednesday, April 21, 2027 (Postponed from April 7, 2027) Wednesday, May 5, 2027 Wednesday, May 19, 2027 Wednesday, June 2, 2027 Wednesday, June 16, 2027 *Wednesday, July 14, 2027 *No 2nd Regular Meeting (Postponed from July 7, 2027) Wednesday, August 4, 2027 Wednesday, August 18, 2027 Wednesday, September 1, 2027 Wednesday, September 15, 2027 Wednesday, October 6, 2027 Wednesday, October 20, 2027 Wednesday, November 3, 2027 Wednesday, November 17, 2027 Wednesday, December 1, 2027 Wednesday, December 15, 2027 * Except for the months of April and July, all meetings will be held on the first and third Wednesdays of each month at 10 a.m. in the Fulton County Government Center Assembly Hall, 141 Pryor Street SW, Atlanta, Georgia. For more information, please contact the Office of the Clerk to the Commission at 404-612-8200 or visit Fulton County’s website at www.fultoncountyga.gov", "note": null}, "P-042": {"source": "S08", "locator": "Public Notices page, introduction and newest notice (captured 2026-11-08)", "text": "Public Notices are provided by applicable laws to inform citizens of special meetings, hearings, and other legislative events where a quorum of the Board of Commissioners is probable. Public Notices of the Board also appear in the county legal organ and posted throughout the Government Center, or at the exact meeting site. October 2026 PUBLIC NOTICE Fulton County Budget Commission - SPECIAL CALLED MEETINGS Monday, October 12, 2026, 10 a.m. – 5 p.m. Tuesday, October 13, 2026, 9 a.m. – 5 p.m. Wednesday, October 14, 2026, 9 a.m. – 5 p.m. Monday, October 19, 2026, 9 a.m. – 5 p.m. Tuesday, October 20, 2026, 9 a.m. – 4:30 p.m. Thursday, October 22, 2026, 9 a.m. – 5 p.m. Fulton County Government Center 141 Pryor Street, SW, Atlanta, GA 30303, Suite 3077A Special called meetings of the Fulton County Budget Commission will be conducted on the dates and locations provided above for the purpose of holding budget hearings for Fulton County’s 2027 General Fun })();
