ACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!46: A=Jun | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!47: A=Jul | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!48: A=Aug | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!49: A=Sep | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!50: A=Oct | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!51: A=Nov | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!52: A=Dec | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!53: A=Annual Total | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED", "note": null}, "P-140": {"source": "S06b", "locator": "GIPL-1-2 Attachment B (Option 2), sheet Impact, rows 38-52", "text": "Impact!38: A=Additional Fuel Revenue Impact!39: B=2026 | C=2027 | D=2028 | E=2029 | F=2030 | G=2031 Impact!40: A=Jan | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!41: A=Feb | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!42: A=Mar | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!43: A=Apr | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!44: A=May | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!45: A=Jun | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!46: A=Jul | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!47: A=Aug | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!48: A=Sep | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!49: A=Oct | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!50: A=Nov | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!51: A=Dec | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED Impact!52: A=Annual Total | B=REDACTED | C=REDACTED | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED", "note": null}, "P-141": {"source": "S06b", "locator": "response GIPL-1-4", "text": "Please see GIPL-1-4 Attachment which shows the estimated rate impact for a typical residential customer using an average of 1,000 kWh a month resulting from a change in $100 million dollars of total revenue requirements for base rates and fuel rates, respectively, based on the Company’s approved rate adjustments from the 2026 Storm Cost Recovery and FCR-27 proceedings in Docket Nos. 44280 and 56765.", "note": null}, "P-142": {"source": "S06b", "locator": "GIPL-1-4 Attachment, sheet Fuel, rows 1-4", "text": "Fuel!1: A=Typical Residential Customer Impact Fuel!2: B=Fuel Revenue Requirement | C=Typical Residential Bill Impact Fuel!3: A=Fuel Rate Case (FCR-27) | B=-394410523.46714401 | C=-5.8395791109699644 Fuel!4: A=Per $100M Revenue Requirement | B=-100000000 | C=-1.4805840015717595", "note": null}, "P-143": {"source": "S06b", "locator": "GIPL-1-4 Attachment, sheet Base, rows 1-4", "text": "Base!1: A=Typical Residential Customer Impact Base!2: B=Base Revenue Requirement | C=Typical Residential Bill Impact Base!3: A=Storm Recovery | B=109148009.35882437 | C=1.7992416115978074 Base!4: A=Per $100M Revenue Requirement | B=100000000 | C=1.6484419845741718", "note": null}, "P-144": {"source": "S08", "locator": "PDF p.21 (testimony p.19), lines 20-22", "text": "The RTP Fuel Credit is the process for recording a portion of revenues from incremental load priced at RTP as a credit in the FCR. In other words, FCR customers pay all fuel costs net of the RTP Fuel Credit.", "note": null}, "P-145": {"source": "S07", "locator": "p.19, Staff's earlier 1-CP illustration", "text": "As a preliminary matter, in FCR-27 Staff relied on the summer peak 1-CP allocation simply for illustration purposes to demonstrate the magnitude of the FT issue that needed further consideration.", "note": null}, "P-146": {"source": "S06b", "locator": "STF-1-1 Attachment (new FT cost allocation), rows 1-14", "text": "STF-1-1 Attachment!1: A=New FT Cost Allocation STF-1-1 Attachment!2: A=(Amounts in Thousands) STF-1-1 Attachment!4: B=2025 | C=2026 | D=2027 | E=2028 | F=2029 | G=2030 | H=2031 STF-1-1 Attachment!5: A=New Natural Gas FT STF-1-1 Attachment!6: A=Yates CT Units 8-10 | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!7: A=Santa Rosa CC | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!8: A=Bowen CC Units 7-8 | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!9: A=Wansley CC Units 10-11 | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!10: A=McIntosh CC Units 10-11 Upgrade | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!11: A=McIntosh CC Unit 12 | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!12: A=FT for Future Generation | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!13: A=Estimated FT Sale Proceeds | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED STF-1-1 Attachment!14: A=Total | D=REDACTED | E=REDACTED | F=REDACTED | G=REDACTED | H=REDACTED", "note": null}, "P-147": {"source": "S07", "locator": "p.20, Table 8 (forecast pipeline and storage allocation)", "text": "Calendar Year | RTP Allocation on MWh 2026 | …………… 2027 | …………… 2028 | …………… Total | ……………", "note": null}, "P-148": {"source": "S08", "locator": "PDF p.26 (testimony p.24), lines 3-8", "text": "Q: SO DOES THE RTP RATE RECOVER FT COSTS? A: This is questionable. It is clear that Southern Company does not include FT cost in lambda, so this leaves the reliability capacity cost component of the RTP rate as the only source of revenues that could cover these costs during peak hours. As discussed above, it is not clear whether or not FT or any other type of fixed fuel delivery cost is, in fact, included in Georgia Power’s marginal value of capacity.", "note": null}, "P-149": {"source": "S07", "locator": "p.24, fuel-related fixed costs", "text": "The following table includes costs that are fuel related. The costs are influenced either by the amount of fuel procured or the type of fuel procured and therefore are appropriately assigned to all customers.", "note": null}, "P-150": {"source": "S07", "locator": "p.22, Table 9 and the note after it", "text": "Cost Categories | 2023 | 2024 | 2025 Natural gas firm transportation | …………… | …………… | …………… Natural gas storage | …………… | …………… | …………… Natural gas hedging gains/losses | $125,452,642 | $114,485,201 | $ 33,624,570 Natural gas (gains)/losses on resales | …………… | …………… | …………… Coal quality penalties and premiums | …………… | …………… | …………… Coal rail car lease | …………… | …………… | …………… Rail car shortfall/liquidated damages costs | …………… | …………… | …………… Start-up costs for Purchase Power Agreements (PPAs) | …………… | …………… | …………… Energy costs associated with non-dispatchable PPAs | …………… | …………… | …………… FCR over/under-balance carrying costs | $85,170,004 | $67,176,525 | $ 32,162,634 Income Qualified Discount (IQD) program costs | …………… | …………… | …………… Net Renewable Program (Revenues)/Expenses | …………… | …………… | …………… Corporate overhead and labor | $5,823,840 | $5,912,128 | $ 5,683,474 Total Company Costs | $740,969,011 | $824,063,892 | $732,060,350 To be clear, these are total costs incurred by the Company. Only a portion of these costs would be credited to fuel revenues under Staff’s recommendations as shown in Tables 2, 5 and 7.", "note": null}, "P-151": {"source": "S07", "locator": "footnote 3", "text": "[footnote 3] Docket No. 57171 (RTP Investigation) Transcript, Tuesday, September 1, 2026, p. 105, ln. 14-15", "note": null}, "P-152": {"source": "S08", "locator": "PDF p.2 (cover page)", "text": "DIRECT TESTIMONY OF JOHN D. WILSON ON BEHALF OF GEORGIA INTERFAITH POWER & LIGHT, PARK AVENUE BAPTIST CHURCH, TEMPLE SINAI, AND UNITARIAN UNIVERSALIST CHURCH OF SAVANNAH September 23, 2026 PUBLIC DISCLOSURE VERSION", "note": null}, "P-153": {"source": "S09", "locator": "PDF p.1 (cover page)", "text": "REDACTED – PUBLIC VERSION Testimony of Jonathan Ly On Behalf of Georgia Association of Manufacturers September 23, 2026", "note": null}, "P-154": {"source": "S11", "locator": "section III, GIPL's position on pipeline costs", "text": "GIPL’s position has proven equally unstable: it recommended a 4-CP allocator, also demand-based, in its testimony one month ago, yet appeared to abandon that position at the evidentiary hearing in favor of an energy basis.", "note": null}, "P-155": {"source": "S11", "locator": "footnote 8", "text": "[footnote 8] GIPL witness Wilson testified that as a result of the Company’s data request responses filed subsequent to his direct testimony, he changed his recommendation from transmission allocation to an energy allocation. Tr. 421, 458-59.", "note": null}, "P-156": {"source": "S08", "locator": "PDF p.30 (testimony p.28), lines 3-9", "text": "Coal-related costs are one type of fixed fuel costs that vary with sustained increases in demand, including coal quality penalties and premiums, coal rail car lease, and rail car shortfall/liquidated damages costs. While these costs are “fixed” based on Georgia Power’s orders for coal deliveries, it is clearly the case that if coal use increased or decreased by 250%, then there would be some increase or decrease in each of these costs as Georgia Power adjusted the volume of coal delivery orders from suppliers and transportation providers.", "note": "Removed footnote number 36, which the text layer fuses to the final word."}, "P-157": {"source": "S07", "locator": "p.20, summary of Staff's pipeline and storage recommendation", "text": "Staff recommends the Company’s RTP fuel credit methodology allocate all natural gas FT and storage costs on a monthly basis, without distinguishing between existing and new fixed FT costs. Staff recommends the allocation be performed monthly and all FT costs be allocated on an energy basis to all customers (both RTP and non-RTP), consistent with the current treatment of existing FT costs for non-RTP customers.", "note": null}, "P-158": {"source": "S12", "locator": "motion, first item on the list of testimony to strike", "text": "Page 2, Line 16 through the word “Second,” on Page 3, Line 14.[fn2] This testimony offers recommendations regarding the reliability and transmission cost components of the RTP rate.", "note": null}, "P-159": {"source": "S14", "locator": "public witness page, paragraph 2", "text": "Testimony is given by witnesses on behalf of staff, intervenors and the company, as well as by public witnesses.", "note": null}, "P-162": {"source": "S10", "locator": "document page for filing 228918", "text": "Document Filing #228918 Company Name: Resource Supply Management Description: Jim Clarkson Direct Testimony Filed Date: 9/22/2026", "note": null}, "P-163": {"source": "S14", "locator": "public witness page, contact block", "text": "For more information, contact us at: Georgia Public Service Commission 244 Washington Street, SW Atlanta, Georgia 30334 email: gapsc@psc.state.ga.us fax: 404-463-6683 1-800-282-5813 (outside metro-Atlanta), press 2 404-656-4501 (local), press 2", "note": null}, "P-164": {"source": "S07", "locator": "footnote 11", "text": "[footnote 11] Georgia Power’s RTP rates include RTP Day Ahead (“RTP-DA”), RTP Hour Ahead (“RTP-HA”), Time of Use – Supplier Choice – Monthly Access Charge (“TOU-SC MAC”), and Electric Arc Furnace (“EAF”).", "note": null}, "P-165": {"source": "S11", "locator": "section I, witness Beppler", "text": "Ross Cannon Beppler, PhD. I am the Director of Pricing and Rates for Georgia Power Company (“Georgia Power” or the “Company”).", "note": null}, "P-166": {"source": "S11", "locator": "section I, witness Evans", "text": "Lee Evans. I am the Vice President of Pricing and Revenue Strategy for Georgia Power.", "note": null}, "P-167": {"source": "S11", "locator": "section I, witness Looney", "text": "Michael “Brandon” Looney. I am the Director of Demand Planning and Analysis for Southern Company Services (“SCS”).", "note": null}, "P-168": {"source": "S09", "locator": "PDF p.13 (testimony p.10), lines 16-22", "text": "The discussion surrounding FT costs in this proceeding appears to conflate RTP and the pricing for service applicable to new very large load (i.e., 100 megawatts and larger) customers. However, the only overlap is that these customers may elect to have all or a portion of their load served through RTP. In addition to RTP, new very large load customers will pay access charges that reflect GPC’s incremental costs. Except for the fact that RTP is a component of the overall cost to serve new very large load customers, the allocation and recovery of FT costs are entirely unrelated to RTP.", "note": null}}, "sources": {"S01": {"title": "Docket 57171 page: RTP Revenue Credit and Allocation Methodology", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/search/facts-docket/?docketId=57171", "retrieved_at": "2026-11-08T07:00:09Z", "sha256": "db401d43c6c69c4954fb2c69dda4d4cd0f1bcd66925ef71cdabb6eeb6336906a", "method": null, "short": "Docket", "why": "Official title, status and dated list of every filing"}, "S01b": {"title": "Docket 57171 filing list (the JSON the docket page itself requests)", "publisher": "Georgia Public Service Commission", "type": "primary-government", "typeLabel": "Primary · government", "url": "https://psc.ga.gov/search/service-facts-docket/?docketId=57171&sortDirection=DESC&sortColumn=Filed&searchText=&pageSize=50&pageNumber=1", "retrieved_a he case for take-or-pay choice 2, energy-based pipeline sharing and more costs; Staff's estimates"}, "S08": {"title": "GIPL et al.: Direct Testimony of John D. Wilson, public disclosure version (2026-09-23)", "publisher": "Georgia Interfaith Power & Light, Park Avenue Baptist Church, Temple Sinai, and Unitarian Universalist Church of Savannah", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228952", "retrieved_at": "2026-11-08T07:02:12Z", "sha256": "47521a3c063504b19aec01d5a191c99987d1d3bfd3f58219feb3208c0304e206", "method": null, "short": "GIPL testimony", "why": "The case for take-or-pay choice 1, a power-line-style pipeline split and more costs"}, "S09": {"title": "GAM: Testimony of Jonathan Ly, redacted public version (2026-09-23)", "publisher": "Georgia Association of Manufacturers", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228951", "retrieved_at": "2026-11-08T07:02:14Z", "sha256": "f9e0e836ff374e59149a0466d1ae86bf737d15dd4e940c9a60c8f62d44c37861", "method": null, "short": "GAM testimony", "why": "The base-rate trade-off, its effect by customer group, and GAM's pipeline view"}, "S10": {"title": "Resource Supply Management: Direct Testimony of Jim Clarkson (filed 2026-09-22)", "publisher": "Resource Supply Management", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.ga.gov/search/facts-document/?documentId=228918", "retrieved_at": "2026-11-08T07:02:16Z", "sha256": "5fbf0ddef110692b59154caee4418500e9b7fb7a5d50a62a6f132a89898c6868", "method": null, "short": "Resource Supply Management", "why": "Which party Jim Clarkson's testimony is for (the testimony itself is a scan)"}, "S11": {"title": "Georgia Power: RTP Rebuttal Testimony of Dr. Ross Beppler, Lee Evans and Brandon Looney (2026-10-27)", "publisher": "Georgia Power Company", "type": "party-filing", "typeLabel": "Party filing", "url": "https://psc.g sources. Separate AI checkers, which never saw the drafting, then checked it in rounds. In this trial, no person checked the facts. Here is what the checkers did, what they found, and what is still open.", "stats": [{"value": "556", "label": "sentences, each tied to a source or labeled as our own analysis"}, {"value": "0", "label": "claims found unsupported by their sources in rounds 2 to 6 and the follow-up checks (round 1 found 1, which we fixed)"}, {"value": "12 of 12", "label": "hidden test errors the fact-checker caught"}, {"value": "4 of 5", "label": "fairness rating from both side reviewers, rounds 4, 5 and 6"}], "sections": [{"title": "What we checked", "paras": ["Each round runs the same checks. A page passes a round only when every check passes. After that, we fix only sentences that misstate a source or break our writing rules, and a fresh checker looks again at just those sentences. If a fix changes an evidence label, the whole panel checks the page again."], "head": ["Check", "What it does", "Pass mark"], "rows": [["Automatic checks", "Code confirms that every sentence cites a source passage or is labeled as our analysis, that quotes match word for word, that numbers appear in the cited passage, that \"no party disputes\" claims are limited to what we could read, that saved files match their fingerprints, and that the reading level is about grade 8 or lower.", "No errors"], ["Blind fact-check", "A separate AI checker sees only this page and the source passages. For each sentence it must copy the exact words that support it, and code confirms those words are really there.", "No unsupported claims"], ["Fairness panel", "Three more AI checkers. One speaks up for Georgia Power's and the manufacturers' positions, one for the PSC's public-interest staff and the advocacy groups, and a neutral editor checks the rules. The editor also asks of each sentence: would we write it the same way about another party?", "Both side reviewers give at least 4 of 5, and no serious problem"], ["Testing the fact-checker", "We hid 12 errors in a copy of the page, such as a wrong number, a quote credited to the wrong party and a wrong deadline time. The fact-checker had to find them without knowing they were there.", "At least 9 of every 10 caught"]]}, {"title": "What each round found", "paras": ["This case has five parties and several separate questions, so it took longer than our other trials. After round 1, no fact-check found a claim its sources didn't support. The reviewers' concerns moved from missing points, to which side's numbers were shown, to one summary line, and then to labels."], "head": ["Round", "Fact-check", "Georgia Power and manufacturers' reviewer", "Staff and advocacy groups' reviewer", "Editor (neutral, clear)", "Result"], "rows": [["1", "197 supported, 28 partly, 1 unsupported", "3 of 5", "3 of 5", "3, 3", "Failed. One claim wasn't supported by its source, and the editor found 4 serious problems"], ["2", "289 supported, 7 partly, 0 unsupported", "3 of 5", "3 of 5", "3, 3", "Failed. Each reviewer found missing points for its own side"], ["3", "321 supported, 5 partly, 0 unsupported", "3 of 5", "4 of 5", "4, 3", "Failed. Only the fuel side of a shift had dollar figures, and every evidence label came out \"Mixed\""], ["4", "310 supported, 11 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 3", "Failed. The editor found one serious problem in the 30-second summary"], ["5", "315 supported, 10 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 3", "Passed. Our accuracy fixes then changed three evidence labels, so the whole panel checked again"], ["6", "322 supported, 7 partly, 0 unsupported", "4 of 5", "4 of 5", "4, 3", "Passed. We then fixed every sentence that said more than its source"], ["Follow-up", "13 changed sentences, then 7, then 1: none unsupported", "", "", "", "Passed. The page you see is this version"]]}, {"title": "What's still open", "paras": ["These suggestions would change a card, a label or the balance between parties, so they wait for the next full round. Some contradict each other; we list every view rather than pick one quietly."], "items": ["Reviewers disagree about card 5's label. One says the record shows Georgia Power disputing its first point; one says that rests only on the advocacy group's account of Georgia Power; one says no filing we could read disputes it.", "Reviewers disagree about whether the advocacy group's claim that the peak price is set too low belongs on Georgia Power's card, since the group calls rate design outside this case and Georgia Power has asked to strike it.", "Each side's reviewer listed points from the record that could strengthen its cards, and asked that its opponents' replies sit in the same fields on every card.", "The top of the page and the evidence labels are longer than our budgets, and some technical terms remain.", "The parties file briefs on Dec 2, and the PSC is scheduled to decide on Dec 15. This page must be revised as those come in."]}, {"title": "What this can't do", "paras": ["All the checkers are AI, like the writer, so they may share blind spots. Hiding test errors measures only the kinds of errors we thought to hide.", "The checkers compare this page with the sources we saved. They can't tell what is missing from those sources. Some figures and words in the filings are blacked out, one party's testimony is a scan we couldn't use, and one hearing transcript isn't posted."]}, {"title": "See every report", "paras": ["Every check, report and fix is public in the project's repository, in trials/002-psc-57171-fuel-credit/verification.md."]}]}, "audiences": ["Home", "Business, standard rates", "Business, real-time prices", "EMC or city utility"], "visuals": {"bill": {"title": "Two parts of a Georgia Power bill, if the PSC adopts a proposed plan", "units": [{"t": "No filing we read gives the size of either change for a home, as of Nov 8, 2026.", "tag": "editorial", "note": "scoped to the filings we read"}], "parts": [{"name": "Fuel charge", "dir": "down", "units": [{"t": "Would likely drop.", "cite": ["P-144", "P-058"]}]}, {"name": "Base rates", "dir": "up", "units": [{"t": "Could rise later, in a future rate case.", "cite": ["P-115", "P-016"]}]}]}, "seats": {"total": 5, "vacant": 0, "units": [{"t": "The PSC's five commissioners make the final decision.", "cite": ["P-013", "P-029", "P-031"]}]}}}, {"slug": "fulton-budget-2027", "code": "Fulton County · 2027 budget", "title": "Fulton County commissioners must adopt the 2027 budget by their second regular January meeting", "linkText": "Fulton County's 2027 budget", "kind": "budget", "trial": "003", "status": [{"text": "Budget Commission draft due by Nov 15, 2026"}, {"text": "Board vote due by its 2nd regular January meeting, expected Jan 20"}], "optionChips": {"Option A": {"text": "Draft due Nov 15"}, "Option B": {"text": "Board can add or cut money"}, "Option C": {"text": "Set aside (filed) Nov 4"}}, "verified": false, "statusText": "1 sentence waiting for a check", "disclosure": "Drafted with AI help from the archived sources below. Every sentence links to its source or is labeled as our analysis. This draft has not passed our checks yet; see how we checked it. This is a test page; no person reviewed it.", "revisionLabel": "version 5.4 · fingerprint 2f92576329be", "workspace": {"sections": [{"id": "summary", "title": "30-second version", "blocks": [{"kind": "bullet", "label": "What's being decided", "units": [{"t": "Fulton County's 2027 budget: what the county spends.", "cite": ["P-005", "P-042"]}, {"t": "Fulton County's Board of Commissioners, a chairman and six district seats, decides.", "cite": ["P-014", "P-035"]}, {"t": "A Budget Commission of two commissioners and two staff must propose the budget by Nov 15.", "cite": ["P-005", "P-008"]}, {"t": "The commission's makeup and a limit on requests to 5% above current funding are disputed.", "tag": "analysis", "note": "Commissioner Barrett and six justice officials object to the makeup 7 funding for the jail, courts, prosecutors and public defender's office isn't known as of Nov 8, 2026.", "tag": "analysis", "note": "the budget page on Nov 8 had no 2027 proposal (P-045)"}, {"t": "Six of their leaders asked for more money.", "cite": ["P-069", "P-070"]}, {"t": "What the draft funds isn't known.", "tag": "analysis", "note": "the 2027 proposal wasn't on the county's budget page on Nov 8 (P-045)"}, {"t": "Adoption is due by the second regular January meeting, expected Jan 20, 2027.", "cite": ["P-005", "P-041"]}]}], "subs": [{"title": "Where the money comes from", "blocks": [{"kind": "num", "label": null, "units": [{"t": "The General Fund is the county's biggest fund: $1,057,100,578 in the 2026 budget.", "cite": ["P-052", "P-054"]}, {"t": "The county's other funds are \"specialty funds,\" such as for water and the airport.", "cite": ["P-045", "P-052"]}]}, {"kind": "num", "label": null, "units": [{"t": "Property tax is the General Fund's biggest source of money: $834,032,152 in the 2026 budget.", "cite": ["P-054", "P-101"]}]}, {"kind": "num", "label": null, "units": [{"t": "The county's property tax billing comes from the value of taxable property and the tax rate, called the millage rate.", "cite": ["P-102"]}]}, {"kind": "num", "label": null, "units": [{"t": "The General Fund pays for the sheriff, who runs the jail, and for the courts, libraries and senior services.", "tag": "analysis", "note": "P-054 lists these under General Fund spending; P-060 ties the sheriff's staff to the jail"}]}, {"kind": "num", "label": null, "units": [{"t": "In 2026, the plan spends $73,637,614 more than it expects to take in, using savings, which the budget calls \"fund balance.\"", "cite": ["P-054"]}]}], "cardMeta": null}, {"title": "Decided now, and decided later", "blocks": [{"kind": "bullet", "label": "Now", "units": [{"t": "The Board adopts the 2027 budget, which sets county spending, by its second regular meeting in January 2027.", "cite": ["P-005", "P-041"]}]}, {"kind": "bullet", "label": "Later", "units": [{"t": "The property tax rate has its own decision.", "tag": "analysis", "note": "in the 2026 cycle, the rate was a separate decision, planned for after the budget (P-046, P-098, P-101)"}, {"t": "In 2026, the Board adopted the budget on Jan 21 and scheduled a hearing on the proposed tax rate for Sept 30.", "cite": ["P-046", "P-098"]}]}, {"kind": "bullet", "label": "Later", "units": [{"t": "Changes to the adopted budget during the year need a formal Board vote at an advertised regular meeting.", "cite": ["P-006"]}]}, {"kind": "bullet", "label": "Already decided", "units": [{"t": "Who sits on the Budget Commission for the 2027 budget, approved Aug 19, 2026.", "cite": ["P-021", "P-022"]}]}], "cardMeta": null}, {"title": "Not known yet", "blocks": [{"kind": "bullet", "label": "How much the county will spend in 2027, and on what", "units": [{"t": "not known as of Nov 8, 2026, because the proposal wasn't on the county's budget page.", "tag": "analysis", "note": "P-045, captured Nov 8, 2026; the proposal is due by Nov 15 (P-005)"}]}, {"kind": "bullet", "label": "Whether your property tax bill will change", "units": [{"t": "not known as of Nov 8, 2026, because the 2027 tax rate isn't set and the proposal wasn't on the county's budget page.", "tag": "analysis", "note": "P-045; in the 2026 cycle the rate was planned for after the budget (P-098, P-101), and bills also depend on property values (P-102)"}]}, {"kind": "bullet", "label": "When the Board will hold its budget hearing and vote", "units": [{"t": "not known as of Nov 8, 2026; the newest notice was for the Budget Commission's October hearings.", "tag": "analysis", "note": "P-042, captured Nov 8, 2026"}]}, {"kind": "bullet", "label": "Why the 5% limit was set", "units": [{"t": "not known as of Nov 8, 2026; the minutes we archived record no reason, and we didn't review the meeting video.", "tag": "analysis", "note": "P-088 and P-092; see sources.yaml, S16"}]}], "cardMeta": null}]}, {"id": "overview", "title": "Layer 1: Participate", "blocks": [], "subs": [{"title": "What you can do", "blocks": [{"kind": "bullet", "label": "Input", "units": [{"t": "Speak during public comment at a Board meeting, in person or by Zoom.", "cite": ["P-067"]}, {"t": "Zoom comments and requests to speak in person must be submitted before the meeting starts at 10 a.m.", "cite": ["P-067"]}, {"t": "The Clerk to the Commission keeps the Board's records, such as its agendas and minutes.", "cite": ["P-097"]}, {"t": "The archived text of the Clerk's web page doesn't say where to submit comments or requests.", "tag": "analysis", "note": "P-067 is the public-comment text we archived from that page"}, {"t": "To ask, or to arrange a speaking date, call the Office of the Clerk to the Commission at 404-612-8200.", "cite": ["P-036", "P-039"]}, {"t": "Staff check each speaker's residency, and people from Fulton County and its businesses and groups go first.", "cite": ["P-036"]}, {"t": "Each speaker gets up to two minutes.", "cite": ["P-036"]}, {"t": "Public comment lasts up to 60 minutes; if speakers remain, it resumes at the end of the meeting.", "cite": ["P-036"]}]}, {"kind": "bullet", "label": "Input", "units": [{"t": "The meeting rules also mention comments sent by email or by phone, but the Clerk's page lists only in person and Zoom.", "cite": ["P-036", "P-067"]}, {"t": "Call the Clerk's office to ask how to send a written comment.", "tag": "editorial", "note": "suggested action; see README, D9"}]}, {"kind": "bullet", "label": "Input", "units": [{"t": "The Clerk's Public Notices page is at fultoncountyga.gov/Commissioners/Clerk-to-the-Commission/Public-Notices.", "cite": ["P-100", "P-039"]}, {"t": "Watch that page for the budget hearing, and take part.", "tag": "editorial", "note": "suggested action; a hearing came before adoption in the 2026 cycle as state law requires (P-047), and the county posts hearing notices there (P-042)"}]}, {"kind": "bullet", "label": "Input", "units": [{"t": "Tell Board members what the budget should fund, cut or keep the same.", "tag": "editorial", "note": "suggested action; the full Board adopts the budget (P-014)"}, {"t": "You can also say what you think of how the budget is being prepared.", "tag": "editorial", "note": "suggested action"}, {"t": "The chairman represents the whole county, and each other member represents one district.", "tag": "analysis", "note": "P-035 lists the chairman as \"At-Large\" and the others by district"}, {"t": "This page can't look up your district.", "tag": "editorial", "note": ""}, {"t": "The county's website links a Commission District Finder at fultoncountyga.gov/Commission-District-Finder.", "cite": ["P-099", "P-039"]}, {"t": "The District 4 seat is vacant, so people there can contact the chairman.", "tag": "analysis", "note": "P-035 lists District 4 as \"Vacant\" and the chairman as \"At-Large\""}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "Read the proposal when it comes out; a copy goes to the Clerk to the Commission the day it is submitted.", "cite": ["P-006"]}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "Read the two resolutions behind the dispute.", "cite": ["P-001", "P-027"]}, {"t": "Resolution 26-0460 set up the commission, and Resolution 26-0729 sought to remove the 5% limit.", "cite": ["P-001", "P-017", "P-024", "P-027"]}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "Read the 2026 adopted budget book on the county's budget page.", "cite": ["P-045", "P-046"]}, {"t": "The book includes the budget message sent with the proposal, and a table of the General Fund's money in and out.", "cite": ["P-046", "P-054"]}]}, {"kind": "bullet", "label": "Observe", "units": [{"t": "Several offices' own 2027 budget presentations are on the county's data website, data.fultoncountyga.gov, including the sheriff's and public defender's.", "cite": ["P-055", "P-056", "P-057", "P-058", "P-094", "P-095"]}, {"t": "The public defender's office defends people charged with crimes who can't afford a lawyer.", "tag": "analysis", "note": "plain-language definition"}]}, {"kind": "bullet", "label": null, "units": [{"t": "If you need a disability accommodation to take part, call the Clerk to the Commission at 404.612.8200.", "cite": ["P-067"]}]}], "cardMeta": null}, {"title": "Who decides, and how to reach them", "blocks": [{"kind": "bullet", "label": "Fulton County Board of Commissioners", "units": [{"t": "adopts the budget, and only the full Board can.", "cite": ["P-014"]}, {"t": "On the Nov 4 agenda, the Board had a chairman, who serves at large, and six district seats.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "Chairman, who represents the whole county (At-Large)", "units": [{"t": "Robert Pitts.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "District 1", "units": [{"t": "Commissioner Bridget Thorne.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "District 2", "units": [{"t": "Commissioner Bob Ellis, also on the Budget Commission.", "cite": ["P-035", "P-021"]}]}, {"kind": "bullet", "label": "District 3", "units": [{"t": "Commissioner Dana Barrett.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "District 4", "units": [{"t": "vacant on the Nov 4 agenda.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "District 5", "units": [{"t": "Commissioner Marvin Arrington.", "cite": ["P-035"]}]}, {"kind": "bullet", "label": "District 6", "units": [{"t": "Vice Chair Khadijah Abdur-Rahman, also on the Budget Commission.", "cite": ["P-035", "P-021"]}]}, {"kind": "bullet", "label": "Budget Commission (proposes the budget; can't adopt it)", "units": [{"t": "the county manager and the chief financial officer, plus Commissioner Ellis for districts 1 to 3 and Vice Chair Abdur-Rahman for districts 4 to 6.", "cite": ["P-008", "P-014", "P-021"]}, {"t": "The county manager carries out the budget once the Board adopts it.", "cite": ["P-006"]}, {"t": "To be eligible for the 2027 budget, a commissioner needed a year on the Board and a term not ending in 2026.", "cite": ["P-010"]}, {"t": "Ellis was the only eligible member from districts 1 to 3, and an eligible vice chair serves automatically.", "cite": ["P-021", "P-011"]}]}, {"kind": "bullet", "label": "How to reach them", "units": [{"t": "Speak during public comment at a Board meeting, or call the Office of the Clerk to the Commission at 404-612-8200.", "cite": ["P-036", "P-039"]}, {"t": "Our sources don't say how Board members are chosen or how long their terms are.", "tag": "analysis", "note": "none of the archived sources does"}, {"t": "They give no direct phone or email for any commissioner or for the Budget Commission.", "tag": "analysis", "note": "none of the archived sources does"}]}], "cardMeta": null}, {"title": "Coming up", "blocks": [{"kind": "bullet", "label": "By Nov 15", "units": [{"t": "The Budget Commission must submit its proposed budget to the Board.", "cite": ["P-005"]}, {"t": "Nov 15, 2026 falls on a Sunday.", "tag": "computed", "note": "Nov 4, 2026 is a Wednesday (P-039), and Nov 15 is 11 days later"}, {"t": "The budget section of Fulton County's code of laws, Section 2-261, doesn't say what happens when the deadline falls on a weekend.", "tag": "analysis", "note": "its full text is in P-005 and P-006; we did not check other sections or state law"}, {"t": "In the 2026 cycle, the county manager submitted the proposal on Nov 15, 2025, and it was presented on Nov 19.", "cite": ["P-047", "P-046"]}, {"t": "Nov 15, 2025 was a Saturday.", "tag": "computed", "note": "Nov 15, 2025 is 365 days before Sunday, Nov 15, 2026, so a Saturday"}, {"t": "A copy goes to the Clerk to the Commission the day it is submitted.", "cite": ["P-006"]}]}, {"kind": "bullet", "label": "Nov 18, Dec 2 and Dec 16, 10 a.m.", "units": [{"t": "The Board holds regular meetings in the Assembly Hall of the Fulton County Government Center, 141 Pryor Street SW, Atlanta.", "cite": ["P-039"]}]}, {"kind": "bullet", "label": "Public hearing (no date 6", "units": [{"t": "The Board voted to bring back a Budget Commission to help develop the county's budget, as one did until 2018.", "cite": ["P-017", "P-018", "P-002", "P-003"]}, {"t": "Yes: Chairman Pitts, Commissioners Thorne and Ellis, and Vice Chair Abdur-Rahman.", "cite": ["P-020", "P-035"]}, {"t": "Commissioner Arrington abstained, and Commissioner Barrett is listed as not voting.", "cite": ["P-020", "P-035"]}, {"t": "To abstain is to choose formally not to vote yes or no.", "tag": "analysis", "note": "plain-language definition; the roll call records \"Abstain\" and \"Did Not Vote\" as different values (P-020)"}]}, {"kind": "bullet", "label": "Aug 19", "units": [{"t": "The Board approved the commission's members: Commissioner Bob Ellis for the north and Vice Chair Khadijah Abdur-Rahman for the south.", "cite": ["P-021", "P-022"]}, {"t": "Barrett had the item taken off the consent agenda for a separate vote, and voted no.", "cite": ["P-021", "P-023"]}, {"t": "Pitts, Thorne, Ellis and Abdur-Rahman voted yes, and Arrington was absent.", "cite": ["P-023"]}]}, {"kind": "bullet", "label": "Oct 7", "units": [{"t": "The sheriff, district attorney, solicitor-general, court clerk, probate judge and public defender held a news conference and sent the Board a letter.", "cite": ["P-068", "P-069"]}, {"t": "They objected to presenting their needs to a two-commissioner panel rather than the full Board, FOX 5 reported.", "cite": ["P-076", "P-080"]}, {"t": "They also raised concerns about the 5% limit.", "cite": ["P-077"]}, {"t": "They said they would not present in person at the commission's hearings, but had sent their 2027 requests in writing.", "cite": ["P-076", "P-080"]}, {"t": "In Atlanta News First's report, Commissioner Barrett said some current board members were trying to take control of the budget process.", "cite": ["P-072"]}, {"t": "In the same report, Commissioner Ellis responded that the commission's meetings are open meetings.", "cite": ["P-073"]}, {"t": "FOX 5 county's budget page didn't show the 2027 proposal, and the newest notice on its Public Notices page was for the Budget Commission's October hearings.", "tag": "analysis", "note": "P-045 and P-042, captured Nov 8, 2026"}]}, {"kind": "para", "label": "What's different this year", "units": []}, {"kind": "num", "label": null, "units": [{"t": "A four-member Budget Commission, including two commissioners, helps draft the budget; since 2018, the county manager had done it alone.", "cite": ["P-005", "P-008", "P-003"]}, {"t": "The county manager carries out the budget once the Board adopts it.", "cite": ["P-006"]}]}, {"kind": "num", "label": null, "units": [{"t": "A FOX 5 report says a directive asked departments to limit 2027 requests for extra money to \"5% above current allocations.\"", "cite": ["P-077", "P-080"]}, {"t": "Commissioner Barrett's resolution says the commission restricted requests for extra money to 5% of each department's \"base budget.\"", "cite": ["P-029", "P-032"]}]}], "subs": [{"title": "How the budget is drafted", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "From 1953 until 2018, a budget commission drafted Fulton's budget.", "cite": ["P-002", "P-003"]}, {"t": "Its members were the Board chairman, the county manager and the chief financial officer.", "cite": ["P-002"]}, {"t": "In 2018, the Board gave that job to the county manager alone.", "cite": ["P-003"]}, {"t": "Resolution 26-0460, adopted Aug 5, 2026, brought a commission back \"in a modified form.\"", "cite": ["P-004", "P-017"]}, {"t": "Commissioner Ellis and Vice Chair Abdur-Rahman sponsored it.", "cite": ["P-016", "P-017"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The new commission's members are the county manager, the chief financial officer, Commissioner Bob Ellis (north) and Vice Chair Khadijah Abdur-Rahman (south).", "cite": ["P-008", "P-021"]}, {"t": "The county manager and chief financial officer still prepare the budget documents and ask departments for their budget proposals.", "cite": ["P-012"]}, {"t": "The commission works by agreement; if it can't agree, the county manager decides how to present the draft.", "cite": ["P-014"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The two commissioner members are chosen before each budget cycle at a publicly announced Board meeting.", "cite": ["P-009"]}, {"t": "One comes from districts 1 to 3, and one from districts 4 to 6.", "cite": ["P-008"]}, {"t": "To be eligible, a member must have served a year, and must not have a term ending in the year the budget is drafted.", "cite": ["P-010"]}, {"t": "The rules have a fallback if no one in a group is eligible.", "cite": ["P-010"]}, {"t": "An eligible vice chair serves automatically.", "cite": ["P-011"]}, {"t": "For the 2027 budget, Ellis was the only eligible member from districts 1 to 3.", "cite": ["P-021"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The two commissioners must ask all commissioners for their budget priorities.", "cite": ["P-013"]}, {"t": "They take part in reviewing departments' requests, and they report to the full Board.", "cite": ["P-013"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The county code says the proposal \"will serve, as presented, as the operating budget until a final budget is adopted.\"", "cite": ["P-005"]}, {"t": "The operating budget is the spending plan the county runs on.", "tag": "analysis", "note": "plain-language definition"}, {"t": "The proposal covers 2027, so this applies only to 2027 spending before the Board adopts a budget.", "tag": "analysis", "note": "P-005 says the proposal governs spending \"for the following year,\" and adoption is due by the second regular meeting in January"}]}], "cardMeta": null}, {"title": "The 2026 budget, for scale", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "The Board adopted the 2026 budget on Jan 21, 2026.", "cite": ["P-046"]}, {"t": "Its General Fund, the largest of the county's funds, was $1,057,100,578.", "cite": ["P-054", "P-052"]}, {"t": "The General Fund pays for many county offices, including the sheriff, the courts, libraries and senior services.", "tag": "analysis", "note": "P-054 lists these under General Fund spending"}]}, {"kind": "bullet", "label": null, "units": [{"t": "Justice and safety got $507.5 million of the General Fund.", "cite": ["P-053"]}, {"t": "That is about 48 cents of every General Fund dollar.", "tag": "computed", "note": "$507.5 million ÷ $1,057.1 million ≈ 0.48"}]}, {"kind": "bullet", "label": null, "units": [{"t": "The sheriff's office had $156,663,989.", "cite": ["P-054"]}, {"t": "A separate \"Consent Decree\" line held $50,000,000 for the county's jail agreement with the federal Department of Justice, described below.", "cite": ["P-054", "P-048"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Property taxes are the biggest source of General Fund money, at $834,032,152.", "cite": ["P-054"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The 2026 plan spends $73,637,614 more than it expects to take in.", "cite": ["P-054"]}, {"t": "Savings, called fund balance, cover the gap and fall from $252,638,514 to $179,000,901.", "cite": ["P-054"]}, {"t": "That leaves about $2.8 million above the plan's minimum reserve.", "tag": "computed", "note": "$179,000,901 − $176,218,666 = $2,782,235 (P-054)"}, {"t": "The minimum reserve is the least savings the plan says the county must keep.", "tag": "analysis", "note": "plain-language reading of the schedule's \"Fund Balance Minimum Reserve Requirement\" (P-054)"}, {"t": "In 2023, 2024 and 2025, actual revenue topped actual spending, by about $3.0 million, $12.3 million and $13.0 million.", "cite": ["P-054"]}, {"t": "Over those years, savings grew from $224,363,249 to $252,638,514.", "cite": ["P-054"]}]}], "cardMeta": null}, {"title": "The jail agreement", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "In January 2025, the county entered into an agreement with the federal Department of Justice.", "cite": ["P-048"]}, {"t": "Its aim was \"to address constitutional violations at the Fulton County Jail.\"", "cite": ["P-048"]}, {"t": "The county says the agreement \"mandated the County implement specific reforms.\"", "cite": ["P-048"]}, {"t": "They cover safety from violence, health care, \"staffing and supervision,\" and living conditions.", "cite": ["P-048"]}, {"t": "Budget documents call the work to meet it consent decree compliance.", "tag": "analysis", "note": "P-048 describes the agreement and, in the next sentence, \"consent decree compliance\""}, {"t": "In general, a consent decree is a legal settlement that a court approves and can enforce.", "tag": "analysis", "note": "plain-language definition"}]}, {"kind": "bullet", "label": null, "units": [{"t": "The 2026 proposal set aside $31,843,000 for consent decree costs, and the adopted budget has $50,000,000.", "cite": ["P-054"]}, {"t": "That is $18,157,000 more.", "tag": "computed", "note": "$50,000,000 − $31,843,000 = $18,157,000 (P-054)"}, {"t": "The budget message sent with the 2026 proposal said these \"costs could exceed a range from $30 - $60 million.\"", "cite": ["P-050", "P-046"]}, {"t": "It added that \"this number is expected to grow.\"", "cite": ["P-050"]}]}], "cardMeta": null}, {"title": "What the county code says about requests", "blocks": [{"kind": "bullet", "label": null, "units": [{"t": "Section 2-261 of the county code says the proposal \"shall include the budget requests of all of the county's departments, agencies, elected officials and authorities.\"", "cite": ["P-005"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "Neither Section 2-261 nor Section 2-263 mentions a cap on requests, either to allow one or to forbid one.", "tag": "analysis", "note": "their full text is archived in P-005 to P-015"}]}, {"kind": "bullet", "label": null, "units": [{"t": "The resolution to remove the limit says the Budget Commission set it, at 5% of each department's \"base budget\" for 2027.", "cite": ["P-029"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "We found no written instruction for the 5% limit, so its exact wording and date aren't known; no source we reviewed disputes that the limit exists.", "tag": "analysis", "note": "see README, D4"}]}, {"kind": "bullet", "label": null, "units": [{"t": "Resolution 26-0729 would have added to the code: \"No limits or caps shall be placed on what a department, agency, elected official, or authority can request.\"", "cite": ["P-030", "P-024"]}, {"t": "It says the change would \"clarify that all departmental budget requests are included in the proposed budget.\"", "cite": ["P-083", "P-024"]}, {"t": "The Board set the resolution aside (filed it) on Nov 4.", "tag": "analysis", "note": "status \"Filed\" after a Nov 4 vote to file, with no later step (P-024, P-025)"}]}, {"kind": "bullet", "label": null, "units": [{"t": "In the 2026 budget, the county's \"Base Budget\" meant the current funding needed for past spending patterns, including staff.", "cite": ["P-086"]}]}, {"kind": "bullet", "label": null, "units": [{"t": "The budget message sent with the 2026 proposal said departments' extra requests were \"included as an appendix.\"", "cite": ["P-049", "P-046"]}, {"t": "Beyond the extra requests it had already considered, it counted almost $158 million more for staff and operations and over $64 million for capital.", "cite": ["P-051"]}, {"t": "These came from departments, agencies and outside groups.", "cite": ["P-051"]}, {"t": "Capital requests are for buildings, equipment and projects.", "tag": "analysis", "note": "plain-language definition"}]}, {"kind": "bullet", "label": null, "units": [{"t": "The 2026 proposal also included \"a 1% decrease across all agencies and departments,\" worth $10 million.", "cite": ["P-050"]}, {"t": "That was a cut to spending, not a limit on requests.", "tag": "analysis", "note": "P-050 describes a spending decrease"}]}], "cardMeta": null}]}, {"id": "options", an't afford a lawyer.", "tag": "analysis", "note": "plain-language definition"}, {"t": "The probate judge heads the court that handles estates, guardianships, marriage licenses and weapons carry licenses, among other services.", "cite": ["P-087", "P-076"]}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "What the plan contains, because it isn't public yet.", "tag": "editorial", "note": ""}, {"t": "When the Board will vote; the county code sets only a latest date, and the justice officials asked for January.", "cite": ["P-005", "P-070"]}]}], "cardMeta": null}, {"title": "Option B: Change the proposal before adopting it", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "The Board adds, cuts or moves money before it votes.", "tag": "analysis", "note": "a description of the option"}, {"t": "The county's 2026 budget resolution says state law lets the Board adopt amounts \"greater or less than the sums presented in the proposed budget.\"", "cite": ["P-047", "P-046"]}]}, {"kind": "bullet", "label": "Where it stands", "units": [{"t": "The proposal isn't out, so there is nothing to change yet.", "tag": "analysis", "note": "P-045, captured Nov 8, 2026"}, {"t": "Last cycle, the budget book lists changes to the proposal dated Jan 7 and Jan 21, 2026, and the Board adopted the amended budget on Jan 21.", "cite": ["P-054", "P-046"]}, {"t": "The adopted budget raised consent decree spending by $18,157,000.", "tag": "computed", "note": "$50,000,000 adopted − $31,843,000 proposed (P-054)"}, {"t": "That money pays for the county's jail agreement with the federal Department of Justice.", "cite": ["P-054", "P-048"]}, {"t": "On the revenue side, it dropped a proposed $32,170,000 line of \"Additional Property Taxes\" and raised the regular property tax line by $18,535,960.", "tag": "computed", "note": "P-054: the \"Additional Property Taxes (Consent)\" line went from $32,170,000 proposed to none adopted; \"Property Taxes\" changed by $4,055,960 + $14,480,000 = $18,535,960"}, {"t": "Taken together, total property-tax revenue ended $13,634,040 below the proposal.", "tag": "computed", "note": "proposed $815,496,192 + $32,170,000 = $847,666,192; adopted $834,032,152 + $0 = $834,032,152; $847,666,192 − $834,032,152 = $13,634,040 (P-054)"}, {"t": "The adopted General Fund, the county's biggest fund, ended up about 0.4% larger than proposed.", "tag": "computed", "note": "$1,057,100,578 ÷ $1,053,152,000 ≈ 1.004 (P-054); P-052 ranks the funds"}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "If the Board adds money, the offices it funds, and the people who use their services, gain.", "tag": "analysis", "note": "both directions are allowed (P-047)"}, {"t": "If the Board cuts, taxpayers and the county's savings gain.", "tag": "analysis", "note": ""}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "If the Board adds money, taxpayers, other programs or savings pay.", "tag": "analysis", "note": ""}, {"t": "If the Board cuts, the offices cut, and the people who use their services, pay.", "tag": "analysis", "note": ""}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much room 2027 revenue leaves, because the proposal isn't public yet.", "tag": "editorial", "note": ""}]}], "cardMeta": null}, {"title": "Option C: Remove the 5% limit and list every request (Resolution 26-0729, set aside on Nov 4)", "blocks": [{"kind": "bullet", "label": "What it does", "units": [{"t": "It would have barred any cap on what county departments, and other offices and bodies the county funds, can request.", "cite": ["P-030", "P-005"]}, {"t": "It would have required the proposal to include all requests, including ones left out because of the 5% cap.", "cite": ["P-030", "P-031"]}, {"t": "The resolution itself spent no money; it would have changed what is asked for and shown.", "tag": "analysis", "note": "based on its full text, P-027 to P-032, P-083 and P-084"}]}, {"kind": "bullet", "label": "Where it stands", "units": [{"t": "A motion to approve it failed on Oct 21, with 1 yes, 1 no, 2 not voting and 2 absent.", "tag": "computed", "note": "P-033 lists 1 \"Yea\", 1 \"Nay\", 2 \"Did Not Vote\" and 2 \"Absent\""}, {"t": "The Board filed it on Nov 4, by 4 votes to 1.", "tag": "computed", "note": "P-034 lists 4 \"Yea\", 1 \"Nay\" and 1 \"Did Not Vote\""}, {"t": "Its record shows no later action.", "cite": ["P-025"]}]}, {"kind": "bullet", "label": "Who benefits", "units": [{"t": "Board members and the public would see every request in the draft.", "tag": "analysis", "note": "P-030 would require the proposal to include all requests"}, {"t": "Departments whose needs go beyond 5% could ask for the full amount.", "tag": "analysis", "note": "P-030 would bar caps on requests"}, {"t": "The resolution says listing requests in the proposed budget has let the Board \"get a true picture of the departments’ needs.\"", "cite": ["P-028"]}]}, {"kind": "bullet", "label": "Who pays", "units": [{"t": "Budget staff would have had 25 days to add any omitted requests that departments chose to submit.", "tag": "computed", "note": "if adopted Oct 21 (P-025), the proposal was due Nov 15 (P-031), 25 days later; P-031 gives departments \"the opportunity to submit\" omitted requests"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether listing every request would change what the Board funds, since the Board can add or cut either way.", "tag": "editorial", "note": ""}]}], "cardMeta": null}]}, {"id": "arguments", "title": "Layer 4: Arguments you'll hear", "blocks": [{"kind": "para", "label": null, "units": [{"t": "The Fulton County Board of Commissioners, a chairman and six district seats, adopts the budget.", "cite": ["P-014", "P-035"]}, {"t": "The Board's votes are listed under What happened, on the Summary tab.", "tag": "analysis", "note": "P-020, P-023, P-033 and P-034"}, {"t": "The cards don't use the votes as evidence for either side, because the records don't give each member's reasons.", "tag": "editorial", "note": "evidence rule; the minutes record votes only (P-088, P-092)"}, {"t": "The Budget Commission is a four-member panel, two commissioners and two county staff, that must propose the budget.", "cite": ["P-005", "P-008"]}, {"t": "Our archived sources quote one commissioner, Bob Ellis, backing the commission process.", "tag": "analysis", "note": "P-073, P-079"}, {"t": "They also include Resolution 26-0460, which Ellis and Vice Chair Abdur-Rahman sponsored and which states its reasons.", "tag": "analysis", "note": "P-004, P-016"}, {"t": "Atlanta News First said it was still waiting to hear back from the vice chair, who serves on the commission.", "cite": ["P-073", "P-021"]}, {"t": "The sources quote Chief Probate Judge Kenya Johnson, Sheriff Patrick Labat and Commissioner Dana Barrett criticizing the process, plus Solicitor-General Keith Gammage on funding.", "tag": "analysis", "note": "P-078, P-072, P-071 and P-077"}, {"t": "They also include Resolution 26-0729, which Barrett sponsored and which states its reasons.", "tag": "analysis", "note": "P-027 to P-032"}, {"t": "That reflects whom the sources quoted, not how many people hold each view.", "tag": "editorial", "note": ""}, {"t": "The county code mentioned on the cards is the Fulton County Code of Ordinances, the county's local laws.", "cite": ["P-017"]}]}, {"kind": "para", "label": null, "units": [{"t": "FOX 5 says the 5% limit holds departments' requests for extra money to \"5% above current allocations.\"", "cite": ["P-077", "P-080"]}, {"t": "Resolution 26-0729 puts it at 5% of each department's \"base budget.\"", "cite": ["P-029", "P-024"]}, {"t": "No archived record or statement gives a reason for the limit, or for filing, or setting aside, the resolution to remove it.", "tag": "analysis", "note": "none of the archived records or statements does; the minutes and the unreviewed meeting video are noted in Layer 5"}, {"t": "The leaders of six justice offices asked for more money: the sheriff, district attorney, solicitor-general, court clerk, probate judge and public defender.", "cite": ["P-069", "P-070"]}, {"t": "The district attorney and solicitor-general prosecute crimes.", "tag": "analysis", "note": "plain-language definition"}, {"t": "The court clerk keeps court records.", "tag": "analysis", "note": "plain-language definition"}, {"t": "The public defender's office defends people charged with crimes who can't afford a lawyer.", "tag": "analysis", "note": "plain-language definition"}, {"t": "The probate judge heads the court that handles estates, guardianships, marriage licenses and weapons carry licenses, among other services.", "cite": ["P-087", "P-076"]}, {"t": "No 2027 source we archived argued against more money for the six offices.", "tag": "analysis", "note": "none of the archived statements does"}]}], "subs": [{"title": "How to read these cards", "blocks": [{"kind": "para", "label": null, "units": [{"t": "Every card uses the same fields, and one rule sets every evidence label.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Supported\" means a record that settles the point backs the claim.", "tag": "editorial", "note": "labeling rule"}, {"t": "For what a rule says, that record is the rule's own text.", "tag": "editorial", "note": "labeling rule"}, {"t": "For money, needs or effects, it is a county record written by someone other than the people making the claim, such as the budget book or a Board record.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Uncertain\" means only statements or requests by the people making the claim back it, no record settles it, or the key document isn't out yet.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"A values question\" means that part of the claim is about what is fair or right, not mainly about facts.", "tag": "editorial", "note": "labeling rule"}, {"t": "When a card makes more than one claim, each part gets its own label.", "tag": "editorial", "note": "labeling rule"}, {"t": "A claim type says \"with a values question\" when the card also asks what is fair or right, and the label names that question.", "tag": "editorial", "note": "labeling rule"}, {"t": "\"Documented\" means a real person or body made the argument, and we cite where.", "tag": "editorial", "note": "labeling rule"}, {"t": "Cards are paired by topic: who drafts (1 and 2), requests and openness (3 and 4), then timing (5) and funding (6).", "tag": "editorial", "note": "ordering rule"}, {"t": "The first pair starts with the case for the current process, and the second with the case against it; the order is not a ranking.", "tag": "editorial", "note": "ordering rule"}]}, {"kind": "para", "label": null, "units": [{"t": "Six justice officials, the sheriff, district attorney, solicitor-general, superior court clerk, chief probate judge and public defender, call themselves \"Justice Leaders.\"", "cite": ["P-076"]}, {"t": "Their letter is not on any page we could find.", "tag": "analysis", "note": "see README, D6"}, {"t": "Their views, and Ellis's statements, come from two news reports published Oct 7, 2026, the day of the officials' news conference on the courthouse steps.", "cite": ["P-068", "P-069", "P-074", "P-080"]}, {"t": "The resolutions quoted below are Board records: Resolution 26-0460 (Ellis, Abdur-Rahman; adopted Aug 5, 2026) and Resolution 26-0729 (Barrett; its motion to approve failed Oct 21, and it was filed Nov 4).", "cite": ["P-016", "P-017", "P-024", "P-032"]}, {"t": "Filing set Resolution 26-0729 aside without approving it.", "tag": "analysis", "note": "status \"Filed\" after a Nov 4 vote to file, with no later step (P-024, P-025)"}]}], "cardMeta": null}, {"title": "1. The commission adds early input, and the full Board still decides", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "North and south Fulton would each have a commissioner shaping the draft, and the full Board still votes.", "tag": "analysis", "note": "P-004, P-008 and P-014"}, {"t": "Resolution 26-0460 calls this \"earlier and ongoing input\" from Board members.", "cite": ["P-004", "P-017"]}, {"t": "Records back these rules, not results, which wait on the draft.", "tag": "analysis", "note": "P-007 to P-015; the draft is due by Nov 15 (P-005)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Commissioner Bob Ellis and Vice Chair Khadijah Abdur-Rahman sponsored Resolution 26-0460.", "cite": ["P-016", "P-017"]}, {"t": "It says the new commission is \"structured to ensure balanced representation from both the northern and southern portions of Fulton County.\"", "cite": ["P-004"]}, {"t": "It says the design preserves \"the full Board's exclusive authority to adopt the County's annual budget.\"", "cite": ["P-004"]}, {"t": "It says a budget commission drafted the budget from 1953 until 2018.", "cite": ["P-002", "P-003"]}, {"t": "Ellis said the full Board will review and vote on the final budget, FOX 5 reported.", "cite": ["P-079", "P-080"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "The code says the commission can't adopt, amend or approve the budget.", "cite": ["P-014"]}, {"t": "Only the full Board can.", "cite": ["P-014"]}, {"t": "The county manager and chief financial officer still prepare the budget documents.", "cite": ["P-012"]}, {"t": "The two commissioners must ask all commissioners for their budget priorities and report to the full Board.", "cite": ["P-013"]}, {"t": "The code says they stand for \"the policy priorities of the full board of commissioners.\"", "cite": ["P-007"]}, {"t": "It also says each represents \"the interests and priorities of their respective district grouping.\"", "cite": ["P-013"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "FOX 5 reported that the justice officials' main objection is to presenting their needs to a two-commissioner panel rather than the full Board.", "cite": ["P-076", "P-080"]}, {"t": "Commissioner Dana Barrett said the two are \"creating a budget commission that only they qualify to be on.\"", "cite": ["P-072"]}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The 1953-2018 commission's only Board member was the chairman, who serves at large; the new one has two district commissioners instead.", "cite": ["P-002", "P-003", "P-008", "P-035"]}, {"t": "In the 2026 cycle, the adopted General Fund, the county's biggest fund, ended about 0.4% above the county manager's proposal, though some lines moved by millions of dollars.", "tag": "computed", "note": "$1,057,100,578 ÷ $1,053,152,000 ≈ 1.004 (P-054; P-052 ranks the funds; P-047 says the county manager submitted the proposal); for example, the \"Consent Decree\" line rose by $18,157,000 (P-054)"}, {"t": "Commissioner Barrett's Resolution 26-0729 says the commission failed its duty to ask all commissioners for their priorities when it set the 5% cap.", "cite": ["P-029", "P-032", "P-024"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "Apart from that claim, we found no record on whether the two asked every commissioner for priorities.", "tag": "analysis", "note": "none in the sources reviewed; the claim is in P-029"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether the budget will differ from one drafted by the county manager alone.", "tag": "editorial", "note": ""}, {"t": "The draft isn't out, and there is no other draft to compare.", "tag": "analysis", "note": "P-045, captured Nov 8, 2026"}]}], "cardMeta": {"kind": "Documented", "side": "supports the current process", "claimType": "factual, with a values question", "evidence": "Rules: Supported (the code's text). Results: Uncertain (no draft yet). Whether all commissioners were asked for priorities: Uncertain (no record settles it). Better design: a values question"}}, {"title": "2. Two commissioners, seated under rules they sponsored, have too much say", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "Department heads must present their needs to two commissioners, not the full Board, critics say.", "cite": ["P-076"]}, {"t": "Commissioner Barrett said the rules let only those two serve.", "cite": ["P-072"]}, {"t": "Records back who serves, not how much the two commissioners shape the draft.", "tag": "analysis", "note": "P-021; the draft is due by Nov 15 (P-005)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Chief Probate Judge Kenya Johnson spoke for the group.", "cite": ["P-078"]}, {"t": "Johnson said, \"We respectfully decline to participate in a process that unnecessarily limits the voices of the justice system.\"", "cite": ["P-078"]}, {"t": "FOX 5 reported that Sheriff Patrick Labat criticized the two-commissioner arrangement as unfair to county agencies and taxpayers.", "cite": ["P-078", "P-080"]}, {"t": "Labat said, \"For two commissioners to take a hold of this project—hijack this process is simply unfair.\"", "cite": ["P-078"]}, {"t": "Commissioner Dana Barrett said the two are \"creating a budget commission that only they qualify to be on.\"", "cite": ["P-072"]}, {"t": "Barrett also said, \"There are some shenanigans among some of the current board members who are angling to take control of the budget process in a way that I feel is inappropriate.\"", "cite": ["P-072"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "Ellis and Abdur-Rahman, the commission's two commissioners, sponsored the rules that decide who serves.", "cite": ["P-016", "P-017", "P-021"]}, {"t": "Under those rules, which require a year on the Board and a term not ending in 2026, Ellis was the only eligible member from districts 1 to 3 for the 2027 budget.", "cite": ["P-021", "P-010"]}, {"t": "The vice chair served automatically.", "cite": ["P-021", "P-011"]}, {"t": "Neither Ellis nor the vice chair needed a nomination by their district group; the Board approved the item naming them on Aug 19.", "cite": ["P-021", "P-022", "P-009"]}, {"t": "The county's notice lists the hearings as \"Special called meetings of the Fulton County Budget Commission.\"", "cite": ["P-042"]}, {"t": "The two \"participate directly and continuously with the county manager and chief financial officer,\" including in reviewing departments' requests.", "cite": ["P-013"]}, {"t": "The code has the commission help prepare the recommended budget it presents to the full Board.", "cite": ["P-013", "P-015"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Commissioner Bob Ellis said, \"They are speaking and addressing the budget commission just like a standard committee structure.\"", "cite": ["P-073"]}, {"t": "Ellis added that \"all commissioners and their staff are able to attend and hear what is said.\"", "cite": ["P-073"]}, {"t": "FOX 5 reported that Ellis, addressing the officials' concerns, noted that the commission is solely responsible for drafting recommendations and that the full Board will review and vote on the final budget.", "cite": ["P-079", "P-080"]}, {"t": "Ellis's archived statements don't address the eligibility rules.", "tag": "analysis", "note": "P-073 and P-079 are his archived statements"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The commission can't adopt or change the budget.", "cite": ["P-014"]}, {"t": "It has four members, and two are county staff: the county manager and the chief financial officer.", "cite": ["P-008"]}, {"t": "When it can't agree, the county manager decides how to present the draft.", "cite": ["P-014"]}, {"t": "The rules choose the two commissioners again before each budget cycle.", "cite": ["P-009"]}, {"t": "Each of the six offices had a hearing slot, and FOX 5 reported that they sent their requests in writing.", "cite": ["P-043", "P-044", "P-080"]}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "We did not find the justice officials' letter, so their statements come from news reports.", "tag": "analysis", "note": "see README, D6"}, {"t": "Our sources don't say why the other two commissioners from districts 1 to 3 were not eligible.", "tag": "analysis", "note": "P-021 gives no reason; P-010 lists the grounds, less than a year on the Board or a term ending in 2026"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "How much the two commissioners shape the draft, because it isn't out yet.", "tag": "editorial", "note": ""}]}], "cardMeta": {"kind": "Documented", "side": "critical of the current process", "claimType": "factual, with a values question", "evidence": "Who serves in 2027, and how chosen: Supported (county records). Hearings scheduled as commission meetings: Supported (county notice). How much the two shape the draft: Uncertain (no draft yet). Fairness: a values question"}}, {"title": "3. The 5% limit keeps departments' full requests out of the draft", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "If the claim is right, the draft won't show departments' full requests.", "tag": "analysis", "note": "what the card's claim would mean"}, {"t": "Resolution 26-0729 says the 5% limit effectively makes the code's rule on requests \"impossible.\"", "cite": ["P-029", "P-024"]}, {"t": "Records back the code's rule and 2026 practice, not a conflict.", "tag": "analysis", "note": "the label above names each part; the rule is P-005, and the 2026 draft listed extra requests (P-049, P-046)"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Commissioner Barrett's Resolution 26-0729 calls the cap an \"unprecedented restriction.\"", "cite": ["P-029", "P-032", "P-024"]}, {"t": "It says across-the-board spending cuts and caps let \"legacy spending\" go unchecked \"while new and often necessary funding is denied.\"", "cite": ["P-028"]}, {"t": "It says the Government Finance Officers Association calls such \"spending cuts or caps\" a sign of weak budgeting.", "cite": ["P-028"]}, {"t": "It cites advice from The Pew Charitable Trusts to \"resist the temptation\" of across-the-board cuts.", "cite": ["P-028"]}, {"t": "It says the county has long listed departments' extra requests in its public proposed budget.", "cite": ["P-028"]}, {"t": "It says that let the Board \"get a true picture of the departments’ needs\" and adjust the budget.", "cite": ["P-028"]}, {"t": "The justice officials raised concerns about the limit, FOX 5 reported.", "cite": ["P-077", "P-080"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "The code says the draft \"shall include the budget requests of all of the county's departments.\"", "cite": ["P-005"]}, {"t": "In the 2026 cycle, \"All submissions were received and carefully reviewed,\" and extra requests were \"included as an appendix.\"", "cite": ["P-049", "P-046"]}, {"t": "The resolution says department budgets changed by \"a decrease of 4 percent to an increase of 43 percent\" from FY2025 to FY2026.", "cite": ["P-028"]}, {"t": "It says 27 of the county's 41 General Fund departments and agencies asked for more than 5% for 2026, and 14 of them got increases above 5%.", "cite": ["P-029"]}, {"t": "The public defender's posted 2027 slides list six requests totaling $4,720,447.", "tag": "computed", "note": "$76,981 + $3,793,366 + $755,884 + $30,000 + $58,000 + $6,216 = $4,720,447 (P-064)"}, {"t": "That is about 3.3 times 5% of the office's 2026 budget.", "tag": "computed", "note": "5% of $28,395,566 = $1,419,778 (P-054); $4,720,447 ÷ $1,419,778 ≈ 3.3"}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "No one in the sources we reviewed disputed this directly.", "tag": "analysis", "note": "none of Ellis's archived statements, or Resolution 26-0460, mentions the limit"}, {"t": "The minutes record votes on the resolution, but no reasons (see What happened).", "tag": "analysis", "note": "P-088 and P-092"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The county's 2026 budget resolution says state law lets the Board adopt amounts \"greater or less than the sums presented in the proposed budget.\"", "cite": ["P-047", "P-046"]}, {"t": "In 2026, the Board adopted more than the draft for four of the six justice offices.", "tag": "computed", "note": "P-054: the sheriff, public defender, solicitor-general and superior court clerk lines rose from the proposal to the adopted budget; the district attorney and probate court lines didn't change"}, {"t": "As the resolution quotes them, the finance officers' association and Pew speak of across-the-board spending cuts or caps, not limits on requests.", "tag": "analysis", "note": "P-028"}, {"t": "The resolution and FOX 5 describe the limit as applying to requests for extra money.", "cite": ["P-029", "P-077", "P-080"]}, {"t": "For the 2026 budget, the county described its \"Base Budget\" as the current funding needed for past spending patterns, including staff.", "cite": ["P-086"]}, {"t": "The resolution says departments may describe broader needs, but only \"in narrative form.\"", "cite": ["P-029"]}, {"t": "Outside the draft, at least one office's requests above 5% are public: the public defender's posted slides list $4,720,447 in requests.", "tag": "analysis", "note": "P-057 and P-064; \"above 5%\" is measured against its 2026 budget, as under What supports it"}]}, {"kind": "bullet", "label": "What's missing", "units": [{"t": "We did not find the commission's written 5% instruction.", "tag": "analysis", "note": "see README, D4"}, {"t": "We did not check the resolution's figures against budget books.", "tag": "analysis", "note": "scope note"}, {"t": "We did not check past years' budget instructions for earlier limits on requests.", "tag": "analysis", "note": "scope note"}, {"t": "The minutes give no reasons for the limit, and we did not review the meeting video, where reasons may have been given.", "tag": "analysis", "note": "P-088 to P-093; see sources.yaml, S16"}]}, {"kind": "bullet", "label": "What's uncertain", "units": [{"t": "Whether the Nov 15 draft will show requests above 5%.", "tag": "editorial", "note": ""}, {"t": "Whether a cap fits the code's rule on requests; the code mentions no cap, and no source we reviewed settles it.", "tag": "analysis", "note": "P-005 to P-015; P-029 argues it does not fit"}, {"t": "The jail agreement is the county's January 2025 agreement with the federal Department of Justice \"to address constitutional violations at the Fulton County Jail.\"", "cite": ["P-048"]}, {"t": "Budget documents call meeting that agreement \"consent decree compliance.\"", "cite": ["P-048"]}, {"t": "Whether the limit covers costs tied to court orders or the jail agreement, such as the sheriff's \"Consent Decree Compliance\" and \"Court Ordered Contract\" requests.", "tag": "analysis", "note": "P-061; the limit's descriptions (P-029, P-077) don't say, and in 2026 consent decree money sat in its own line (P-054)"}]}], "cardMeta": {"kind": "Documented", "side": "critical of the current process", "claimType": "factual and about what will happen, with a values question", "evidence": "Code requires all requests, and the 2026 draft listed extras: Supported (code text; budget book). Conflict with the code: Uncertain (the code mentions no cap). Exact terms: Uncertain (no written instruction; undisputed). Unprecedented: Uncertain (the resolution's statement; we didn't check past years). Needs above 5%: Uncertain (claimants' figures). Effect on the draft: Uncertain (not out yet). Sound budgeting: a values question"}}, {"title": "4. The new process is open", "blocks": [{"kind": "bullet", "label": "In short", "units": [{"t": "If the claim is right, all commissioners and their staff can hear departments' requests.", "tag": "analysis", "note": "what the card's claim would mean"}, {"t": "Commissioner Ellis called the meetings \"open meetings\" and the process \"more transparent and open\" than in recent years.", "cite": ["P-073"]}, {"t": "Records back the announced hearings, not the comparison.", "tag": "analysis", "note": "P-042 and P-055 to P-058; the comparison is Ellis's, in P-073"}]}, {"kind": "bullet", "label": "Who says it", "units": [{"t": "Ellis said, \"Those meetings are open meetings.\"", "cite": ["P-073"]}, {"t": "Ellis also said, \"The process we’ve laid out is more transparent and open than anything we’ve had in recent years.\"", "cite": ["P-073"]}]}, {"kind": "bullet", "label": "What supports it", "units": [{"t": "The county posted a public notice for the commission's six days of hearings.", "cite": ["P-042"]}, {"t": "Several offices' 2027 presentations are on the county's data website.", "cite": ["P-055", "P-056", "P-057", "P-058", "P-094", "P-095"]}, {"t": "They include the sheriff's and the public defender's.", "cite": ["P-055", "P-057"]}, {"t": "The code requires the two commissioners to report to the full Board on the budget's progress.", "cite": ["P-013"]}, {"t": "The Board's Oct 21 and Nov 4 meetings each took up an update on the budget process.", "cite": ["P-096", "P-089", "P-090", "P-093"]}]}, {"kind": "bullet", "label": "Who disagrees", "units": [{"t": "Resolution 26-0729 sought \"to ensure transparency,\" by requiring every department's request to be \"disclosed in the proposed budget.\"", "cite": ["P-024"]}, {"t": "Judge Johnson, speaking for the justice officials, objected to \"a process that unnecessarily limits the voices of the justice system.\"", "cite": ["P-078"]}, {"t": "The resolution does not say the meetings were closed.", "tag": "analysis", "note": "its full text is archived in P-027 to P-032, P-083 and P-084"}]}, {"kind": "bullet", "label": "What challenges it", "units": [{"t": "The resolution says departments may describe broader needs only \"in narrative form.\"", "cite": ["P-029"]}, {"t": "The 2026 cycle also held formal hearings; the county \"reinstated formal budget hearings\" that year.", "cite": ["P-049", "P-046"]}, {"t": "The 2026 budget message said extra requests were \"included as an appendix.\"", "cite": ["P-049", "P-046"]}, {"t": "The Oct
