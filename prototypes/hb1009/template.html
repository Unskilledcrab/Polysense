<style>
/* Layout, phone first: one reading column; the site menu sits in a bottom bar on phones and in the top bar on
   wide screens; the bill page pins one scrollable row of tabs at the top. */
:root {
  --bg: #f5f7f4; --surface: #ffffff; --sunk: #eef2ee; --ink: #16201c; --muted: #56625c; --line: #d6ddd7;
  --accent: #1d5a45; --accent-ink: #ffffff; --accent-soft: #e2efe8; --gold: #8a5a00; --gold-soft: #f6ead2;
  --ok: #2b7046; --ok-soft: #e1f0e6; --warn: #8a5a00; --warn-soft: #f6ead2; --bad: #a33a3a; --bad-soft: #f6e2e2;
  --ins: #1d5a45; --ins-bg: #dcefe4; --del: #a33a3a; --del-bg: #f6e2e2; --unc: #3d5486; --unc-soft: #e6ebf6;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px; --shadow: 0 1px 2px rgba(22, 32, 28, .06), 0 6px 18px rgba(22, 32, 28, .06);
  --bottom-nav: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --surface: #151d1a; --sunk: #111816; --ink: #e5ece8; --muted: #9eaba5; --line: #2a3531;
  --accent: #7cc9a6; --accent-ink: #0e1412; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --sunk: #111816; --ink: #e5ece8; --muted: #9eaba5; --line: #2a3531;
  --accent: #7cc9a6; --accent-ink: #0e1412; --accent-soft: #193027; --gold: #e2b65c; --gold-soft: #2c2412;
  --ok: #7cc9a6; --ok-soft: #16291f; --warn: #e2b65c; --warn-soft: #2c2412; --bad: #ee8b8b; --bad-soft: #321a1a;
  --ins: #8fdab6; --ins-bg: #173326; --del: #f09a9a; --del-bg: #3a1d1d; --unc: #a9bcea; --unc-soft: #1c2438; --shadow: none; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.wrap { max-width: 46rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* Top bar: brand only on phones (it scrolls away); brand + menu, pinned, on wide screens */
.bar { background: var(--surface); border-bottom: 1px solid var(--line) }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; min-height: 52px }
.brand { font: 600 1.15rem/1 var(--font-display); letter-spacing: .01em; color: var(--ink); text-decoration: none; display: flex; align-items: baseline; gap: 8px }
.brand small { font: 500 .7rem/1 var(--font-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
.nav { display: none; gap: 4px; margin-left: auto }
.nav a { font-size: .95rem; text-decoration: none; color: var(--muted); padding: 8px 10px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); font-weight: 700 }

/* Bottom menu on phones, within thumb reach */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
.bottom a { min-height: var(--bottom-nav); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; color: var(--muted); font-size: .82rem; line-height: 1.15; text-align: center; padding: 6px 4px }
.bottom a::before { content: ""; width: 22px; height: 3px; border-radius: 3px; background: transparent }
.bottom a[aria-current="page"] { color: var(--ink); font-weight: 700 }
.bottom a[aria-current="page"]::before { background: var(--accent) }
main { padding-block: 18px calc(var(--bottom-nav) + 48px + env(safe-area-inset-bottom, 0px)) }

@media (min-width: 720px) {
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
  .nav { display: flex }
  .bottom { display: none }
  main { padding-block: 24px 72px }
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0 }
h1 { font-size: clamp(1.65rem, 4.6vw, 2.3rem) }
h2 { font-size: 1.35rem }
h3 { font-size: 1.12rem }
p { margin: 0 }
.eyebrow { font: 500 .75rem/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.lede { color: var(--muted); max-width: 40rem }
.stack { display: flex; flex-direction: column; gap: 14px }
.stack-lg { display: flex; flex-direction: column; gap: 26px }
.notice { font-size: .92rem; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 12px }

/* Chips and badges */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { font-size: .78rem; line-height: 1.2; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; max-width: 100% }
.chip.wrap { white-space: normal; border-radius: 12px }   /* long chips (a card's side) wrap instead of widening the page */
.chip.law { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok) }
.chip.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn) }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad) }
.power { font: 700 .72rem/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px }
.power::before { content: ""; width: 8px; height: 8px; display: inline-block; border: 2px solid currentColor }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.evlist { list-style: none; margin: .35rem 0 .25rem; padding: 0; display: grid; gap: .3rem }
.evlist li { display: flex; flex-wrap: wrap; gap: .25rem .45rem; align-items: baseline }
.evlist .scope { flex: 1 1 7rem; min-width: 0; font-size: .92rem }
.evpart .evbtn { margin-top: .15rem }
.power.decide { color: var(--accent); background: var(--accent-soft) } .power.decide::before { background: currentColor }
.power.input { color: var(--gold); background: var(--gold-soft) } .power.input::before { border-radius: 50% }
.power.observe { color: var(--muted); background: var(--sunk) } .power.observe::before { border-radius: 50%; background: transparent }

/* Source chips: small, at the end of each sentence; tap for the exact passage */
.src { font: 500 .7rem/1 var(--font-body); vertical-align: .14em; margin-left: 5px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--sunk); color: var(--accent); cursor: pointer; min-height: 24px; white-space: nowrap }
.src:hover { border-color: var(--accent) }
.src.tag { color: var(--muted); border-style: dashed; background: transparent }
.src.tag.editorial { color: var(--gold) }

/* Labeled fields: the label on its own line, then one sentence per line */
.field { display: flex; flex-direction: column; gap: 4px }
.flabel { font: 700 .78rem/1.3 var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px }
.lines li { padding-left: 14px; position: relative }
.lines li::before { content: ""; position: absolute; left: 1px; top: .72em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .6 }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow) }
.home-sec { display: flex; flex-direction: column; gap: 12px }
.home-sec > h2 { display: flex; align-items: baseline; gap: 10px }
.home-sec > h2 .count { font: 500 .8rem var(--font-mono); color: var(--muted) }
.item { display: grid; gap: 8px }
.item .when { font: 500 .85rem/1.2 var(--font-mono); color: var(--ink) }
.item .go { font-weight: 700; text-decoration: none; justify-self: start; padding: 6px 0; min-height: 40px; display: inline-flex; align-items: center }

/* Bill header and the 30-second box */
.billcode { font: 500 .82rem/1 var(--font-mono); color: var(--accent); letter-spacing: .04em }
.billhead { display: flex; flex-direction: column; gap: 10px }
.thirty { background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 14px }
.thirty h2 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 700; letter-spacing: .01em }
.cta { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; text-decoration: none; padding: 10px 14px }
.disclose { font-size: .86rem; color: var(--muted); display: flex; gap: 8px; align-items: flex-start }
.disclose::before { content: "i"; font: 700 .75rem/1.35rem var(--font-mono); flex: 0 0 1.35rem; text-align: center; border-radius: 50%; border: 1px solid var(--muted) }

/* Bill tabs: one scrollable row, pinned at the top while you read */
.tabs { display: flex; gap: 4px; padding: 6px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; scroll-snap-type: x proximity; box-shadow: 0 0 0 6px var(--bg) }
.tabs::-webkit-scrollbar { display: none }
.tabs a { flex: 0 0 auto; scroll-snap-align: center; text-decoration: none; color: var(--muted); font-size: .95rem; padding: 8px 12px; border-radius: 8px;
  min-height: 44px; display: inline-flex; align-items: center; white-space: nowrap }
.tabs a[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow) }
@media (min-width: 720px) { .tabs { top: calc(env(safe-area-inset-top, 0px) + 53px) } }

/* Workspace content */
.layer { display: flex; flex-direction: column; gap: 18px }
.layer-head { display: flex; flex-direction: column; gap: 4px }
.blocks { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.blocks li { padding-left: 16px; position: relative }
.blocks li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--line) }
.blocks.num { counter-reset: n } .blocks.num li { counter-increment: n; padding-left: 26px }
.blocks.num li::before { content: counter(n); width: auto; height: auto; background: none; top: 0; font: 700 .85rem/1.6 var(--font-mono); color: var(--accent) }
.label { font-weight: 700 }
.timeline { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; list-style: none; border-left: 2px solid var(--line); margin-left: 6px }
.timeline li { padding: 0 0 12px 16px; position: relative }
.timeline li::before { content: ""; position: absolute; left: -7px; top: .45em; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent) }
.timeline .when { display: block; font: 500 .82rem/1.4 var(--font-mono); color: var(--muted) }
.sub { display: flex; flex-direction: column; gap: 10px }
#act { scroll-margin-top: 76px }
.options { display: grid; gap: 12px }
.opt-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }

/* Expandable cards (options and arguments) */
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow) }
details.fold > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; gap: 8px }
details.fold > summary::-webkit-details-marker { display: none }
details.fold > summary h3 { display: flex; gap: 10px; align-items: baseline }
details.fold > summary h3::after { content: "+"; margin-left: auto; font: 500 1.2rem var(--font-mono); color: var(--muted) }
details.fold[open] > summary h3::after { content: "\2212" }
details.fold .hint { font-size: .86rem; color: var(--accent); font-weight: 700 }
details.fold[open] .hint { display: none }
details.fold .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed var(--line) }
.meta-line { font-size: .84rem; color: var(--muted) }
.ev { font: 700 .74rem/1.3 var(--font-mono); letter-spacing: .02em; padding: 5px 8px; border-radius: 6px; border: 1px solid currentColor; display: inline-block }
.ev.supported { color: var(--ok) } .ev.mixed { color: var(--warn) }
.ev.uncertain { color: var(--unc); border-style: dashed } .ev.values { color: var(--muted); border-style: dotted }
.evbtn { font: 700 .78rem/1.2 var(--font-body); color: var(--accent); background: none; border: 0; padding: 6px 2px; min-height: 32px; cursor: pointer; text-decoration: underline }
.legend { display: grid; gap: 8px }
.legend .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline }
.legend .row p { margin: 0 }
/* "What it means for you" and the values guide */
.you { border-left: 4px solid var(--accent) }
.you h2, .vguide h3 { margin: 0 }
.ifyou { padding-top: 10px; border-top: 1px solid var(--line) }
.ifyou:first-of-type { border-top: 0; padding-top: 0 }
.ifyou strong.lead, .vguide strong.lead { color: var(--ink) }
.vguide .vline { padding-top: 10px; border-top: 1px solid var(--line) }
.vguide .vline:first-of-type { border-top: 0 }
.chip.past { background: var(--sunk); color: var(--muted); border-style: dashed }
.mayline { margin: 0; font-size: .95rem }
.qcard ul { margin: 0; padding-left: 1.2em }

/* Collapsible notes */
details.more { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
details.more > summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 48px; display: flex; align-items: center }
details.more[open] { padding-bottom: 14px }

/* Bill markup */
.markup { font: .88rem/1.7 var(--font-mono); background: var(--sunk); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto }
.markup .ln { color: var(--muted); display: inline-block; width: 2.4em; user-select: none }
.markup del { color: var(--del); background: var(--del-bg); text-decoration: line-through; text-decoration-thickness: 2px }
.markup ins { color: var(--ins); background: var(--ins-bg); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px }

/* Next and previous tab */
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px }
.pager a { min-height: 48px; display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); text-decoration: none; font-weight: 700 }
.pager a.next { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }

/* Evidence list */
.sources { display: flex; flex-direction: column; gap: 10px }
.source { display: grid; gap: 6px }
.source .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted) }
.hash { font-family: var(--font-mono); font-size: .8rem }
.type { font: 700 .7rem/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; background: var(--sunk); color: var(--muted); justify-self: start }
.type.primary { background: var(--accent-soft); color: var(--accent) }

/* Checks view: each table row becomes a small card */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; justify-content: flex-start }
.stat b { font: 600 1.5rem/1.1 var(--font-display); font-variant-numeric: tabular-nums }
.stat span { font-size: .85rem; color: var(--muted) }
.rowcards { display: flex; flex-direction: column; gap: 10px }
.rowcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px }
.rowcard h3 { font-size: 1.02rem }
.rowcard dl { margin: 0; display: grid; grid-template-columns: minmax(0, 9.5rem) minmax(0, 1fr); gap: 4px 12px; font-size: .92rem }
.rowcard dt { color: var(--muted) } .rowcard dd { margin: 0; min-width: 0 }
@media (max-width: 420px) { .rowcard dl { grid-template-columns: 1fr } .rowcard dd { margin-bottom: 4px } }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 20 }
.drawer { position: fixed; z-index: 21; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
  left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
@media (min-width: 900px) { .drawer { left: auto; top: 0; bottom: 0; width: 30rem; max-height: none; border-radius: 0; padding-top: calc(18px + env(safe-area-inset-top, 0px)) } }
.drawer .close { float: right; font: inherit; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 8px; padding: 6px 14px; min-height: 44px }
.drawer blockquote { margin: 10px 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--sunk); border-radius: 0 8px 8px 0; font-size: .95rem }
.drawer dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .85rem; margin: 10px 0 }
.drawer dt { color: var(--muted) } .drawer dd { margin: 0; min-width: 0; overflow-wrap: anywhere }

footer { margin-top: 32px; font-size: .82rem; color: var(--muted) }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: up .18s ease-out } @keyframes up { from { transform: translateY(12px); opacity: .6 } } }
</style>

      box.appendChild(el("div", { class: "row" }, [evChip(row[0]), el("p", { text: row[2] })]));
    });
    if (rule) {
      var b = el("button", { class: "evbtn", type: "button", text: "This page's exact rule" });
      b.addEventListener("click", function () { drawer("How to read these cards", renderBlocks(rule.blocks), b); });
      box.appendChild(b);
    }
    return box;
  }

  // The grades an evidence label names, in order ("Supported", "Uncertain", "Values question"...). A folded
  // card shows only these, so it stays scannable on a phone; the full label is inside the card.
  // Split a card's evidence label into parts: [{grade, scope, note, text}]. Handles "Rules: Supported (note). Results:
  // Uncertain (note)", "Supported on X (note); uncertain on Y (note)" and "Supported (note); Mixed (note); size (note)".
  function evParts(label) {
    var t = (label || "").trim(), segs = [], cur = "", depth = 0, out = [];
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (ch === "(") depth++;
      else if (ch === ")") depth = Math.max(0, depth - 1);
      if (depth === 0 && (ch === ";" || (ch === "." && /\s/.test(t.charAt(i + 1) || " ")))) { if (cur.trim()) segs.push(cur.trim()); cur = ""; continue; }
      cur += ch;
    }
    if (cur.trim()) segs.push(cur.trim());
    segs.forEach(function (seg) {
      var head = seg, note = "", open = seg.indexOf("(");
      if (open >= 0 && /\)\s*$/.test(seg)) { head = seg.slice(0, open).trim(); note = seg.slice(open + 1, seg.lastIndexOf(")")).trim(); }
      var g = evGrades(head)[0], scope = "", m;
      if ((m = head.match(/^(.+?):\s*(?:a\s+)?(supported|mixed|uncertain|contested|values question|not mainly)/i))) scope = m[1].trim();
      else if ((m = head.match(/^(?:supported|mixed|uncertain|contested)(?:, with limits)?\s+on\s+(.+)$/i))) scope = m[1].trim();
      out.push({ grade: g || "", scope: scope, note: note, text: seg });
    });
    return out;
  }
  // One line per grade, naming the parts it covers ("● Supported: Rules"), or null when the label names no parts.
  function evByPart(parts) {
    var graded = parts.filter(function (p) { return p.grade; });
    if (graded.length < 2 || !graded.every(function (p) { return p.scope; })) return null;
    var order = [], by = {};
    graded.forEach(function (p) { if (!by[p.grade]) { by[p.grade] = []; order.push(p.grade); } by[p.grade].push(p.scope); });
    return el("ul", { class: "evlist" }, order.map(function (g) {
      var txt = by[g].map(function (x, i) { return i && /^[A-Z][a-z]/.test(x) ? x.charAt(0).toLowerCase() + x.slice(1) : x; }).join("; ");
      return el("li", null, [evChip(g), el("span", { class: "sr-only", text: ": " }), el("span", { class: "scope", text: txt })]);
    }));
  }
  function evGrades(label) {
    var t = label || "", prev;
    do { prev = t; t = t.replace(/\([^()]*\)/g, ""); } while (t !== prev);   // drop explanations in parentheses
    var out = [], m, re = /\b(supported, with limits|supported|mixed|uncertain|contested|not mainly a factual question|values question)\b/gi;
    while ((m = re.exec(t))) {
      var g = m[1].toLowerCase().replace("not mainly a factual question", "not mainly factual");
      g = g.charAt(0).toUpperCase() + g.slice(1);
      if (out.indexOf(g) < 0) out.push(g);
    }
    return out;
  }

  // Arguments: all cards start closed, so both sides' claims are visible at a glance.
  function layerArguments() {
    var s = sectionById("arguments"), L = el("section", { class: "layer" });
    L.appendChild(layerHead("Arguments you'll hear", "Tap a card to see who makes the argument, what backs it up, who disagrees and what's missing."));
    var used = [], rule = null, questions = null;
    s.subs.forEach(function (a) { if (a.cardMeta) evGrades(a.cardMeta.evidence).forEach(function (g) { if (used.indexOf(g) < 0) used.push(g); }); });
    s.subs.forEach(function (a) { if (/^how to read/i.test(a.title)) rule = a; if (/^questions to weigh/i.test(a.title)) questions = a; });
    var opts = sectionById("options");
    if (opts && opts.subs.some(function (o) { return /^if you care most about/i.test(o.title); }))
      L.appendChild(el("p", { class: "meta-line" }, ["What each side says it protects, quoted from the record, is at the top of the ", el("a", { href: "#" + W.slug + "-options", text: "Options tab" }), "."]));
    if (used.length) L.appendChild(el("section", { class: "card stack", "aria-labelledby": "h-legend" }, [el("h3", { id: "h-legend", text: "What the evidence labels mean" }), legendBox(used, rule)]));
    if (s.blocks.length) L.appendChild(el("div", { class: "card stack" }, [renderBlocks(s.blocks)]));
    s.subs.forEach(function (a) {
      if (!a.cardMeta) {  // a non-card subsection: the rule opens from the legend; questions show after the cards
        if (a === questions) return;
        var m = el("details", { class: "more" }, [el("summary", { text: a.title })]);
        m.appendChild(renderBlocks(a.blocks));
        L.appendChild(m);
        return;
      }
      var meta = a.cardMeta, grades = evGrades(meta.evidence), parts = evParts(meta.evidence), byPart = evByPart(parts);
      var side = meta.side ? (meta.side.charAt(0).toUpperCase() + meta.side.slice(1)) : "";
      var shortB = a.blocks.filter(function (b) { return b.label === "In short"; })[0];
      var rest = a.blocks.filter(function (b) { return b !== shortB; });
      var d = el("details", { class: "fold" });
      d.appendChild(el("summary", null, [
        el("h3", { text: a.title.replace(/^\d+\.\s*/, "") }),
        el("div", { class: "chips" }, [el("span", { class: "chip wrap", text: side })]),
        shortB ? el("p", null, [units(shortB.units)]) : null,
        grades.length
          ? (byPart
              ? el("div", { class: "evpart" }, [el("span", { class: "meta-line", text: "Evidence, part by part:" }), byPart, legendButton(used, rule)])
              : el("div", { class: "chips" }, [el("span", { class: "meta-line", text: "Evidence:" })]
                  .concat(grades.map(evChip)).concat([legendButton(used, rule)])))
          : el("div", null, [el("span", { class: "ev " + evClass(meta.evidence || ""), text: "Evidence: " + (meta.evidence || "") })])
      ]));
      var body = el("div", { class: "body" }, [
        el("p", { class: "meta-line", text: (meta.kind === "Anticipated" ? "Anticipated: not said by a named person" : "Documented: said on the record") + " · " + (meta.claimType || "") + " claim" }),
        grades.length ? el("div", { class: "evfull" }, [el("p", { class: "meta-line", text: "The evidence label in full:" }),
          el("ul", { class: "evlist" }, parts.map(function (p) {
            var what = p.scope ? p.scope + (p.note ? " (" + p.note + ")" : "") : p.note;
            return el("li", null, p.grade ? [evChip(p.grade), what ? el("span", { class: "sr-only", text: ": " }) : null, what ? el("span", { class: "scope", text: what }) : null]
                                          : [el("span", { class: "scope", text: p.text.charAt(0).toUpperCase() + p.text.slice(1) })]);
          }))]) : null,
        renderBlocks(rest)
      ]);
      d.appendChild(body);
      L.appendChild(d);
    });
    if (questions) L.appendChild(el("section", { class: "card stack qcard", "aria-labelledby": "h-questions" }, [el("h3", { id: "h-questions", text: questions.title }), renderBlocks(questions.blocks)]));
    L.appendChild(el("p", { class: "notice", text: "Every card uses the same fields for both sides, and one rule sets every evidence label. Disagreements about values are not treated as misinformation." }));
    return L;
  }
  // "What these mean" on a folded card opens the legend without unfolding the card.
  function legendButton(used, rule) {
    var b = el("button", { class: "evbtn", type: "button", text: "What these mean" });
    b.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); drawer("What the evidence labels mean", legendBox(used, rule), b); });
    return b;
  }

  function layerEvidence() {
    var L = el("section", { class: "layer" });
    L.appendChild(layerHead("Sources", "Every source we cite, saved on the date shown. Anyone can download the original and compare its SHA-256 fingerprint."));
    var list = el("div", { class: "sources" });
    W.sourceOrder.forEach(function (sid) {
      var s = W.sources[sid];
      var pids = Object.keys(W.passages).filter(function (k) { return W.passages[k].source === sid; });
      var card = el("article", { class: "card source" }, [
        el("span", { class: "type" + (s.type === "primary-government" ? " primary" : ""), text: s.typeLabel }),
        el("h3", { text: s.title }),
        el("p", { class: "lede", text: s.why || "" }),
        el("div", { class: "meta" }, [el("span", { text: "Captured " + (s.retrieved_at || "").slice(0, 10) }), el("span", { class: "hash", text: "fingerprint " + (s.sha256 || "").slice(0, 12) + "…" }), el("span", { text: pids.length + " passages" })])
      ]);
      var row = el("div", { class: "chips" });
      if (pids.length) { var b = el("button", { class: "src", type: "button", text: "Read the passages" }); b.addEventListener("click", function () { openPassages(pids, b); }); row.appendChild(b); }
      if (s.url) row.appendChild(el("a", { class: "chip", href: s.url, target: "_blank", rel: "noopener", text: "Original ↗" }));
      card.appendChild(row);
      list.appendChild(card);
    });
    L.appendChild(list);
    // Notes in Layer 5 (for example, what the meeting minutes and video do and don't record) show after the sources.
    var ev = sectionById("evidence");
    if (ev) ev.subs.forEach(function (sub) {
      if (!sub.blocks.length) return;
      var d = el("details", { class: "more" }, [el("summary", { text: sub.title })]);
      d.appendChild(renderBlocks(sub.blocks));
      L.appendChild(d);
    });
    return L;
  }

  function viewChecks() {
    var V = W.verification, root = el("div", { class: "stack-lg" });
    root.appendChild(el("div", { class: "stack" }, [el("p", { class: "eyebrow", text: "Test page " + W.trial + " · how this page was checked" }), el("h1", { text: "How we checked " + W.code.split(" · ")[0] }),
      el("div", { class: "chips" }, [statusChip(W)]), el("p", { class: "lede", text: V.intro }), el("a", { class: "go", href: "#" + W.slug, text: "← Back to " + W.linkText })]));
    var stats = el("div", { class: "stats" });
    V.stats.forEach(function (st) { stats.appendChild(el("div", { class: "stat" }, [el("b", { text: st.value }), el("span", { text: st.label })])); });
    root.appendChild(stats);
    V.sections.forEach(function (sec) {
      var s = el("section", { class: "stack" }, [el("h2", { text: sec.title })]);
      (sec.paras || []).forEach(function (p) { s.appendChild(el("p", { text: p })); });
      if (sec.items) {
        var ul = el("ul", { class: "lines" });
        sec.items.forEach(function (t) { ul.appendChild(el("li", { text: t })); });
        s.appendChild(ul);
      }
      if (sec.rows) {
        var list = el("div", { class: "rowcards" });
        sec.rows.forEach(function (r) {
          var title = (sec.head[0] === "Round" ? "Round " : "") + r[0];
          var dl = el("dl");
          for (var i = 1; i < r.length; i++) { if (!r[i]) continue; dl.appendChild(el("dt", { text: sec.head[i] })); dl.appendChild(el("dd", { text: r[i] })); }
          list.appendChild(el("div", { class: "rowcard" }, [el("h3", { text: title }), dl]));
        });
        s.appendChild(list);
      }
      root.appendChild(s);
    });
    return root;
  }

  // ---------- Router ----------
  // #home · #decisions · #checks · #<slug> · #<slug>-<tab> · #<slug>-checks
  var prev = null;
  function route() {
    var h = (location.hash || "#home").slice(1), view = "home", layer = "overview", nav = "home";
    if (h === "decisions") { view = "decisions"; nav = "decisions"; }
    else if (h === "checks") { view = "method"; nav = "checks"; }
    else if (h !== "home" && h !== "") {
      var match = null;
      D.workspaces.forEach(function (w) { if (h === w.slug || h.indexOf(w.slug + "-") === 0) match = w; });
      if (match) {
        W = match; nav = "decisions"; view = "bill";
        var rest = h.slice(match.slug.length + 1);
        if (rest === "checks") { view = "checks"; nav = "checks"; }
        else if (rest && LAYERS.some(function (L) { return L.id === rest; })) layer = rest;
      }
    }
    var key = view === "bill" ? "bill:" + W.slug : view;
    var stayInBill = prev === key;
    app.innerHTML = "";
    app.appendChild(view === "home" ? viewHome() : view === "decisions" ? viewDecisions() : view === "method" ? viewMethod() : view === "checks" ? viewChecks() : viewBill(layer));
    app.appendChild(el("footer", { text: D.meta.footer + (view === "checks" ? " · Test page " + W.trial + " · " + W.revisionLabel
      : view === "bill" ? " · Test page · " + W.revisionLabel.replace(/ · fingerprint.*$/, "") : "") }));
    document.querySelectorAll("[data-nav]").forEach(function (a) { if (a.getAttribute("data-nav") === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    var tabs = document.querySelector(".tabs");
    if (stayInBill && tabs) {
      // Switching tabs: keep the tab row where it is and start the new tab at its top.
      var stick = parseFloat(getComputedStyle(tabs).top) || 0;
      var tabsTop = tabs.getBoundingClientRect().top + window.scrollY - stick;
      if (window.scrollY > tabsTop) window.scrollTo(0, tabsTop);
    } else {
      window.scrollTo(0, 0);
    }
    if (tabs) {
      var cur = tabs.querySelector('[aria-selected="true"]');
      if (cur) tabs.scrollLeft = cur.offsetLeft - (tabs.clientWidth - cur.clientWidth) / 2;
    }
    prev = key;
  }
  window.addEventListener("hashchange", function () { closeDrawer(); route(); });
  route();
})();
</script>
