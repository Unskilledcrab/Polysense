    title: "Resolution 26-0460: re-establishes the Budget Commission, amends Sec. 2-261 and adds Sec. 2-263 of the Fulton County Code (text attached to the Legistar matter as '08.05.26 - Resolution Fulton_County_Budget_Commission 7.30_')"
