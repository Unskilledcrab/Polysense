    local_file: S01b.pdf
    license: public record
    settles: [D3]
    notes: "Image-only scan (no text layer; no OCR tool in this environment), so no passages. Pages 2, 3 and 7 compared visually with S01 at 45-60 dpi: same wording line for line; the signed copy also underlines 'budget commission' on p.2 lines 19 and 23. Page 7 reads 'PASSED AND ADOPTED ... this 5 day of August, 2026' and 'ITEM #26-0460 FRM 08/05/26'. Pages 1, 4-6 and 8 were not compared."
