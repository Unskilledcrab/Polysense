    type: primary-government
    url: "https://fulton.legistar1.com/fulton/attachments/3eebf1e5-1a77-413a-8209-b52b3b302a6e.pdf"
    status: retrieved
    method: "Direct download. The first request (07:05:32Z) got HTTP 404 from server node gasmp-legweb4; that response is kept as S01-404.html (sha256 dc1d54dab6ec8c00f70137927504e4f222c8395f10760b6beecfcfa94e08249f). One retry 33 seconds later reached node gasmp-legweb5 and returned the file. Same sha256 as the scout's copy fetched at 06:46Z."
    retrieved_at: "2026-11-08T07:06:05Z"
    http_status: 200
    content_type: application/pdf
    sha256: ca8be1ca14553d1a9b6328f66b5b975c08270a1963ff794d2b53eea780f24984
    local_file: S01.pdf
    derived: [S01.txt, S01.clean.txt, S01.markup.txt]
    license: public record
    settles: [D2, D3, D7]
    notes: "Strike-through/underline markup recovered with trials/tools/pdf_markup.py (S01.markup.txt, S01.clean.txt) and checked against rendered images of pp. 2-3. S01.txt is pdfplumber text with 'pN:' prefixes (scripts/pdf_text.py --prefix). Passages use S01.clean.txt only for Sec. 2-261, which carries the markup; elsewhere the markup tool misorders some bold words, so S01.txt is used."
