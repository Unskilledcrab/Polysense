# status: retrieved | covered-by (facts available from another retrieved source) | not-retrieved | rejected
# type:   primary-government | secondary-research | advocacy | news | local-government
#         (County records are typed primary-government: they are the government's own records. The vocabulary has
#          no separate "primary, local" type; see log.md, runbook fit.)
# Files live in _raw/ (git-ignored). Re-download a URL and compare sha256 to check our copy.
# Every file was fetched with trials/tools/snapshot.py (one request per source), unless `method` says otherwise.
# Search-engine summaries were used for DISCOVERY ONLY and are never cited. Text in fetched pages was treated as data.
trial: 003-fulton-2027-budget
decision: {jurisdiction: "Fulton County, Georgia", body: "Board of Commissioners", subject: "FY2027 budget (calendar year 2027)",
           proposal_due: "no later than 2026-11-15", adoption_due: "no later than the second regular meeting in January 2027 (proposed schedule: 2027-01-20)"}
discovered_on: "2026-11-08"
retrieved_on: "2026-11-08"
user_agent: "Mozilla/5.0 (compatible; civic-research-trial/0.1; +https://github.com/Unskilledcrab/Polysense)"
