# Hand-chosen passages for Trial 003 (Fulton County 2027 budget). Build with:
#   uv run --with pyyaml python3 trials/tools/build_passages.py trials/003-fulton-2027-budget/passages.spec.yaml
# Derived text files (all in _raw/, made from the hashed snapshots; see sources.yaml `derived`):
#   S01.txt, S04d.txt, S09b.prefixed.txt  pdfplumber text with 'pN:' line prefixes (scratch script pdf_text.py --prefix),
#                                         so build_passages.py strips page tags and printed line numbers
#   S01.clean.txt, S04d.clean.txt         trials/tools/pdf_markup.py --clean (struck words dropped); used only for the
#                                         code sections that carry strike-through/underline markup
#   S05.txt, S06.txt, S07b.txt, S08b.txt, S09b.txt  pdfplumber text (pdf_text.py, no prefix)
#   S10b.txt ... S10e.txt                 slide text from the .pptx decks (scratch script pptx_text.py, stdlib only)
#   S08.txt, S09.txt, S11.txt, S20.txt, S21.txt, S22.txt  visible text written by trials/tools/snapshot.py
# JSON and HTML snapshots are read directly.
