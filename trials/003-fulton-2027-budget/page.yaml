stage: open                   # open | decided: which Home group the page sits in
public_addresses: ["141 Pryor Street"]   # the Fulton County Government Center; any other street address fails trials/tools/check_privacy.py
publish: true                 # false keeps a page out of the app while it is being drafted
watch:                        # what would make this page stale; read by trials/tools/desk.py (work notes, not page text)
